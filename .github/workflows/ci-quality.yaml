name: CI Quality

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'README.md'
      - '.github/workflows/ci-quality.yaml'
      - 'agent/scripts/run-quality.sh'
      - 'agent/scripts/check-backend-coverage.sh'
      - 'agent/scripts/write-coverage-badge.py'
      - 'renderer/**'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-quality.yaml'
      - 'agent/scripts/run-quality.sh'
      - 'agent/scripts/check-backend-coverage.sh'
      - 'agent/scripts/write-coverage-badge.py'
      - 'renderer/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      renderer: ${{ steps.filter.outputs.renderer }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Evaluate path filters
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-quality.yaml'
              - 'agent/scripts/run-quality.sh'
              - 'agent/scripts/check-backend-coverage.sh'
              - 'agent/scripts/write-coverage-badge.py'
            renderer:
              - 'renderer/**'
              - '.github/workflows/ci-quality.yaml'
              - 'agent/scripts/run-quality.sh'
              - 'agent/scripts/write-coverage-badge.py'

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    services:
      postgres:
        image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
        env:
          POSTGRES_DB: pumpbuddy
          POSTGRES_USER: pumpbuddy
          POSTGRES_PASSWORD: pumpbuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pumpbuddy -d pumpbuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Setup Rust dependency cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Resolve llvm tool paths
        run: |
          set -euo pipefail
          llvm_cov=""
          llvm_profdata=""

          if command -v rustup >/dev/null 2>&1; then
            llvm_cov="$(rustup which llvm-cov 2>/dev/null || true)"
            llvm_profdata="$(rustup which llvm-profdata 2>/dev/null || true)"
          fi

          if [ -z "$llvm_cov" ] || [ -z "$llvm_profdata" ] || [ ! -x "$llvm_cov" ] || [ ! -x "$llvm_profdata" ]; then
            host="$(rustc -vV | sed -n 's/^host: //p')"
            sysroot="$(rustc --print sysroot)"
            llvm_cov="$sysroot/lib/rustlib/$host/bin/llvm-cov"
            llvm_profdata="$sysroot/lib/rustlib/$host/bin/llvm-profdata"
          fi

          test -x "$llvm_cov"
          test -x "$llvm_profdata"
          {
            echo "LLVM_COV=$llvm_cov"
            echo "LLVM_PROFDATA=$llvm_profdata"
          } >>"$GITHUB_ENV"

      - name: Run backend quality and generate coverage badge
        env:
          # Used by Postgres-backed tests in CI.
          TEST_DATABASE_URL: postgresql://pumpbuddy:pumpbuddy@localhost:5432/pumpbuddy
          COVERAGE_BADGE_OUTPUT_DIR: ${{ github.workspace }}/site/badges
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --check
          cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features -- -D warnings
          agent/scripts/check-backend-coverage.sh

      - name: Upload backend coverage badge artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: backend-coverage-badge
          path: site/badges/backend-coverage.json
          if-no-files-found: error

  renderer-quality:
    name: Renderer quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.renderer == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: renderer
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run renderer quality and generate coverage badge
        # Run from repository root so we can use explicit `npm --prefix renderer run ...` invocations
        working-directory: ${{ github.workspace }}
        env:
          COVERAGE_BADGE_OUTPUT_DIR: ${{ github.workspace }}/site/badges
        run: |
          npm --prefix renderer run lint
          npm --prefix renderer run test
          npm --prefix renderer run test:coverage

      - name: Upload renderer coverage badge artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: renderer-coverage-badge
          path: site/badges/renderer-coverage.json
          if-no-files-found: error

  publish-coverage-badges:
    name: Publish coverage badges to Pages
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - backend-quality
      - renderer-quality
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (needs.backend-quality.result == 'success' || needs.backend-quality.result == 'skipped') &&
          (needs.renderer-quality.result == 'success' || needs.renderer-quality.result == 'skipped') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage badge artifacts
        if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.renderer == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*-coverage-badge'
          merge-multiple: true
          path: site/badges

      - name: Restore unchanged badge artifacts from current Pages
        run: |
          set -euo pipefail
          mkdir -p site/badges
          touch site/.nojekyll
          for badge in backend renderer; do
            target="site/badges/${badge}-coverage.json"
            if [ -f "$target" ]; then
              continue
            fi

            source_url="https://christianpflugradt.github.io/PumpBuddy/badges/${badge}-coverage.json"
            if ! curl --fail --show-error --silent --location \
              --output "$target" \
              "$source_url"; then
              printf '{\n  "schemaVersion": 1,\n  "label": "%s coverage",\n  "message": "n/a",\n  "color": "lightgrey"\n}\n' "$badge" >"$target"
            fi
          done

      - name: Write Pages index
        run: |
          cat >site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>PumpBuddy Coverage Badges</title>
            </head>
            <body>
              <p>Coverage badge endpoint artifacts for Shields.</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib import error, request


          def github_request(method, url, token, payload=None):
              data = None
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = request.Request(url=url, method=method, data=data, headers=headers)
              with request.urlopen(req) as response:
                  return json.loads(response.read().decode("utf-8"))


          github_token = os.environ["GITHUB_TOKEN"]
          api_url = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          artifact_id = int(os.environ["ARTIFACT_ID"])

          id_token_request = request.Request(
              url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"],
              headers={"Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with request.urlopen(id_token_request) as response:
              oidc_token = json.loads(response.read().decode("utf-8"))["value"]

          deployment = github_request(
              method="POST",
              url=f"{api_url}/repos/{repo}/pages/deployments",
              token=github_token,
              payload={
                  "artifact_id": artifact_id,
                  "pages_build_version": sha,
                  "oidc_token": oidc_token,
              },
          )

          deployment_id = deployment["id"]
          page_url = deployment.get("page_url", "")

          timeout_seconds = 600
          poll_seconds = 5
          deadline = time.time() + timeout_seconds

          while True:
              status = github_request(
                  method="GET",
                  url=f"{api_url}/repos/{repo}/pages/deployments/{deployment_id}",
                  token=github_token,
              )["status"]

              if status == "succeed":
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
                      output_file.write(f"page_url={page_url}\n")
                  break

              if status in {
                  "deployment_failed",
                  "deployment_content_failed",
                  "deployment_cancelled",
                  "deployment_lost",
              }:
                  raise RuntimeError(f"GitHub Pages deployment failed with status: {status}")

              if time.time() >= deadline:
                  raise TimeoutError(
                      f"Timed out waiting for Pages deployment status after {timeout_seconds} seconds"
                  )

              time.sleep(poll_seconds)

          print(f"Pages deployment completed for run {run_id}: {deployment_id}")
          PY
