name: CI Quality

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/Dockerfile'
      - 'backend/rust-toolchain.toml'
      - '.node-version'
      - 'agent/design/api-contract.yaml'
      - 'README.md'
      - 'runtime/README.md'
      - 'runtime/compose/compose.dev.yaml'
      - 'runtime/compose/compose.prod.yaml'
      - 'runtime/database/**'
      - '.github/workflows/ci-quality.yaml'
      - '.github/workflows/release.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'Makefile'
      - 'agent/scripts/run-quality.sh'
      - 'agent/scripts/check-backend-coverage.sh'
      - 'agent/scripts/check/check-bootstrap-secret-handoff.sh'
      - 'agent/scripts/check/verify-api-contract-alignment.sh'
      - 'agent/scripts/write-coverage-badge.py'
      - 'renderer/**'
      - 'renderer/Dockerfile'
  pull_request:
    paths:
      - 'backend/**'
      - 'backend/Dockerfile'
      - 'backend/rust-toolchain.toml'
      - '.node-version'
      - 'agent/design/api-contract.yaml'
      - 'README.md'
      - 'runtime/README.md'
      - 'runtime/compose/compose.dev.yaml'
      - 'runtime/compose/compose.prod.yaml'
      - 'runtime/database/**'
      - '.github/workflows/ci-quality.yaml'
      - '.github/workflows/release.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'Makefile'
      - 'agent/scripts/run-quality.sh'
      - 'agent/scripts/check-backend-coverage.sh'
      - 'agent/scripts/check/check-bootstrap-secret-handoff.sh'
      - 'agent/scripts/check/verify-api-contract-alignment.sh'
      - 'agent/scripts/write-coverage-badge.py'
      - 'renderer/**'
      - 'renderer/Dockerfile'
  workflow_dispatch:
    inputs:
      run_all_quality_jobs:
        description: Run both backend and frontend quality jobs
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      renderer: ${{ steps.filter.outputs.renderer }}
      api_contract_alignment: ${{ steps.filter.outputs.api_contract_alignment }}
      release_artifacts: ${{ steps.filter.outputs.release_artifacts }}
      bootstrap_secret_handoff: ${{ steps.filter.outputs.bootstrap_secret_handoff }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Evaluate path filters
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            backend:
              - 'agent/design/api-contract.yaml'
              - 'backend/**'
              - 'runtime/database/**'
              - 'backend/rust-toolchain.toml'
              - '.node-version'
              - '.github/workflows/ci-quality.yaml'
              - 'agent/scripts/run-quality.sh'
              - 'agent/scripts/check-backend-coverage.sh'
              - 'agent/scripts/write-coverage-badge.py'
            renderer:
              - '.node-version'
              - 'renderer/**'
              - 'agent/design/api-contract.yaml'
              - 'backend/src/api/**'
              - '.github/workflows/ci-quality.yaml'
              - 'agent/scripts/run-quality.sh'
              - 'agent/scripts/write-coverage-badge.py'
            api_contract_alignment:
              - 'agent/design/api-contract.yaml'
              - 'backend/src/api/**'
              - 'renderer/src/openapi-contract.ts'
              - 'renderer/src/workout-contract-state.ts'
              - 'renderer/src/workout-contract.ts'
              - 'renderer/src/workout-api.ts'
              - 'agent/scripts/check/verify-api-contract-alignment.sh'
              - '.github/workflows/ci-quality.yaml'
            release_artifacts:
              - '.node-version'
              - '.github/workflows/release.yaml'
              - 'package.json'
              - 'package-lock.json'
              - 'backend/Dockerfile'
              - 'backend/rust-toolchain.toml'
              - 'renderer/Dockerfile'
              - 'Makefile'
              - 'agent/scripts/run-quality.sh'
            bootstrap_secret_handoff:
              - 'README.md'
              - 'runtime/README.md'
              - 'runtime/compose/compose.dev.yaml'
              - 'runtime/compose/compose.prod.yaml'
              - 'Makefile'
              - 'agent/scripts/check/check-bootstrap-secret-handoff.sh'
              - '.github/workflows/ci-quality.yaml'

  bootstrap-secret-handoff:
    name: Bootstrap secret handoff
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      ${{ needs.detect-changes.outputs.bootstrap_secret_handoff == 'true' ||
          inputs.run_all_quality_jobs == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run bootstrap secret handoff guard
        run: |
          make check-bootstrap-secret-handoff

  release-artifact-quality:
    name: Release artifact quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      ${{ needs.detect-changes.outputs.release_artifacts == 'true' ||
          inputs.run_all_quality_jobs == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run release artifact verification
        run: |
          make check-release-artifacts

  api-contract-alignment:
    name: API contract alignment
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      ${{ needs.detect-changes.outputs.api_contract_alignment == 'true' ||
          inputs.run_all_quality_jobs == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify API contract alignment
        run: |
          QUALITY_GATE_SOURCE_COMMIT="${GITHUB_SHA}" \
            agent/scripts/check/verify-api-contract-alignment.sh

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      ${{ needs.detect-changes.outputs.backend == 'true' ||
          inputs.run_all_quality_jobs == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve backend Rust toolchain
        id: backend-rust-toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' backend/rust-toolchain.toml | head -n 1)"
          if [ -z "$channel" ]; then
            echo "Failed to resolve Rust toolchain channel from backend/rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=$channel" >>"$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.backend-rust-toolchain.outputs.channel }}

      - name: Setup Rust dependency cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run backend quality and generate coverage badge
        env:
          COVERAGE_BADGE_OUTPUT_DIR: ${{ github.workspace }}/site/badges
        run: |
          make check-backend

      - name: Upload backend coverage badge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-badge
          path: site/badges/backend-coverage.json
          if-no-files-found: error

  renderer-quality:
    name: Renderer quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      ${{ needs.detect-changes.outputs.renderer == 'true' ||
          inputs.run_all_quality_jobs == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Run renderer quality and generate coverage badge
        env:
          COVERAGE_BADGE_OUTPUT_DIR: ${{ github.workspace }}/site/badges
        run: |
          make check-renderer

      - name: Upload renderer coverage badge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: renderer-coverage-badge
          path: site/badges/renderer-coverage.json
          if-no-files-found: error

  publish-coverage-badges:
    name: Publish coverage badges to Pages
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - backend-quality
      - renderer-quality
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (needs.backend-quality.result == 'success' || needs.backend-quality.result == 'skipped') &&
          (needs.renderer-quality.result == 'success' || needs.renderer-quality.result == 'skipped') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage badge artifacts
        if: >-
          ${{ needs.detect-changes.outputs.backend == 'true' ||
              needs.detect-changes.outputs.renderer == 'true' ||
              inputs.run_all_quality_jobs == true }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*-coverage-badge'
          merge-multiple: true
          path: site/badges

      - name: Restore unchanged badge artifacts from current Pages
        run: |
          set -euo pipefail
          mkdir -p site/badges
          touch site/.nojekyll
          for badge in backend renderer; do
            target="site/badges/${badge}-coverage.json"
            if [ -f "$target" ]; then
              continue
            fi

            source_url="https://christianpflugradt.github.io/PumpBuddy/badges/${badge}-coverage.json"
            if ! curl --fail --show-error --silent --location \
              --output "$target" \
              "$source_url"; then
              printf '{\n  "schemaVersion": 1,\n  "label": "%s coverage",\n  "message": "n/a",\n  "color": "lightgrey"\n}\n' "$badge" >"$target"
            fi
          done

      - name: Write Pages index
        run: |
          cat >site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>PumpBuddy Coverage Badges</title>
            </head>
            <body>
              <p>Coverage badge endpoint artifacts for Shields.</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib import error, request


          def github_request(method, url, token, payload=None):
              data = None
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = request.Request(url=url, method=method, data=data, headers=headers)
              with request.urlopen(req) as response:
                  return json.loads(response.read().decode("utf-8"))


          github_token = os.environ["GITHUB_TOKEN"]
          api_url = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          artifact_id = int(os.environ["ARTIFACT_ID"])

          id_token_request = request.Request(
              url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"],
              headers={"Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with request.urlopen(id_token_request) as response:
              oidc_token = json.loads(response.read().decode("utf-8"))["value"]

          deployment = github_request(
              method="POST",
              url=f"{api_url}/repos/{repo}/pages/deployments",
              token=github_token,
              payload={
                  "artifact_id": artifact_id,
                  "pages_build_version": sha,
                  "oidc_token": oidc_token,
              },
          )

          deployment_id = deployment["id"]
          page_url = deployment.get("page_url", "")

          timeout_seconds = 600
          poll_seconds = 5
          deadline = time.time() + timeout_seconds

          while True:
              status = github_request(
                  method="GET",
                  url=f"{api_url}/repos/{repo}/pages/deployments/{deployment_id}",
                  token=github_token,
              )["status"]

              if status == "succeed":
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
                      output_file.write(f"page_url={page_url}\n")
                  break

              if status in {
                  "deployment_failed",
                  "deployment_content_failed",
                  "deployment_cancelled",
                  "deployment_lost",
              }:
                  raise RuntimeError(f"GitHub Pages deployment failed with status: {status}")

              if time.time() >= deadline:
                  raise TimeoutError(
                      f"Timed out waiting for Pages deployment status after {timeout_seconds} seconds"
                  )

              time.sleep(poll_seconds)

          print(f"Pages deployment completed for run {run_id}: {deployment_id}")
          PY
