name: Coverage Badges
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve backend Rust toolchain
        id: backend-rust-toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' backend/rust-toolchain.toml | head -n 1)"
          if [ -z "$channel" ]; then
            echo "Failed to resolve Rust toolchain channel from backend/rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=$channel" >>"$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.backend-rust-toolchain.outputs.channel }}
          components: rustfmt, clippy, llvm-tools-preview

      - name: Setup Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare dependencies
        run: agent/scripts/governance/prepare.sh badges

      - name: Run backend quality and generate coverage badge
        env:
          COVERAGE_BADGE_OUTPUT_DIR: ${{ github.workspace }}/site/badges
        run: |
          make coverage-backend

      - name: Upload backend coverage badge artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage-badge
          path: site/badges/backend-coverage.json
          if-no-files-found: error

  renderer-quality:
    name: Renderer quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Prepare Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' backend/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - name: Prepare dependencies
        run: agent/scripts/governance/prepare.sh badges

      - name: Run renderer quality and generate coverage badge
        env:
          COVERAGE_BADGE_OUTPUT_DIR: ${{ github.workspace }}/site/badges
        run: |
          make coverage-renderer

      - name: Upload renderer coverage badge artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: renderer-coverage-badge
          path: site/badges/renderer-coverage.json
          if-no-files-found: error

  publish-coverage-badges:
    name: Publish coverage badges to Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: coverage-pages
      cancel-in-progress: false
      queue: max
    needs:
      - backend-quality
      - renderer-quality
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.backend-quality.result == 'success' &&
          needs.renderer-quality.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage badge artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-coverage-badge'
          merge-multiple: true
          path: site/badges

      - name: Restore unchanged badge artifacts from current Pages
        run: |
          set -euo pipefail
          mkdir -p site/badges
          touch site/.nojekyll
          for badge in backend renderer; do
            target="site/badges/${badge}-coverage.json"
            if [ -f "$target" ]; then
              continue
            fi

            source_url="https://christianpflugradt.github.io/PumpBuddy/badges/${badge}-coverage.json"
            if ! curl --fail --show-error --silent --location \
              --output "$target" \
              "$source_url"; then
              printf '{\n  "schemaVersion": 1,\n  "label": "%s coverage",\n  "message": "n/a",\n  "color": "lightgrey"\n}\n' "$badge" >"$target"
            fi
          done

      - name: Write Pages index
        run: |
          cat >site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>PumpBuddy Coverage Badges</title>
            </head>
            <body>
              <p>Coverage badge endpoint artifacts for Shields.</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
