name: Release
on:
  workflow_dispatch:
    inputs:
      force:
        description: Release a patch version even if no commit would raise the version, to test the release process
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-plan.yml@aa0b0b05864581c26e4f5f9f1024c1411c6b172f # updates/workflows/release
    with:
      force: ${{ inputs.force }}

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-readiness.yml@aa0b0b05864581c26e4f5f9f1024c1411c6b172f # updates/workflows/release
    with:
      source-sha: ${{ needs.plan.outputs.source_sha }}
      required-jobs: check / Check

  release-candidate:
    name: Release Candidate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: v${{ needs.plan.outputs.version }}
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python github:please-behave/cli
          experimental: true
          version: 2026.11.11
      - name: Prepare candidate inputs
        run: mise run setup:candidate
      - name: Set up emulation for the arm64 build
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify the candidate at the release point
        uses: christianpflugradt/please-behave-governance/actions/release/governance@97a2570e70f0ae008ecde59f6878f44d55a399fa # updates/actions/release
      - name: Export the verified image candidate
        uses: christianpflugradt/please-behave-governance/actions/release/export-image@97a2570e70f0ae008ecde59f6878f44d55a399fa # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          images: |
            pumpbuddy-backend
            pumpbuddy-renderer
      - name: Record release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@97a2570e70f0ae008ecde59f6878f44d55a399fa # updates/actions/release
        with:
          operation: record
          version: ${{ needs.plan.outputs.version }}
          target: linux-amd64

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node
          experimental: true
          version: 2026.11.11
      - name: Verify complete release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@97a2570e70f0ae008ecde59f6878f44d55a399fa # updates/actions/release
        with:
          operation: verify
          version: ${{ needs.plan.outputs.version }}
      - name: Publish the verified images, version tag and release notes
        uses: christianpflugradt/please-behave-governance/actions/release/publish-image@97a2570e70f0ae008ecde59f6878f44d55a399fa # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          force: ${{ inputs.force }}
