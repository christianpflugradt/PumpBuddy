name: Statistics
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  collect-backend:
    name: Collect backend statistics
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and coverage tool
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust uv cargo:cargo-llvm-cov aqua:boyter/scc
          experimental: true
          version: 2026.11.11

      - name: Setup Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15.2'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: Prepare dependencies
        run: tools/governance/prepare.sh statistics

      - name: Run backend quality and write coverage metric
        env:
          COVERAGE_METRIC_OUTPUT_DIR: ${{ github.workspace }}/build/statistics
        run: make coverage-backend

      - name: Count backend lines of code and tests
        run: |
          set -euo pipefail
          loc="$(scc --format json --include-ext rs --not-match 'test_support|test_runtime' backend/src | jq 'map(.Code) | add')"
          tests="$(cargo test --offline --locked --manifest-path backend/Cargo.toml -- --list | awk '/^[0-9]+ tests?, [0-9]+ benchmarks?/ { sum += $1 } END { print sum + 0 }')"
          python3 tools/write-count-metric.py build/statistics/backend-loc.json "backend LOC" "$loc" loc
          python3 tools/write-count-metric.py build/statistics/backend-tests.json "backend tests" "$tests" tests

      - name: Upload backend metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-metrics
          path: build/statistics
          if-no-files-found: error

  collect-renderer:
    name: Collect renderer statistics
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: mise.toml
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15.2'
      - name: Install pinned Rust toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust uv aqua:boyter/scc
          experimental: true
          version: 2026.11.11
      - name: Prepare dependencies
        run: tools/governance/prepare.sh statistics

      - name: Run renderer quality and write coverage metric
        env:
          COVERAGE_METRIC_OUTPUT_DIR: ${{ github.workspace }}/build/statistics
        run: make coverage-renderer

      - name: Count renderer lines of code and tests
        run: |
          set -euo pipefail
          loc="$(scc --format json --include-ext ts,scss --not-match '\.test\.ts$' renderer/src | jq 'map(.Code) | add')"
          unit="$(cd renderer && node_modules/.bin/vitest list --json | jq length)"
          smoke="$(cd renderer && node_modules/.bin/playwright test --list --project=chromium | sed -n 's/^Total: \([0-9]*\) tests.*/\1/p')"
          python3 tools/write-count-metric.py build/statistics/renderer-loc.json "renderer LOC" "$loc" loc
          python3 tools/write-count-metric.py build/statistics/renderer-tests.json "renderer tests" "$((unit + smoke))" tests

      - name: Upload renderer metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: renderer-metrics
          path: build/statistics
          if-no-files-found: error

  publish:
    name: Publish statistics
    needs:
      - collect-backend
      - collect-renderer
    if: github.ref == 'refs/heads/main'
    uses: christianpflugradt/repository-catalog/.github/workflows/statistics-publish.yml@8d44e3ebb495ba1371e949bcc11b11597a632394 # updates/workflows/statistics
    with:
      project: pumpbuddy
    secrets:
      STATISTICS_TOKEN: ${{ secrets.STATISTICS_TOKEN }}
