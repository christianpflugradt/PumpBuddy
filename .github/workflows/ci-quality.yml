name: CI Quality

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-quality.yml'
      - 'agent/scripts/check-backend-coverage.sh'
      - 'agent/scripts/write-coverage-badge.py'
      - 'agent/scripts/run-quality.sh'
      - 'renderer/**'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-quality.yml'
      - 'agent/scripts/check-backend-coverage.sh'
      - 'agent/scripts/write-coverage-badge.py'
      - 'agent/scripts/run-quality.sh'
      - 'renderer/**'

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      renderer: ${{ steps.filter.outputs.renderer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate path filters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-quality.yml'
              - 'agent/scripts/check-backend-coverage.sh'
              - 'agent/scripts/write-coverage-badge.py'
              - 'agent/scripts/run-quality.sh'
            renderer:
              - 'renderer/**'
              - '.github/workflows/ci-quality.yml'
              - 'agent/scripts/write-coverage-badge.py'
              - 'agent/scripts/run-quality.sh'

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run backend quality
        run: agent/scripts/run-quality.sh backend

  renderer-quality:
    name: Renderer quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.renderer == 'true' }}
    defaults:
      run:
        working-directory: renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run renderer quality
        run: ../agent/scripts/run-quality.sh renderer
