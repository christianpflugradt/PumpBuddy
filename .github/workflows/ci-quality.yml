name: CI Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/**'
      - 'renderer/**'
      - '.github/workflows/ci-quality.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      renderer: ${{ steps.filter.outputs.renderer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate path filters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            renderer:
              - 'renderer/**'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'yarn.lock'

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend quality placeholder
        run: |
          echo "Add backend lint/test commands in a follow-up item"

  renderer-quality:
    name: Renderer quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.renderer == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Renderer quality placeholder
        run: |
          echo "Add renderer lint/test commands in a follow-up item"
