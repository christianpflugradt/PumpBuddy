name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22

      - name: Install repository toolchain
        run: npm ci

      # Run semantic-release from the repository-managed, pinned dependencies
      # (avoid floating package resolution such as `npx -p ...`). The project
      # installs devDependencies using `npm ci` above and exposes a `release`
      # script that runs the pinned `semantic-release` binary from
      # `node_modules/.bin`.
      - name: Run semantic-release
        run: npm run release --silent

      - name: Derive release tag output
        id: release-tag
        run: |
          tag="$(git tag --points-at "$GITHUB_SHA" --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then
            tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          if [ -z "$tag" ]; then
            echo "No release tag available for image publish." >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  publish-backend-image:
    name: Publish backend image
    needs: semantic-release
    if: ${{ needs.semantic-release.outputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate backend OpenAPI models
        run: make generate-openapi-backend

      - name: Build and push backend image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pumpbuddy-backend:${{ needs.semantic-release.outputs.release_tag }}

  publish-renderer-image:
    name: Publish renderer image
    needs: semantic-release
    if: ${{ needs.semantic-release.outputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push renderer image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: ./renderer
          file: ./renderer/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pumpbuddy-renderer:${{ needs.semantic-release.outputs.release_tag }}
