name: Agent Framework Quality

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'agent/**'
      - 'validation/**'
      - '.githooks/**'
      - '.github/workflows/agent-framework-quality.yaml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'agent/**'
      - 'validation/**'
      - '.githooks/**'
      - '.github/workflows/agent-framework-quality.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pydantic-contracts:
    name: Pydantic Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install validation dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r validation/core/requirements.txt

      - name: Validate registered YAML contracts
        run: python3 -m validation.core.validate

  execution-item-invariants:
    name: Execution Item Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install validation dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r validation/core/requirements.txt

      - name: Validate execution item state invariants
        run: agent/scripts/check/check-execution-items.sh

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shell script lint
        run: agent/scripts/check/shellcheck.sh

  task-contracts:
    name: Task Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install validation dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r validation/core/requirements.txt

      - name: Validate task contracts
        run: |
          set -euo pipefail
          for task in \
            discuss-plan \
            refine-plan \
            plan-item \
            implement-item \
            review-item \
            finalize-plan \
            review-architecture \
            review-consistency \
            review-quality \
            review-security \
            review-technology \
            freestyle \
            next-item; do
            agent/scripts/check/check-task-contract.sh "$task"
          done
