name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare pinned Rust compiler
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' backend/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Prepare validation tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Prepare project dependencies
        run: agent/scripts/governance/prepare.sh check
      - name: Read published governor pin
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - name: Install published governor
        uses: please-behave/action@3f726664f6a18193ac1bfa0f542e34ba76f24523 # v1.1.1
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Resolve external rules and independent provider
        run: please sync --yes
      - name: Run Please Behave checks
        run: please run --at check --checks-only
      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-check
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
