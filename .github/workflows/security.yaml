name: Security

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'renderer/**'
      - '.node-version'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'renderer/package.json'
      - 'renderer/package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'backend/Cargo.toml'
      - 'backend/Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'renderer/**'
      - '.node-version'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'renderer/package.json'
      - 'renderer/package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'backend/Cargo.toml'
      - 'backend/Cargo.lock'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  npm-audit:
    name: npm audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install release toolchain dependencies
        run: npm ci

      - name: Run release toolchain npm audit
        run: npm audit --audit-level=high

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Run renderer npm audit
        working-directory: renderer
        run: npm audit --audit-level=high

# Rust dependency audit is intentionally disabled for now. It previously raised
# CVEs that did not affect PumpBuddy's actual usage, and cargo-audit did not
# provide a low-friction suppression workflow that kept the signal worthwhile.
# Re-enable this when Rust audit tooling provides more actionable suppression or
# when the repository's dependency risk profile changes enough to justify the
