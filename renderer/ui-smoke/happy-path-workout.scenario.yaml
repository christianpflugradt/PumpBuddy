version: 1
area: ui_smoke
suite: playwright
source_of_truth: renderer/ui-smoke/zzz-hpp.spec.js
notes:
  - "Backend APIs are mocked in Playwright routes; this validates critical UI workflow behavior."
  - "Classification: UI smoke (not full system end-to-end)."

scenario:
  name: "Happy Path - Configured Gym/Workout"
  description: "Covers login, gym/plan selection, three exercise interaction types, and completion summary."
  preconditions:
    - login: ""
    - password: "test-api-key"
    - gyms_exist:
        - "Countryside Core Club"
        - "Downtown Dumbbell Den"
    - plans_exist:
        - "Leg Day"
        - "Push Day"
        - "Pull Day"

  steps:
    - name: "Login"
      user_action:
        type: multi_input_and_click
        inputs:
          - field: "Login"
            value: ""
          - field: "Password"
            value: "test-api-key"
        click: "Sign in"

    - name: "Select plan and gym"
      user_action:
        type: select
        fields:
          - field: "Training Plan"
            value: "Leg Day"
          - field: "Gym"
            value: "Downtown Dumbbell Den"
      expect:
        - "Start Workout is enabled"

    - name: "Start workout"
      user_action:
        type: click
        field: "Start Workout"

    - name: "Exercise 1 (Deadlift): fallback option path"
      mock_data:
        options:
          - station: "Barbell Rack"
            variant: "Conventional Barbell Deadlift"
          - station: "Platform A"
            variant: "Paused Barbell Deadlift"
          - station: "Rig B"
            variant: "Romanian Deadlift"
      user_action:
        type: dropdown_select_then_confirm
        field: "Fallback exercise option"
        select: "Platform A + Paused Barbell Deadlift"
      expect:
        - "Load/Reps controls are hidden before option selection"
        - "Load/Reps controls are visible after option selection"
      fill_set:
        load_kg: 100
        reps: 5
        interaction_mode: "increment/decrement buttons (no direct text entry)"
      confirm_set: true

    - name: "Exercise 2 (Bulgarian Split Squat)"
      fill_set:
        load_per_side_kg: 24
        reps: 8
        interaction_mode: "increment/decrement buttons"
      confirm_set: true

    - name: "Exercise 3 (Plank timer)"
      fill_set:
        seconds: 45
        interaction_mode: "open spinner dialog and pick time"
      confirm_set: true

    - name: "Finish"
      user_action:
        type: click
        field: "Finish Workout"
      expect:
        - "Plan Completed screen is visible"
        - "Workout metrics show 3 exercises completed"
