[package]
name = "pumpbuddy-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

# Small, widely-used crate for UUID parsing/formatting used in persistence layer
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
dotenvy = "0.15"
serde_json = "1"
testcontainers = { version = "0.27", features = ["blocking"] }
tower = { version = "0.5", features = ["util"] }
