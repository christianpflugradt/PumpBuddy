[package]
name = "pumpbuddy-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

# Small, widely-used crate for UUID parsing/formatting used in persistence layer
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
testcontainers = { version = "0.28", features = ["blocking"] }
tower = { version = "0.5", features = ["util"] }
