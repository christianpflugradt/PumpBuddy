include = [
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/repository-conventions/mise.toml?ref=29b8b072e41158ab12cadafbda35e868642b224e",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/security/mise.toml?ref=0de24d29d6195adecb6806103e205a202793cc0b",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/open-source-software/mise.toml?ref=4a3679d9da910272ca4d741307e4cbbe2bde6d6e",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/releasable-open-source-software/mise.toml?ref=c13b67c59b7ab4224fb2544a2de6fa2f49d36e2f",
]

[task_config]
includes = [
  "git::https://github.com/christianpflugradt/please-behave-governance.git//mise-tasks/release?ref=c13b67c59b7ab4224fb2544a2de6fa2f49d36e2f",
]

[tools]
"github:please-behave/cli" = "0.18.0"
rust = { version = "1.100.0", profile = "minimal", components = "rustfmt,clippy,llvm-tools" }
python = "3.15.2"
node = "26.13.1"
gh = "2.104.0"
ripgrep = "15.2.0"
ruff = "0.17.5"
"cargo:cargo-audit" = "0.23.0"
"pipx:pip-audit" = "2.10.1"
uv = "0.13.9"
"cargo:cargo-llvm-cov" = "0.9.1"
"aqua:boyter/scc" = "4.1.0"

[tasks.format]
description = "Format Rust, Python and shell sources"
run = [
  "cargo fmt --manifest-path backend/Cargo.toml",
  "git ls-files -z '*.py' | xargs -0 ruff format",
  "git ls-files -z '*.sh' | xargs -0 -r shfmt -w",
]

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.setup]
description = "Prepare locked dependencies, cached images and local browser inputs"
run = "make prepare"

[tasks.run-app]
description = "Start the development application"
run = "make run-app"

[tasks.stop-app]
description = "Stop the development application"
run = "make stop-app"

[tasks.rebuild-app]
description = "Rebuild and start the development application"
run = "make rebuild-app"

[tasks."setup:candidate"]
description = "Prepare cached API generation inputs for candidate images"
run = "tools/governance/prepare.sh candidate"

[tasks.build]
description = "Build and verify both Docker images"
run = "make check-release-artifacts"

