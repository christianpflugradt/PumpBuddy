[tools]
python = "3.15.2"
node = "{{ read_file(path='.node-version') | trim }}"
rust = { version = '''0.12.0''', profile = "minimal", components = "rustfmt,clippy,llvm-tools" }
actionlint = "1.7.12"
gitleaks = "8.30.1"
shellcheck = "0.11.0"

[bootstrap.packages]
"brew:argon2" = "latest"

[tasks.check]
description = "Run all repository quality checks"
run = "make check"

[tasks.prepare]
description = "Prepare locked dependencies, cached images and local browser inputs"
run = "make prepare"

[tasks.run-app]
description = "Start the development application"
run = "make run-app"

[tasks.stop-app]
description = "Stop the development application"
run = "make stop-app"

[tasks.rebuild-app]
description = "Rebuild and start the development application"
run = "make rebuild-app"
