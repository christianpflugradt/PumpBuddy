include = [
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/repository-conventions/mise.toml?ref=29f7071f4b285c228ea4206693a5c397f693a966",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/security/mise.toml?ref=356256b67beed2419a0691611bb71aa3736c326e",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/open-source-software/mise.toml?ref=356256b67beed2419a0691611bb71aa3736c326e",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/releasable-open-source-software/mise.toml?ref=690f75c72c064425ab52e9a1454dc9839b2cf7d9",
]

[task_config]
includes = [
  "git::https://github.com/christianpflugradt/repository-catalog.git//mise-tasks/release?ref=c13b67c59b7ab4224fb2544a2de6fa2f49d36e2f",
]

[tools]
"github:please-behave/cli" = "0.25.0"
rust = { version = "1.100.0", profile = "minimal", components = "rustfmt,clippy,llvm-tools" }
python = "3.15.2"
node = "26.13.1"
gh = "2.105.0"
ripgrep = "15.2.0"
ruff = "0.17.6"
"cargo:cargo-audit" = "0.23.0"
"pipx:pip-audit" = "2.10.1"
uv = "0.13.9"
"cargo:cargo-llvm-cov" = "0.9.2"
"aqua:boyter/scc" = "4.1.0"

[tasks.format]
description = "Format Rust, Python and shell sources"
run = [
  "cargo fmt --manifest-path backend/Cargo.toml",
  "git ls-files -z '*.py' | xargs -0 ruff format",
  "git ls-files -z '*.sh' | xargs -0 -r shfmt -w",
]

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.setup]
description = "Prepare locked dependencies, cached images and local browser inputs"
run = "make prepare"

[tasks.run-app]
description = "Start the development application"
run = "make run-app"

[tasks.stop-app]
description = "Stop the development application"
run = "make stop-app"

[tasks.rebuild-app]
description = "Rebuild and start the development application"
run = "make rebuild-app"

[tasks."setup:candidate"]
description = "Prepare cached API generation inputs for candidate images"
run = "tools/governance/prepare.sh candidate"

[tasks.build]
description = "Build and verify both Docker images"
run = "make check-release-artifacts"

