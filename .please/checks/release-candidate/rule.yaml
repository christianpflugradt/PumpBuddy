purpose: Keep both shipped Docker images buildable for the release platform at release time.
problem: A platform-specific build failure would otherwise first appear while publishing.
value: The release is gated on the exact platform that ships.
conditions:
  - statement: Both images build for linux/amd64.
    rationale: That is the platform of the shipped images, which differs from a developer's host.
  - statement: The rule runs only at the custom release point.
    rationale: The build is slow and needed only when releasing; release-artifacts covers the other points natively.
success_criteria:
  - A failing build for the release platform fails.
out_of_scope:
  - description: Publishing the images.
  - description: Builds at pre-push and check, which release-artifacts covers.
limitations:
  - Needs a Docker daemon that can build for the release platform.
placement: Local, because the release point and the images exist only in this repository.
