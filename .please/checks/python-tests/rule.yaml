purpose: Keep the unit tests of the release scripts passing.
problem: Defects in the release scripts would first show up while releasing.
value: Release script changes are tested before every push.
conditions:
  - statement: All test_*.py files under the release scripts directory pass.
    rationale: Those scripts decide what gets published, so they carry their own offline tests.
  - statement: A crash of the test runner is an ERROR, not a FAIL.
    rationale: A technical failure is not a verdict about the code.
success_criteria:
  - A failing test fails.
  - A runner crash is an ERROR.
out_of_scope:
  - description: The governance script tests, which framework runs.
limitations:
  - Tests in other directories are not discovered.
placement: Local, because the release scripts exist only in this repository.
