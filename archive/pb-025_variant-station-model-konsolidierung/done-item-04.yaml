version: 1
kind: backlog_item
item:
  id: pb-025-item-04
  title: Render stationless workouts as reps-only without load controls
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Renderer state and UI treat stationless selected options as reps-only flows
    by hiding load increment/decrement/input controls and preserving workout progression.
  rationale: User-facing behavior must reflect the backend stationless/null-load contract
    while retaining current station-based UX.
scope:
  in:
  - Update stationless option realizability and set drafting logic in renderer/src/workout-state.ts.
  - Update set-entry rendering in renderer/src/workout-render.ts to hide load controls
    for stationless selections.
  - Ensure payload builders send null load values for stationless sets and numeric
    load values for station-based sets.
  out:
  - Backend schema/query changes.
  - Global UI redesign outside workout flow.
constraints:
- Keep station-based load stepping/snap behavior unchanged.
inputs:
  required:
  - renderer/src/workout-state.ts
  - renderer/src/workout-render.ts
  - renderer/src/workout-types.ts
  optional:
  - renderer/src/app.test.ts
  - renderer/src/fallback-variant-switching.test.ts
acceptance_criteria:
- id: ac-01
  statement: Stationless selected options no longer expose load controls and continue
    progressing sets/exercises with reps-only entries.
  verification:
    type: command
    command: npm --prefix renderer run vitest:run -- workout-state workout-render
      fallback-variant-switching
    expected: Renderer tests for state/render/fallback paths pass with stationless
      reps-only coverage and no station-based regressions.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer/workout-state
  - renderer/workout-render
handoff:
  review_focus:
  - Confirm hidden-load behavior applies only when selected option is stationless.
  - Confirm payload nullability aligns with backend expectations.
review_feedback:
- at: '2026-03-27T12:05:53Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01 requires the renderer state/render/fallback\
    \ paths to pass deterministic\n    quality verification without regressions.\n\
    \  evidence: '`agent/scripts/task/review-item/finalize.sh 04 accept` failed the\
    \ renderer\n    quality gate with TypeScript errors in `renderer/src/workout-interaction.ts`\
    \ (`TS2345`\n    and `TS18047` around lines 228/231/245/248) because increment/decrement\
    \ handlers\n    pass `number | null` load values where `number` is required.'\n\
    \  risk: Current stationless-null load handling introduces compile-time type breakage\n\
    \    in workout interaction controls, blocking deterministic integration and creating\n\
    \    risk of runtime load-control faults if forced through.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: Acceptance criterion ac-01 is satisfied; stationless selected options
      render reps-only set controls with load controls hidden, station-based controls
      remain available, and stationless load normalization/payload mappings preserve
      null load values through workout progression.
    evidence: '`npm --prefix renderer run vitest:run -- workout-state workout-render
      fallback-variant-switching` passed (3 files, 12 tests). Code verification confirms
      stationless load controls are hidden only when `selectedPlanExerciseOptionId
      !== null && selectedStationId === null` in `renderer/src/workout-render.ts`,
      load interactions short-circuit for stationless selections in `renderer/src/workout-interaction.ts`,
      and payload builders keep `load_value: set.loadValue` / `exercise.activeSet.loadValue`
      in `renderer/src/workout-state.ts`.'
    runtime_build_check: Deterministic quality gate execution is delegated to `agent/scripts/task/review-item/finalize.sh
      04 accept` and must pass for item finalization.
    residual_risk: Residual risk is low and limited to UI event-edge cases outside
      the covered renderer suites; scoped state/render/fallback behavior for stationless
      reps-only flows is validated by targeted tests and explicit stationless guards.
