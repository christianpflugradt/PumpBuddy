- id: ac-01
  statement: UC-03 and mapping rules explicitly represent both station-based and stationless
    configured-gym set semantics.
  verification:
    type: command
    command: rg -n "UC-03|stationless|null load|configured_gym_load_must_match_station_load_profile_definition|mode_behavior"
