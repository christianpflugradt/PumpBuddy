    paths.
review_feedback:
- at: '2026-03-27T20:08:05Z'
  source: review-consistency:f-02
  notes: Use-case and mapping artifacts still encode configured-gym load profile validation
    as unconditional and omit explicit stationless reps-only/null-load behavior.
