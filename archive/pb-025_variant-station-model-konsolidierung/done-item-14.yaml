version: 1
kind: backlog_item
item:
  id: pb-025-item-14
  title: Fix configured-gym fractional load handling by always using canonical profile
    values
  status_hint: done
  source:
    type: finalize_return
    reference: agent/tmp/finalize-plan-findings.yaml
intent:
  outcome: Ensure configured-gym station-based load adjustments with fractional values
    always resolve to exact selected-station profile entries so save/complete flows
    succeed.
  rationale: Finalize is blocked because the error "set.load_value must match selected
    station load profile values in configured-gym mode" still occurs on fractional
    values despite prior fixes, indicating the current approach is not reliably using
    canonical profile values.
scope:
  in:
  - Reproduce the fractional increment/decrement path that still triggers configured-gym
    profile-mismatch validation.
  - Refactor renderer load stepping/normalization so persisted values are selected
    from the known fixed profile list (canonical values), not derived floating-point
    calculations.
  - Add regression coverage for repeated fractional +/- edits proving the submitted
    value matches an exact profile entry and saves successfully.
  out:
  - Relaxing backend configured-gym profile enforcement rules.
  - Changes unrelated to configured-gym station-based load selection.
constraints:
- Preserve strict backend rejection for genuinely off-profile station-based loads.
- Use profile-list value selection as the source of truth for configured-gym stepped
  loads.
inputs:
  required:
  - renderer/src/workout-state.ts
  - renderer/src/workout-interaction.ts
  - renderer/src/app.test.ts
  - backend/src/application/workouts.rs
  optional: []
acceptance_criteria:
- id: ac-01
  statement: Configured-gym fractional load increments/decrements persist exact station
    profile values and no longer trigger profile-mismatch errors on save.
  verification:
    type: command
    command: npm --prefix renderer test && cargo test --manifest-path backend/Cargo.toml
      active_workout_selection_consistency_rejects_off_profile_set_loads_in_configured_gym
    expected: Renderer tests pass with explicit repeated fractional +/- save coverage
      using exact profile entries, and backend off-profile rejection test remains
      passing.
execution:
  plan_item_required: true
  risk_level: high
  boundary_impact:
  - renderer/workout-state
  - renderer/workout-interaction
  - renderer/tests
  - backend/application-validation
handoff:
  review_focus:
  - Verify persisted configured-gym fractional load values are exact selected-station
    profile entries across repeated +/- edits.
  - Verify no floating-point drift path remains between UI interactions and payload
    submission.
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 satisfied: configured-gym load normalization now snaps to
      canonical selected-station profile entries through workout-state helpers (`stepProfileLoad`
      and `snapToProfileLoad`), so persisted station-based loads remain exact profile
      values rather than derived floating-point results.'
    evidence: renderer/src/workout-state.ts applies profile-index stepping and canonical
      snap logic for configured-gym paths; renderer/src/workout-interaction.ts routes
      increment/decrement load controls through `stepProfileLoad`; renderer/src/app.test.ts
      includes `createApp persists exact configured-gym profile load after fractional
      decrement/increment stepping`, which runs repeated fractional +/- cycles and
      asserts payload `load_value` equals the exact profile value (27.333333333333332).
    runtime_build_check: 'PASS: npm --prefix renderer test (5 files, 63 tests) and
      cargo test --manifest-path backend/Cargo.toml active_workout_selection_consistency_rejects_off_profile_set_loads_in_configured_gym
      (1 passed).'
    residual_risk: 'Low: coverage is focused on renderer interaction/state paths and
      the targeted backend guardrail; residual risk is mainly future call sites bypassing
      canonicalization if new load mutation paths are introduced.'
