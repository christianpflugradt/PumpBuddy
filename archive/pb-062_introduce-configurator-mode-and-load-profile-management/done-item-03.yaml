version: 1
kind: backlog_item
item:
  id: pb-062-item-03
  title: Implement draft-safe load profile write lifecycle
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Backend create, update, rename, and draft-delete capabilities for load
    profiles that enforce status-based mutability and per-user name uniqueness.
  rationale: "The plan\u2019s core safety promise is that draft profiles stay editable\
    \ while historical profiles preserve load meaning, so the write lifecycle must\
    \ be explicit before renderer editors are built."
scope:
  in:
  - Add contract-backed create, update, and delete boundaries for load profiles.
  - Persist status values new|active|inactive and enforce definition and weight-unit
    mutability only while status is new.
  - Allow name changes across all statuses, with conflict handling suitable for renderer
    warning-confirmed rename flows.
  - Enforce per-user duplicate-name prevention in both application validation and
    durable persistence constraints.
  out:
  - User-driven transitions from new to active or inactive.
  - Renderer detail-screen implementation.
constraints:
- Preserve historical workout meaning by blocking definition mutation once a profile
  is active or inactive.
- Keep validation failures explicit and user-safe without leaking internal persistence
  details.
- Regenerate affected OpenAPI-derived artifacts instead of hand-editing generated
  code.
inputs:
  required:
  - agent/design/configurator-use-cases.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/api-contract.yaml
  optional:
  - backend/src/persistence/load_profiles.rs
  - backend/src/application/workouts.rs
acceptance_criteria:
- id: ac-01
  statement: Draft load profiles can be created, fully edited, and physically deleted
    through backend APIs with tests covering both fixed-list and formula definitions.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality checks pass with create, update, and draft-delete lifecycle
      coverage.
- id: ac-02
  statement: Active and inactive profiles reject definition or weight-unit mutation
    while still allowing unique-name updates, and duplicate names fail gracefully.
  verification:
    type: command
    command: make check-backend
    expected: Backend tests validate status-gated mutability and durable per-user
      name uniqueness enforcement.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: high
  boundary_impact:
  - api/openapi
  - backend/application
  - backend/persistence
  - database/load_profiles
handoff:
  review_focus:
  - Status-based write rules and conflict semantics for duplicate or immutable edits.
  - Migration or schema changes needed for normalized uniqueness and lifecycle safety.
review_feedback:
- at: '2026-08-18T15:01:36Z'
  source: review_result
  notes: "findings:\n- criterion: ac-02\n  evidence: backend/src/persistence/load_profiles.rs\
    \ enforces the immutable-field\n    guard for any status other than `new` (lines\
    \ 149-165), but the added API coverage\n    in backend/tests/api_workouts.rs:943-1058\
    \ seeds only an `active` historical profile\n    and never exercises the same\
    \ rename-or-mutation rules for an `inactive` profile.\n    The item acceptance\
    \ text explicitly requires active and inactive behavior to be\n    validated by\
    \ tests.\n  risk: A regression that only affects inactive profiles could pass\
    \ review and quality\n    gates unnoticed, leaving one of the two historical lifecycle\
    \ states without the\n    required acceptance evidence.\n"
  findings:
  - criterion: ac-02
    evidence: backend/src/persistence/load_profiles.rs enforces the immutable-field
      guard for any status other than `new` (lines 149-165), but the added API coverage
      in backend/tests/api_workouts.rs:943-1058 seeds only an `active` historical
      profile and never exercises the same rename-or-mutation rules for an `inactive`
      profile. The item acceptance text explicitly requires active and inactive behavior
      to be validated by tests.
    risk: A regression that only affects inactive profiles could pass review and quality
      gates unnoticed, leaving one of the two historical lifecycle states without
      the required acceptance evidence.
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 are satisfied. The implementation still provides
      draft create, full draft edit, and draft delete coverage, and the follow-up
      change closes the prior evidence gap by validating both active and inactive
      historical load profiles for rename success and immutable-field rejection.
    evidence: 'backend/tests/api_workouts.rs now seeds active, inactive, and new load
      profiles in load_profile_routes_enforce_duplicate_names_and_historical_mutation_rules
      and asserts: duplicate create conflicts, active rename success, inactive rename
      success, active immutable update conflict, inactive immutable update conflict,
      and duplicate rename conflict. The follow-up implementation commit 0b68375c
      is limited to that test evidence update, matching the returned finding without
      changing runtime behavior.'
    runtime_build_check: The implementation task ran make check-backend successfully
      after the follow-up test change; the captured run included the updated api_workouts
      suite with load_profile_routes_enforce_duplicate_names_and_historical_mutation_rules
      passing and the full backend quality gate finishing green.
    residual_risk: Residual risk is low and mainly limited to untested future status-transition
      behavior, which is explicitly out of scope for this item. The accepted coverage
      now matches the item requirement for both historical statuses under the current
      API surface.
  findings: []
