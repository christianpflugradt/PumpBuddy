version: 1
kind: item_plan

plan:
  item_id: "01"
  item_path: agent/execution/open-item-01.yaml
  title: Add GHCR backend publish path to release workflow

summary:
  goal: Wire semantic-release output into release workflow so backend images are built and pushed to GHCR with version tags.

context:
  required:
    - .github/workflows/release.yaml
    - backend/Dockerfile
  optional:
    - agent/strategy/engineering-guardrails.yaml

implementation_approach:
  - Extend the release workflow so the semantic-release job emits a concrete release version/tag output that downstream jobs can consume.
  - Add or update a backend image build/push step using `docker/build-push-action` targeting `ghcr.io`, reusing semantic-release job outputs for image tags.
  - Ensure GHCR publishing prerequisites are present (login/action usage and workflow permissions) while preserving existing workflow conventions and order.
  - Keep release as the source of truth by referencing semantic-release outputs instead of introducing separate version derivation logic.

risks_and_assumptions:
  - Current workflow may not expose semantic-release outputs yet; this item assumes we can add those outputs without changing release behavior.
  - GHCR push can fail if package permissions are missing or token scopes are insufficient; workflow permissions may need adjustment.
  - Tag formatting must stay valid for container tags (e.g., strip invalid prefixes only if necessary and consistent with current release tags).

validation_plan:
  - Run `rg -n "backend|ghcr.io|docker/build-push-action|tags:" .github/workflows/release.yaml` and confirm backend GHCR build-push config with version tag mapping is present.
  - Perform a YAML sanity check by reviewing job dependencies and expression references to ensure semantic-release outputs are consumed correctly.
  - Verify acceptance criterion `ac-01` is satisfied by confirming the workflow contains both GHCR target coordinates and semantic version tag wiring for the backend image job.

out_of_scope:
  - Runtime behavior changes in backend application code.
  - Publishing backend images to registries other than GHCR.

handoff_notes:
  - During implementation, reviewers should verify step ordering and that backend publish occurs only after version derivation is available.
  - Focus review on semantic version propagation, GHCR target naming, and required workflow permissions for package publish.
