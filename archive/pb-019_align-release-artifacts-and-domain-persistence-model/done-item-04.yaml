  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - design-domain-model
  - backend-domain-implementation
handoff:
  review_focus:
  - Correctness of doc-to-code mapping for domain entities.
  - Absence of accidental backend behavior changes while aligning.
