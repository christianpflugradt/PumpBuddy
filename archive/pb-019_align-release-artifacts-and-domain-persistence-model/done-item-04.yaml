  title: Align domain model design with backend Rust domain structures
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: '`agent/design/domain-model.yaml` accurately reflects current backend domain
    definitions used by Rust code.'
  rationale: The plan calls for removing conflicts between design documentation and
    implemented domain model.
scope:
  in:
  - Compare `agent/design/domain-model.yaml` against `backend/src/domain.rs`.
  - Update design model definitions to match implemented entities and relationships.
  out:
  - Introducing new domain features not required for alignment.
  - Renderer API contract changes.
constraints:
- Preserve existing backend behavior while reconciling documentation.
- Keep scope to confirmed mismatches only.
inputs:
