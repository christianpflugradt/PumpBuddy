version: 1
kind: backlog_item
item:
  id: pb-053-item-01
  title: Align renderer network types with generated OpenAPI models
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-consistency-findings.yaml
intent:
  outcome: The renderer API boundary consumes generated OpenAPI request and response
    models, and CI verifies those generated artifacts stay in sync with agent/design/api-contract.yaml.
  rationale: This restores a single contract authority instead of maintaining parallel
    handwritten network schemas in the renderer.
scope:
  in:
  - replace handwritten renderer API request and response typing at the fetch boundary
    with generated OpenAPI models or thin adapters derived from them
  - decide where renderer-local UI state types should stop and contract-derived network
    types should begin
  - add build or CI verification so frontend generated artifacts cannot silently drift
    from the OpenAPI contract
  out:
  - feature-level UX changes unrelated to contract consumption
  - backend endpoint behavior changes unless required to repair contract mismatches
    discovered during integration
constraints:
- keep agent/design/api-contract.yaml as the single contract authority
- preserve existing endpoint paths and payload semantics
- use make targets only for quality and test verification commands
inputs:
  required:
  - agent/design/api-contract.yaml
  - agent/strategy/engineering-guardrails.yaml
  - Makefile
  - renderer/src/workout-api.ts
  - renderer/src/workout-types.ts
  - renderer/src/auth-gate.ts
  optional:
  - renderer/dist/generated/openapi/typescript
acceptance_criteria:
- id: ac-01
  statement: Renderer network-boundary code uses generated OpenAPI models or adapters
    derived from them, and contract drift is checked during normal repository verification.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with generated-contract integration in place and
      no remaining contract drift at the fetch boundary.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: high
  boundary_impact:
  - renderer
  - api_contract
  - build_ci
handoff:
  review_focus:
  - verify generated models are the only authority for wire-level payload shapes
  - verify renderer-local app state types remain separate from contract-derived network
    types
review_feedback:
- at: '2026-05-15T20:00:57Z'
  source: review-consistency:f-01
  notes: The repository says OpenAPI is canonical and generated artifacts should be
    reproducible in build or CI, but the renderer still depends on a handwritten request
    and response type layer plus manual payload translation at the network boundary.
- at: '2026-05-16T07:43:39Z'
  source: review_result
  notes: "findings:\n- criterion: AC-01 requires renderer network-boundary code to\
    \ use generated OpenAPI\n    models or adapters derived from them as the authority\
    \ for wire payloads.\n  evidence: Both active-workout resume and workout start\
    \ still call fetchJson<TrainingPlanExerciseVariantsResponse>\n    directly for\
    \ /api/training-plans/:id/options in renderer/src/workout-controller.ts:299\n\
    \    and renderer/src/workflow-orchestrator.ts:152. That response shape is still\
    \ handwritten\n    in renderer/src/workout-types.ts:400 even though TrainingPlanExerciseVariantsResponse\n\
    \    is defined in the OpenAPI contract at agent/design/api-contract.yaml:1544.\n\
    \  risk: A contract change to the training-plan options payload can still drift\
    \ past\n    the generated-model boundary and leave the renderer depending on a\
    \ stale handwritten\n    DTO, so the boundary-alignment goal for this item is\
    \ not complete yet.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: The remaining training-plan options fetch boundary now uses a generated
      OpenAPI response model plus a thin renderer adapter, and the implementation
      commit preserved the existing renderer-local state boundary while removing the
      last direct handwritten wire-contract consumer in start/resume flows.
    evidence: renderer/src/workout-api.ts adds loadTrainingPlanOptions and routes
      the endpoint through parseTrainingPlanOptionsResponse; renderer/src/openapi-contract.ts
      parses /api/training-plans/{trainingPlanId}/options with TrainingPlanExerciseVariantsResponseFromJSON
      and normalizes it into renderer-local option data; renderer/src/workout-controller.ts
      and renderer/src/workflow-orchestrator.ts now call loadTrainingPlanOptions instead
      of fetchJson<TrainingPlanExerciseVariantsResponse>; renderer/src/workout-api.test.ts
      and renderer/ui-smoke/zzz-hpp.spec.js both assert the canonical exercise_variants
      payload shape.
    runtime_build_check: make check-renderer passed for implementation commit 08f20e24
      on 2026-05-16, including regenerated frontend OpenAPI output and the renderer
      smoke/test stack.
    residual_risk: Renderer-local option types still mirror contract fields by design,
      so future schema changes still require adapter upkeep, but the wire-level authority
      is now centralized in generated OpenAPI models and the normal renderer verification
      path exercises that boundary.
  findings: []
