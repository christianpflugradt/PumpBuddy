version: 1
kind: backlog_item
item:
  id: pb-036-item-01
  title: Add LIFO Delete Control To Active Workout Set History
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Render a delete control only for the latest completed set row in the current
    exercise set history.
  rationale: Enforces strict last-in-first-out deletion affordance and prevents out-of-order
    set removal attempts.
scope:
  in:
  - Add an X delete affordance on the far right of completed set rows in the active
    workout exercise view.
  - Show the delete affordance only for the most recently recorded completed set row.
  - Keep non-latest set rows non-deletable in the UI.
  out:
  - Persisting deletion mutations.
  - Confirmation modal behavior.
constraints:
- Preserve existing web component architecture and current styling conventions.
- Keep row layout stable while adding right-aligned delete affordance.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/strategy/engineering-guardrails.yaml
  - agent/strategy/test-strategy.yaml
  optional:
  - agent/design/workout-use-cases.yaml
  - agent/design/domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Completed set history renders a right-aligned delete X only on the newest
    set row for the current exercise.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer quality checks pass with tests covering latest-row-only delete
      affordance visibility.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - renderer/workout-active-flow
handoff:
  review_focus:
  - Verify latest-set-only visibility logic across bilateral and unilateral set histories.
  - Verify no layout regressions in completed-set row rendering.
review_feedback:
- at: '2026-04-05T19:50:26Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01\n  evidence: The delete X renders only for\
    \ the latest row, but it is emitted as a disabled\n    button in renderer templates\
    \ (`renderer/src/pb-exercise-screen.ts`, `renderer/src/pb-set-history.ts`,\n \
    \   `renderer/src/workout-render.ts` all render `<button ... class=\"completed-set-delete\"\
    \n    ... disabled>`), so clicking the visible control does nothing.\n  risk:\
    \ The UI presents a delete affordance that users cannot activate, causing the\n\
    \    reported \"X icon cannot be clicked\" behavior and blocking expected progression\n\
    \    toward the follow-up confirmation/delete flow.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 satisfied; the delete control now renders as an enabled button
      only on the newest completed set row for the current exercise.
    evidence: Renderer templates in renderer/src/pb-exercise-screen.ts, renderer/src/pb-set-history.ts,
      and renderer/src/workout-render.ts render the delete X only when row.canDelete
      is true and no longer include a disabled attribute; shared latest-row eligibility
      is centralized via buildCompletedSetHistoryModel in renderer/src/completed-set-history.ts;
      coverage includes latest-row-only and clickable-action checks for bilateral
      and unilateral histories in renderer/src/pb-exercise-screen.test.ts and latest-row-only
      visibility in renderer/src/workout-render.test.ts.
    runtime_build_check: Not run manually during review; accept finalize is configured
      to run deterministic quality gates through agent/scripts/check/run-quality-gate.sh.
    residual_risk: Low; behavior depends on completed set ordering feeding buildCompletedSetHistoryModel,
      but current tests cover bilateral and unilateral multi-row visibility and click
      emission for the latest row.
