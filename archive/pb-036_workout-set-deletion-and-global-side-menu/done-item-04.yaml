version: 1
kind: backlog_item
item:
  id: pb-036-item-04
  title: Implement Global Burger Button And Side Menu Shell
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Workout selection screen has an absolute top-left burger button that toggles
    a side menu with outside-click dismissal.
  rationale: Introduces shared navigation entrypoint without disturbing current selection
    layout flow.
scope:
  in:
  - Add absolute-positioned burger button above workout selection layout flow.
  - Add side menu shell with Workout, Settings, and Log out entries.
  - Support open/close via burger toggle and outside-click dismissal.
  out:
  - Wiring Settings page content.
  - Wiring logout session-clearing behavior.
constraints:
- Keep visual style consistent with existing web component design language.
- Ensure menu interactions are keyboard/mouse predictable without focus traps.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/strategy/engineering-guardrails.yaml
  - agent/strategy/test-strategy.yaml
  optional:
  - agent/design/workout-capabilities.yaml
  - agent/design/glossary.yaml
acceptance_criteria:
- id: ac-01
  statement: Burger/side-menu open-close behavior works from workout selection screen
    and does not shift surrounding layout.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer quality checks pass with coverage for toggle and outside-click
      dismissal behavior.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - renderer/navigation-shell
handoff:
  review_focus:
  - Verify absolute positioning and no layout shift.
  - Verify outside-click and toggle-close behavior is robust.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 satisfied; workout selection now supports burger toggle open/close
      and outside-click dismissal without moving the existing start-screen panel flow.
    evidence: Renderer implementation adds absolute top-left burger control and fixed
      side-menu shell in renderer/src/pb-start-screen.ts with outside-click handling
      via window pointerdown capture and toggle-close via repeated burger action;
      styling in renderer/src/styles.scss positions the burger absolutely and overlays
      menu/backdrop outside layout flow; renderer/src/pb-start-screen.test.ts covers
      toggle open/close, outside-click dismissal, and confirms the start panel remains
      a direct shell child to guard against layout-shift regressions.
    runtime_build_check: Not run manually during review; accept finalize is configured
      to execute deterministic quality gates through agent/scripts/check/run-quality-gate.sh.
    residual_risk: Low; main remaining risk is future navigation wiring for enabled
      menu entries, while current shell interaction behavior is covered by renderer
      tests.
