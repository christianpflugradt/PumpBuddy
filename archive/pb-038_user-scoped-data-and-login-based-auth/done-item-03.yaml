version: 1
kind: backlog_item
item:
  id: pb-038-item-03
  title: User-scoped backend persistence for owned catalog tables
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Ensure backend reads and writes for newly user-owned catalog data consistently
    persist and filter by user_id.
  rationale: Enforce ownership isolation in repository/query paths beyond schema-level
    safeguards.
scope:
  in:
  - Update backend persistence and query modules for exercises, gyms, load_profiles,
    equipment_stations, exercise_variants, and variant equipment compatibilities to
    include user_id.
  - Add or update backend tests to verify user-scoped filtering and insertion behavior
    for affected paths.
  out:
  - Login/auth endpoint contract changes.
  - Renderer login/settings UI updates.
  - Seed SQL edits.
constraints:
- Keep domain payload shape stable unless a user_id field is already part of public
  contract requirements.
- Follow existing backend layering and sqlx usage patterns.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/persistence-model.yaml
  - backend
  optional:
  - agent/design/workout-use-cases-to-domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Affected backend repositories always bind user_id on write and filter
    by user_id on read.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality checks, including updated persistence tests, pass.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend
  - database
handoff:
  review_focus:
  - Query filtering coverage and test assertions for cross-user isolation.
review_feedback:
- at: '2026-04-10T06:12:20Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01\n  evidence: Finalize quality gate (`make\
    \ check-backend`) fails on implementation commit\n    bdc4a4c with a formatting\
    \ diff in backend/src/persistence/training_plans.rs (function\n    fetch_gym_summaries),\
    \ so acceptance verification does not pass.\n  risk: Item cannot be accepted while\
    \ the required backend quality gate is red; returning\n    now prevents promoting\
    \ changes that fail deterministic repository checks.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: Backend catalog repository read paths for scoped user-owned tables
      (exercises, gyms, load_profiles, equipment_stations, exercise_variants, and
      exercise_variant_equipment_compatibilities) are user-scoped via authenticated
      user_id propagation, and affected repository entry points consistently use user-scoped
      variants.
    evidence: Reviewed implementation commits bdc4a4c and 9b3bec3; handlers now call
      user-scoped repository methods, persistence queries add user_id filters across
      joins involving gyms/exercises/variants/stations/load profiles/compatibilities,
      and integration tests validate cross-user isolation for gym summaries and station
      profile load lookup.
    runtime_build_check: Manual verification passed on 2026-04-10 via `make check-backend`
      in the repository workspace; finalize quality gate remains authoritative.
    residual_risk: Catalog table write paths are largely seed/migration driven in
      current backend runtime code, so regression risk is primarily in future query
      additions that bypass user-scoped repository methods without equivalent isolation
      tests.
