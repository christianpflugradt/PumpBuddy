version: 1
kind: backlog_item
item:
  id: pb-052-item-02
  title: Align backend integration test container PostgreSQL major with runtime compose
    baseline
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-technology-findings.yaml
intent:
  outcome: Integration tests run on the same PostgreSQL major as runtime deployment
    topology.
  rationale: Matching engine major versions across test and runtime boundaries reduces
    hidden compatibility regressions in persistence and query behavior.
scope:
  in:
  - update backend testcontainer image tags to PostgreSQL 18 baseline
  - centralize the test PostgreSQL image reference to avoid duplicated version drift
  - validate integration tests continue to bootstrap schema and seed data on aligned
    major
  out:
  - migration of schema objects to new SQL features
  - changes to production compose networking
  - changes to public API behavior
constraints:
- keep backend persistence access through sqlx
- preserve existing Testcontainers-based integration strategy
- retain make target based quality execution
inputs:
  required:
  - backend/src/test_support.rs
  - backend/tests/support/mod.rs
  - runtime/compose/compose.dev.yaml
  - runtime/compose/compose.prod.yaml
  - agent/strategy/test-strategy.yaml
  optional: []
acceptance_criteria:
- id: ac-01
  statement: All backend Testcontainers PostgreSQL image references use the runtime-major
    baseline.
  verification:
    type: command
    command: make check-backend
    expected: Integration tests pass while running against PostgreSQL major 18.
- id: ac-02
  statement: Test container image version is defined in one maintainable location
    to prevent future drift.
  verification:
    type: command
    command: make check-backend
    expected: No duplicate hardcoded PostgreSQL major strings remain in backend test
      support.
execution:
  plan_item_required: false
  plan_item_skip_reason: Narrow test-runtime dependency alignment in isolated support
    modules without API or schema redesign.
  risk_level: medium
  boundary_impact:
  - backend_integration_test_runtime
  - persistence_compatibility_confidence
handoff:
  review_focus:
  - verify aligned engine version is used in both unit-integrated and cross-module
    integration harnesses
  - verify no residual version mismatch remains in test helpers
review_feedback:
- at: '2026-04-26T07:36:24Z'
  source: review-technology:f-02
  notes: Runtime compose stacks use PostgreSQL 18 while backend Testcontainers-based
    integration tests run PostgreSQL 17, so persistence coverage does not execute
    against the same major engine used by the deployed topology.
