version: 1
kind: item_plan
plan:
  item_id: '07'
  item_path: agent/execution/items/done-item-07.yaml
  title: Split workout orchestration and persistence integration suites
summary:
  goal: Extract large workflow and integration test files into responsibility-focused
    modules without changing workout behavior or confidence.
context:
  required:
  - agent/execution/items/open-item-07.yaml
  - renderer/src/workout-controller.ts
  - backend/tests/persistence_integration.rs
  - agent/strategy/engineering-guardrails.yaml
  - agent/strategy/test-strategy.yaml
  optional:
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/domain-model.yaml
implementation_approach:
- Inventory current workout-controller responsibilities and define extraction seams
  for screen-data loading, elapsed-seconds timer behavior, settings mutations, and
  navigation orchestration while preserving the public orchestration entrypoints.
- Move each responsibility into focused renderer modules with shared interfaces/helpers
  where needed, keeping side-effect ordering deterministic and unchanged for start/resume
  workout flows.
- Break backend persistence integration scenarios into themed test modules (for example
  session lifecycle, workout state persistence, and resume/restore behavior) and centralize
  shared setup/assertion helpers to avoid duplication.
- Keep scenario names and assertions behavior-oriented so failures localize to a specific
  domain module without reducing integration coverage.
risks_and_assumptions:
- Assumes current controller logic can be extracted behind stable orchestration boundaries
  without introducing circular imports or hidden lifecycle coupling.
- 'Risk: refactor-only extraction can accidentally reorder timer/settings side effects;
  preserve execution order and assert behavior in existing tests.'
- 'Risk: test splitting may reduce readability if helpers become too implicit; keep
  shared fixtures thin and scenario intent explicit.'
validation_plan:
- make check-renderer
- make check-backend
out_of_scope:
- Feature expansion, UX redesign, or schema/API contract changes not required to complete
  the decomposition safely.
- New persistence features beyond preserving current integration coverage during file/module
  extraction.
handoff_notes:
- Review should concentrate on responsibility boundaries and whether orchestration
  behavior stays stable in workout execution and resume paths.
- Verify backend integration failures are easier to localize by module while maintaining
  deterministic coverage expectations.
