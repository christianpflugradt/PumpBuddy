version: 1
kind: backlog_item
item:
  id: pb-026-item-05
  title: Reconcile Training Plan Detail Contract Surface
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-consistency-findings.yaml
intent:
  outcome: API contract and implementation expose the same training-plan endpoints.
  rationale: Contract-first guardrails require API surface and OpenAPI to evolve together.
scope:
  in:
  - Add or remove the training-plan detail endpoint so router and OpenAPI are equivalent.
  - Regenerate backend and renderer OpenAPI artifacts after the contract decision.
  out:
  - Changes to workout execution behavior.
constraints:
- Keep `agent/design/api-contract.yaml` as canonical source.
- Preserve session-required access control for protected routes.
inputs:
  required:
  - agent/design/api-contract.yaml
  - backend/src/api/router.rs
  - renderer/src/workout-api.ts
  optional: []
acceptance_criteria:
- id: ac-01
  statement: The training-plan detail route is either documented in OpenAPI and generated
    models, or removed from runtime and renderer usage.
  verification:
    type: command
    command: rg -n "/training-plans/\{trainingPlan(Id|_id)\}" agent/design/api-contract.yaml
      backend/src/api/router.rs renderer/src/workout-api.ts
    expected: Route definitions and route usage are intentionally aligned with no
      undocumented runtime path.
execution:
  plan_item_required: true
  risk_level: high
  boundary_impact:
  - api_contract
  - backend_router
  - renderer_api_client
handoff:
  review_focus:
  - contract_first_alignment
  - generated_model_coverage
review_feedback:
- at: '2026-03-27T21:52:03Z'
  source: review-consistency:f-01
  notes: Runtime exposes and consumes `/api/training-plans/{id}` detail, but the canonical
    OpenAPI contract does not define this path.
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 satisfied: training-plan detail is now documented in the
      canonical OpenAPI contract and remains intentionally present in backend runtime
      and renderer usage.'
    evidence: agent/design/api-contract.yaml:82-99 defines `/api/training-plans/{trainingPlanId}`
      with `getTrainingPlan`; backend/src/api/router.rs:31-34 exposes `/training-plans/{training_plan_id}`
      and routes to `get_training_plan`; renderer/src/workout-api.ts:90-94 calls `/api/training-plans/${encodeURIComponent(trainingPlanId)}`
      for detail loading. These references align on one intentional runtime endpoint
      shape despite path-parameter naming style differences.
    runtime_build_check: 'PASS: verified route alignment with `rg -n "/training-plans/\{trainingPlan(Id|_id)\}"
      agent/design/api-contract.yaml backend/src/api/router.rs renderer/src/workout-api.ts`
      plus supplemental `rg -n "trainingPlanId|training_plan_id|/training-plans/"
      agent/design/api-contract.yaml backend/src/api/router.rs renderer/src/workout-api.ts`
      to account for snake_case backend parameter naming.'
    residual_risk: Low residual risk. Backend and renderer alignment is explicit,
      but acceptance relies on static route verification in this review pass and does
      not re-run full backend/renderer generation or end-to-end API contract tests.
