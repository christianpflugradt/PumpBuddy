version: 1
kind: backlog_item
item:
  id: pb-026-item-01
  title: Establish Shared Workout Load Display Rule
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Define and centralize one canonical load rounding and formatting rule used
    by workout load UI surfaces.
  rationale: A single source of truth prevents drift between load input rendering
    and completed-set row rendering.
scope:
  in:
  - Introduce a shared load display helper usable by both load-input and completed-set
    rendering code paths.
  - Align helper behavior to two-decimal display semantics with trailing-zero trimming
    for equivalent values.
  out:
  - Changing persisted load precision or API payload serialization behavior.
constraints:
- Preserve exact numeric values in workout state and payloads while only normalizing
  user-facing display text.
inputs:
  required:
  - agent/execution/plan.yaml
  - renderer/src/workout-state.ts
  - renderer/src/workout-render.ts
  optional:
  - renderer/src/workout-types.ts
acceptance_criteria:
- id: ac-01
  statement: A single shared formatter exists and both workout-state load input formatting
    and workout-render load display formatting use it.
  verification:
    type: command
    command: npm --prefix renderer run vitest:run -- src/workout-state.test.ts src/workout-render.test.ts
    expected: Vitest passes and no duplicated competing load display formatter remains
      in the touched modules.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer/src/workout-state.ts
  - renderer/src/workout-render.ts
handoff:
  review_focus:
  - Verify shared formatter semantics are applied consistently without introducing
    module coupling regressions.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 satisfied: a single shared formatter exists in renderer/src/workout-load-display.ts
      and both workout-state and workout-render consume it.'
    evidence: renderer/src/workout-state.ts imports formatLoadDisplayNumber from ./workout-load-display
      and uses it via formatLoadInputValue; renderer/src/workout-render.ts imports
      formatLoadDisplayNumber and uses it via formatLoadValue; no competing formatter
      definitions remain in touched modules.
    runtime_build_check: 'PASS: npm --prefix renderer run vitest:run -- src/workout-state.test.ts
      src/workout-render.test.ts (2 files, 10 tests passed).'
    residual_risk: Low residual risk. Shared helper coupling is limited to presentation
      formatting and does not alter persisted numeric values; edge-decimal behavior
      remains covered by existing tests.
