version: 1
kind: backlog_item
item:
  id: pb-031-item-03
  title: Implement Most-Recent Fallback Variant+Station Default
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Start screen fallback selector preselects the most recently completed matching
    variant+station combination.
  rationale: Fallback default behavior should prioritize the user's latest matching
    setup while staying deterministic under ties.
scope:
  in:
  - Update fallback default-selection logic to choose the latest matching variant+station
    completion timestamp.
  - Keep deterministic tie-breaking by existing option order when recency matches.
  - Add targeted tests for no-history, mixed-history, and equal-recency fallback-option
    cases.
  out:
  - Training plan default-selection behavior.
constraints:
- Match on configured-gym fallback variant+station identity, not partial attributes.
- Deterministic tie-breaking must follow first matching option in current order.
- Avoid changing persisted identifier formats.
inputs:
  required:
  - renderer/src/pb-fallback-selector.ts
  - renderer/src/pb-start-screen.ts
  - renderer/src/pb-fallback-selector.test.ts
  optional:
  - renderer/src/workout-state.ts
acceptance_criteria:
- id: ac-01
  statement: Renderer tests prove fallback defaults choose the most recent matching
    variant+station and preserve first-order tie handling.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with regression coverage for fallback recency selection
      and deterministic ties.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer_fallback_selection
  - renderer_start_screen_integration
handoff:
  review_focus:
  - Matching logic uses full variant+station identity.
  - Tie-break behavior is deterministic and order-based.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'AC-01 satisfied: configured-gym fallback default selection now
      picks the most recently completed variant+station option, and equal-recency
      ties remain deterministic by preserving first option order.'
    evidence: '`selectMostRecentFallbackOption` compares `last_completed_at` recency
      scores and only replaces the selection when a candidate is strictly newer, which
      enforces most-recent selection while keeping first-order tie behavior (`renderer/src/workout-state.ts`).
      Focused renderer tests cover no-history default-to-first, mixed-history most-recent
      variant+station selection, and equal-recency first-order tie handling (`renderer/src/workout-state.test.ts`).'
    runtime_build_check: Pending finalize quality gate execution via `agent/scripts/task/review-item/finalize.sh
      03 accept` (review flow policy delegates deterministic validation to finalize).
    residual_risk: 'Low: core recency and tie-break semantics are asserted in targeted
      renderer tests; residual risk is limited to malformed timestamp edge cases beyond
      this item scope.'
