version: 1
kind: backlog_item
item:
  id: pb-031-item-06
  title: Uplift Coverage For Controller And Orchestration Core
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Add high-value tests for controller/orchestration paths to materially raise
    coverage in the most under-covered workflow core files.
  rationale: Core flow modules have the largest coverage deficits and highest regression
    impact.
scope:
  in:
  - Add targeted tests for `renderer/src/workout-controller.ts` (baseline 14.55% lines,
    31/213) covering state transitions, command dispatch, and error handling.
  - Add targeted tests for `renderer/src/workflow-orchestrator.ts` (baseline 32.00%
    lines, 64/200) covering orchestration branching and failure/retry paths.
  - Add targeted tests for `renderer/src/workout-render.ts` (baseline 43.00% lines,
    43/100) covering render path selection and guard behavior.
  out:
  - Refactors of production workflow architecture not required for testability.
constraints:
- Tests must validate user-visible workflow behavior instead of private implementation
  details.
- Keep fixtures deterministic and minimal to avoid brittle orchestration tests.
- Focus on meaningful branch/path coverage, not synthetic assertion inflation.
inputs:
  required:
  - renderer/src/workout-controller.ts
  - renderer/src/workflow-orchestrator.ts
  - renderer/src/workout-render.ts
  - renderer/src/workout-controller.test.ts
  - renderer/src/workflow-orchestrator.test.ts
  - renderer/src/workout-render.test.ts
  optional:
  - renderer/src/workout-state.ts
acceptance_criteria:
- id: ac-01
  statement: New and updated tests cover key controller/orchestration/render branches
    and materially improve line coverage for the three targeted files.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with expanded tests for targeted workflow core
      behaviors and measurable coverage gain in the targeted files.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer_workflow_core
  - renderer_unit_tests
handoff:
  review_focus:
  - Test cases exercise meaningful workflow branches and failure paths.
  - Coverage gains correspond to real behavior checks, not mock-only assertions.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'AC-01 satisfied: renderer workflow-core tests now cover key controller/orchestration/render
      branches and materially improve line coverage across all three targeted files.'
    evidence: '`make check-renderer` passed with expanded workflow-core tests (`83`
      tests across `18` files). Coverage for targeted files improved from the item
      baseline to current run results: `renderer/src/workout-controller.ts` `31/213`
      (14.55%) -> `67/213` (31.46%), `renderer/src/workflow-orchestrator.ts` `64/200`
      (32.00%) -> `96/200` (48.00%), and `renderer/src/workout-render.ts` `43/100`
      (43.00%) -> `88/100` (88.00%). Added tests exercise user-visible behavior branches
      including start-screen input/action dispatch and cancel confirmation (`renderer/src/workout-controller.test.ts`),
      configured-gym/free-mode start branching plus blocked-start and skip-persist
      flows (`renderer/src/workflow-orchestrator.test.ts`), and render guards for
      fallback-confirmation and read-only navigation states (`renderer/src/workout-render.test.ts`).'
    runtime_build_check: 'Passed: `make check-renderer` (lint, tests, and coverage)
      completed successfully during review.'
    residual_risk: 'Low: targeted branch/failure-path coverage improved substantially
      in the highest-deficit workflow files; residual risk is limited to untested
      edge interactions outside the scoped controller/orchestration/render paths.'
