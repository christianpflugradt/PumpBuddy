version: 1
kind: backlog_item
item:
  id: pb-035-item-02
  title: Remove Deprecated workout_sets.reps Usage
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Eliminate `workout_sets.reps` as a persisted schema dependency so `repetition_value`
    is the only supported workout-set repetition field.
  rationale: The plan explicitly deprecates `workout_sets.reps` and requires repository
    behavior to rely on `repetition_value`.
scope:
  in:
  - Remove `workout_sets.reps` column/constraint/trigger references from `runtime/database/00-schema.sql`.
  - Update backend persistence SQL touchpoints if any still reference `workout_sets.reps`.
  out:
  - Renaming domain-level `reps` API fields that map to `repetition_value` semantics.
constraints:
- Preserve API response/request semantics expected by existing clients.
- Avoid introducing compatibility logic that reintroduces `workout_sets.reps` writes.
inputs:
  required:
  - agent/execution/plan.yaml
  - runtime/database/00-schema.sql
  - backend/src
  optional:
  - backend/tests
acceptance_criteria:
- id: ac-01
  statement: Deprecated `workout_sets.reps` schema artifacts are removed.
  verification:
    type: command
    command: '! rg -n "reps INTEGER|workout_sets_reps_positive_check|NEW\\.reps|SET
      repetition_value = reps|AND reps IS NOT NULL" runtime/database/00-schema.sql'
    expected: Command exits successfully with no matches.
- id: ac-02
  statement: Backend persistence code does not reference `workout_sets.reps` in SQL
    paths.
  verification:
    type: command
    command: '! rg -n "workout_sets\\.reps" backend/src'
    expected: Command exits successfully with no matches.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - runtime_database_schema
  - backend_persistence
handoff:
  review_focus:
  - Confirmation that `repetition_value` remains the single persisted repetition source.
  - Regression risk around workout set write/read queries.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 satisfied; deprecated `workout_sets.reps` schema
      artifacts are removed and backend SQL paths contain no `workout_sets.reps` references.
    evidence: Verified acceptance checks by searching `runtime/database/00-schema.sql`
      for deprecated reps artifacts (no matches) and `backend/src` for `workout_sets.reps`
      (no matches); direct schema inspection confirms `workout_sets` persists `repetition_value`
      with positive-check constraint as the sole repetition column.
    runtime_build_check: Not run manually during review per policy; finalize accept
      path executes deterministic quality gate via agent/scripts/check/run-quality-gate.sh.
    residual_risk: Low; client-facing domain aliases that use `reps` naming remain
      mapped to `repetition_value`, with minor risk only if undiscovered external
      SQL consumers still depend on removed legacy column semantics.
