version: 1
kind: backlog_item
item:
  id: pb-040-item-01
  title: Rename plan option persistence identifiers
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Database migration renames plan option table/column constraint and trigger
    identifiers to training plan exercise variant terminology without changing data
    semantics.
  rationale: Establishes the storage-layer naming baseline required for safe cross-layer
    terminology migration.
scope:
  in:
  - Add migration updates for `plan_exercise_options` to `training_plan_exercise_variants`
    and `workout_exercises.selected_plan_exercise_option_id` to `selected_training_plan_exercise_variant_id`.
  - Rename related foreign key, unique, check, index, and trigger identifiers that
    reference old names.
  out:
  - Backend and renderer code-level type/field renames.
  - Auth logging and settings UX changes.
constraints:
- Preserve existing data, constraints, and behavioral semantics while applying identifier/name
  changes.
- Keep PostgreSQL as the authoritative persistence store and avoid ORM-oriented rewrites.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/persistence-model.yaml
  optional:
  - backend/tests/persistence_integration.rs
acceptance_criteria:
- id: ac-01
  statement: Migration files rename the specified table/column identifiers and dependent
    DB object names consistently.
  verification:
    type: command
    command: rg -n "plan_exercise_options|selected_plan_exercise_option_id" backend/migrations
    expected: Only intentional legacy references remain; renamed identifiers are present
      for active schema objects.
- id: ac-02
  statement: Backend persistence checks still pass with the renamed schema.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality/test suite passes without schema-regression failures.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - database
handoff:
  review_focus:
  - Migration preserves constraints and trigger behavior while renaming only identifiers/terms.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 satisfied for this item scope; schema identifiers
      were renamed to training-plan-exercise-variant terminology with intentional
      legacy compatibility references documented.
    evidence: Implementation commit 7e7d9b4 renames `plan_exercise_options` table
      identifiers to `training_plan_exercise_variants`, renames timestamp trigger
      to `training_plan_exercise_variants_set_row_timestamps`, adds `selected_training_plan_exercise_variant_id`,
      and retains explicitly commented compatibility aliases (`plan_exercise_options`
      view and `selected_plan_exercise_option_id` mirror) to preserve behavior during
      phased rollout.
    runtime_build_check: Accept finalize will run deterministic quality gate script
      `agent/scripts/check/run-quality-gate.sh` for this review item; no additional
      manual full-suite run was needed during review.
    residual_risk: Legacy compatibility view/column sync trigger remain transitional
      coupling points until downstream terminology migration is fully complete; risk
      is limited by explicit comments and synchronized trigger enforcement.
