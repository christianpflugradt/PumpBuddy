version: 1
kind: backlog_item
item:
  id: pb-040-item-06
  title: Surface login name and registration date in settings data flow
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Settings data contract and backend/renderer mapping provide current user
    login name and registration date for display.
  rationale: Enables the upgraded settings profile view requirements with explicit
    session/profile fields.
scope:
  in:
  - Extend session/profile payloads to include login name and registration date fields
    for the current user.
  - Map backend response fields into renderer settings state and render date-only
    output in user-local timezone.
  out:
  - Display-name edit interaction controls.
  - Auth-failure logging behavior.
constraints:
- Preserve existing authentication/session trust boundaries and avoid exposing sensitive
  credentials.
- Keep user-facing copy in English unless explicitly changed.
inputs:
  required:
  - agent/design/api-contract.yaml
  - backend/src/api/models.rs
  - renderer/src/pb-settings-screen.ts
  optional:
  - renderer/src/pb-settings-screen.test.ts
acceptance_criteria:
- id: ac-01
  statement: Settings view can render login name and registration date from current-session/profile
    data.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer settings tests pass with new fields displayed.
- id: ac-02
  statement: Backend/API mapping supports session/profile response fields for login
    name and registration date.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality/test suite passes with updated response models.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - api
handoff:
  review_focus:
  - Contract/backend/renderer alignment for new settings-facing session user fields.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 and ac-02 are satisfied: settings renders login plus registration
      date from session/profile data, and backend/API mapping now carries both fields
      end-to-end.'
    evidence: AuthSessionUser contract includes login and registration_date (agent/design/api-contract.yaml);
      backend maps session.login and session.registration_date into AuthSessionUserResponse
      (backend/src/api/auth.rs, backend/src/application/auth.rs, backend/src/persistence/auth.rs);
      renderer maps registration_date to SessionUser.registrationDate and renders
      date-only output with fallback handling (renderer/src/auth-gate.ts, renderer/src/workout-types.ts,
      renderer/src/pb-settings-screen.ts); coverage updated to assert new mapping/rendering
      behavior (renderer/src/auth-gate.test.ts, renderer/src/pb-app-root.test.ts,
      renderer/src/pb-settings-screen.test.ts).
    runtime_build_check: Not run manually during review by policy; finalize accept
      executes deterministic quality gates via agent/scripts/check/run-quality-gate.sh
      for implementation-changed files.
    residual_risk: Low residual risk. registration_date remains optional in the contract/model,
      so users missing persisted values will see 'Unavailable'; this is consistent
      with current fallback behavior.
