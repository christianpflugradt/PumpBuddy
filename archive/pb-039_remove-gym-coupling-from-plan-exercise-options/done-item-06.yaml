  acceptance:
    criteria_met: ac-01 satisfied; domain, persistence, and API artifacts consistently
      model gym-agnostic plan exercise options with compatibility-derived configured-gym
      realizability and explicit blocked-start semantics.
    evidence: Domain model defines PlanExerciseOption as gym-agnostic with compatibility-derived
