    evidence: Commit `b173feb` updates `renderer/src/pb-exercise-screen.ts` so reps
      field renders `REPS` in a dedicated label and guidance in a separate `.set-row-field-guidance`
      span, preserving minus/input/plus control order; `renderer/src/pb-exercise-screen.test.ts`
      adds/updates assertions that `REPS` remains visible with guidance present and
