version: 1
kind: backlog_item
item:
  id: pb-037-item-08
  title: Prefix prior-set suggestions with "try "
  status_hint: done
  source:
    type: finalize_return
    reference: agent/tmp/finalize-plan-findings.yaml
intent:
  outcome: Display prior-set guidance text with the literal prefix "try " for reps
    and secs suggestion variants.
  rationale: Missing prefix creates ambiguous guidance copy and blocks acceptance
    of the suggestion UX requirement.
scope:
  in:
  - Update suggestion formatting for no-load reps and secs guidance to include static
    prefix "try ".
  - Keep existing numeric formatting semantics (`>=reps`, `>=m:ss`) after the prefix.
  out:
  - Changes to how prior values are selected from workout history.
  - Changes to load-based rep-range guidance copy.
constraints:
- Prefix must be exact lowercase text `try `.
- Keep current conditional rendering behavior when source data is absent.
inputs:
  required:
  - agent/design/workout-use-cases.yaml
  - agent/execution/plan.yaml
  optional: []
acceptance_criteria:
- id: ac-01
  statement: Prior-set guidance text renders as `try >=<reps>` for reps mode and `try
    >=m:ss` for secs mode whenever guidance is shown.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with assertions for prefixed reps and secs guidance
      strings.
execution:
  plan_item_required: true
  risk_level: medium
  boundary_impact:
  - renderer
handoff:
  review_focus:
  - Confirm exact prefix text and no regressions to guidance suppression rules.
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 satisfied; prior-set no-load guidance now renders with the
      exact lowercase prefix `try ` for both reps and secs variants while preserving
      existing threshold formatting semantics.
    evidence: Commit `9925693` updates `renderer/src/pb-exercise-screen.ts` to compose
      no-load prior guidance as `try >=${exerciseStep.suggestedSet.reps}` for reps
      mode and `try >=${formatSecondsToMinutesSeconds(...)}` for secs mode; `renderer/src/pb-exercise-screen.test.ts`
      updates assertions to full expected strings (`try >=12`, `try >=1:15`) and retains
      hide-when-missing coverage for no suggested prior values.
    runtime_build_check: Ran `make check-renderer` during review; quality gate passed
      end-to-end (lint, unit tests, coverage, and UI smoke).
    residual_risk: Low; coverage verifies prefixed reps/secs text and suppression
      behavior for missing prior values, with only minor residual risk around untested
      edge formatting variants.
