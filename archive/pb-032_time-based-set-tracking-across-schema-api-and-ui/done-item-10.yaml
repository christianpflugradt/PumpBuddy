acceptance_criteria:
- id: ac-01
  statement: Critical workflow E2E checks are executable via make and run in CI for
    relevant changes.
  verification:
    type: command
    command: make check-renderer
    expected: Targeted E2E smoke checks execute alongside renderer quality checks
      and pass.
execution:
  plan_item_required: true
