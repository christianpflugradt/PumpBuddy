      documentation updates and terminology alignment.
    evidence: '`rg "REPS|SECS|repetition" agent/design/domain-model.yaml agent/design/persistence-model.yaml`
      shows aligned repetition-kind semantics and integer repetition-value rules in
      both artifacts; `rg "timer|play|pause|reset|navigation|m:ss" agent/design/workout-use-cases.yaml
      agent/design/workout-capabilities.yaml` shows timed-set controls, one-second
      progression, m:ss formatting, and running-state navigation/set-confirmation
      lockout.'
    runtime_build_check: '`agent/scripts/check/run-quality-gate.sh agent/execution/items/review-item-01.yaml`
