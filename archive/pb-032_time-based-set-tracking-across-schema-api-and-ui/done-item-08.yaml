version: 1
kind: backlog_item
item:
  id: pb-032-item-08
  title: Make backend OpenAPI generation an enforced prerequisite for runtime/build
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-technology-findings.yaml
intent:
  outcome: Backend build and runtime commands become deterministic on clean clones
    without manual pre-generation.
  rationale: Generated contract artifacts are currently required but not uniformly
    bootstrapped.
scope:
  in:
  - Enforce OpenAPI generation before backend build paths used by `make run-app` and
    container build flows.
  - Keep generated model wiring contract-first and reproducible.
  out:
  - API schema redesign.
constraints:
- Preserve `agent/design/api-contract.yaml` as canonical contract source.
- Keep quality/test execution interface make-based.
inputs:
  required:
  - Makefile
  - backend/Dockerfile
  - backend/src/models/mod.rs
  - agent/design/api-contract.yaml
  optional: []
acceptance_criteria:
- id: ac-01
  statement: Running the standard app startup path from a clean workspace no longer
    depends on manually pre-existing generated Rust models.
  verification:
    type: command
    command: make run-app
    expected: Compose startup succeeds without missing `backend/target/generated/openapi/rust/src/models`
      errors.
execution:
  plan_item_required: true
  risk_level: high
  boundary_impact:
  - backend
  - docker
  - api
handoff:
  review_focus:
  - Reproducibility of generated artifacts across local and CI flows.
  - Consistency between Make targets and Docker build requirements.
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 is satisfied because backend OpenAPI generation is now a prerequisite
      of the standard compose startup path, so clean-workspace startup no longer relies
      on pre-existing generated Rust models.
    evidence: 'In source commit `525ee5b585140e98ca639a3e89ed47722f8a497c`, `Makefile`
      changes wire `run-app: generate-openapi-backend` and `rebuild-app: generate-openapi-backend`;
      `make -n run-app` and `make -n rebuild-app` now both start with `rm -rf backend/target/generated/openapi/rust`
      and OpenAPI generator execution from `agent/design/api-contract.yaml` before
      compose build/run commands.'
    runtime_build_check: Pending finalize quality gate execution.
    residual_risk: Low residual risk remains that runtime validation still depends
      on Docker availability in the executing environment, but prerequisite wiring
      for deterministic generated-model bootstrap is in place.
review_feedback:
- at: '2026-04-04T06:29:21Z'
  source: review-technology:f-01
  notes: Backend compilation and container builds require OpenAPI-generated Rust model
    files under `backend/target/generated`, but this path is gitignored and not guaranteed
    by default runtime startup commands.
