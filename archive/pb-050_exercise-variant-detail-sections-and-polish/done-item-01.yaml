version: 1
kind: backlog_item
item:
  id: pb-050-item-01
  title: Personal records derivation for all supported metric families
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Add deterministic Personal Records derivation logic that correctly handles
    Load x Reps, Load x Seconds, Reps-only, and Seconds-only variants with required
    grouping, sorting, and row limits.
  rationale: Correct record derivation is the functional backbone for the remaining
    Personal Records UI and prevents duplicated formula logic across detail sections.
scope:
  in:
  - Introduce or extend renderer-side derivation utilities used by exercise variant
    detail to compute personal-record rows per supported metric family.
  - Enforce record grouping and stable sorting rules required by the plan, including
    deterministic tie-breaking.
  - Cap record row counts to the configured compact list target used by the detail
    screen.
  out:
  - Final visual table treatment and alternating row styling for Personal Records
    card.
  - Changes to backend persistence schema or API contract.
constraints:
- Reuse pb-049 shared helpers and avoid copy-pasting score or formatting formulas.
- Keep business logic outside custom element rendering template strings when practical.
- Preserve existing exercise detail data flow and navigation behavior.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/tmp/pb-050-plan.yaml
  - renderer/src/pb-exercise-variant-detail-screen.ts
  - renderer/src/exercise-performance-derivation.ts
  optional:
  - renderer/src/pb-exercise-variant-detail-screen.test.ts
  - agent/strategy/test-strategy.yaml
acceptance_criteria:
- id: ac-01
  statement: Personal Records derivation returns correct grouped/sorted/limited rows
    for all supported metric families and edge cases.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer quality suite passes with unit tests covering Load x Reps,
      Load x Seconds, Reps-only, Seconds-only, and tie/limit behavior.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - renderer/src/pb-exercise-variant-detail-screen.ts
  - renderer/src/exercise-performance-derivation.ts
  - renderer/src/pb-exercise-variant-detail-screen.test.ts
handoff:
  review_focus:
  - Verify record grouping/sorting rules match plan language for all metric families.
  - Confirm no duplicated business logic was introduced in template rendering.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 met: derivePersonalRecords implements grouped, deterministically
      sorted, compact-limited rows for LOAD_X_REPS, LOAD_X_SECONDS, REPS_ONLY, and
      SECONDS_ONLY families.'
    evidence: Verified implementation in renderer/src/exercise-performance-derivation.ts
      (metric family resolution, per-family grouping/sorting, deterministic tie-breakers,
      and PERSONAL_RECORDS_COMPACT_ROW_LIMIT=6) and behavior coverage in renderer/src/exercise-performance-derivation.test.ts
      (all four families plus tie/limit and unsupported/missing payload cases).
    runtime_build_check: Finalize acceptance runs deterministic quality gates through
      agent/scripts/check/run-quality-gate.sh for the implementation source commit.
    residual_risk: Tie precedence for load-family equal-value edge cases beyond current
      fixtures may still depend on source order/date quality; behavior is deterministic
      but additional targeted fixtures could increase confidence.
