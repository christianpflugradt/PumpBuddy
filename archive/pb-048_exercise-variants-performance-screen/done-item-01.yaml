version: 1
kind: backlog_item
item:
  id: pb-048-item-01
  title: Define exercises performance endpoint contract
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Publish canonical API contract entries for the 30-day exercises performance
    endpoint and payload schema.
  rationale: Establish contract-first boundaries so backend and renderer can implement
    against a stable response model.
scope:
  in:
  - Add path, operation, and response schema for the new exercises performance endpoint
    in the canonical contract file.
  - Model grouped payload semantics, including tone groups and row display fields
    required by the renderer.
  - Encode selected-station average, variant-wide session count, and not-enough-data
    signaling as explicit schema fields.
  out:
  - Backend handler or query implementation.
  - Renderer UI behavior and client-side filtering logic.
constraints:
- Keep naming and payload semantics aligned with existing Progress/Workout Completion
  tone vocabulary.
- Preserve contract-first workflow using agent/design/api-contract.yaml as the source
  of truth.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/api-contract.yaml
  optional:
  - agent/design/workout-capabilities.yaml
acceptance_criteria:
- id: ac-01
  statement: The canonical API contract declares one new exercises performance endpoint
    with request and response shapes that cover all renderer-required fields from
    the active plan.
  verification:
    type: command
    command: make refresh-api-clients
    expected: OpenAPI generator completes successfully for backend and frontend outputs
      without schema errors.
- id: ac-02
  statement: Contract descriptions differentiate selected-station scoring aggregates
    from variant-wide session counts to prevent renderer-side business derivation.
  verification:
    type: command
    command: make check
    expected: Repository quality checks pass after the contract update.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - api-contract
  - backend-generated-openapi
  - renderer-generated-openapi
handoff:
  review_focus:
  - Endpoint naming and response shape match plan scope exactly.
  - Field semantics clearly separate selected-station and variant-wide metrics.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 met: `agent/design/api-contract.yaml` adds one new GET `/api/workouts/exercises-performance`
      operation and response schemas (`WorkoutExercisesPerformanceResponse`, `WorkoutExercisesPerformanceGroup`,
      `WorkoutExercisesPerformanceRow`) covering grouped tones and renderer-required
      row fields. ac-02 met: descriptions explicitly distinguish selected-station
      30-day average (`selected_station_average_score_30d`) from variant-wide session
      count (`variant_session_count_30d`) and encode not-enough-data via `performance_status`/`performance_tone`.'
    evidence: Reviewed implementation commit `c7bd3a1973ae6f2fe162bfaebee445f34d596115`
      with focused diff in `agent/design/api-contract.yaml`; validated endpoint wiring,
      schema fields, and semantic descriptions against `agent/execution/plans/plan-item-01.yaml`
      scope and acceptance.
    runtime_build_check: Deferred to finalize deterministic quality gate execution
      (`agent/scripts/check/run-quality-gate.sh`) for implementation-commit changed
      files.
    residual_risk: Low residual risk remains until deterministic quality gates finish;
      no scope or semantic contract gaps were found in review.
