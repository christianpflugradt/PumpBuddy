version: 1
kind: backlog_item
item:
  id: pb-058-item-01
  title: Backend Training Plan Browsing Projection
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Extend the canonical training-plan detail API into a backend-owned browsing
    projection for no-gym and selected-gym plan inspection.
  rationale: The current plan detail response contains only ordered exercises, while
    the existing options endpoint is workout-start-oriented and filters out unavailable
    station-required variants.
scope:
  in:
  - Extend the OpenAPI contract for GET /api/training-plans/{trainingPlanId} with
    an optional gymId query parameter and a renderer-ready browsing response shape.
  - Include plan name, ordered exercises, all configured exercise variants, target
    fields, variant execution metadata, and configured variant counts in no-gym responses.
  - Include selected-gym plan executability, optional compact summary text, per-exercise
    executable counts, green/yellow/red-equivalent backend status semantics, variant
    availability, and compatible station rows when gymId is provided.
  - Add backend domain, application, handler, and persistence projection code that
    derives availability from ExerciseVariantEquipmentCompatibility, ExerciseVariant.requires_station,
    and stations in the selected gym.
  - Preserve the current /api/training-plans/{trainingPlanId}/options start-workout
    behavior unless shared helper extraction is needed.
  out:
  - Creating, editing, or reordering training plans, exercises, variants, gyms, stations,
    load profiles, or compatibility mappings.
  - Moving workout-start fallback selection semantics from /options into the renderer.
  - Adding a new public endpoint path for plan browsing.
constraints:
- Keep OpenAPI YAML as the canonical contract and keep backend API models aligned
  with it.
- Keep plan executability, variant realizability, and station compatibility derivation
  server-side.
- In no-gym mode, do not emit availability status, traffic-light indicators, or station
  information for renderer display.
- In selected-gym mode, stationless variants are available and station-required variants
  are available only when at least one compatible station exists in the selected gym.
- Return all configured variants for the latest visible plan version, including unavailable
  variants in selected-gym mode.
- Preserve authenticated user scoping on plans, gyms, stations, variants, and compatibility
  rows.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/api-contract.yaml
  - backend/src/domain.rs
  - backend/src/api/models.rs
  - backend/src/api/handlers/training_plans.rs
  - backend/src/application/training_plans.rs
  - backend/src/persistence/mod.rs
  - backend/src/persistence/training_plans.rs
  optional:
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - backend/src/persistence/tests.rs
  - backend/src/api/router.rs
acceptance_criteria:
- id: ac-01
  statement: GET /api/training-plans/{trainingPlanId} returns all configured variants
    with target metadata in no-gym mode and omits selected-gym availability and station
    display fields.
  verification:
    type: command
    command: make check-backend
    expected: Backend checks pass, including focused coverage for the no-gym browsing
      projection.
- id: ac-02
  statement: GET /api/training-plans/{trainingPlanId}?gymId=... returns backend-owned
    plan executability, per-exercise status/counts, variant availability, and compatible
    station rows without filtering unavailable variants.
  verification:
    type: command
    command: make check-backend
    expected: Backend checks pass, including focused coverage for selected-gym availability
      and unavailable station-required variants.
- id: ac-03
  statement: Generated OpenAPI clients can be refreshed from the updated canonical
    contract without manual generated-file edits.
  verification:
    type: command
    command: make refresh-api-clients
    expected: Client generation completes successfully from agent/design/api-contract.yaml.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: high
  boundary_impact:
  - api_contract
  - backend_application
  - backend_persistence
  - renderer_generated_boundary
handoff:
  review_focus:
  - Verify no-gym responses do not leak selected-gym availability concepts.
  - Verify selected-gym responses include unavailable variants and derive compatible
    stations from backend data.
  - Verify /options remains suitable for workout start and is not repurposed as the
    browsing projection.
  - Verify user scoping and latest-plan-version selection are preserved.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'AC-01, AC-02, and AC-03 are met: the canonical detail endpoint
      supports no-gym and selected-gym browsing, includes configured variants and
      target metadata, derives selected-gym status server-side, and leaves /options
      as the filtered workout-start projection.'
    evidence: Reviewed agent/design/api-contract.yaml plus backend/src/api/handlers/training_plans.rs,
      backend/src/application/training_plans.rs, backend/src/persistence/training_plans.rs,
      and backend/tests/api_integration.rs. The detail SQL returns latest visible
      plan exercises with all configured variants; application metadata clears no-gym
      status/stations and derives selected-gym availability/count/status; the API
      integration test injects an unavailable variant, verifies it remains visible
      in detail, and verifies /options filters it out.
    runtime_build_check: Implementation evidence shows make check-backend and make
      check passed before finalize; review finalize will run the deterministic quality
      gate for the implementation commit.
    residual_risk: Residual risk is low and limited to future renderer consumption
      of the richer browsing projection, which this item explicitly left out of scope
      beyond generated boundary/test fixture alignment.
  findings: []
