version: 1
kind: backlog_item
item:
  id: pb-027-item-14
  title: Enforce Single-Primary and Outline Secondary Action Styling
  status_hint: done
  source:
    type: stakeholder_feedback
    reference: agent/tmp/workout_ui_spec.md
intent:
  outcome: Establish predictable action hierarchy where only primary actions are filled
    and secondary navigation is outline-based.
  rationale: Filled orange secondary buttons and strong effects still create competing
    call-to-action signals.
scope:
  in:
  - ensure only one filled primary action per screen state (green)
  - convert secondary navigation actions to outline style with orange accent rather
    than orange fill
  - keep destructive actions subtle/dashed and remove excessive glow intensity from
    non-primary actions
  - apply rules consistently to start, workout active/read states, and completion
    screen
  out:
  - changes to action semantics or workflow transitions
  - backend/API changes
constraints:
- preserve all existing data-action hooks and disable behavior
- keep palette direction aligned with agreed dark/green/orange system
inputs:
  required:
  - agent/tmp/workout_ui_spec.md
  - renderer/src/styles.scss
  - renderer/src/workout-render.ts
  - renderer/src/workout-render.test.ts
  optional:
  - agent/execution/plan.yaml
acceptance_criteria:
- id: ac-01
  statement: Action styling consistently enforces one filled primary action and outline
    secondary navigation across defined screen states.
  verification:
    type: command
    command: cd renderer && npm test
    expected: command exits 0 with renderer tests passing and hierarchy assertions
      updated
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer/src/styles.scss
  - renderer/src/workout-render.ts
  - renderer/src/workout-render.test.ts
handoff:
  review_focus:
  - verify no filled orange secondary navigation buttons remain
  - verify only one filled primary action is visible per screen state
  - verify destructive action remains visually de-emphasized
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 satisfied. Action styling enforces a single filled primary
      action while secondary navigation remains outline-based across start, active/read,
      and completion states.
    evidence: Commit 3736f11 updates renderer/src/styles.scss so .nav-button-secondary
      uses transparent background with orange border/text tokens (no orange fill),
      keeps .nav-button-primary as the filled gradient primary style, and leaves .nav-button-tertiary
      subtle/dashed. renderer/src/workout-render.test.ts adds explicit one-primary
      assertions in active, read, and completion state tests.
    runtime_build_check: PASS - `cd renderer && npm test` exited 0 on 2026-03-28 with
      5 test files passed and 76 tests passed.
    residual_risk: Low. Changes are scoped to workout action presentation tokens/selectors
      and renderer hierarchy assertions; action semantics, data-action hooks, and
      workflow transitions were not modified.
