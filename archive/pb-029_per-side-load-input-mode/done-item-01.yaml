item:
  id: pb-029-item-01
  title: Specify load_input_mode semantics in design sources
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Design documents define ExerciseVariant load_input_mode and canonical total-load
    persistence semantics.
  rationale: Establishes unambiguous contract language before any schema or code changes.
scope:
  in:
  - Update domain design to include ExerciseVariant.load_input_mode with TOTAL and
    PER_SIDE values.
  - Update persistence design to state workout_sets remain canonical total load regardless
    of input mode.
  - Update API contract design notes so active workout payloads expose renderer-ready
    load semantics for PER_SIDE.
  out:
  - Database migrations or seed SQL implementation.
  - Runtime Rust or renderer code edits.
constraints:
- Keep terminology consistent across domain, persistence, and API design files.
- Preserve canonical total-load storage as the only persisted workout-set load representation.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/api-contract.yaml
  optional:
  - agent/design/glossary.yaml
acceptance_criteria:
- id: ac-01
  statement: Design docs include explicit load_input_mode semantics and canonical
    total-load persistence rule.
  verification:
    type: command
    command: rg -n "load_input_mode|PER_SIDE|canonical total" agent/design/domain-model.yaml
      agent/design/persistence-model.yaml agent/design/api-contract.yaml
    expected: Matches in all three files showing aligned semantics.
