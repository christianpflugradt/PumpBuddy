  - backend/src/domain.rs
  - backend/src/persistence/workouts.rs
  - backend/src/persistence/active_workouts.rs
  - backend/src/api/models.rs
  - backend/init.sql
  - .github/workflows/release.yaml
  - README.md
  - agent/scripts/task/finalize-plan/finalize.sh
  - agent/scripts/task/extended-review/finalize.sh
  - agent/execution/workflow-state.yaml
refinement_note: |
  Refinement should derive execution items from this plan.
  Prioritize c-01 and c-02 implementation slices first, then release/workflow/documentation hardening slices.
  Ensure each item includes explicit verification for version-binding invariants and free-mode null-gym semantics.
  Ensure each c-01/c-02 item includes at least one negative-path verification (expected rejection/failure case), not only happy-path checks.
