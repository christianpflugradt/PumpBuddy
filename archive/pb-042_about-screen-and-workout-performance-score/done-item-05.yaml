version: 1
kind: backlog_item
item:
  id: pb-042-item-05
  title: Align Design Docs With Performance Score Persistence
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Update domain and persistence design documents to reflect `performance_score`
    field and completion-time semantics.
  rationale: Implemented behavior must remain traceable in canonical design artifacts.
scope:
  in:
  - Update `agent/design/domain-model.yaml` for `WorkoutExercise` attributes/semantics
    including `performance_score`.
  - Update `agent/design/persistence-model.yaml` tables/decisions/checks to include
    `workout_exercises.performance_score` and completion-time write semantics.
  - Keep `agent/design/api-contract.yaml` unchanged for this plan scope.
  out:
  - Adding new API request/response fields.
  - Non-related design-document refactors.
constraints:
- Preserve existing naming conventions and source-of-truth structure.
- Keep semantics consistent with completion-only score writes from backend.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  optional:
  - agent/design/api-contract.yaml
  - agent/design/glossary.yaml
acceptance_criteria:
- id: ac-01
  statement: Domain and persistence design docs both describe `performance_score`
    and its completion-time semantics.
  verification:
    type: command
    command: rtk rg "performance_score" agent/design/domain-model.yaml agent/design/persistence-model.yaml
    expected: Command output contains references in both files.
- id: ac-02
  statement: API contract remains unchanged regarding performance score exposure.
  verification:
    type: command
    command: rtk git diff --exit-code -- agent/design/api-contract.yaml
    expected: Command exits successfully with no changes in the API contract file.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - design/domain-model
  - design/persistence-model
handoff:
  review_focus:
  - Terminology consistency between domain and persistence docs.
  - Explicit confirmation that API contract did not expand.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 satisfied; domain and persistence design artifacts
      now both capture performance_score with completion-time semantics, and API contract
      exposure remains unchanged.
    evidence: Implementation commit 4e822b3 updates agent/design/domain-model.yaml
      to include WorkoutExercise.performance_score and explicitly describe completion-time
      scoring semantics, and updates agent/design/persistence-model.yaml with a dedicated
      workout_exercise_performance_score_strategy decision plus workout_exercises
      column/check documentation for nullable completion-driven writes. Verification
      command `rtk rg "performance_score" agent/design/domain-model.yaml agent/design/persistence-model.yaml`
      returns hits in both files, and `rtk git diff --exit-code -- agent/design/api-contract.yaml`
      exits 0.
    runtime_build_check: Deterministic quality gates are delegated to review finalize
      for this item via agent/scripts/check/run-quality-gate.sh using implementation-commit
      change scope.
    residual_risk: Low; residual risk is limited to future behavior changes that alter
      completion-score write semantics without synchronized updates to both design
      documents.
