version: 1
kind: backlog_item
item:
  id: pb-042-item-03
  title: Persist Workout Exercise Performance Score Field
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Introduce `workout_exercises.performance_score` as an integer persistence
    field with backend model/repository support.
  rationale: Completion-time scoring needs durable storage on workout exercise rows.
scope:
  in:
  - Add database migration/schema support for `workout_exercises.performance_score`.
  - Update backend persistence and domain mapping structs to include nullable integer
    `performance_score`.
  - Ensure write/read repository paths remain compatible when score is null before
    completion.
  out:
  - Computing the score value from set data.
  - Exposing performance_score in API responses or contracts.
constraints:
- Keep backend persistence access through SQLx with explicit SQL.
- Preserve existing API contract surface and avoid new public fields.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/persistence-model.yaml
  - agent/strategy/engineering-guardrails.yaml
  optional:
  - agent/design/domain-model.yaml
  - agent/design/api-contract.yaml
acceptance_criteria:
- id: ac-01
  statement: Database schema and persistence mappings include nullable integer `workout_exercises.performance_score`.
  verification:
    type: command
    command: rtk make check-backend
    expected: Backend checks pass with schema and persistence mapping updates.
- id: ac-02
  statement: No API contract change is introduced for performance_score exposure.
  verification:
    type: command
    command: rtk git diff --exit-code -- agent/design/api-contract.yaml
    expected: Command exits successfully with no diff for API contract file.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - database/workout_exercises
  - backend/persistence-models
handoff:
  review_focus:
  - Migration safety and nullable lifecycle behavior.
  - Contract boundary remains unchanged for API exposure.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 satisfied; schema plus backend persistence/domain
      mappings now include nullable `performance_score`, and no API contract exposure
      change was introduced.
    evidence: 'Implementation commit fa7d293 adds `performance_score INTEGER` to runtime/database/00-schema.sql,
      adds `performance_score: Option<i32>` to backend/src/domain.rs::WorkoutExercise,
      updates backend/src/persistence/workouts.rs insert/fetch SQL + row mapping with
      nullable handling, and extends backend tests (backend/src/persistence/tests.rs
      and backend/tests/persistence_integration.rs) to assert NULL lifecycle behavior
      for initial workout creation; the commit does not modify agent/design/api-contract.yaml.'
    runtime_build_check: Deterministic quality gates are delegated to finalize for
      this review item (including backend quality checks based on source-commit change
      scope).
    residual_risk: Low; primary residual risk is future query drift if new workout_exercises
      SQL paths are added without performance_score column parity.
