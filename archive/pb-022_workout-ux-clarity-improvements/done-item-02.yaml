version: 1
kind: backlog_item
item:
  id: pb-022-item-02
  title: Hide free-mode gym labeling and selector in workout tracker
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Ensure free-mode workout tracker view omits gym headline context and gym
    selector controls.
  rationale: Free mode has no gym binding and should not show gym-specific UI distractions.
scope:
  in:
  - conditionally suppress gym heading/select UI in free-mode tracker rendering
  - keep configured-gym rendering behavior unchanged
  - add or update tests for free-mode vs configured-gym tracker output
  out:
  - changing start-screen gym selection behavior
  - backend or API contract changes
constraints:
- preserve configured-gym mode affordances
- keep free-mode workout execution behavior unchanged beyond UI visibility
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-use-cases.yaml
  - renderer/src/workout-render.ts
  - renderer/src/app.test.ts
  optional:
  - renderer/src/workout-types.ts
acceptance_criteria:
- id: ac-01
  statement: In free mode, tracker render omits gym headline and gym selector while
    configured-gym mode still displays gym-specific UI.
  verification:
    type: command
    command: npm --prefix renderer run vitest:run -- src/app.test.ts
    expected: Tests covering free-mode and configured-gym tracker rendering pass.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer/workout-render
  - renderer/tests
handoff:
  review_focus:
  - verify free-mode branch has no gym label/select remnants
  - verify configured-gym branch regression risk is covered by assertions
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 met: free-mode tracker render omits gym context heading/select,
      while configured-gym tracker render retains gym-specific UI.'
    evidence: Reviewed renderer/src/workout-render.ts renderExerciseScreen conditional
      branch (`selectedWorkoutMode === "configured-gym"`) that gates `.tracker-gym-context`
      and `#tracker-gym-select`; reviewed renderer/src/app.test.ts tests "createApp
      shows gym context in tracker for configured-gym workouts" and "createApp omits
      gym context in tracker for free-mode workouts" asserting presence/absence respectively.
    runtime_build_check: pass - npm --prefix renderer run vitest:run -- src/app.test.ts
      (1 file, 28 tests passed).
    residual_risk: Low risk; this change is scoped to tracker render branching and
      covered by mode-specific integration tests, with residual risk limited to future
      markup refactors bypassing these selectors.
