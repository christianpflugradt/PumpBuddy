version: 1
kind: backlog_item
item:
  id: pb-033-item-07
  title: Migrate WorkoutSet Repetition Query Fields
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Rewrite backend query usage of legacy workout_sets reps column to the new
    repetition_value and repetition_kind fields.
  rationale: Remaining legacy column usage in active workout and workout queries risks
    incorrect behavior against the current schema contract.
scope:
  in:
  - Identify all query paths still reading ws.reps.
  - Update active workout and workout query mappings to use repetition_value and repetition_kind.
  - Ensure result structs and transformations align with the new repetition fields.
  out:
  - Schema migrations or database structure changes.
  - Unrelated suggestion logic or renderer behavior changes.
constraints:
- Treat runtime/database/00-schema.sql as schema source of truth for repetition fields.
- Preserve existing API behavior semantics while reading from the new columns.
inputs:
  required:
  - agent/execution/plan.yaml
  - runtime/database/00-schema.sql
  - agent/design/api-contract.yaml
  optional:
  - agent/design/domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: No backend query path uses ws.reps; active workout and workouts flows
    read repetition_value and repetition_kind consistently.
  verification:
    type: command
    command: make check-backend
    expected: Backend checks pass with updated query and mapping usage for repetition
      fields.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend_query_layer
  - active_workout_read_models
  - workout_read_models
handoff:
  review_focus:
  - Complete removal of ws.reps usage across backend queries.
  - Correct repetition_kind and repetition_value propagation into API-facing models.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'AC-01 satisfied: backend query reads in active workout, workout,
      and suggestion historical lookup paths no longer reference legacy `ws.reps`,
      and active workout/workout read models consistently consume `repetition_value`
      with `repetition_kind` sourced from variant context.'
    evidence: Implementation commit `0363007` updates `backend/src/persistence/active_workouts.rs`,
      `backend/src/persistence/workouts.rs`, and `backend/src/persistence/suggestions.rs`
      by replacing `COALESCE(ws.repetition_value, ws.reps)` with `ws.repetition_value`.
      Repository search confirms no remaining `ws.reps` references in `backend/*.rs`,
      while active workout and workout mapping code continues to propagate `repetition_value`
      into `reps` fields and `repetition_kind` from variant joins (`ev.repetition_kind`
      with REPS fallback) into API-facing models.
    runtime_build_check: Pending finalize quality gate execution via `agent/scripts/task/review-item/finalize.sh
      07 accept` (review policy delegates deterministic validation to finalize).
    residual_risk: Low; if historical rows have `repetition_value` null while `reps`
      was populated, reads now intentionally return null per canonical-column policy,
      which is acceptable under current schema/trigger synchronization but depends
      on legacy-data backfill completeness.
