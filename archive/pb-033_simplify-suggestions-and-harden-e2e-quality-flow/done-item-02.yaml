version: 1
kind: backlog_item
item:
  id: pb-033-item-02
  title: Historical Scope And First-Set Matching Constraints
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Enforce historical lookup boundaries and exact/first-set matching constraints
    for reps suggestions.
  rationale: Suggestion correctness depends on strict filtering and fallback levels
    that exclude non-eligible history.
scope:
  in:
  - Restrict historical matches to same_user and same_exercise only.
  - Exclude current workout rows from historical lookup inputs.
  - Apply exact-match and first-set fallback constraints including set_side and level
    ordering.
  out:
  - Station profile load conversion or snapping behavior.
  - Frontend rendering changes.
constraints:
- Historical matching must remain newest-first.
- First-set fallback applies only at set_index 1 and when set_side is not RIGHT.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/domain-model.yaml
  optional:
  - agent/design/workout-use-cases.yaml
acceptance_criteria:
- id: ac-01
  statement: History-scoped matching excludes current workout and applies exact/level
    fallback constraints as defined.
  verification:
    type: command
    command: make check-backend
    expected: Backend checks pass with tests validating history filters and first-set
      fallback constraints.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend_history_query_logic
  - backend_matching_rules
handoff:
  review_focus:
  - same_user plus same_exercise filter correctness.
  - Exclusion of current workout and fallback ordering.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'AC-01 satisfied: historical matching excludes current-workout rows,
      remains scoped to same user plus same exercise, and applies exact/first-set
      fallback constraints with side-aware and level-ordered evaluation.'
    evidence: Implementation commit `23ff804` keeps historical lookup newest-first
      while explicitly excluding the active workout and enforcing same-user scope
      in query predicates (`backend/src/persistence/suggestions.rs`), and gates Rules
      2-6 to first-set non-RIGHT requests (`idx != 1 || requested_set_side == "RIGHT"`).
      The fallback path now carries requested side matching across rules via `set_side_eq`,
      and integration coverage includes side-gated Rule 2 fallback and history scoping
      boundaries (`suggestions_rule_2_idx_one_filters_fallback_by_requested_set_side`,
      `suggestions_history_scope_ignores_different_exercise_even_when_newer`, `suggestions_history_scope_ignores_other_user_history`)
      plus deterministic ordering/current-workout path checks (`suggestions_rule_order_prefers_same_gym_variant_before_other_gym_variant`,
      `suggestions_explicitly_cover_current_workout_and_global_fallback_paths`) in
      `backend/tests/persistence_integration.rs`.
    runtime_build_check: Pending finalize quality gate execution via `agent/scripts/task/review-item/finalize.sh
      02 accept` (review policy delegates deterministic validation to finalize).
    residual_risk: 'Low: scope and side constraints are covered by integration scenarios;
      remaining risk is limited to future rule-order refactors that bypass these query
      predicates without updating the scenario matrix.'
