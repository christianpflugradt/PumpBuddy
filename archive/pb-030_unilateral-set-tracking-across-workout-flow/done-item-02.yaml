version: 1
kind: backlog_item
item:
  id: pb-030-item-02
  title: Add side-aware bootstrap schema and bilateral defaults
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Development bootstrap SQL supports side-aware set storage and bilateral
    default variant tracking.
  rationale: Rebuild-based dev environments must start from the new unilateral-capable
    schema without data migration steps.
scope:
  in:
  - Update `runtime/database/00-schema.sql` to persist side-aware set rows for unilateral
    and bilateral tracking.
  - Update constraints/indexes so logical set uniqueness is side-aware for one exercise.
  - Update `runtime/database/10-seed-dev.sql` so all seeded exercise variants default
    to BILATERAL tracking mode.
  out:
  - Non-bootstrap migration scripts for existing production data.
  - Runtime repository/service behavior updates.
constraints:
- Maintain compatibility with `make rebuild-app` bootstrap workflow.
- Keep seed defaults bilateral only; unilateral assignment remains manual outside
  this item.
inputs:
  required:
  - agent/execution/plan.yaml
  - runtime/database/00-schema.sql
  - runtime/database/10-seed-dev.sql
  - agent/design/persistence-model.yaml
  optional:
  - agent/design/domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Bootstrap schema and seed SQL include side-aware set persistence and
    bilateral variant defaults.
  verification:
    type: command
    command: rg -n "set_side|LEFT|RIGHT|BILATERAL|set_tracking_mode|UNILATERAL|BILATERAL|workout_sets"
      runtime/database/00-schema.sql runtime/database/10-seed-dev.sql
    expected: Schema contains side-aware set definitions and seed data explicitly
      sets BILATERAL defaults.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - runtime/database
handoff:
  review_focus:
  - Verify side-aware uniqueness rule is encoded in schema constraints/indexes.
  - Verify seed defaults do not accidentally assign unilateral mode.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: Acceptance criterion ac-01 is met; bootstrap schema includes side-aware
      workout set persistence with set_side LEFT|RIGHT|BILATERAL, and seed data sets
      set_tracking_mode to BILATERAL for all seeded exercise variants.
    evidence: The required verification command `rg -n "set_side|LEFT|RIGHT|BILATERAL|set_tracking_mode|UNILATERAL|BILATERAL|workout_sets"
      runtime/database/00-schema.sql runtime/database/10-seed-dev.sql` matched the
      new set_side column/default/check and side-aware unique constraint `(workout_exercise_id,
      set_index, set_side)` in runtime/database/00-schema.sql, plus explicit BILATERAL
      set_tracking_mode values in runtime/database/10-seed-dev.sql for every seeded
      exercise variant row.
    runtime_build_check: Deterministic quality gates are expected to pass on finalize
      because the reviewed implementation scope is limited to bootstrap schema/seed
      SQL and review evidence confirms required side-aware and bilateral-default definitions
      are present.
    residual_risk: Low residual risk remains around bootstrap idempotency behavior
      when rerun against legacy intermediate states, but guarded ADD COLUMN IF NOT
      EXISTS, backfills, and constraint guards reduce rebuild-flow risk for make rebuild-app.
