version: 1
kind: backlog_item
item:
  id: pb-051-item-01
  title: Connect progress heatmap day taps to completed workout detail navigation
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Progress heatmap day selection opens the matching completed workout detail.
  rationale: Deliver the first requested read-only interconnection for drill-down
    from timeline score dots.
scope:
  in:
  - Map heatmap day interaction payload to a concrete completed workout identifier.
  - Trigger existing workout-detail navigation from the Progress screen interaction.
  out:
  - Any History screen interaction changes.
  - Any new cross-screen links beyond Progress to Workout Detail.
constraints:
- Keep Progress read-only with no workout mutation side effects.
- Reuse existing route parameter patterns when available.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  optional:
  - agent/design/domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Selecting a Progress heatmap day dot navigates to the completed workout
    detail for that day entry.
  verification:
    type: command
    command: make check-renderer
    expected: Command exits successfully with renderer checks passing.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - renderer/progress-screen
  - renderer/navigation
handoff:
  review_focus:
  - Verify selected heatmap entry resolves to the correct workout id before navigation.
  - Confirm no mutation calls are introduced in Progress flow.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 satisfied: selecting a Progress heatmap day dot emits open-workout-detail
      with a concrete workoutId and the controller navigates to workout-detail for
      that id when opened from Progress.'
    evidence: Renderer wiring verified in renderer/src/pb-progress-screen.ts (heatmap
      cells map to workout ids and emit payload action), renderer/src/workout-controller.ts
      (open-workout-detail accepts progress origin and routes to workout-detail),
      and targeted tests in renderer/src/pb-progress-screen.test.ts and renderer/src/workout-controller.test.ts
      covering event payload and progress-origin navigation path.
    runtime_build_check: 'PASS: make check-renderer'
    residual_risk: Low. Multiple workouts on a single day resolve to highest tone
      then latest completion timestamp; this deterministic tie-break is implemented
      and acceptable for current scope but should be revisited if product semantics
      require a different day-selection priority.
