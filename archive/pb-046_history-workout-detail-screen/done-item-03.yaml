version: 1
kind: backlog_item
item:
  id: pb-046-item-03
  title: Wire History Row Navigation And Return State
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Enable navigation from History rows to workout detail and restore prior
    History list position on return.
  rationale: The detail flow is incomplete unless users can enter from any History
    row and return without losing context.
scope:
  in:
  - Add History row interaction that opens the workout-detail screen for the selected
    workout id.
  - Replace detail top-left affordance with back navigation returning to History.
  - Persist and restore History list scroll focus to the previously opened workout
    row.
  out:
  - Detail hero metadata card styling and stat tile layout.
  - Exercise section formatting details.
constraints:
- Preserve existing History list information architecture.
- Keep navigation behavior deterministic for repeated open/close cycles.
- Avoid introducing global state that is unrelated to History/detail flow.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-use-cases.yaml
  optional:
  - archive/pb-046_history-workout-detail-screen/external-reference-image.md
acceptance_criteria:
- id: ac-01
  statement: Tapping any completed History row opens the corresponding workout-detail
    route/state.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with navigation wiring changes.
- id: ac-02
  statement: Back action from detail returns to History and restores scroll to the
    previously viewed workout entry.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with return-state restoration logic.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer-routing
  - history-screen-state
handoff:
  review_focus:
  - Scroll restoration reliability across repeated detail transitions.
  - Correct workout id propagation from list row to detail loader.
review_feedback:
- at: '2026-04-18T14:52:13Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01\n  evidence: 'Deterministic finalize quality\
    \ gate failed for source commit `9a9930d`\n    via `agent/scripts/check/verify-api-contract-alignment.sh`:\
    \ \"API contract alignment\n    failed: API surface changed without updating agent/design/api-contract.yaml.\"\
    \n    The changed set includes renderer API-surface files such as `renderer/src/workout-types.ts`\n\
    \    without a paired contract update in the same implementation commit context.'\n\
    \  risk: Contract-governance policy is violated, so renderer detail-navigation\
    \ changes\n    cannot be finalized safely; contract and consumer API surface may\
    \ drift, increasing\n    risk of schema/type mismatch in future iterations.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: AC-01 met because History rows dispatch `open-workout-detail` with
      the selected `workoutId` and controller state transitions to `viewState.screen=workout-detail`
      for that id; AC-02 met because detail back navigation returns to History with
      `restoreWorkoutId` anchor persistence and History emits `history-restore-complete`
      after scroll/focus restoration, clearing stale anchors for deterministic repeat
      cycles.
    evidence: Verified in renderer wiring and tests across `renderer/src/pb-history-screen.ts`,
      `renderer/src/workout-controller.ts`, `renderer/src/pb-workout-detail-screen.ts`,
      plus coverage in `renderer/src/pb-history-screen.test.ts`, `renderer/src/workout-controller.test.ts`,
      and `renderer/src/pb-app-root.test.ts`.
    runtime_build_check: '`make check-renderer` passes locally (lint, unit tests,
      coverage, build, and UI smoke). Deterministic quality gate for this review item
      currently resolves to source commit `d4070dc` and reports `QUALITY_GATE_RESULT=skipped_no_matching_rules`.'
    residual_risk: Low residual risk remains around UX behavior when the anchored
      workout row is no longer present after refresh/filter changes; current implementation
      handles this by emitting restore completion with `restored=false` and clearing
      restoration state.
