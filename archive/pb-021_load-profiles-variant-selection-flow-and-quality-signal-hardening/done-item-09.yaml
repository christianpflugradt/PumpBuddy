version: 1
kind: backlog_item
item:
  id: pb-021-item-09
  title: Lock fallback choice after first completed set
  status_hint: done
  source:
    type: finalize_return
    reference: agent/tmp/finalize-plan-findings.yaml
intent:
  outcome: Enforce rule that fallback option/variant/station becomes immutable once
    any set for that exercise has been completed.
  rationale: Finalization is blocked because current behavior appears to allow post-start
    fallback changes contrary to product rule.
scope:
  in:
  - Add backend guard preventing fallback selection mutation after first completed
    set.
  - Align renderer behavior to disable or reject fallback changes after set completion.
  - Add tests for both allowed pre-set changes and blocked post-set changes.
  out:
  - General edit-locking for unrelated workout fields.
constraints:
- Enforcement must be authoritative server-side; UI lock is additive for clarity.
inputs:
  required:
  - agent/design/workout-use-cases.yaml
  - backend/src/application/workouts.rs
  - renderer/src/workout-render.ts
  optional:
  - renderer/src/fallback-variant-switching.test.ts
acceptance_criteria:
- id: ac-01
  statement: After first completed set on an exercise, attempts to change fallback
    selection are rejected and surfaced correctly.
  verification:
    type: command
    command: cargo test --manifest-path backend/Cargo.toml active_workout_selection_consistency
      && npm --prefix renderer run test -- fallback-variant-switching
    expected: Test assertions show fallback mutation blocked after first completed
      set while pre-set updates still pass.
execution:
  plan_item_required: true
  risk_level: high
  boundary_impact:
  - backend
  - renderer
  - api
handoff:
  review_focus:
  - Ensure lock activates exactly at first completed set boundary and does not regress
    initial fallback selection flow.
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01
    evidence: The backend guard in `validate_fallback_selection_lock` rejects fallback
      selection changes after an exercise has any completed set, renderer fallback
      selector rendering disables the control once completed sets exist, and targeted
      tests passed for both boundaries. Verified with `cargo test --manifest-path
      backend/Cargo.toml active_workout_selection_consistency` (7 passed including
      allows-before-first-set and rejects-after-first-set) and `npm --prefix renderer
      run test -- fallback-variant-switching` (6 passed including selector-disabled
      plus no mutation after completion).
    runtime_build_check: Deterministic quality gate passed via `agent/scripts/check/run-quality-gate.sh
      agent/execution/items/review-item-09.yaml` and reported `QUALITY_GATE_RESULT=passed`.
    residual_risk: Lock timing is enforced by `completed_sets` presence; if future
      workflow changes redefine the completion boundary semantics, these guard assertions
      may need synchronized updates across backend and renderer tests.
review_feedback:
- at: '2026-03-22T19:17:45Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01\n  evidence: Deterministic quality gate failed\
