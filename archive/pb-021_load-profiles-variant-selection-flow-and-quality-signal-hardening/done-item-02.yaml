version: 1
kind: backlog_item
item:
  id: pb-021-item-02
  title: Guarantee seeded variant option parity with deterministic defaults
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Ensure all seeded exercise variants are selectable in configured-gym training-plan
    option flows with deterministic ordering and default behavior.
  rationale: Prevents dead or missing options and makes workout start behavior predictable.
scope:
  in:
  - Implement backend option resolution so seeded variants in backend/init.sql are
    represented in training-plan option selection.
  - Enforce deterministic selection_order and default-selection behavior (single option
    auto-select; multiple default to first).
  - Add focused tests that assert seed parity and ordering/default semantics.
  out:
  - In-workout fallback variant switching UX.
  - Badge and release metadata fixes.
constraints:
- Preserve configured_gym precondition that every exercise has at least one realizable
  option.
- Keep ordering driven by explicit selection_order semantics.
- Maintain compatibility with existing training plan option API response shape.
inputs:
  required:
  - agent/execution/plan.yaml
  - backend/init.sql
  - agent/design/workout-use-cases.yaml
  - agent/design/api-contract.yaml
  optional:
  - agent/design/workout-use-cases-to-domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Automated tests prove seeded exercise variants are available as selectable
    options and default ordering rules are enforced.
  verification:
    type: command
    command: cargo test --manifest-path backend/Cargo.toml seeded_variant_option_parity_and_ordering
    expected: Test suite passes and includes assertions for seed parity plus single/multi-option
      default behavior.
execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
  - backend
  - database
handoff:
  review_focus:
  - No seeded variant becomes unreachable in configured-gym option selection.
  - Default-selection behavior matches UC-02 rules exactly.
review_feedback:
- at: '2026-03-22T17:00:56Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01\n  evidence: agent/scripts/task/review-item/finalize.sh\
    \ 02 accept failed deterministic\n    quality gate on source commit 9364624edc2875828fd625d662f09d3bc624150f\
    \ because\n    Clippy flagged if_same_then_else in backend/tests/persistence_integration.rs\
    \ around\n    the new default-selection assertions.\n  risk: Item cannot be merged/finalized\
    \ while quality gates fail, and the duplicated\n    branch assertions reduce confidence\
    \ that single-option vs multi-option semantics\n    are intentionally differentiated.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 met; automated tests confirm seeded variant option parity
      and deterministic ordering/default behavior for single-option and multi-option
      cases.
    evidence: backend/tests/persistence_integration.rs::seeded_variant_option_parity_and_ordering
      asserts expected variant IDs by exercise position, validates full seeded variant
      coverage set equality, and verifies default-selected option IDs resolve to the
      first option per deterministic selection order across both single-option and
      multi-option exercises.
    runtime_build_check: Ran `cargo test --manifest-path backend/Cargo.toml seeded_variant_option_parity_and_ordering`
      (passed with 1 test) and `cargo test --manifest-path backend/Cargo.toml training_plan_option`
      (passed; no matching tests under that selector in current suite).
    residual_risk: Assertions validate seeded parity and default semantics for configured-gym
      seed fixtures (plan 000...201 at gym 000...102); broader regression protection
      still depends on maintaining similar coverage if seed data or option-resolution
      query behavior changes.
