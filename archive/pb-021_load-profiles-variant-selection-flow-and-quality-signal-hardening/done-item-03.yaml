version: 1
kind: backlog_item
item:
  id: pb-021-item-03
  title: Implement in-workout fallback variant switching flow
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Deliver a user-facing configured-gym flow to switch fallback variant/station
    during workout with immediate persistence.
  rationale: Users need a recovery path when initially selected options become unsuitable
    mid-workout.
scope:
  in:
  - Add renderer interaction for switching fallback variant/station on the active
    exercise in configured-gym mode.
  - Persist selected option/variant/station immediately through active-workout APIs.
  - Add renderer tests for single-option auto behavior and multi-option switch behavior.
  out:
  - Free-mode behavior changes.
  - New API surface unrelated to active workout progression.
constraints:
- Keep flow aligned with UC-02 and UC-03 interaction rules.
- Avoid large UX redesign beyond fallback-selection affordance.
- Maintain thin renderer boundaries with business rules enforced backend-side.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-use-cases.yaml
  - agent/design/api-contract.yaml
  - agent/design/domain-model.yaml
  optional:
  - agent/design/workout-capabilities.yaml
acceptance_criteria:
- id: ac-01
  statement: Renderer tests validate that fallback switching updates the selected
    option and persists it without breaking exercise progression.
  verification:
    type: command
    command: npm --prefix renderer run test -- fallback-variant-switching
    expected: Tests pass for configured-gym fallback switching, including persistence-trigger
      behavior.
execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
  - renderer
  - api
handoff:
  review_focus:
  - Switching UX remains clear and does not regress existing set-recording flow.
  - Persisted selected option/variant/station IDs remain consistent after reload/resume.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 met; renderer fallback switching updates selected option/variant/station
      and triggers immediate active-workout persistence without blocking exercise
      progression.
    evidence: renderer/src/workflow-orchestrator.ts adds persistFallbackSelection
      with immediate create/update active-workout payload writes for selected fields,
      renderer/src/workout-state.ts adds withFallbackOptionSelected and includeExercisePositions
      payload support, renderer/src/workout-render.ts + renderer/src/workout-interaction.ts
      expose/configure single-option display and multi-option selector flow, and renderer/src/fallback-variant-switching.test.ts
      validates single-option auto behavior plus multi-option persistence payload
      and UI re-selection.
    runtime_build_check: Ran `npm --prefix renderer run test -- fallback-variant-switching`
      (passed; 1 file, 2 tests). Also ran `npm --prefix renderer run test -- active-workout`
      as an additional regression check; command returned "No test files found" for
      that selector in current suite.
    residual_risk: Fallback-switch coverage is focused and strong for selection/persistence
      paths, but there is still no broader exercise-progression regression suite under
      an active-workout selector; future UI/state refactors should keep integration
      coverage around set-recording + fallback-switch interaction ordering.
