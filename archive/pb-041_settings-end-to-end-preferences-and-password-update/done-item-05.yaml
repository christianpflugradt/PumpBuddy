version: 1
kind: backlog_item
item:
  id: pb-041-item-05
  title: Preselect workout gym from saved favorite gym preference
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: "Workout selection preselects the user\u2019s updated favorite gym when\
    \ starting workout flows."
  rationale: Connects saved settings preference to workout-start behavior promised
    by the plan.
scope:
  in:
  - Load favorite gym preference into workout-start gym selection context.
  - Preselect matching gym when favorite gym exists and is available.
  - Define fallback behavior when preference is missing or unavailable.
  out:
  - Settings page edit controls and persistence API behavior.
  - Password update section behavior.
constraints:
- Depends on favorite gym persistence and API availability from earlier items.
- Must not break existing configured-gym validation requirements.
- Keep preselection deterministic for equal/edge conditions.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  optional:
  - agent/design/api-contract.yaml
acceptance_criteria:
- id: ac-01
  statement: Workout start flow preselects favorite gym when available and falls back
    safely when unavailable.
  verification:
    type: command
    command: make check
    expected: Full quality checks pass with workout selection behavior validated.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer-workout-start
  - backend-workout-session-read
handoff:
  review_focus:
  - Favorite gym preselection and fallback behavior across configured-gym start scenarios.
  - Regression risk for existing workout start defaults.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 met; workout start now preselects the authenticated favorite
      gym when present in available gyms and deterministically falls back to the first
      available gym when missing or unavailable.
    evidence: renderer/src/workout-state.ts adds selectDefaultGymId with favorite-match
      then first-gym fallback behavior; renderer/src/workout-controller.ts applies
      this selection during start-screen bootstrap/reload and after favorite-gym save;
      renderer/src/workout-state.test.ts and renderer/src/workout-controller.test.ts
      cover favorite available, missing, unavailable, and post-save selection update
      scenarios.
    runtime_build_check: make check-renderer passed on 2026-04-13 in this review cycle
      (lint, unit tests, coverage, build, and UI smoke). One earlier run showed an
      intermittent Chromium UI-smoke timeout but the immediate deterministic rerun
      passed without code changes.
    residual_risk: Low residual risk; configured-gym validation paths remain unchanged
      and favorite preselection is bounded by available-gym matching with deterministic
      first-gym fallback, with only minor residual risk from known intermittent Chromium
      UI-smoke flakiness.
