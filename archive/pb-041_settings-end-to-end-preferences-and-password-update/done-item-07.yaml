version: 1
kind: backlog_item
item:
  id: pb-041-item-07
  title: Add settings password section UI with validation and feedback
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Settings page supports password read-only masked display plus edit mode
    with old/new/confirm fields, mismatch validation, and inline feedback banners.
  rationale: Completes the end-user password change experience defined in plan scope.
scope:
  in:
  - Add read-only masked password presentation with fixed-length masking and pen-icon
    entry into edit mode.
  - Add old/new/confirm password inputs with labeled controls, save/discard, and client-side
    mismatch validation.
  - Show inline success/error feedback area and return to read-only mode after save/discard
    outcomes.
  out:
  - Backend password verification and hash persistence logic.
  - Changes to unrelated settings sections outside scoped behavior.
constraints:
- Must align with existing web-components implementation style.
- Must use contract-backed API integration for password update flow.
- Client-side validation must not replace server-side password checks.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/api-contract.yaml
  - agent/strategy/tech-stack.yaml
  optional:
  - agent/strategy/test-strategy.yaml
acceptance_criteria:
- id: ac-01
  statement: Settings password section supports required read-only/edit-mode transitions,
    mismatch validation, and inline feedback messaging.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with password-section interaction behavior validated.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer-settings-ui
  - renderer-auth-client
handoff:
  review_focus:
  - Password section state transitions and validation behavior.
  - Feedback messaging and post-save/discard return-to-read-only logic.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 met; settings password section now provides masked read-only
      presentation, pen-icon entry into edit mode, old/new/confirm inputs, mismatch
      validation that blocks save, and inline feedback messaging with return to read-only
      mode after save/discard.
    evidence: renderer/src/pb-settings-screen.ts adds explicit password view/edit
      state transitions, mismatch validation messaging, save/discard controls, and
      success/error feedback rendering; renderer/src/workout-controller.ts handles
      `save-password` UI action via POST `/auth/password` using the contract payload
      keys; renderer/src/pb-settings-screen.test.ts and renderer/src/workout-controller.test.ts
      add coverage for mismatch blocking, save success/error feedback, and API submission
      behavior.
    runtime_build_check: make check-renderer passed on 2026-04-13 during this review
      run (lint, unit tests, coverage, renderer build, and cross-browser UI smoke
      checks all succeeded).
    residual_risk: Low residual risk within item scope; password save flow is frontend-validated
      and contract-aligned, with remaining risk primarily in backend/runtime failure
      semantics outside this renderer-focused review item.
