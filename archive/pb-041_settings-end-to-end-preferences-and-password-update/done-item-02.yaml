version: 1
kind: backlog_item
item:
  id: pb-041-item-02
  title: Add user preferences persistence for favorite gym
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Database and persistence layer support reading and writing favorite gym
    as extensible user preferences.
  rationale: Provides durable storage required for settings and workout preselection
    behavior.
scope:
  in:
  - Add SQL migration artifacts for a new extensible user_preferences table keyed
    by user.
  - Add backend persistence queries/repository methods for favorite gym preference
    get and update.
  - Keep schema and query design extensible for future preference keys.
  out:
  - HTTP/API handler behavior and validation wiring.
  - Renderer settings or workout selection UI updates.
constraints:
- SQL must align with the persistence model and keep user-scoped ownership.
- Database access must remain explicit SQL via sqlx.
- Migration must be safe for existing users without preferences.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/persistence-model.yaml
  - agent/strategy/security.yaml
  optional:
  - agent/design/domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: New migration and repository persistence logic for favorite gym preference
    pass backend quality checks.
  verification:
    type: command
    command: make check-backend
    expected: Backend checks pass including migration and sqlx validation paths.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - database-migrations
  - backend-persistence
handoff:
  review_focus:
  - Migration safety and preference-table extensibility.
  - Correct user scoping in repository read/write queries.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 met: Persistence schema now includes extensible user_preferences
      storage and repository methods now support user-scoped favorite-gym read, upsert,
      and clear flows.'
    evidence: Commit 096f92a86033c40899b0e9450812b780f1abdeeb adds runtime/database/00-schema.sql
      user_preferences table (unique user_id+preference_key, non-blank key check,
      timestamp trigger), backend/src/persistence/auth.rs favorite gym preference
      query/upsert/delete paths keyed by user_id, DomainRepository user-scoped wrappers
      in backend/src/persistence/mod.rs, and integration tests in backend/tests/persistence_integration.rs
      covering upsert overwrite behavior, single-row enforcement, clear behavior,
      and cross-user isolation.
    runtime_build_check: 'Pending finalize quality gate: agent/scripts/task/review-item/finalize.sh
      02 accept runs deterministic checks via agent/scripts/check/run-quality-gate.sh.'
    residual_risk: Low residual risk. Preference values are intentionally stored as
      extensible text keys/values, so downstream API-layer validation must continue
      to enforce favorite-gym UUID semantics and any gym-ownership constraints at
      write boundaries.
