version: 1
kind: backlog_item
item:
  id: pb-041-item-09
  title: Style favorite gym dropdown to match workflow selection dropdowns
  status_hint: done
  source:
    type: finalize_return
    reference: agent/tmp/finalize-plan-findings.yaml
intent:
  outcome: Make the favorite gym dropdown styling consistent with dropdown components
    used in the workflow selection screen.
  rationale: Stakeholder expects visual consistency and reports the current favorite
    gym dropdown is not styled appropriately.
scope:
  in:
  - Apply workflow-selection-consistent dropdown styling to favorite gym editing control.
  - Reuse existing renderer styling patterns/tokens from workflow selection screen
    where available.
  - Add or update renderer tests/snapshots that validate the intended dropdown structure/styling
    hooks.
  out:
  - Behavioral changes to favorite gym persistence logic.
  - Redesign of unrelated form controls.
constraints:
- Maintain existing favorite gym edit/save/discard interaction behavior.
- Preserve accessibility and keyboard interaction for dropdown control.
inputs:
  required:
  - agent/execution/plan.yaml
  - renderer/src/pb-settings-screen.ts
  - renderer/src/workout-render.ts
  optional: []
acceptance_criteria:
- id: ac-01
  statement: Favorite gym dropdown matches workflow selection dropdown styling conventions
    in the settings UI.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass and tests confirm favorite gym dropdown uses workflow-selection-consistent
      styling hooks and structure.
execution:
  plan_item_required: true
  risk_level: medium
  boundary_impact:
  - renderer-settings-ui
handoff:
  review_focus:
  - Styling parity between settings favorite gym dropdown and workflow selection dropdowns.
  - Regression risk to existing settings interactions.
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 met; the favorite gym edit dropdown now explicitly uses the
      same workflow selection dropdown hook (`start-select`) while retaining settings-specific
      selector hooks for local layout and targeting, yielding styling convention parity
      in the settings UI.
    evidence: renderer/src/pb-settings-screen.ts renders the favorite gym editor select
      with `class="start-select settings-favorite-gym-select"`; renderer/src/styles.scss
      applies shared dropdown styling through `.start-select` and keeps `.settings-favorite-gym-select`
      width/layout composition instead of divergent custom dropdown chrome; renderer/src/workout-render.ts
      remains the workflow selection reference where training plan/gym selects use
      `.start-select`; renderer/src/pb-settings-screen.test.ts asserts the favorite
      gym draft select includes both `start-select` and `settings-favorite-gym-select`
      classes and preserves existing edit/save/discard behavior checks.
    runtime_build_check: make check-renderer passed on 2026-04-13 during this review
      run (renderer lint, unit tests, coverage, build, and UI smoke checks succeeded).
    residual_risk: Low residual risk within scope; the change is a narrow styling-hook
      alignment backed by renderer tests, with remaining risk mainly in visual nuances
      not fully captured by automated assertions.
