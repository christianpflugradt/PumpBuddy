version: 1
kind: backlog_item
item:
  id: pb-045-item-05
  title: Reorder settings and add spinner-based max load edit flow
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Settings UI places registration date before display name and provides editable
    max-load control using existing pen-edit and spinner interaction pattern.
  rationale: Keep settings ergonomics consistent while exposing configurable max load
    in the established edit UX.
scope:
  in:
  - Reorder settings field rendering so registration date appears before display name.
  - Keep pre-display-name fields static and preserve editability from display name
    onward.
  - Add max-load field to editable settings section using pen-to-edit, save/discard
    controls, and spinner-based value selection.
  - Enforce UI-level spinner bounds for max load between 100 and 999.
  out:
  - Backend persistence schema changes.
  - Workout suggestion clamp business logic.
  - Non-settings navigation redesign.
constraints:
- Reuse existing editable-setting interaction pattern already used by display-name
  edits.
- Preserve English user-facing copy unless explicitly changed by scope.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/api-contract.yaml
  - agent/strategy/engineering-guardrails.yaml
  optional:
  - agent/design/workout-capabilities.yaml
acceptance_criteria:
- id: ac-01
  statement: Registration date renders before display name, and only display name
    plus later settings entries are editable.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with settings order and editability boundaries
      validated.
- id: ac-02
  statement: Max-load setting follows pen-edit mode with spinner entry and save/discard
    behavior, bounded between 100 and 999.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with max-load edit flow and spinner bounds behavior
      covered.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - renderer settings screen
  - renderer settings form state handling
handoff:
  review_focus:
  - Confirm settings ordering and static/editable partitioning match plan intent.
  - Confirm max-load edit flow mirrors existing display-name edit affordances.
review_feedback:
- at: '2026-04-18T08:04:09Z'
  source: review_result
  notes: "findings:\n- criterion: Engineering guardrail quality gate (API contract\
    \ alignment) must pass\n    for the implementation commit referenced by this review\
    \ item.\n  evidence: 'agent/scripts/task/review-item/finalize.sh 05 accept failed\
    \ in deterministic\n    quality gate execution with \"API contract alignment failed:\
    \ API surface changed\n    without updating agent/design/api-contract.yaml\" for\
    \ source commit 92ad1fcb5c20b64ec88441bfa1c9a5677b49e830.'\n  risk: Accepting\
    \ while the API-contract alignment gate fails allows renderer/backend\n    API\
    \ usage changes to drift from the declared contract and can cause integration\n\
    \    regressions across generated clients and future contract-driven checks.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: AC-01 and AC-02 are satisfied; settings now render registration
      date before display name with editability starting at display name and continuing
      for subsequent rows, and max load uses the existing pen-edit flow with save/discard
      behavior plus UI spinner bounds constrained to 100..999.
    evidence: renderer/src/pb-settings-screen.ts renders Registration date above Display
      name in the details list, keeps registration date as static text, and provides
      display-name/favorite-gym/max-load pen-edit affordances; renderer/src/pb-settings-screen.ts
      also enforces max-load draft parsing against MIN_EDITABLE_MAX_LOAD_KG=100 and
      MAX_EDITABLE_MAX_LOAD_KG=999 and wires save/discard actions for max-load edit
      mode; renderer/src/pb-settings-screen.test.ts covers registration-date ordering
      with non-editable registration row and editable display-name row, max-load edit
      save behavior, max-load boundary enable/disable checks at 99/100/999/1000, and
      save-failure retention behavior.
    runtime_build_check: make check-renderer passed locally during review (renderer
      lint/test/coverage/ui-smoke pipeline all green, including 268 renderer tests
      and 3-browser UI smoke pass), and finalize will run deterministic quality gates
      via agent/scripts/check/run-quality-gate.sh for the implementation source commit.
    residual_risk: Low; the max-load editor relies on numeric input spinner behavior
      provided by the browser, so cross-browser UX nuances remain possible despite
      functional bounds and flow coverage.
