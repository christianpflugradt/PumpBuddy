version: 1
kind: backlog_item
item:
  id: pb-045-item-03
  title: Clamp workout load suggestions and selectable profile options to configured
    max
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Active-workout suggestion and option data surfaces only profile values
    less than or equal to configured max load, with over-max suggestions falling back
    to nearest lower allowed value.
  rationale: Enforce configured limits during new load guidance while preserving deterministic
    progression behavior.
scope:
  in:
  - Apply configured max-load clamp when computing selectable profile-driven load
    options for workout flows.
  - Apply fallback rule for suggestions above max to nearest allowed lower profile
    value.
  - Preserve rendering of previously saved workout loads even when those historical
    values exceed current configured max.
  out:
  - UI-level spinner component rendering changes.
  - User settings page editing interactions.
  - Data migration of historical workout sets.
constraints:
- Existing saved over-max loads must remain visible and unmodified.
- API response behavior must stay consistent with contract-first development practices.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/api-contract.yaml
  - agent/design/domain-model.yaml
  optional:
  - agent/design/persistence-model.yaml
acceptance_criteria:
- id: ac-01
  statement: API-facing workout option and suggestion data excludes profile-driven
    values above configured max and applies nearest-lower fallback when raw suggestion
    exceeds max.
  verification:
    type: command
    command: make check-backend
    expected: Backend checks pass with tests verifying clamped option lists and fallback
      suggestion selection.
- id: ac-02
  statement: Historical saved loads above current max still appear in workout rendering
    data and are not rewritten by clamp logic.
  verification:
    type: command
    command: make check-backend
    expected: Backend checks pass with assertions that persisted over-max historical
      set loads remain unchanged and readable.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend workout suggestion logic
  - backend active workout query mapping
handoff:
  review_focus:
  - Confirm clamp applies only to new suggestions/selectable values and not historical
    records.
  - Confirm fallback behavior matches nearest-lower profile value requirement.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: AC-01 and AC-02 satisfied; profile-driven option/suggestion outputs
      are clamped to configured max for new guidance paths, while persisted historical
      over-max set loads remain unchanged in active-workout rendering data.
    evidence: backend/src/persistence/training_plans.rs now fetches user max-load
      preference and filters station_profile_loads_kg to values <= max before response
      mapping, backend/src/persistence/active_workouts.rs clamps profile loads before
      suggestion mapping/progression (including over-max fallback snapping against
      clamped profile values), and backend/tests/persistence_integration.rs adds coverage
      for clamped option lists and active-workout suggestion fallback with preserved
      persisted 230kg completed_set visibility under a 200kg preference.
    runtime_build_check: Finalize quality gate will run deterministic backend checks
      from the implementation commit via agent/scripts/check/run-quality-gate.sh (expected
      to include make check-backend for this backend-only change set).
    residual_risk: Low; behavior depends on existing profile ordering/units semantics,
      but scoped tests cover clamp and fallback behavior plus preservation of historical
      over-max persisted loads.
