version: 1
kind: backlog_item
item:
  id: pb-045-item-06
  title: Add targeted regression coverage for spinner and max-load workflows
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Automated coverage guards the new spinner-first workout input and configurable
    max-load behavior across renderer and backend quality gates.
  rationale: Reduce regression risk for multi-surface behavior changes introduced
    by pb-045.
scope:
  in:
  - Add or update renderer tests for reps/load spinner-first interactions and settings
    max-load edit behavior.
  - Add or update backend tests for max-load defaults, bounds validation, and suggestion
    clamp fallback behavior.
  - Ensure test naming and assertions explicitly cover preservation of historical
    over-max load display behavior.
  out:
  - New product features beyond pb-045 scope.
  - Tooling, CI pipeline, or framework migration changes.
  - Non-behavioral refactors without confidence impact.
constraints:
- Tests should prioritize meaningful behavior assertions over implementation details.
- Keep end-to-end additions minimal and focused on critical workflow coverage.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/strategy/test-strategy.yaml
  - agent/design/workout-use-cases.yaml
  optional:
  - agent/design/api-contract.yaml
acceptance_criteria:
- id: ac-01
  statement: Renderer quality suite includes assertions for spinner-first reps/load
    input and settings max-load edit interactions.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with added coverage for new spinner and settings
      behavior.
- id: ac-02
  statement: Backend quality suite includes assertions for max-load defaulting, bounds
    validation, clamped option/suggestion behavior, and historical over-max display
    preservation.
  verification:
    type: command
    command: make check-backend
    expected: Backend checks pass with targeted coverage for max-load business rules.
- id: ac-03
  statement: Combined project quality gate passes with the pb-045 regression additions
    in place.
  verification:
    type: command
    command: make check
    expected: Full quality checks pass without regressions.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - backend tests
  - renderer tests
handoff:
  review_focus:
  - Confirm tests encode behavior outcomes rather than internal implementation details.
  - Confirm coverage includes the over-max preservation edge case.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: AC-01 and AC-02 are satisfied because renderer coverage now includes
      spinner-first reps/load interaction assertions with over-max historical display
      preservation in workout flow, while existing settings-suite assertions cover
      max-load edit interactions with spinner bounds and save/discard behavior; AC-03
      will be validated by deterministic finalize quality gates for this accepted
      review item.
    evidence: renderer/src/pb-exercise-screen.test.ts adds a regression test asserting
      load/reps remain spinner-first (no direct text inputs), picker options stay
      clamped to allowed profile loads, and completed-set history still displays a
      previously saved over-max 230 kg value; renderer/src/pb-settings-screen.test.ts
      already verifies max-load pen-edit workflow, spinner numeric input bounds at
      100..999, save success path, and save-failure retention; backend/tests/api_auth.rs
      now validates both low (99) and high (1000) max_load_kg PATCH rejections with
      the expected bounds message; backend/src/persistence/active_workouts.rs adds
      unit coverage for nearest-lower clamped profile fallback mapping (230 -> 195);
      backend/tests/persistence_integration.rs already covers configured-max clamping
      while preserving saved over-max completed-set display.
    runtime_build_check: Review evidence is code-and-test based; deterministic runtime
      quality gates are executed by finalize via agent/scripts/check/run-quality-gate.sh
      for the implementation source commit, satisfying the acceptance gate for this
      review outcome when finalize succeeds.
    residual_risk: Low; coverage is strong on targeted regression paths, with remaining
      risk mainly around edge-case interactions across less-common station profile
      compositions not explicitly enumerated in this item's new assertions.
