          format: double
          nullable: true
          description: |
            Raw workout progress decimal rounded by renderer display rules.
            Null when progress cannot be computed because completion data is insufficient.
        workout_progress_status:
          type: string
          enum: [AVAILABLE, NOT_ENOUGH_DATA]
          description: |
            Availability state for workout_progress.
            AVAILABLE means workout_progress contains a numeric value.
            NOT_ENOUGH_DATA means progress is intentionally unavailable for this completion.
