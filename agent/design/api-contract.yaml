          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutSetInput'
    CompletedActiveWorkoutSet:
      type: object
      required:
        - set_index
        - set_side
        - load_value
      properties:
        set_index:
          type: integer
          format: int32
          minimum: 1
        set_side:
          type: string
          enum: [LEFT, RIGHT, BILATERAL]
          description: |
            Recorded side for this set entry.
            BILATERAL variants always use BILATERAL.
            UNILATERAL variants use LEFT and RIGHT entries for each set_index.
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            Canonical total load in kg. Nullable for stationless configured-gym options
            and free-mode/bodyweight-style sets where no station profile applies.
        load_value_per_side:
          type: number
          format: double
          nullable: true
          description: |
            Renderer-ready per-side load in kg for PER_SIDE variants.
            Null for TOTAL variants or when no load is applicable.
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          nullable: true
          description: |
            Repetition unit for this set entry.
            REPS means repetition_value is a count.
            SECS means repetition_value is total whole seconds.
        repetition_value:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Repetition value for this set entry.
            Interpreted according to repetition_kind: REPS=count, SECS=total whole seconds.
    ActiveWorkoutSet:
      type: object
      required:
        - set_index
        - set_side
        - suggested_load_input_kg
        - suggested_load_total_kg
      properties:
        set_index:
          type: integer
          format: int32
          minimum: 1
        set_side:
          type: string
          enum: [LEFT, RIGHT, BILATERAL]
          description: |
            Suggested side for the next entry.
            UNILATERAL flows progress left-then-right for each set_index.
            BILATERAL flows always suggest BILATERAL.
        suggested_load_input_kg:
          type: number
          format: double
          nullable: true
          description: |
            Renderer-ready suggested input load in kg for the active variant mode.
            For TOTAL variants this equals suggested_load_total_kg.
            For PER_SIDE variants this is a per-side value.
            Nullable when no load is applicable.
        suggested_load_total_kg:
          type: number
          format: double
          nullable: true
          description: |
            Canonical suggested total load in kg used for persistence semantics.
            Nullable when no load is applicable.
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          nullable: true
          description: |
            Suggested repetition unit for the next set entry.
            REPS means repetition_value is a count.
            SECS means repetition_value is total whole seconds.
        repetition_value:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Suggested repetition value for the next set entry.
            Interpreted according to repetition_kind: REPS=count, SECS=total whole seconds.
    ActiveWorkoutSetInput:
      type: object
      required:
        - set_index
        - set_side
        - load_value
      properties:
        set_index:
          type: integer
          format: int32
          minimum: 1
        set_side:
          type: string
          enum: [LEFT, RIGHT, BILATERAL]
          description: |
            Side being recorded for this set entry.
            UNILATERAL requests must submit LEFT first, then RIGHT for the same set_index.
            BILATERAL requests submit BILATERAL.
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            User-recorded canonical total load in kg.
            This field remains canonical total load for persistence semantics in both TOTAL and PER_SIDE modes.
            Nullable for stationless configured-gym options and free-mode/bodyweight-style sets.
        load_value_per_side:
          type: number
          format: double
          nullable: true
          description: |
            User-entered per-side load in kg for PER_SIDE variants.
            Null for TOTAL variants or when no load is applicable.
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          nullable: true
          description: |
            User-recorded repetition unit.
            REPS means repetition_value is a count.
            SECS means repetition_value is total whole seconds.
        repetition_value:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            User-recorded repetition value.
            Interpreted according to repetition_kind: REPS=count, SECS=total whole seconds.
