openapi: 3.0.3
info:
  title: PumpBuddy API
  version: 0.1.0
  description: |
    Canonical API contract for the active workout product slice.
    Note: the 2026-03-28 auth/session boundary refactor is internal-only and does
    not change external endpoints or payload schemas.
    Note: the 2026-04-06 workout-select greeting update reuses existing
    AuthSessionUser.display_name and does not change endpoint shapes.
    Note: the 2026-04-12 auth-failure logging hardening emits structured
    `auth_login_failure` telemetry for application attempt keys without
    endpoint or payload-schema changes.
    Note: the 2026-04-12 settings profile data update extends AuthSessionUser
    with `login` and `registration_date` for settings display.
    Note: the 2026-04-12 settings display-name persistence update adds PATCH
    /auth/session for authenticated display-name changes.
    Note: the 2026-04-13 settings preferences contract update extends PATCH
    /auth/session and AuthSessionUser with `favorite_gym_id`, and adds
    POST /auth/password for authenticated password changes.
    Note: the 2026-05-30 password-change lifecycle hardening keeps
    /auth/password request and response schemas unchanged while throttling
    repeated current-password failures and clearing the session cookie after a
    successful password change.
    Note: the 2026-04-14 About navigation wiring tightened renderer
    AboutMetadata.channel typing to `stable`; this is API-surface alignment
    only and does not change endpoint paths or payload schema shapes.
    Note: the 2026-04-17 workout history contract update adds GET /api/workouts
    for unbounded history-list retrieval used by the History screen.
    Note: the 2026-04-18 workout detail contract update adds GET
    /api/workouts/{workoutId} with hero metadata, completion stats, and ordered
    exercise set-line payload coverage for the History detail screen.
    Note: the 2026-04-18 workout detail regression-coverage update adds backend
    and renderer contract-alignment tests for mixed set-line formats and
    history-detail restore behavior; endpoint paths and payload schemas are
    unchanged.
    Note: the 2026-04-18 session profile max-load update extends
    AuthSessionUser and PATCH /auth/session payloads with `max_load_kg`
    and enforces backend-owned bounds validation.
    Note: the 2026-06-06 server-backed side-menu preference update extends
    AuthSessionUser with `side_menu_middle_click_counts` and adds
    POST /auth/session/side-menu-middle-clicks for authenticated per-user
    adaptive menu count increments.
    Note: the 2026-04-19 progress screen contract update adds GET
    /api/workouts/progress for 30-day workout progress scoring and trend rendering.
    Note: the 2026-04-21 workout semantics authority alignment confirms renderer
    consumption of backend-owned `set_tracking_mode` semantics from existing
    workout option and active-workout payload fields; endpoint paths and payload
    schemas are unchanged.
    Note: the 2026-04-21 exercises performance contract update adds GET
    /api/workouts/exercises-performance for 30-day variant performance groups
    with backend-owned scoring/tone semantics and renderer-ready row fields.
    Note: the 2026-04-22 exercises renderer integration alignment confirms
    renderer consumption types for /api/workouts/exercises-performance match the
    canonical WorkoutExercisesPerformance response schema; endpoint paths and
    payload shapes are unchanged.
    Note: the 2026-04-24 exercise variant detail navigation update extends
    renderer ViewState with an exercise-variant-detail route keyed by
    `variant_id` from the existing exercises-performance row payload; endpoint
    paths and payload shapes are unchanged.
    Note: the 2026-04-25 exercise variant detail contract revision removes
    `recent_sessions` from WorkoutExercisesPerformanceRow and adds
    backend-owned `personal_records_12m` grouped record payloads for renderer
    PR-table rendering; endpoint paths are unchanged.
    Note: the 2026-04-25 progress-detail back-navigation alignment extends
    renderer ViewState `workout-detail` with optional `returnScreen: progress`
    metadata so Progress-origin detail routes return to Progress on back; API
    endpoint paths and payload shapes are unchanged.
    Note: the 2026-04-25 workout-detail variant navigation contract update adds
    optional `variant_id` to WorkoutDetailExercise so Workout Detail rows can
    target Exercise Variant Detail without changing endpoint paths.
    Note: the 2026-04-25 workout-detail variant-id emission alignment confirms
    backend response mapping now emits WorkoutDetailExercise.variant_id from the
    canonical contract field; endpoint paths and payload shapes are unchanged.
    Note: the 2026-04-26 training-plan projection boundary update splits
    GET /api/training-plans/{trainingPlanId} detail reads from gym-context
    option/station realization used by
    GET /api/training-plans/{trainingPlanId}/options; endpoint paths and
    payload schemas are unchanged.
    Note: the 2026-05-16 training-plan options renderer alignment confirms
    renderer consumption of GET
    /api/training-plans/{trainingPlanId}/options now flows through generated
    OpenAPI models at the network boundary; endpoint paths and payload shapes
    are unchanged.
    Note: the 2026-06-04 training-plan detail renderer alignment confirms
    renderer consumption of GET /api/training-plans/{trainingPlanId}, with or
    without optional `gymId`, now flows through generated
    TrainingPlanDetailResponse models at the network boundary; endpoint paths
    and payload shapes are unchanged.
    Note: the 2026-05-16 active-workout start lifecycle alignment clarifies
    POST /api/active-workout as the initial persisted snapshot boundary for
    both configured-gym and free-mode starts, including free-mode snapshots
    before any completed set exists.
    Note: the 2026-05-16 API contract-alignment gate refresh keeps the
    deterministic review script, CI quality workflow, and strategy markers
    aligned on the same backend API tree and renderer contract-boundary files;
    endpoint paths and payload schemas are unchanged.
    Note: the 2026-05-16 auth explicit-login update removes the public
    blank-login bootstrap alias so POST /auth/login requires an explicit login
    identifier while bootstrap access-key handoff remains unchanged.
    Note: the 2026-05-29 gym transparency contract update extends
    GET /api/gyms with optional list metadata and adds read-only
    GET /api/gyms/{gymId} and
    GET /api/gyms/{gymId}/stations/{stationId} response schemas for gym,
    station, load-profile, and variant station-suitability inspection.
    Note: the 2026-05-29 gym transparency backend projection update confirms
    GET /api/gyms is authenticated user-scoped and ordered favorite-first when
    configured, then by gym display name, and confirms GET /api/gyms/{gymId}
    uses the existing deterministic station and exercise-grouped variant
    response contract.
    Note: the 2026-05-29 station transparency backend projection update
    confirms GET /api/gyms/{gymId}/stations/{stationId} is authenticated
    user-scoped, constrained by both gym id and station id, and returns
    read-only load-profile possible values plus enabled station-required
    compatible variants using the existing station detail response contract.
    Note: the 2026-05-29 gyms renderer navigation alignment confirms the
    top-level Gyms screen consumes GET /api/gyms through the generated
    GymSummary boundary for list rows with last-visited and station-count
    metadata; endpoint paths and payload schemas are unchanged.
    Note: the 2026-05-29 gym detail renderer browser alignment confirms the
    Gym Detail screen consumes GET /api/gyms/{gymId} through the generated
    GymDetailResponse boundary for Stations and Exercises sheet rendering;
    endpoint paths and payload schemas are unchanged.
    Note: the 2026-05-30 station detail renderer alignment confirms the Station
    Detail screen consumes GET /api/gyms/{gymId}/stations/{stationId} through
    the generated GymStationDetailResponse boundary for read-only station
    metadata, load-profile possible values, and suitable variant group
    rendering; endpoint paths and payload schemas are unchanged.
    Note: the 2026-05-30 backend application-service routing update moves
    workout, training-plan, and gym handler orchestration behind application
    service functions; endpoint paths and payload schemas are unchanged.
    Note: the 2026-04-26 logout revocation contract update clarifies
    POST /auth/logout as idempotent 204 plus cookie-clearing behavior while
    server-side session revocation remains an internal lifecycle concern.
    Note: the 2026-04-26 auth login abuse-resistance update enforces bounded
    application-key failed-attempt throttling with cooldown lockout and
    structured failure telemetry for POST /auth/login while preserving generic
    Unauthorized responses and existing request/response payload schemas.
    Note: the 2026-06-07 auth source-IP policy simplification removes
    app-level IP storage and source-IP throttling from PumpBuddy. PumpBuddy does
    not parse public forwarding headers or renderer-normalized client-IP
    handoff headers for login throttling; internet-facing client identity, rate
    limiting, and ban policy belong to the external reverse proxy or tools such
    as fail2ban.
paths:
  /auth/login:
    post:
      summary: Log in with login and password
      operationId: loginWithCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/session:
    get:
      summary: Resolve session state
      operationId: resolveSession
      responses:
        '200':
          description: Session resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update authenticated session user settings fields
      operationId: updateSessionProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUpdateDisplayNameRequest'
      responses:
        '200':
          description: Session profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Invalid profile update payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/session/side-menu-middle-clicks:
    post:
      summary: Increment authenticated side-menu middle click count
      operationId: incrementSideMenuMiddleClickCount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthIncrementSideMenuMiddleClickRequest'
      responses:
        '200':
          description: Side-menu middle click count incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Invalid side-menu preference update payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password:
    post:
      summary: Update authenticated user password
      operationId: updatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUpdatePasswordRequest'
      responses:
        '204':
          description: Password updated successfully and session cookie cleared
        '400':
          description: Invalid password update payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'Current password validation failed (message: "Current password validation failed")'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      summary: Log out current session
      operationId: logoutSession
      responses:
        '204':
          description: Logout succeeded
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/about:
    get:
      summary: Retrieve About metadata for renderer display
      operationId: getAboutMetadata
      responses:
        '200':
          description: About metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/gyms:
    get:
      summary: List available gyms
      operationId: listGyms
      responses:
        '200':
          description: |
            Gyms retrieved successfully for the authenticated user. Rows are
            ordered with the user's configured favorite gym first when visible,
            followed by gym display name with stable backend tie-breakers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GymSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/gyms/{gymId}:
    get:
      summary: Retrieve read-only gym transparency detail
      operationId: getGymDetail
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gym detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Gym not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/gyms/{gymId}/stations/{stationId}:
    get:
      summary: Retrieve read-only station transparency detail
      operationId: getGymStationDetail
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Station detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymStationDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Gym station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans:
    get:
      summary: List available training plans
      operationId: listTrainingPlans
      responses:
        '200':
          description: Training plans retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingPlanSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans/{trainingPlanId}:
    get:
      summary: Retrieve training plan detail
      operationId: getTrainingPlan
      parameters:
        - name: trainingPlanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gymId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Optional selected gym context for read-only plan browsing.
            When omitted, the response lists configured variants without
            availability, execution status, or station display data.
      responses:
        '200':
          description: Training plan browsing detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Training plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans/{trainingPlanId}/options:
    get:
      summary: List gym-agnostic training plan exercise variants realizable in a selected gym context
      operationId: listTrainingPlanExerciseVariants
      parameters:
        - name: trainingPlanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gymId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Training plan exercise variants retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanExerciseVariantsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts:
    get:
      summary: List completed workouts for History screen rendering
      operationId: listWorkouts
      responses:
        '200':
          description: Completed workouts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutHistoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a completed workout
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkoutRequest'
      responses:
        '201':
          description: Workout created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Workout payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts/progress:
    get:
      summary: Retrieve 30-day workout progress entries for Progress screen rendering
      operationId: getWorkoutProgress
      responses:
        '200':
          description: Workout progress entries retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts/exercises-performance:
    get:
      summary: Retrieve 30-day exercises performance groups for Exercises screen rendering
      operationId: getWorkoutExercisesPerformance
      responses:
        '200':
          description: Exercises performance groups retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutExercisesPerformanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts/{workoutId}/summary:
    get:
      summary: Retrieve a minimal workout summary
      operationId: getWorkoutSummary
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workout summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts/{workoutId}:
    get:
      summary: Retrieve workout detail for History screen rendering
      operationId: getWorkoutDetail
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workout detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout:
    get:
      summary: Retrieve the resumable active workout
      operationId: getActiveWorkout
      responses:
        '200':
          description: Active workout retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No active workout is available to resume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Start an active workout
      description: |
        Applies a start command and establishes the resumable active-workout record.
        The backend derives the training-plan exercise count, configured-gym
        realizability, and configured-gym default option selections, then returns
        canonical active-workout state for renderer hydration.
      operationId: createActiveWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActiveWorkoutRequest'
      responses:
        '201':
          description: Active workout created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An active workout already exists or the create transition is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}:
    put:
      summary: Advance an active workout cursor
      description: |
        Applies a forward-navigation command for an already created active workout.
        The backend validates the requested cursor position against current persisted
        exercise state and returns canonical active-workout state for renderer
        hydration.
      operationId: updateActiveWorkout
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActiveWorkoutRequest'
      responses:
        '200':
          description: Active workout updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout advance payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout advance is invalid for the current workout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Cancel an unfinished active workout
      operationId: cancelActiveWorkout
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Active workout cancelled and deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Active workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout cannot be cancelled in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}/exercises/{exercisePosition}/option:
    post:
      summary: Select the option for an active workout exercise
      description: |
        Applies an option-selection command before the selected exercise has completed
        set progress. The backend resolves selected variant metadata, station context,
        default set hints, and configured-gym validation, then returns canonical
        active-workout state for renderer hydration.
      operationId: selectActiveWorkoutExerciseOption
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exercisePosition
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectActiveWorkoutExerciseOptionRequest'
      responses:
        '200':
          description: Active workout exercise option selected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout option-selection payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout or exercise was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout option selection is invalid for the current workout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}/exercises/{exercisePosition}/sets:
    post:
      summary: Confirm the current set for an active workout exercise
      description: |
        Applies a set-confirmation command to the selected exercise. The backend
        resolves canonical set index, set side, load normalization, deletion/skip
        clearing, and next-set progression, then returns the canonical active-workout
        state for renderer hydration.
      operationId: confirmActiveWorkoutSet
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exercisePosition
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmActiveWorkoutSetRequest'
      responses:
        '200':
          description: Active workout set confirmed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout set confirmation payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout or exercise was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout set confirmation is invalid for the current workout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}/exercises/{exercisePosition}/sets/latest:
    delete:
      summary: Delete the latest completed set for an active workout exercise
      description: |
        Applies a latest-set deletion command to the selected exercise. The backend
        resolves which persisted logical set is latest, updates exercise completion
        state when needed, and returns the canonical active-workout state for renderer
        hydration.
      operationId: deleteLatestActiveWorkoutSet
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exercisePosition
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Latest active workout set deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout set deletion request was invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout, exercise, or completed set was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout set deletion is invalid for the current workout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}/exercises/{exercisePosition}/skip:
    post:
      summary: Skip an active workout exercise
      description: |
        Applies a skip command to the selected exercise. The backend records the
        skip marker, advances the cursor when appropriate, and returns canonical
        active-workout state for renderer hydration.
      operationId: skipActiveWorkoutExercise
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exercisePosition
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipActiveWorkoutExerciseRequest'
      responses:
        '200':
          description: Active workout exercise skipped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout skip payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout or exercise was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout skip is invalid for the current workout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}/reopen:
    post:
      summary: Reopen a previous active workout exercise
      description: |
        Applies a backward-reopen command before new progress is recorded on the
        current exercise. The backend clears the reopened exercise completion marker
        while preserving persisted set and selection context, then returns canonical
        active-workout state for renderer hydration.
      operationId: reopenActiveWorkoutExercise
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenActiveWorkoutExerciseRequest'
      responses:
        '200':
          description: Active workout exercise reopened successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout reopen payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout or exercise was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout reopen is invalid for the current workout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}/complete:
    post:
      summary: Complete an active workout
      description: |
        Applies a completion command and transitions the workout out of the
        resumable active-workout lifecycle. The backend derives final exercise
        progress from persisted active-workout state instead of accepting a full
        renderer-authored exercise snapshot.
      operationId: completeActiveWorkout
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteActiveWorkoutRequest'
      responses:
        '200':
          description: Active workout completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout completion payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout cannot be completed in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    Unauthorized:
      description: Unauthorized (empty response body)
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AboutMetadataResponse:
      type: object
      required:
        - app_version
        - commit_hash_short
        - build_timestamp_utc
        - channel
      properties:
        app_version:
          type: string
        commit_hash_short:
          type: string
          description: Short commit hash rendered in About screen.
        build_timestamp_utc:
          type: string
          description: Build/commit timestamp rendered as YYYY-MM-DD HH:mm UTC.
        channel:
          type: string
          enum: [stable]
    AuthLoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          description: Explicit public login identifier. Blank values are invalid.
        password:
          type: string
    AuthLoginResponse:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
    AuthSessionResponse:
      type: object
      required:
        - authenticated
        - user
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/AuthSessionUser'
    AuthSessionUser:
      type: object
      required:
        - id
        - display_name
        - max_load_kg
        - side_menu_middle_click_counts
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        max_load_kg:
          type: number
          format: double
        login:
          type: string
        registration_date:
          type: string
          format: date-time
        favorite_gym_id:
          type: string
          format: uuid
          nullable: true
        side_menu_middle_click_counts:
          $ref: '#/components/schemas/SideMenuMiddleClickCounts'
    SideMenuMiddleClickCounts:
      type: object
      required:
        - progress
        - history
        - exercises
        - training_plans
        - gyms
      properties:
        progress:
          type: integer
          format: int64
          minimum: 0
        history:
          type: integer
          format: int64
          minimum: 0
        exercises:
          type: integer
          format: int64
          minimum: 0
        training_plans:
          type: integer
          format: int64
          minimum: 0
        gyms:
          type: integer
          format: int64
          minimum: 0
    AuthIncrementSideMenuMiddleClickRequest:
      type: object
      required:
        - screen
      properties:
        screen:
          type: string
          enum:
            - progress
            - history
            - exercises
            - training_plans
            - gyms
    AuthUpdateDisplayNameRequest:
      type: object
      required:
        - display_name
      properties:
        display_name:
          type: string
        max_load_kg:
          type: number
          format: double
          minimum: 100
          maximum: 999
        favorite_gym_id:
          type: string
          format: uuid
          nullable: true
    AuthUpdatePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
        - confirm_new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
        confirm_new_password:
          type: string
    GymSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        station_count:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            Count of stations visible for this gym. Optional during staged
            rollout so existing start-screen gym consumption remains compatible.
        last_visited_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Most recent completed workout timestamp for this gym.
            Null when the authenticated user has no completed visits.
            Optional during staged rollout so existing start-screen gym
            consumption remains compatible.
    GymDetailResponse:
      type: object
      description: |
        Read-only gym transparency payload for renderer detail browsing.
        Ordering of stations, exercise groups, variants, and station options is
        backend-owned and deterministic by display name with stable id
        tie-breakers.
      required:
        - id
        - name
        - station_count
        - last_visited_at
        - stations
        - exercise_groups
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        station_count:
          type: integer
          format: int64
          minimum: 0
        last_visited_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Most recent completed workout timestamp for this gym.
            Null when the authenticated user has no completed visits.
        stations:
          type: array
          items:
            $ref: '#/components/schemas/GymStationSummary'
        exercise_groups:
          type: array
          description: Exercise variants grouped by canonical exercise.
          items:
            $ref: '#/components/schemas/GymExerciseGroup'
    GymStationSummary:
      type: object
      required:
        - id
        - name
        - load_profile_name
        - suitable_variant_count
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        load_profile_name:
          type: string
          description: Display name of the station load profile.
        suitable_variant_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of station-required variants compatible with this station.
    GymExerciseGroup:
      type: object
      required:
        - exercise_id
        - exercise_name
        - variants
      properties:
        exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/GymExerciseVariantSummary'
    GymExerciseVariantSummary:
      type: object
      description: |
        Gym transparency variant projection. Stationless rows are represented by
        requires_station=false, station_availability=STATIONLESS, and an empty
        station_options array rather than a synthetic station record.
      required:
        - variant_id
        - variant_name
        - requires_station
        - station_availability
        - repetition_kind
        - load_input_mode
        - set_tracking_mode
        - station_options
      properties:
        variant_id:
          type: string
          format: uuid
        variant_name:
          type: string
        requires_station:
          type: boolean
          description: Canonical ExerciseVariant.requires_station value.
        station_availability:
          type: string
          enum: [STATIONLESS, SINGLE_STATION, MULTI_STATION]
          description: |
            Backend-derived station suitability bucket for renderer navigation.
            STATIONLESS opens exercise variant detail directly.
            SINGLE_STATION opens that station detail directly.
            MULTI_STATION requires station selection before station detail.
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          description: Variant repetition unit used by renderer detail copy.
        load_input_mode:
          type: string
          enum: [TOTAL, PER_SIDE]
          description: Variant load entry mode.
        set_tracking_mode:
          type: string
          enum: [UNILATERAL, BILATERAL]
          description: Variant set-tracking mode.
        station_options:
          type: array
          description: |
            Compatible station options for station-required variants in this
            gym. Empty for stationless variants.
          items:
            $ref: '#/components/schemas/GymStationOption'
    GymStationOption:
      type: object
      required:
        - station_id
        - station_name
      properties:
        station_id:
          type: string
          format: uuid
        station_name:
          type: string
        station_profile_loads_kg:
          type: array
          description: |
            Optional station load-profile values in canonical kg. Present when
            a caller needs station range display, such as training-plan detail
            compatible-station rows. Omitted for compact gym station options.
          items:
            type: number
            format: double
    GymStationDetailResponse:
      type: object
      description: |
        Read-only station transparency payload scoped to one gym station.
        Stationless variants are not included because this payload describes a
        concrete station and its explicit compatibility mappings.
      required:
        - gym_id
        - gym_name
        - station_id
        - station_name
        - load_profile
        - suitable_variant_groups
      properties:
        gym_id:
          type: string
          format: uuid
        gym_name:
          type: string
        station_id:
          type: string
          format: uuid
        station_name:
          type: string
        load_profile:
          $ref: '#/components/schemas/GymLoadProfileSummary'
        suitable_variant_groups:
          type: array
          description: |
            Station-required variants compatible with this station, grouped by
            canonical exercise and sorted by backend-owned display order.
          items:
            $ref: '#/components/schemas/GymStationExerciseGroup'
    GymLoadProfileSummary:
      type: object
      required:
        - id
        - name
        - weight_unit
        - definition_kind
        - possible_loads_kg
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        weight_unit:
          type: string
          enum: [KG, LBS]
          description: Source unit of the immutable load profile definition.
        definition_kind:
          type: string
          enum: [fixed_list, formula]
          description: LoadProfile.definition kind discriminator.
        possible_loads_kg:
          type: array
          description: |
            Sorted canonical kg values expanded from the immutable load profile
            definition. Formula profiles expose finite generated values using
            the existing backend expansion cap.
          items:
            type: number
            format: double
    GymStationExerciseGroup:
      type: object
      required:
        - exercise_id
        - exercise_name
        - variants
      properties:
        exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/GymStationExerciseVariantSummary'
    GymStationExerciseVariantSummary:
      type: object
      required:
        - variant_id
        - variant_name
        - repetition_kind
        - load_input_mode
        - set_tracking_mode
      properties:
        variant_id:
          type: string
          format: uuid
        variant_name:
          type: string
        repetition_kind:
          type: string
          enum: [REPS, SECS]
        load_input_mode:
          type: string
          enum: [TOTAL, PER_SIDE]
        set_tracking_mode:
          type: string
          enum: [UNILATERAL, BILATERAL]
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      properties:
        selected_gym_id:
          type: string
          format: uuid
          description: |
            Gym selected for configured-gym workout start validation.
            Returned when workout start is blocked because one or more exercises have no realizable option in that gym.
            Equals the configured-gym context used for start validation.
        missing_exercises:
          type: array
          description: |
            Plan exercises that block configured-gym workout start in the selected gym context.
            Each item identifies the training-plan exercise that has no realizable option after compatibility filtering.
            Items are sorted by exercise_position ascending, then training_plan_exercise_id.
          items:
            $ref: '#/components/schemas/MissingExerciseDetail'
    MissingExerciseDetail:
      type: object
      required:
        - training_plan_exercise_id
        - exercise_name
        - exercise_position
        - reason
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_position:
          type: integer
          format: int32
          minimum: 1
        reason:
          type: string
    ActiveWorkoutResponse:
      type: object
      required:
        - workout
      properties:
        workout:
          $ref: '#/components/schemas/ActiveWorkout'
    ActiveWorkout:
      type: object
      required:
        - id
        - training_plan_id
        - training_plan_name
        - gym_id
        - gym_name
        - started_at
        - updated_at
        - current_exercise_position
        - total_exercise_count
        - exercises
      properties:
        id:
          type: string
          format: uuid
        training_plan_id:
          type: string
          format: uuid
        training_plan_name:
          type: string
        gym_id:
          type: string
          format: uuid
          nullable: true
          description: Nullable gym binding; clients derive workout mode from this field, with null meaning free and non-null meaning configured_gym.
        gym_name:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the exercise the renderer should show when resuming
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExercise'
    CreateActiveWorkoutRequest:
      type: object
      required:
        - training_plan_id
        - started_at
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          nullable: true
          description: Nullable gym binding; null creates a free workout and non-null creates a configured_gym workout. No separate workout_mode field is sent.
        started_at:
          type: string
          format: date-time
    UpdateActiveWorkoutRequest:
      type: object
      required:
        - current_exercise_position
      properties:
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based exercise position the backend should display after forward navigation.
    SelectActiveWorkoutExerciseOptionRequest:
      type: object
      required:
        - training_plan_exercise_variant_id
        - selected_station_id
      properties:
        training_plan_exercise_variant_id:
          type: string
          format: uuid
          description: TrainingPlanExerciseVariant option id selected by the user.
        selected_station_id:
          type: string
          format: uuid
          nullable: true
          description: Nullable station selection; null selects a stationless option.
    SkipActiveWorkoutExerciseRequest:
      type: object
      required:
        - skipped_at
        - current_exercise_position
      properties:
        skipped_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based exercise position the backend should display after the skip command.
    ReopenActiveWorkoutExerciseRequest:
      type: object
      required:
        - current_exercise_position
      properties:
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based previous exercise position to reopen.
    CompleteActiveWorkoutRequest:
      type: object
      required:
        - completed_at
      properties:
        completed_at:
          type: string
          format: date-time
    ActiveWorkoutProgressPayload:
      type: object
      deprecated: true
      required:
        - training_plan_id
        - gym_id
        - started_at
        - current_exercise_position
        - total_exercise_count
        - exercises
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          nullable: true
          description: Nullable gym binding; active-workout mode is derived from this field instead of a separate workout_mode value.
        started_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the next exercise to display after the save completes
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          description: Deprecated legacy active-workout snapshot shape. Execution mutations use command requests instead.
          items:
            $ref: '#/components/schemas/ActiveWorkoutExerciseInput'
    ConfirmActiveWorkoutSetRequest:
      type: object
      required:
        - set
      properties:
        set:
          $ref: '#/components/schemas/ActiveWorkoutSetDraftInput'
    ActiveWorkoutSetDraftInput:
      type: object
      required:
        - load_value
        - repetition_value
      properties:
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            User-entered load in kg using the selected variant input mode.
            TOTAL variants interpret this as canonical total load. PER_SIDE variants
            interpret this as per-side load and let the backend derive canonical total
            load. Nullable when no load applies.
        repetition_value:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            User-entered repetition value for the set being confirmed. Interpreted
            by the backend according to the selected variant repetition kind.
    ActiveWorkoutExercise:
      type: object
      required:
        - training_plan_exercise_id
        - position
        - exercise_name
        - selected_training_plan_exercise_variant_id
        - selected_variant_id
        - selected_variant_name
        - load_input_mode
        - set_tracking_mode
        - selected_station_id
        - selected_station_name
        - completed_sets
        - suggested_set
        - next_set
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          minimum: 1
        exercise_name:
          type: string
        selected_training_plan_exercise_variant_id:
          type: string
          format: uuid
          nullable: true
        selected_variant_id:
          type: string
          format: uuid
          nullable: true
        selected_variant_name:
          type: string
          nullable: true
        load_input_mode:
          type: string
          enum: [TOTAL, PER_SIDE]
          nullable: true
          description: |
            Variant load entry mode for renderer load editing. Null when no variant has been selected yet.
            TOTAL means renderer input values and canonical total values are identical.
            PER_SIDE means renderer input values are per-side while canonical total values remain two-sided.
        set_tracking_mode:
          type: string
          enum: [UNILATERAL, BILATERAL]
          nullable: true
          description: |
            Variant set tracking behavior. Null when no variant has been selected yet.
            BILATERAL records one set entry using set_side=BILATERAL.
            UNILATERAL records deterministic left-then-right entries using set_side=LEFT then set_side=RIGHT for each set_index.
        selected_station_id:
          type: string
          format: uuid
          nullable: true
        selected_station_name:
          type: string
          nullable: true
        skipped_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp recorded when the exercise was explicitly skipped.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp recorded when the exercise was marked completed.
        completed_sets:
          type: array
          items:
            $ref: '#/components/schemas/CompletedActiveWorkoutSet'
        suggested_set:
          $ref: '#/components/schemas/ActiveWorkoutSet'
        next_set:
          $ref: '#/components/schemas/ActiveWorkoutNextSetHint'
    ActiveWorkoutExerciseInput:
      type: object
      required:
        - training_plan_exercise_id
        - position
        - selected_training_plan_exercise_variant_id
        - selected_variant_id
        - selected_station_id
        - completed_sets
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          minimum: 1
        selected_training_plan_exercise_variant_id:
          type: string
          format: uuid
          nullable: true
        selected_variant_id:
          type: string
          format: uuid
          nullable: true
        load_input_mode:
          type: string
          enum: [TOTAL, PER_SIDE]
          nullable: true
          description: |
            Optional legacy echo of the selected variant load entry mode.
            The backend derives authoritative load semantics from the selected ExerciseVariant metadata.
            When provided, this value must match the selected variant metadata.
        set_tracking_mode:
          type: string
          enum: [UNILATERAL, BILATERAL]
          nullable: true
          description: |
            Optional legacy echo of the selected variant set tracking behavior.
            The backend derives authoritative set-side semantics from the selected ExerciseVariant metadata.
            When provided, this value must match the selected variant metadata.
        selected_station_id:
          type: string
          format: uuid
          nullable: true
        skipped_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp recorded when the exercise was explicitly skipped.
        completed_sets:
          type: array
          description: |
            Completed set entries already persisted for this exercise. The array may be
            empty when the payload is persisting a pre-set snapshot instead of recorded
            set progress, including free-mode workout start before any completed set exists.
          items:
            $ref: '#/components/schemas/ActiveWorkoutSetInput'
    CompletedActiveWorkoutSet:
      type: object
      required:
        - set_index
        - set_side
        - load_value
      properties:
        set_index:
          type: integer
          format: int32
          minimum: 1
        set_side:
          type: string
          enum: [LEFT, RIGHT, BILATERAL]
          description: |
            Recorded side for this set entry.
            BILATERAL variants always use BILATERAL.
            UNILATERAL variants use LEFT and RIGHT entries for each set_index.
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            Canonical total load in kg. Nullable for stationless configured-gym options
            and free-mode/bodyweight-style sets where no station profile applies.
        load_value_per_side:
          type: number
          format: double
          nullable: true
          description: |
            Renderer-ready per-side load in kg for PER_SIDE variants.
            Null for TOTAL variants or when no load is applicable.
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          nullable: true
          description: |
            Repetition unit for this set entry.
            REPS means repetition_value is a count.
            SECS means repetition_value is total whole seconds.
        repetition_value:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Repetition value for this set entry.
            Interpreted according to repetition_kind: REPS=count, SECS=total whole seconds.
    ActiveWorkoutSet:
      type: object
      required:
        - set_index
        - set_side
        - suggested_load_input_kg
        - suggested_load_total_kg
      properties:
        set_index:
          type: integer
          format: int32
          minimum: 1
        set_side:
          type: string
          enum: [LEFT, RIGHT, BILATERAL]
          description: |
            Suggested side for the next entry.
            UNILATERAL flows progress left-then-right for each set_index.
            BILATERAL flows always suggest BILATERAL.
        suggested_load_input_kg:
          type: number
          format: double
          nullable: true
          description: |
            Renderer-ready suggested input load in kg for the active variant mode.
            For TOTAL variants this equals suggested_load_total_kg.
            For PER_SIDE variants this is a per-side value.
            Nullable when no load is applicable.
        suggested_load_total_kg:
          type: number
          format: double
          nullable: true
          description: |
            Canonical suggested total load in kg used for persistence semantics.
            Nullable when no load is applicable.
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          nullable: true
          description: |
            Suggested repetition unit for the next set entry.
            REPS means repetition_value is a count.
            SECS means repetition_value is total whole seconds.
        repetition_value:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Suggested repetition value for the next set entry.
            Interpreted according to repetition_kind: REPS=count, SECS=total whole seconds.
    ActiveWorkoutNextSetHint:
      type: object
      required:
        - set_index
        - set_side
      properties:
        set_index:
          type: integer
          format: int32
          minimum: 1
          description: Backend-owned next set index progression hint for renderer state hydration.
        set_side:
          type: string
          enum: [LEFT, RIGHT, BILATERAL]
          description: Backend-owned next set side progression hint for renderer state hydration.
    ActiveWorkoutSetInput:
      type: object
      required:
        - set_index
        - set_side
        - load_value
      properties:
        set_index:
          type: integer
          format: int32
          minimum: 1
        set_side:
          type: string
          enum: [LEFT, RIGHT, BILATERAL]
          description: |
            Side being recorded for this set entry.
            UNILATERAL requests must submit LEFT first, then RIGHT for the same set_index.
            BILATERAL requests submit BILATERAL.
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            User-recorded canonical total load in kg.
            This field remains canonical total load for persistence semantics in both TOTAL and PER_SIDE modes.
            Nullable for stationless configured-gym options and free-mode/bodyweight-style sets.
        load_value_per_side:
          type: number
          format: double
          nullable: true
          description: |
            User-entered per-side load in kg for PER_SIDE variants.
            Null for TOTAL variants or when no load is applicable.
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          nullable: true
          description: |
            User-recorded repetition unit.
            REPS means repetition_value is a count.
            SECS means repetition_value is total whole seconds.
        repetition_value:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            User-recorded repetition value.
            Interpreted according to repetition_kind: REPS=count, SECS=total whole seconds.
    CreateWorkoutRequest:
      type: object
      required:
        - training_plan_id
        - exercises
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          description: Optional gym binding; omitted records free mode and provided records configured_gym mode. No separate workout_mode field is sent.
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/CreateWorkoutExerciseInput'
    CreateWorkoutExerciseInput:
      type: object
      required:
        - training_plan_exercise_id
        - position
        - set
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          minimum: 1
        selected_training_plan_exercise_variant_id:
          type: string
          format: uuid
          nullable: true
        selected_variant_id:
          type: string
          format: uuid
          nullable: true
        selected_station_id:
          type: string
          format: uuid
          nullable: true
        set:
          $ref: '#/components/schemas/CreateWorkoutSetInput'
    CreateWorkoutSetInput:
      type: object
      required:
        - load_value
      properties:
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            User-recorded load in kg. Nullable for stationless configured-gym options
            and free-mode/bodyweight-style sets.
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          nullable: true
          description: |
            User-recorded repetition unit for the completed set.
            REPS means repetition_value is a count.
            SECS means repetition_value is total whole seconds.
        repetition_value:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            User-recorded repetition value for the completed set.
            Interpreted according to repetition_kind: REPS=count, SECS=total whole seconds.
    TrainingPlanSummary:
      type: object
      required:
        - id
        - name
        - exercise_count
        - last_completed_at
        - start_selection_rank
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        exercise_count:
          type: integer
          format: int64
          minimum: 0
        last_completed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Most recent completed workout timestamp for this training plan.
            Null when the plan has no completed workout history.
        start_selection_rank:
          type: integer
          format: int32
          minimum: 1
          description: |
            Backend-owned deterministic ordering key for start-screen default plan selection.
            Lower rank values are preferred (rank 1 is the default selection).
            Ranking is resolved backend-side using canonical workout recency tie-break rules.
    TrainingPlanExerciseDetail:
      type: object
      required:
        - training_plan_exercise_id
        - exercise_name
        - exercise_position
        - configured_variant_count
        - executable_variant_count
        - execution_status
        - variants
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_position:
          type: integer
          format: int32
          minimum: 1
        configured_variant_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Count of variants configured for this plan exercise in the latest
            visible plan version, independent of selected-gym availability.
        executable_variant_count:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Count of variants available in the selected gym. Null when no gym
            context is selected.
        execution_status:
          type: string
          enum: [GREEN, YELLOW, RED]
          nullable: true
          description: |
            Backend-owned traffic-light status for selected-gym plan browsing.
            GREEN means every configured variant is available for this exercise.
            YELLOW means at least one but not all configured variants are available.
            RED means no configured variants are available.
            Null when no gym context is selected.
        variants:
          type: array
          items:
            $ref: '#/components/schemas/TrainingPlanExerciseVariantDetail'
    TrainingPlanExerciseVariantDetail:
      type: object
      description: |
        One configured variant for a training-plan exercise in read-only
        browsing detail. Variant records remain gym-agnostic; selected-gym
        availability and station rows are compatibility-derived projection data.
      required:
        - id
        - training_plan_exercise_id
        - variant_id
        - variant_name
        - requires_station
        - rep_min
        - rep_max
        - target_sets
        - repetition_kind
        - load_input_mode
        - set_tracking_mode
        - availability
        - compatible_stations
      properties:
        id:
          type: string
          format: uuid
          description: TrainingPlanExerciseVariant identifier.
        training_plan_exercise_id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        variant_name:
          type: string
        requires_station:
          type: boolean
        rep_min:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        rep_max:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        target_sets:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        repetition_kind:
          type: string
          enum: [REPS, SECS]
        load_input_mode:
          type: string
          enum: [TOTAL, PER_SIDE]
        set_tracking_mode:
          type: string
          enum: [UNILATERAL, BILATERAL]
        availability:
          type: string
          enum: [AVAILABLE, NOT_AVAILABLE]
          nullable: true
          description: |
            Selected-gym variant availability. Null when no gym context is selected.
        compatible_stations:
          type: array
          description: |
            Compatible stations in the selected gym for station-required variants.
            Empty for stationless variants, unavailable variants, and no-gym responses.
          items:
            $ref: '#/components/schemas/GymStationOption'
    TrainingPlanDetailResponse:
      type: object
      required:
        - id
        - name
        - selected_gym_id
        - is_executable
        - execution_status
        - execution_summary
        - exercises
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        selected_gym_id:
          type: string
          format: uuid
          nullable: true
          description: Selected gym context for this browsing projection, or null in no-gym mode.
        is_executable:
          type: boolean
          nullable: true
          description: |
            True when every plan exercise has at least one available variant in
            the selected gym. Null when no gym context is selected.
        execution_status:
          type: string
          enum: [GREEN, YELLOW, RED]
          nullable: true
          description: |
            Backend-owned compact plan status for selected-gym browsing.
            GREEN means every configured exercise has at least one executable
            variant. RED means at least one exercise has no executable variant.
            YELLOW is retained for enum compatibility but is not emitted for
            plan-level status. Null in no-gym mode.
        execution_summary:
          type: string
          nullable: true
          description: Optional compact summary line for selected-gym plan detail.
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/TrainingPlanExerciseDetail'
    TrainingPlanExerciseVariantSummary:
      type: object
      description: |
        Gym-agnostic training plan exercise variant definition projected into a selected gym context.
        Station and load-profile fields are compatibility-derived realizability details for that selected gym.
      required:
        - id
        - training_plan_exercise_id
        - exercise_name
        - exercise_position
        - rep_min
        - rep_max
        - target_sets
        - variant_id
        - variant_name
        - repetition_kind
        - load_input_mode
        - set_tracking_mode
        - station_profile_loads_kg
        - suggested_start_load_kg
        - last_completed_at
        - fallback_selection_rank
      properties:
        id:
          type: string
          format: uuid
        training_plan_exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_position:
          type: integer
          format: int32
          minimum: 1
        rep_min:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Variant-level lower repetition bound used by progression fallback suggestions.
            Null disables fallback suggestions for this variant.
        rep_max:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Variant-level upper repetition bound used by progression fallback suggestions.
            Null disables fallback suggestions for this variant.
        target_sets:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Optional logical set target for this variant.
            Null preserves legacy unlimited-set semantics.
            When present, renderer visual progression uses logical-set counting thresholds.
        variant_id:
          type: string
          format: uuid
        variant_name:
          type: string
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          description: |
            Variant repetition unit used by renderer set controls.
            REPS means count-based controls.
            SECS means timed controls with total whole seconds.
        load_input_mode:
          type: string
          enum: [TOTAL, PER_SIDE]
          description: |
            Variant load entry mode. TOTAL consumes/returns canonical total load values directly.
            PER_SIDE is a two-sided entry mode where canonical total load remains the persisted representation.
        set_tracking_mode:
          type: string
          enum: [UNILATERAL, BILATERAL]
          description: |
            Variant set-tracking mode.
            BILATERAL uses one persisted entry per set_index with set_side=BILATERAL.
            UNILATERAL uses paired set-side entries in deterministic left-then-right order.
        station_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Station identifier for station-based variants. Null for stationless variants.
        station_name:
          type: string
          nullable: true
          description: |
            Human-readable station label for station-based variants. Null for stationless variants.
        station_profile_loads_kg:
          type: array
          nullable: true
          description: |
            Ordered station profile loads in kg for station-based variants.
            Empty or null for stationless variants.
          items:
            type: number
            format: double
        suggested_start_load_kg:
          type: number
          format: double
          nullable: true
          description: |
            Backend-derived canonical starting load suggestion for this variant.
            Null for stationless variants.
        last_completed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Most recent completed workout timestamp for this exact training-plan-exercise
            and variant+station combination.
            Null when no completed history exists for the combination.
        fallback_selection_rank:
          type: integer
          format: int32
          minimum: 1
          description: |
            Backend-owned deterministic ordering key for fallback option preselection
            within one training-plan exercise.
            Lower rank values are preferred (rank 1 is the default fallback selection).
    TrainingPlanExerciseVariantsResponse:
      type: object
      description: |
        Realizable training plan exercise variant projection for one training plan within a selected gym context.
        Variants remain gym-agnostic source-of-truth records; gym_id identifies the validation/projection context.
      required:
        - training_plan_id
        - gym_id
        - exercise_variants
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
        exercise_variants:
          type: array
          items:
            $ref: '#/components/schemas/TrainingPlanExerciseVariantSummary'
    WorkoutHistoryListResponse:
      type: array
      items:
        $ref: '#/components/schemas/WorkoutHistorySummary'
    WorkoutExercisesPerformanceResponse:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutExercisesPerformanceGroup'
    WorkoutExercisesPerformanceGroup:
      type: object
      required:
        - tone
        - rows
      properties:
        tone:
          type: string
          enum: [GREEN, YELLOW, RED, GRAY]
          description: |
            Backend-derived tone bucket for this group.
            GREEN means > 1.03, YELLOW means 0.95-1.03, RED means < 0.95, and GRAY means unavailable.
        rows:
          type: array
          description: |
            Rows belonging to this tone bucket.
            Every row.performance_tone must equal the parent group tone.
          items:
            $ref: '#/components/schemas/WorkoutExercisesPerformanceRow'
    WorkoutExercisesPerformanceRow:
      type: object
      required:
        - variant_id
        - exercise_name
        - variant_name
        - last_performed_at
        - last_performed_days_ago
        - last_performed_first_set_display
        - selected_station_average_score_30d
        - variant_session_count_30d
        - performance_status
        - performance_tone
      properties:
        variant_id:
          type: string
          format: uuid
        exercise_name:
          type: string
          description: Canonical exercise name associated with the selected variant.
        variant_name:
          type: string
        last_performed_at:
          type: string
          format: date-time
        last_performed_days_ago:
          type: integer
          format: int32
          minimum: 0
          description: Whole days elapsed since the last completed workout containing this variant.
        last_performed_first_set_display:
          type: string
          description: |
            Renderer-ready first-set summary from the most recent completed workout containing this variant.
            String may encode load/reps/secs combinations depending on available set data.
        selected_station_average_score_30d:
          type: number
          format: double
          nullable: true
          description: |
            Average performance_score for the selected variant+station stream in the 30-day window.
            Selection is backend-determined by highest sample count, then most recent in-window workout for ties.
            Null when performance_status is NOT_ENOUGH_DATA.
        variant_session_count_30d:
          type: integer
          format: int32
          minimum: 0
          description: |
            Variant-wide completed workout count in the 30-day window across all stations.
            This value is independent from selected_station_average_score_30d stream selection.
        performance_status:
          type: string
          enum: [AVAILABLE, NOT_ENOUGH_DATA]
          description: |
            Availability state for selected_station_average_score_30d.
            AVAILABLE means selected_station_average_score_30d contains a numeric value.
            NOT_ENOUGH_DATA means score is intentionally unavailable for this row.
        performance_tone:
          type: string
          enum: [GREEN, YELLOW, RED, GRAY]
          description: |
            Backend-derived tone classification for selected_station_average_score_30d.
            GREEN means > 1.03, YELLOW means 0.95-1.03, RED means < 0.95, and GRAY means unavailable.
            Must match the enclosing WorkoutExercisesPerformanceGroup.tone.
        score_trend_30d:
          $ref: '#/components/schemas/WorkoutExercisesScoreTrend30d'
          nullable: true
          description: |
            Comparable scored-session trend stream for the selected station over the last 30 days.
            Null or absent when trend points are unavailable.
        strength_progression_12m:
          $ref: '#/components/schemas/WorkoutExercisesStrengthProgression12m'
          nullable: true
          description: |
            Session-level strength progression projection for the last 12 months.
            Null or absent when no progression projection is available.
        personal_records_12m:
          $ref: '#/components/schemas/WorkoutExercisesPersonalRecords12m'
          nullable: true
          description: |
            Backend-derived personal-record rows for the last 12 months.
            Null or absent when no personal-record projection is available.
    WorkoutExercisesScoreTrend30d:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          description: |
            Comparable scored-session entries in ascending time order.
          items:
            $ref: '#/components/schemas/WorkoutExercisesScoreTrendPoint'
    WorkoutExercisesScoreTrendPoint:
      type: object
      required:
        - occurred_at
        - score
      properties:
        occurred_at:
          type: string
          format: date-time
        score:
          type: number
          format: double
          minimum: 0.7
          maximum: 1.2
    WorkoutExercisesStrengthProgression12m:
      type: object
      required:
        - metric_modes
      properties:
        metric_modes:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutExercisesStrengthMetricMode'
    WorkoutExercisesStrengthMetricMode:
      type: object
      required:
        - id
        - label
        - family
        - station_modes
        - points
      properties:
        id:
          type: string
        label:
          type: string
        family:
          type: string
          enum: [kg, reps, time]
        station_modes:
          type: array
          items:
            type: string
            enum: [primary, all]
        points:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutExercisesStrengthPoint'
    WorkoutExercisesStrengthPoint:
      type: object
      required:
        - occurred_at
        - value
      properties:
        occurred_at:
          type: string
          format: date-time
        value:
          type: number
          format: double
        station_id:
          type: string
          format: uuid
          nullable: true
        station_label:
          type: string
          nullable: true
        is_primary_station:
          type: boolean
          nullable: true
    WorkoutExercisesPersonalRecords12m:
      type: object
      required:
        - metric_family
        - entries
      properties:
        metric_family:
          type: string
          enum: [load_x_reps, load_x_seconds, reps_only, seconds_only]
          description: Metric family associated with the projected personal-record rows.
        entries:
          type: array
          description: |
            Backend-derived personal-record entry rows for the selected metric family.
          items:
            $ref: '#/components/schemas/WorkoutExercisesPersonalRecordEntry'
    WorkoutExercisesPersonalRecordEntry:
      type: object
      required:
        - occurred_at
      properties:
        occurred_at:
          type: string
          format: date-time
          description: Timestamp for the source session producing this record entry.
        load_kg:
          type: number
          format: double
          nullable: true
          description: Canonical load value in kg, when applicable.
        reps:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Repetition value, when applicable.
        seconds:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Duration value in whole seconds, when applicable.
    WorkoutProgressResponse:
      type: object
      required:
        - workouts
      properties:
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutProgressEntry'
    WorkoutProgressEntry:
      type: object
      required:
        - id
        - training_plan_name
        - completed_at
        - workout_progress
        - workout_progress_status
        - progress_tone
      properties:
        id:
          type: string
          format: uuid
        training_plan_name:
          type: string
        completed_at:
          type: string
          format: date-time
        workout_progress:
          type: number
          format: double
          nullable: true
          description: |
            Workout score ratio clamped to [0.70, 1.20] using completion-time scoring rules.
            Null when score cannot be computed because historical comparison data is insufficient.
        workout_progress_status:
          type: string
          enum: [AVAILABLE, NOT_ENOUGH_DATA]
          description: |
            Availability state for workout_progress.
            AVAILABLE means workout_progress contains a numeric value.
            NOT_ENOUGH_DATA means progress is intentionally unavailable for this workout.
        progress_tone:
          type: string
          enum: [GREEN, YELLOW, RED, GRAY]
          description: |
            Backend-derived tone classification for workout_progress.
            GREEN means > 1.03, YELLOW means 0.95-1.03, RED means < 0.95, and GRAY means unavailable.
            Uses the same centralized backend tone classifier as Exercises and Workout Completion payloads.
    WorkoutDetailResponse:
      type: object
      required:
        - id
        - hero
        - completion_stats
        - exercises
      properties:
        id:
          type: string
          format: uuid
        hero:
          $ref: '#/components/schemas/WorkoutDetailHero'
        completion_stats:
          $ref: '#/components/schemas/WorkoutDetailCompletionStats'
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutDetailExercise'
    WorkoutDetailHero:
      type: object
      required:
        - training_plan_name
        - started_at
        - completed_at
        - duration_minutes
        - gym_name
      properties:
        training_plan_name:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        duration_minutes:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: |
            Display-ready workout duration in whole minutes for workout detail hero metadata.
            Nullable when start/end timestamps are unavailable.
        gym_name:
          type: string
          nullable: true
    WorkoutDetailCompletionStats:
      type: object
      required:
        - exercise_count
        - completed_set_count
        - average_duration_minutes
        - workout_progress
        - workout_progress_status
      properties:
        exercise_count:
          type: integer
          format: int64
          minimum: 0
          description: Total number of exercises included in the workout detail payload.
        completed_set_count:
          type: integer
          format: int64
          minimum: 0
          description: Total number of completed set-line entries in the workout.
        average_duration_minutes:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: |
            Average completed-workout duration in minutes from up to the 10 most recent
            previous workouts for the same training_plan_version_id and gym_id.
            Null when no matching previous workout duration exists.
        workout_progress:
          type: number
          format: double
          nullable: true
          description: |
            Raw workout progress decimal rounded by renderer display rules.
            Null when progress cannot be computed because completion data is insufficient.
        workout_progress_status:
          type: string
          enum: [AVAILABLE, NOT_ENOUGH_DATA]
          description: |
            Availability state for workout_progress.
            AVAILABLE means workout_progress contains a numeric value.
            NOT_ENOUGH_DATA means progress is intentionally unavailable for this completion.
            Uses the same centralized backend not-enough-data gating semantics as Progress and Exercises payloads.
    WorkoutDetailExercise:
      type: object
      required:
        - training_plan_exercise_id
        - exercise_position
        - exercise_name
        - sets
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        exercise_position:
          type: integer
          format: int32
          minimum: 1
        exercise_name:
          type: string
        variant_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Canonical exercise variant identifier used for Workout Detail row
            navigation to Exercise Variant Detail.
            Null when variant context is unavailable for the exercise row.
        variant_name:
          type: string
          nullable: true
        station_name:
          type: string
          nullable: true
        set_tracking_mode:
          type: string
          enum: [UNILATERAL, BILATERAL]
          nullable: true
          description: |
            Tracking semantics for this exercise set list.
            BILATERAL entries use set_side=BILATERAL.
            UNILATERAL entries use deterministic LEFT then RIGHT ordering per set_index.
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          nullable: true
          description: |
            Repetition unit for the set lines under this exercise.
            REPS means repetition_value is a count.
            SECS means repetition_value is total whole seconds.
        sets:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutDetailSetLine'
    WorkoutDetailSetLine:
      type: object
      required:
        - set_index
        - set_side
      properties:
        set_index:
          type: integer
          format: int32
          minimum: 1
        set_side:
          type: string
          enum: [LEFT, RIGHT, BILATERAL]
          description: |
            Recorded side for this set line.
            BILATERAL variants use BILATERAL.
            UNILATERAL variants use LEFT and RIGHT entries per set_index.
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            Canonical total load in kg.
            Nullable for stationless and bodyweight-style sets.
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          nullable: true
          description: |
            Repetition unit for this set line.
            REPS means repetition_value is a count.
            SECS means repetition_value is total whole seconds.
        repetition_value:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Repetition value for this set line.
            Interpreted according to repetition_kind: REPS=count, SECS=total whole seconds.
