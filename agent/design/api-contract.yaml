openapi: 3.0.3
info:
  title: PumpBuddy API
  version: 0.1.0
  description: |
    Canonical API contract for the active workout product slice.
    Note: the 2026-03-28 auth/session boundary refactor is internal-only and does
    not change external endpoints or payload schemas.
paths:
  /auth/login:
    post:
      summary: Log in with access key
      operationId: loginWithAccessKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          description: Invalid access key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/session:
    get:
      summary: Resolve session state
      operationId: resolveSession
      responses:
        '200':
          description: Session resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Session invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/gyms:
    get:
      summary: List available gyms
      operationId: listGyms
      responses:
        '200':
          description: Gyms retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GymSummary'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans:
    get:
      summary: List available training plans
      operationId: listTrainingPlans
      responses:
        '200':
          description: Training plans retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingPlanSummary'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans/{trainingPlanId}:
    get:
      summary: Retrieve training plan detail
      operationId: getTrainingPlan
      parameters:
        - name: trainingPlanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Training plan detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanDetailResponse'
        '404':
          description: Training plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans/{trainingPlanId}/options:
    get:
      summary: List gym-specific plan exercise options for a training plan
      operationId: listTrainingPlanOptions
      parameters:
        - name: trainingPlanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gymId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plan exercise options retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanOptionsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts:
    post:
      summary: Create a completed workout
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkoutRequest'
      responses:
        '201':
          description: Workout created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '400':
          description: Workout payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts/{workoutId}/summary:
    get:
      summary: Retrieve a minimal workout summary
      operationId: getWorkoutSummary
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workout summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '404':
          description: Workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout:
    get:
      summary: Retrieve the resumable active workout
      operationId: getActiveWorkout
      responses:
        '200':
          description: Active workout retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '404':
          description: No active workout is available to resume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create the first persisted active workout state
      description: |
        Persists the first confirmed exercise for a workout and creates the
        resumable active-workout record. This endpoint is only used for the
        first save after the workout leaves transient renderer state.
      operationId: createActiveWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActiveWorkoutRequest'
      responses:
        '201':
          description: Active workout created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '400':
          description: Active workout payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An active workout already exists or the create transition is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}:
    put:
      summary: Update an existing active workout
      description: |
        Persists later confirmed exercise progress for an already created active
        workout.
      operationId: updateActiveWorkout
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActiveWorkoutRequest'
      responses:
        '200':
          description: Active workout updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '400':
          description: Active workout payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout update is invalid for the current workout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Cancel an unfinished active workout
      operationId: cancelActiveWorkout
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Active workout cancelled and deleted successfully
        '404':
          description: Active workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout cannot be cancelled in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}/complete:
    post:
      summary: Complete an active workout
      description: |
        Persists the final confirmed exercise state and transitions the workout
        out of the resumable active-workout lifecycle.
      operationId: completeActiveWorkout
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteActiveWorkoutRequest'
      responses:
        '200':
          description: Active workout completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '400':
          description: Active workout completion payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout cannot be completed in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AuthLoginRequest:
      type: object
      required:
        - access_key
      properties:
        access_key:
          type: string
    AuthLoginResponse:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
    AuthSessionResponse:
      type: object
      required:
        - authenticated
        - user
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/AuthSessionUser'
    AuthSessionUser:
      type: object
      required:
        - id
        - display_name
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
    GymSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      properties:
        missing_exercises:
          type: array
          items:
            $ref: '#/components/schemas/MissingExerciseDetail'
    MissingExerciseDetail:
      type: object
      required:
        - training_plan_exercise_id
        - exercise_name
        - exercise_position
        - reason
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_position:
          type: integer
          format: int32
          minimum: 1
        reason:
          type: string
    ActiveWorkoutResponse:
      type: object
      required:
        - workout
      properties:
        workout:
          $ref: '#/components/schemas/ActiveWorkout'
    ActiveWorkout:
      type: object
      required:
        - id
        - training_plan_id
        - training_plan_name
        - gym_id
        - gym_name
        - started_at
        - updated_at
        - current_exercise_position
        - total_exercise_count
        - exercises
      properties:
        id:
          type: string
          format: uuid
        training_plan_id:
          type: string
          format: uuid
        training_plan_name:
          type: string
        gym_id:
          type: string
          format: uuid
          nullable: true
        gym_name:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the exercise the renderer should show when resuming
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExercise'
    CreateActiveWorkoutRequest:
      type: object
      required:
        - training_plan_id
        - started_at
        - current_exercise_position
        - total_exercise_count
        - exercises
        - first_confirmed_exercise_position
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the next exercise to display after the save completes
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExerciseInput'
        first_confirmed_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: Position of the first exercise that moved the workout into persisted active state
    UpdateActiveWorkoutRequest:
      type: object
      required:
        - training_plan_id
        - started_at
        - current_exercise_position
        - total_exercise_count
        - exercises
        - last_confirmed_exercise_position
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the next exercise to display after the save completes
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExerciseInput'
        last_confirmed_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: Most recent exercise position confirmed before this later save
    CompleteActiveWorkoutRequest:
      type: object
      required:
        - training_plan_id
        - started_at
        - current_exercise_position
        - total_exercise_count
        - exercises
        - completed_at
        - last_confirmed_exercise_position
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the next exercise to display after the save completes
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExerciseInput'
        completed_at:
          type: string
          format: date-time
        last_confirmed_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: Final exercise position confirmed as part of completion
    ActiveWorkoutProgressPayload:
      type: object
      required:
        - training_plan_id
        - gym_id
        - started_at
        - current_exercise_position
        - total_exercise_count
        - exercises
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the next exercise to display after the save completes
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExerciseInput'
    ActiveWorkoutExercise:
      type: object
      required:
        - training_plan_exercise_id
        - position
        - exercise_name
        - selected_plan_exercise_option_id
        - selected_variant_id
        - selected_variant_name
        - selected_station_id
        - selected_station_name
        - completed_sets
        - suggested_set
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          minimum: 1
        exercise_name:
          type: string
        selected_plan_exercise_option_id:
          type: string
          format: uuid
          nullable: true
        selected_variant_id:
          type: string
          format: uuid
          nullable: true
        selected_variant_name:
          type: string
          nullable: true
        selected_station_id:
          type: string
          format: uuid
          nullable: true
        selected_station_name:
          type: string
          nullable: true
        skipped_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp recorded when the exercise was explicitly skipped.
        completed_sets:
          type: array
          items:
            $ref: '#/components/schemas/CompletedActiveWorkoutSet'
        suggested_set:
          $ref: '#/components/schemas/ActiveWorkoutSet'
    ActiveWorkoutExerciseInput:
      type: object
      required:
        - training_plan_exercise_id
        - position
        - selected_plan_exercise_option_id
        - selected_variant_id
        - selected_station_id
        - completed_sets
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          minimum: 1
        selected_plan_exercise_option_id:
          type: string
          format: uuid
          nullable: true
        selected_variant_id:
          type: string
          format: uuid
          nullable: true
        selected_station_id:
          type: string
          format: uuid
          nullable: true
        skipped_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp recorded when the exercise was explicitly skipped.
        completed_sets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutSetInput'
    CompletedActiveWorkoutSet:
      type: object
      required:
        - set_index
        - load_value
      properties:
        set_index:
          type: integer
          format: int32
          minimum: 1
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            Canonical set load in kg. Nullable for stationless configured-gym options
            and free-mode/bodyweight-style sets where no station profile applies.
        reps:
          type: integer
          format: int32
          minimum: 1
          nullable: true
    ActiveWorkoutSet:
      type: object
      required:
        - load_value
      properties:
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            Suggested load in kg. Nullable when the selected option is stationless
            (configured-gym stationless branch) or when no load is applicable.
        reps:
          type: integer
          format: int32
          minimum: 1
          nullable: true
    ActiveWorkoutSetInput:
      type: object
      required:
        - load_value
      properties:
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            User-recorded load in kg. Nullable for stationless configured-gym options
            and free-mode/bodyweight-style sets.
        reps:
          type: integer
          format: int32
          minimum: 1
          nullable: true
    CreateWorkoutRequest:
      type: object
      required:
        - training_plan_id
        - exercises
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/CreateWorkoutExerciseInput'
    CreateWorkoutExerciseInput:
      type: object
      required:
        - training_plan_exercise_id
        - position
        - set
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          minimum: 1
        selected_plan_exercise_option_id:
          type: string
          format: uuid
          nullable: true
        selected_variant_id:
          type: string
          format: uuid
          nullable: true
        selected_station_id:
          type: string
          format: uuid
          nullable: true
        set:
          $ref: '#/components/schemas/CreateWorkoutSetInput'
    CreateWorkoutSetInput:
      type: object
      required:
        - load_value
      properties:
        load_value:
          type: number
          format: double
          nullable: true
          description: |
            User-recorded load in kg. Nullable for stationless configured-gym options
            and free-mode/bodyweight-style sets.
        reps:
          type: integer
          format: int32
          minimum: 1
          nullable: true
    TrainingPlanSummary:
      type: object
      required:
        - id
        - name
        - exercise_count
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        exercise_count:
          type: integer
          format: int64
          minimum: 0
    TrainingPlanExerciseDetail:
      type: object
      required:
        - training_plan_exercise_id
        - exercise_name
        - exercise_position
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_position:
          type: integer
          format: int32
          minimum: 1
    TrainingPlanDetailResponse:
      type: object
      required:
        - id
        - name
        - exercises
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/TrainingPlanExerciseDetail'
    PlanExerciseOptionSummary:
      type: object
      required:
        - id
        - training_plan_exercise_id
        - exercise_name
        - exercise_position
        - variant_id
        - variant_name
        - variant_type
        - station_profile_loads_kg
      properties:
        id:
          type: string
          format: uuid
        training_plan_exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_position:
          type: integer
          format: int32
          minimum: 1
        variant_id:
          type: string
          format: uuid
        variant_name:
          type: string
        variant_type:
          type: string
        station_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Station identifier for station-based options. Null for stationless options.
        station_name:
          type: string
          nullable: true
          description: |
            Human-readable station label for station-based options. Null for stationless options.
        station_profile_loads_kg:
          type: array
          nullable: true
          description: |
            Ordered station profile loads in kg for station-based options.
            Empty or null for stationless options.
          items:
            type: number
            format: double
    TrainingPlanOptionsResponse:
      type: object
      required:
        - training_plan_id
        - gym_id
        - options
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
        options:
          type: array
          items:
            $ref: '#/components/schemas/PlanExerciseOptionSummary'
    WorkoutSummary:
      type: object
      required:
        - id
        - training_plan_id
        - training_plan_name
        - gym_id
        - gym_name
        - exercise_count
        - completed_set_count
      properties:
        id:
          type: string
          format: uuid
        training_plan_id:
          type: string
          format: uuid
        training_plan_name:
          type: string
        gym_id:
          type: string
          format: uuid
          nullable: true
        gym_name:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        exercise_count:
          type: integer
          format: int64
          minimum: 0
        completed_set_count:
          type: integer
          format: int64
          minimum: 0
