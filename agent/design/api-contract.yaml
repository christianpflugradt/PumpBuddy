openapi: 3.0.3
info:
  title: Bootstrap API
  version: 0.1.0
  description: |
    Temporary API contract for the first milestone.

    This contract exists only to verify the end-to-end interaction between
    renderer, backend, and database. It is expected to evolve in later milestones.
paths:
  /api/hello-world:
    get:
      summary: Retrieve the Hello World value
      operationId: getHelloWorld
      responses:
        '200':
          description: Hello World value retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloWorldResponse'
components:
  schemas:
    HelloWorldResponse:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: Value read from the first record of the Hello World table
