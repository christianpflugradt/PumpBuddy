          type: string
          format: uuid
          nullable: true
        selected_station_name:
          type: string
          nullable: true
        skipped_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp recorded when the exercise was explicitly skipped.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp recorded when the exercise was marked completed.
        completed_sets:
          type: array
          items:
            $ref: '#/components/schemas/CompletedActiveWorkoutSet'
        suggested_set:
          $ref: '#/components/schemas/ActiveWorkoutSet'
    ActiveWorkoutExerciseInput:
      type: object
