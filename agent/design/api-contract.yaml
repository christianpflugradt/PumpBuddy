    TrainingPlanExerciseVariantSummary:
      type: object
      description: |
        Gym-agnostic training plan exercise variant definition projected into a selected gym context.
        Station and load-profile fields are compatibility-derived realizability details for that selected gym.
      required:
        - id
        - training_plan_exercise_id
        - exercise_name
        - exercise_position
        - rep_min
        - rep_max
        - target_sets
        - variant_id
        - variant_name
        - variant_type
        - repetition_kind
        - load_input_mode
        - set_tracking_mode
        - station_profile_loads_kg
        - suggested_start_load_kg
        - last_completed_at
      properties:
        id:
          type: string
          format: uuid
        training_plan_exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_position:
          type: integer
          format: int32
          minimum: 1
        rep_min:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Variant-level lower repetition bound used by progression fallback suggestions.
            Null disables fallback suggestions for this variant.
        rep_max:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Variant-level upper repetition bound used by progression fallback suggestions.
            Null disables fallback suggestions for this variant.
        target_sets:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Optional logical set target for this variant.
            Null preserves legacy unlimited-set semantics.
            When present, renderer visual progression uses logical-set counting thresholds.
        variant_id:
          type: string
          format: uuid
        variant_name:
          type: string
        variant_type:
          type: string
        repetition_kind:
          type: string
          enum: [REPS, SECS]
          description: |
            Variant repetition unit used by renderer set controls.
            REPS means count-based controls.
            SECS means timed controls with total whole seconds.
        load_input_mode:
          type: string
          enum: [TOTAL, PER_SIDE]
          description: |
            Variant load entry mode. TOTAL consumes/returns canonical total load values directly.
            PER_SIDE is a two-sided entry mode where canonical total load remains the persisted representation.
        set_tracking_mode:
          type: string
          enum: [UNILATERAL, BILATERAL]
          description: |
            Variant set-tracking mode.
            BILATERAL uses one persisted entry per set_index with set_side=BILATERAL.
            UNILATERAL uses paired set-side entries in deterministic left-then-right order.
        station_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Station identifier for station-based variants. Null for stationless variants.
        station_name:
          type: string
          nullable: true
          description: |
            Human-readable station label for station-based variants. Null for stationless variants.
        station_profile_loads_kg:
          type: array
          nullable: true
          description: |
            Ordered station profile loads in kg for station-based variants.
            Empty or null for stationless variants.
          items:
            type: number
            format: double
        suggested_start_load_kg:
          type: number
          format: double
          nullable: true
          description: |
            Backend-derived canonical starting load suggestion for this variant.
            Null for stationless variants.
        last_completed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Most recent completed workout timestamp for this exact training-plan-exercise
            and variant+station combination.
            Null when no completed history exists for the combination.
    TrainingPlanExerciseVariantsResponse:
      type: object
      description: |
        Realizable training plan exercise variant projection for one training plan within a selected gym context.
        Variants remain gym-agnostic source-of-truth records; gym_id identifies the validation/projection context.
      required:
        - training_plan_id
        - gym_id
        - exercise_variants
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
