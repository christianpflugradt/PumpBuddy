        - completed_sets
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          minimum: 1
        selected_training_plan_exercise_variant_id:
          type: string
          format: uuid
          nullable: true
        selected_variant_id:
          type: string
          format: uuid
          nullable: true
        load_input_mode:
          type: string
          enum: [TOTAL, PER_SIDE]
          description: |
            Variant load entry mode used when recording active-workout set values.
            PER_SIDE indicates input values may include per-side representation while canonical total load is still persisted.
        set_tracking_mode:
          type: string
          enum: [UNILATERAL, BILATERAL]
          description: |
            Variant set tracking behavior used when recording active-workout set values.
            BILATERAL accepts one entry with set_side=BILATERAL per set_index.
            UNILATERAL requires deterministic set_side=LEFT then set_side=RIGHT entries per set_index.
        selected_station_id:
          type: string
          format: uuid
          nullable: true
        skipped_at:
          type: string
          format: date-time
          nullable: true
