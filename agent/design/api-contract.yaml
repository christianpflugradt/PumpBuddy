openapi: 3.0.3
info:
  title: PumpBuddy API
  version: 0.1.0
  description: |
    Canonical API contract for the active workout product slice.
    Note: the 2026-03-28 auth/session boundary refactor is internal-only and does
    not change external endpoints or payload schemas.
    Note: the 2026-04-06 workout-select greeting update reuses existing
    AuthSessionUser.display_name and does not change endpoint shapes.
    Note: the 2026-04-12 auth-failure logging hardening adds structured `AUTH_FAIL`
    lines and X-Forwarded-For first-IP parsing as internal-only behavior without
    endpoint or payload-schema changes.
    Note: the 2026-04-12 settings profile data update extends AuthSessionUser
    with `login` and `registration_date` for settings display.
    Note: the 2026-04-12 settings display-name persistence update adds PATCH
    /auth/session for authenticated display-name changes.
    Note: the 2026-04-13 settings preferences contract update extends PATCH
    /auth/session and AuthSessionUser with `favorite_gym_id`, and adds
    POST /auth/password for authenticated password changes.
    Note: the 2026-04-14 About navigation wiring tightened renderer
    AboutMetadata.channel typing to `stable`; this is API-surface alignment
    only and does not change endpoint paths or payload schema shapes.
    Note: the 2026-04-17 workout history contract update adds GET /api/workouts
    for unbounded history-list retrieval used by the History screen.
    Note: the 2026-04-18 workout detail contract update adds GET
    /api/workouts/{workoutId} with hero metadata, completion stats, and ordered
    exercise set-line payload coverage for the History detail screen.
    Note: the 2026-04-18 workout detail regression-coverage update adds backend
    and renderer contract-alignment tests for mixed set-line formats and
    history-detail restore behavior; endpoint paths and payload schemas are
    unchanged.
    Note: the 2026-04-18 session profile max-load update extends
    AuthSessionUser and PATCH /auth/session payloads with `max_load_kg`
    and enforces backend-owned bounds validation.
    Note: the 2026-04-19 progress screen contract update adds GET
    /api/workouts/progress for 30-day workout progress scoring and trend rendering.
    Note: the 2026-04-21 workout semantics authority alignment confirms renderer
    consumption of backend-owned `set_tracking_mode` semantics from existing
    workout option and active-workout payload fields; endpoint paths and payload
    schemas are unchanged.
    Note: the 2026-04-21 exercises performance contract update adds GET
    /api/workouts/exercises-performance for 30-day variant performance groups
    with backend-owned scoring/tone semantics and renderer-ready row fields.
paths:
  /auth/login:
    post:
      summary: Log in with login and password
      operationId: loginWithCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/session:
    get:
      summary: Resolve session state
      operationId: resolveSession
      responses:
        '200':
          description: Session resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update authenticated session user settings fields
      operationId: updateSessionProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUpdateDisplayNameRequest'
      responses:
        '200':
          description: Session profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Invalid profile update payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password:
    post:
      summary: Update authenticated user password
      operationId: updatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUpdatePasswordRequest'
      responses:
        '204':
          description: Password updated successfully
        '400':
          description: Invalid password update payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'Current password validation failed (message: "Current password validation failed")'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      summary: Log out current session
      operationId: logoutSession
      responses:
        '204':
          description: Logout succeeded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/about:
    get:
      summary: Retrieve About metadata for renderer display
      operationId: getAboutMetadata
      responses:
        '200':
          description: About metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/gyms:
    get:
      summary: List available gyms
      operationId: listGyms
      responses:
        '200':
          description: Gyms retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GymSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans:
    get:
      summary: List available training plans
      operationId: listTrainingPlans
      responses:
        '200':
          description: Training plans retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingPlanSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans/{trainingPlanId}:
    get:
      summary: Retrieve training plan detail
      operationId: getTrainingPlan
      parameters:
        - name: trainingPlanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Training plan detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Training plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans/{trainingPlanId}/options:
    get:
      summary: List gym-agnostic training plan exercise variants realizable in a selected gym context
      operationId: listTrainingPlanExerciseVariants
      parameters:
        - name: trainingPlanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gymId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Training plan exercise variants retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanExerciseVariantsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts:
    get:
      summary: List completed workouts for History screen rendering
      operationId: listWorkouts
      responses:
        '200':
          description: Completed workouts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutHistoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a completed workout
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkoutRequest'
      responses:
        '201':
          description: Workout created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Workout payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts/progress:
    get:
      summary: Retrieve 30-day workout progress entries for Progress screen rendering
      operationId: getWorkoutProgress
      responses:
        '200':
          description: Workout progress entries retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts/exercises-performance:
    get:
      summary: Retrieve 30-day exercises performance groups for Exercises screen rendering
      operationId: getWorkoutExercisesPerformance
      responses:
        '200':
          description: Exercises performance groups retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutExercisesPerformanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts/{workoutId}/summary:
    get:
      summary: Retrieve a minimal workout summary
      operationId: getWorkoutSummary
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workout summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts/{workoutId}:
    get:
      summary: Retrieve workout detail for History screen rendering
      operationId: getWorkoutDetail
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workout detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout:
    get:
      summary: Retrieve the resumable active workout
      operationId: getActiveWorkout
      responses:
        '200':
          description: Active workout retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No active workout is available to resume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create the first persisted active workout state
      description: |
        Persists the first confirmed exercise for a workout and creates the
        resumable active-workout record. This endpoint is only used for the
        first save after the workout leaves transient renderer state.
      operationId: createActiveWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActiveWorkoutRequest'
      responses:
        '201':
          description: Active workout created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An active workout already exists or the create transition is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}:
    put:
      summary: Update an existing active workout
      description: |
        Persists later confirmed exercise progress for an already created active
        workout.
      operationId: updateActiveWorkout
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActiveWorkoutRequest'
      responses:
        '200':
          description: Active workout updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout update is invalid for the current workout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Cancel an unfinished active workout
      operationId: cancelActiveWorkout
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Active workout cancelled and deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Active workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout cannot be cancelled in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/active-workout/{workoutId}/complete:
    post:
      summary: Complete an active workout
      description: |
        Persists the final confirmed exercise state and transitions the workout
        out of the resumable active-workout lifecycle.
      operationId: completeActiveWorkout
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteActiveWorkoutRequest'
      responses:
        '200':
          description: Active workout completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Active workout completion payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active workout cannot be completed in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    Unauthorized:
      description: Unauthorized (empty response body)
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AboutMetadataResponse:
      type: object
      required:
        - app_version
        - commit_hash_short
        - build_timestamp_utc
        - channel
      properties:
        app_version:
          type: string
        commit_hash_short:
          type: string
          description: Short commit hash rendered in About screen.
        build_timestamp_utc:
          type: string
          description: Build/commit timestamp rendered as YYYY-MM-DD HH:mm UTC.
        channel:
          type: string
          enum: [stable]
    AuthLoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
        password:
          type: string
    AuthLoginResponse:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
    AuthSessionResponse:
      type: object
      required:
        - authenticated
        - user
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/AuthSessionUser'
    AuthSessionUser:
      type: object
      required:
        - id
        - display_name
        - max_load_kg
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        max_load_kg:
          type: number
          format: double
        login:
          type: string
        registration_date:
          type: string
          format: date-time
        favorite_gym_id:
          type: string
          format: uuid
          nullable: true
    AuthUpdateDisplayNameRequest:
      type: object
      required:
        - display_name
      properties:
        display_name:
          type: string
        max_load_kg:
          type: number
          format: double
          minimum: 100
          maximum: 999
        favorite_gym_id:
          type: string
          format: uuid
          nullable: true
    AuthUpdatePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
        - confirm_new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
        confirm_new_password:
          type: string
    GymSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      properties:
        selected_gym_id:
          type: string
          format: uuid
          description: |
            Gym selected for configured-gym workout start validation.
            Returned when workout start is blocked because one or more exercises have no realizable option in that gym.
            Equals the configured-gym context used for start validation.
        missing_exercises:
          type: array
          description: |
            Plan exercises that block configured-gym workout start in the selected gym context.
            Each item identifies the training-plan exercise that has no realizable option after compatibility filtering.
            Items are sorted by exercise_position ascending, then training_plan_exercise_id.
          items:
            $ref: '#/components/schemas/MissingExerciseDetail'
    MissingExerciseDetail:
      type: object
      required:
        - training_plan_exercise_id
        - exercise_name
        - exercise_position
        - reason
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_position:
          type: integer
          format: int32
          minimum: 1
        reason:
          type: string
    ActiveWorkoutResponse:
      type: object
      required:
        - workout
      properties:
        workout:
          $ref: '#/components/schemas/ActiveWorkout'
    ActiveWorkout:
      type: object
      required:
        - id
        - training_plan_id
        - training_plan_name
        - gym_id
        - gym_name
        - started_at
        - updated_at
        - current_exercise_position
        - total_exercise_count
        - exercises
      properties:
        id:
          type: string
          format: uuid
        training_plan_id:
          type: string
          format: uuid
        training_plan_name:
          type: string
        gym_id:
          type: string
          format: uuid
          nullable: true
        gym_name:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the exercise the renderer should show when resuming
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExercise'
    CreateActiveWorkoutRequest:
      type: object
      required:
        - training_plan_id
        - started_at
        - current_exercise_position
        - total_exercise_count
        - exercises
        - first_confirmed_exercise_position
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the next exercise to display after the save completes
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExerciseInput'
        first_confirmed_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: Position of the first exercise that moved the workout into persisted active state
    UpdateActiveWorkoutRequest:
      type: object
      required:
        - training_plan_id
        - started_at
        - current_exercise_position
        - total_exercise_count
        - exercises
        - last_confirmed_exercise_position
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the next exercise to display after the save completes
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExerciseInput'
        last_confirmed_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: Most recent exercise position confirmed before this later save
    CompleteActiveWorkoutRequest:
      type: object
      required:
        - training_plan_id
        - started_at
        - current_exercise_position
        - total_exercise_count
        - exercises
        - completed_at
        - last_confirmed_exercise_position
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the next exercise to display after the save completes
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExerciseInput'
        completed_at:
          type: string
          format: date-time
        last_confirmed_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: Final exercise position confirmed as part of completion
    ActiveWorkoutProgressPayload:
      type: object
      required:
        - training_plan_id
        - gym_id
        - started_at
        - current_exercise_position
        - total_exercise_count
        - exercises
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
        current_exercise_position:
          type: integer
          format: int32
          minimum: 1
          description: 1-based position of the next exercise to display after the save completes
        total_exercise_count:
          type: integer
          format: int32
          minimum: 1
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActiveWorkoutExerciseInput'
    ActiveWorkoutExercise:
      type: object
      required:
        - training_plan_exercise_id
        - position
        - exercise_name
        - selected_training_plan_exercise_variant_id
        - selected_variant_id
        - selected_variant_name
        - load_input_mode
        - set_tracking_mode
        - selected_station_id
        - selected_station_name
        - completed_sets
        - suggested_set
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        position:
          type: integer
