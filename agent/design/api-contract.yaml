openapi: 3.0.3
info:
  title: Bootstrap API
  version: 0.1.0
  description: |
    Temporary API contract with minimal read-focused preparation for pb-004
    domain entities.

    Endpoints intentionally avoid workout wizard orchestration and command
    workflows.
paths:
  /api/hello-world:
    get:
      summary: Retrieve the Hello World value
      operationId: getHelloWorld
      responses:
        '200':
          description: Hello World value retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloWorldResponse'
  /api/gyms:
    get:
      summary: List available gyms
      operationId: listGyms
      responses:
        '200':
          description: Gyms retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GymSummary'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans:
    get:
      summary: List available training plans
      operationId: listTrainingPlans
      responses:
        '200':
          description: Training plans retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingPlanSummary'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/training-plans/{trainingPlanId}/options:
    get:
      summary: List gym-specific plan exercise options for a training plan
      operationId: listTrainingPlanOptions
      parameters:
        - name: trainingPlanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gymId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plan exercise options retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanOptionsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts:
    post:
      summary: Create a completed workout
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkoutRequest'
      responses:
        '201':
          description: Workout created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '400':
          description: Workout payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/workouts/{workoutId}/summary:
    get:
      summary: Retrieve a minimal workout summary
      operationId: getWorkoutSummary
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workout summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSummary'
        '404':
          description: Workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HelloWorldResponse:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: Value read from the first record of the Hello World table
    GymSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    CreateWorkoutRequest:
      type: object
      required:
        - training_plan_id
        - gym_id
        - exercises
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateWorkoutExerciseInput'
    CreateWorkoutExerciseInput:
      type: object
      required:
        - training_plan_exercise_id
        - position
        - set
      properties:
        training_plan_exercise_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          minimum: 1
        selected_plan_exercise_option_id:
          type: string
          format: uuid
          nullable: true
        selected_variant_id:
          type: string
          format: uuid
          nullable: true
        selected_station_id:
          type: string
          format: uuid
          nullable: true
        set:
          $ref: '#/components/schemas/CreateWorkoutSetInput'
    CreateWorkoutSetInput:
      type: object
      required:
        - load_value
      properties:
        load_value:
          type: number
          format: double
        reps:
          type: integer
          format: int32
          minimum: 0
          nullable: true
    TrainingPlanSummary:
      type: object
      required:
        - id
        - name
        - exercise_count
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        exercise_count:
          type: integer
          format: int64
          minimum: 0
    PlanExerciseOptionSummary:
      type: object
      required:
        - id
        - training_plan_exercise_id
        - exercise_name
        - exercise_position
        - variant_id
        - variant_name
        - variant_type
        - station_id
        - station_name
      properties:
        id:
          type: string
          format: uuid
        training_plan_exercise_id:
          type: string
          format: uuid
        exercise_name:
          type: string
        exercise_position:
          type: integer
          format: int32
          minimum: 1
        variant_id:
          type: string
          format: uuid
        variant_name:
          type: string
        variant_type:
          type: string
        station_id:
          type: string
          format: uuid
        station_name:
          type: string
    TrainingPlanOptionsResponse:
      type: object
      required:
        - training_plan_id
        - gym_id
        - options
      properties:
        training_plan_id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
        options:
          type: array
          items:
            $ref: '#/components/schemas/PlanExerciseOptionSummary'
    WorkoutSummary:
      type: object
      required:
        - id
        - training_plan_id
        - training_plan_name
        - gym_id
        - gym_name
        - exercise_count
        - completed_set_count
      properties:
        id:
          type: string
          format: uuid
        training_plan_id:
          type: string
          format: uuid
        training_plan_name:
          type: string
        gym_id:
          type: string
          format: uuid
        gym_name:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        exercise_count:
          type: integer
          format: int64
          minimum: 0
        completed_set_count:
          type: integer
          format: int64
          minimum: 0
