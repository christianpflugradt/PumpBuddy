      type: object
      required:
        - tone
        - rows
      properties:
        tone:
          type: string
          enum: [GREEN, YELLOW, RED, GRAY]
          description: |
            Backend-derived tone bucket for this group.
            GREEN means > 1.03, YELLOW means 0.95-1.03, RED means < 0.95, and GRAY means unavailable.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutExercisesPerformanceRow'
    WorkoutExercisesPerformanceRow:
      type: object
      required:
