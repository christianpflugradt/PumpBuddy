      properties:
        variant_id:
          type: string
          format: uuid
        variant_name:
          type: string
        last_performed_at:
          type: string
          format: date-time
        last_performed_days_ago:
          type: integer
          format: int32
          minimum: 0
          description: Whole days elapsed since the last completed workout containing this variant.
        last_performed_first_set_display:
          type: string
          description: |
            Renderer-ready first-set summary from the most recent completed workout containing this variant.
            String may encode load/reps/secs combinations depending on available set data.
        selected_station_average_score_30d:
          type: number
          format: double
          nullable: true
          description: |
            Average performance_score for the selected variant+station stream in the 30-day window.
            Selection is backend-determined by highest sample count, then most recent in-window workout for ties.
            Null when performance_status is NOT_ENOUGH_DATA.
        variant_session_count_30d:
          type: integer
          format: int32
          minimum: 0
          description: |
            Variant-wide completed workout count in the 30-day window across all stations.
            This value is independent from selected_station_average_score_30d stream selection.
        performance_status:
          type: string
          enum: [AVAILABLE, NOT_ENOUGH_DATA]
          description: |
            Availability state for selected_station_average_score_30d.
            AVAILABLE means selected_station_average_score_30d contains a numeric value.
            NOT_ENOUGH_DATA means score is intentionally unavailable for this row.
        performance_tone:
          type: string
          enum: [GREEN, YELLOW, RED, GRAY]
          description: |
            Backend-derived tone classification for selected_station_average_score_30d.
            GREEN means > 1.03, YELLOW means 0.95-1.03, RED means < 0.95, and GRAY means unavailable.
