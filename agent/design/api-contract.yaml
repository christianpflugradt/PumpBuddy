          type: string
          format: uuid
          nullable: true
        selected_variant_name:
          type: string
          nullable: true
        load_input_mode:
          type: string
          enum: [TOTAL, PER_SIDE]
          nullable: true
          description: |
            Variant load entry mode for renderer load editing. Null when no variant has been selected yet.
            TOTAL means renderer input values and canonical total values are identical.
            PER_SIDE means renderer input values are per-side while canonical total values remain two-sided.
        set_tracking_mode:
          type: string
          enum: [UNILATERAL, BILATERAL]
          nullable: true
          description: |
            Variant set tracking behavior. Null when no variant has been selected yet.
            BILATERAL records one set entry using set_side=BILATERAL.
            UNILATERAL records deterministic left-then-right entries using set_side=LEFT then set_side=RIGHT for each set_index.
