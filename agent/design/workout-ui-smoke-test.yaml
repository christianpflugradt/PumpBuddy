version: 1
area: ui_smoke
source_of_truth: renderer_ui_smoke_happy_path
formatting:
  indent_spaces: 2

scenario:
  name: "UI Smoke Happy Path - Configured Gym/Workout"
  description: "Renderer-only Playwright UI smoke covers sign in, plan and gym selection, fallback option choice, three exercise interaction types, and completion summary while backend APIs are mocked in Playwright routes."
  purpose:
    - "Validate critical renderer workflow behavior with mocked backend routes."
    - "Complement backend unit and testcontainers-backed integration coverage rather than replace it."
  preconditions:
    - backend_routes_mocked_in_playwright
    - mocked_login_accepts_blank_login_and_test_api_key_password
    - mocked_gyms_exist:
        - "Countryside Core Club"
        - "Downtown Dumbbell Den"
    - mocked_plans_exist:
        - "Leg Day"
        - "Push Day"
        - "Pull Day"
    - mocked_exercise_option_payloads_cover_barbell_dumbbell_and_timer_cases
    - test_user: "Dev User (mocked session)"
  steps:
    - name: "Login"
      user_action:
        type: "multi_input_and_click"
        inputs:
          - field: "Login"
            value: ""
          - field: "Password"
            value: "test-api-key"
        click: "Sign in"
      expect:
        - "Training Plan and Gym selection appears with mocked choices."
    - name: "Select plan and gym"
      mock_data:
        plans:
          - name: "Leg Day"
          - name: "Push Day"
          - name: "Pull Day"
        gyms:
          - name: "Countryside Core Club"
          - name: "Downtown Dumbbell Den"
      user_action:
        type: "select"
        fields:
          - field: "Training Plan"
            value: "Leg Day"
          - field: "Gym"
            value: "Downtown Dumbbell Den"
      expect:
        - "Start Workout is enabled."
    - name: "Start workout"
      user_action:
        type: "click"
        field: "Start Workout"
      expect:
        - "The workout flow opens on the first exercise for Leg Day."
    - name: "Exercise 1: Deadlift fallback option path"
      mock_data:
        options:
          - station: "Barbell Rack"
            variant: "Conventional Barbell Deadlift"
          - station: "Platform A"
            variant: "Paused Barbell Deadlift"
          - station: "Rig B"
            variant: "Romanian Deadlift"
      user_action:
        type: "select"
        field: "Fallback exercise option"
        value: 
          station: "Platform A"
          variant: "Paused Barbell Deadlift"
      fill_set:
        reps: 5
        load: 100
        interaction_mode: "increment/decrement buttons (no direct text entry)"
      confirm_set: true
      expect:
        - "Load and reps controls stay hidden until a fallback option is selected."
        - "Load and reps controls appear after the fallback option is chosen."
    - name: "Exercise 2: Bulgarian Split Squat"
      fill_set:
        reps: 8
        load: 24  # per side
        interaction_mode: "increment/decrement buttons"
      confirm_set: true
      expect:
        - "Split squat set entry stays in the renderer-only flow and advances to the next exercise."
    - name: "Exercise 3: Plank timer"
      fill_set:
        seconds: 45
        interaction_mode: "open spinner dialog and pick time"
      confirm_set: true
      expect:
        - "Timer entry is captured in the UI smoke flow without direct backend persistence."
    - name: "Finish workout"
      user_action:
        type: "click"
        field: "Finish Workout"
      expect:
        - "Plan Completed screen appears."
        - "Workout metrics show 3 exercises completed."
  teardown:
    - "No persisted workout cleanup is required because backend APIs are mocked in Playwright routes."
