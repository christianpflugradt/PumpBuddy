version: 1
database: postgresql
source_of_truth: persistence-layout
references:
  glossary: /Users/cpf/Workspace/personal/PumpBuddy/agent/design/glossary.yaml
formatting:
  indent_spaces: 2

lifecycle_policy_implementation:
  - id: ARCHIVABLE
    db_strategy:
      - keep_row
      - mark_logically_inactive_via_timestamp_or_flag
      - preserve_references_for_history
  - id: IMMUTABLE
    db_strategy:
      - insert_only
      - block_in_place_mutation_except_operational_fields
      - preserve_for_history_or_audit
  - id: HARD_DELETABLE
    db_strategy:
      - allow_delete_when_business_rule_permits
      - allow_cascade_for_aggregate_children

principles:
  - persistence_is_user_scoped_for_application_data
  - domain_entities_omit_user_id_even_when_tables_store_it
  - auth_state_is_persisted_via_user_secrets_and_sessions
  - relational_child_tables_for_workout_exercises_and_sets

decisions:
  - id: user_scoping_strategy
    decision: Persist user ownership in the database and enforce user-scoped queries in repository methods, while keeping user_id out of most domain entity payloads.
    rationale: Separates identity/tenancy concerns from workout domain structures while still enforcing isolation at persistence boundaries.
  - id: session_persistence_strategy
    decision: Authenticate via access-key secret verification and persist revocable sessions with idle and absolute expiry windows.
    rationale: Enables secure protected routes with durable server-side session lifecycle management.
  - id: workout_set_storage
    decision: Store workout sets as relational child rows under workout_exercises.
    rationale: Supports strict constraints, ordering, and efficient read/write patterns for active workout flows.
  - id: load_profile_sum_type_storage
    decision: Persist load profile variant definitions in load_profiles.definition as JSONB with fixed_list|formula variants in one table.
    rationale: Keeps LoadProfile as a single persistence aggregate while allowing immutable variant-specific shape.
  - id: load_profile_mutability_semantics
    decision: Allow updates to load_profiles.name while treating load_profiles.definition as immutable after insert.
    rationale: Supports display-name edits without changing a profile's canonical load behavior contract.
  - id: load_profile_definition_variant_requirements
    decision: Require definition.kind plus variant-specific keys (fixed_list requires values; formula requires min and step).
    rationale: Matches the simplified load profile editor and keeps reusable load-profile contracts concise.

tables:
  - name: users
    lifecycle_policy: ARCHIVABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: login_name, type: text, nullable: true }
      - { name: display_name, type: text, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: disabled_at, type: timestamptz, nullable: true }
    primary_key: [id]

  - name: user_secrets
    lifecycle_policy: ARCHIVABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: secret_hash, type: text, nullable: false }
      - { name: label, type: text, nullable: true }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: revoked_at, type: timestamptz, nullable: true }
      - { name: last_used_at, type: timestamptz, nullable: true }
      - { name: rotated_by_user_id, type: uuid, nullable: true }
      - { name: rotation_reason, type: text, nullable: true }
    primary_key: [id]
    foreign_keys:
      - { columns: [user_id], references: users(id) }
      - { columns: [rotated_by_user_id], references: users(id) }

  - name: sessions
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: session_token_hash, type: text, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: last_seen_at, type: timestamptz, nullable: false }
      - { name: idle_expires_at, type: timestamptz, nullable: false }
      - { name: absolute_expires_at, type: timestamptz, nullable: false }
      - { name: revoked_at, type: timestamptz, nullable: true }
      - { name: replaced_by_session_id, type: uuid, nullable: true }
      - { name: user_agent, type: text, nullable: true }
      - { name: ip_address, type: text, nullable: true }
      - { name: device_label, type: text, nullable: true }
      - { name: revoke_reason, type: text, nullable: true }
    primary_key: [id]
    foreign_keys:
      - { columns: [user_id], references: users(id) }
      - { columns: [replaced_by_session_id], references: sessions(id) }
    unique_constraints:
      - { columns: [session_token_hash] }
    checks:
      - idle_expires_at >= created_at
      - absolute_expires_at >= created_at

  - name: training_plans
    lifecycle_policy: ARCHIVABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [user_id], references: users(id) }

  - name: training_plan_versions
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: training_plan_id, type: uuid, nullable: false }
      - { name: version_number, type: integer, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [training_plan_id], references: training_plans(id) }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [training_plan_id, version_number] }
    checks:
      - version_number > 0

  - name: exercises
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    unique_constraints:
      - { columns: [name] }

  - name: gyms
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]

  - name: load_profiles
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: weight_unit, type: text, nullable: false }
      - { name: definition, type: jsonb, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    checks:
      - weight_unit in ('KG', 'LBS')
      - definition ? 'kind'
      - (definition->>'kind') in ('fixed_list', 'formula')
      - (definition->>'kind') <> 'fixed_list' OR definition ? 'values'
      - (definition->>'kind') <> 'formula' OR (definition ? 'min' AND definition ? 'step')

  - name: equipment_stations
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: gym_id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: load_profile_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [gym_id], references: gyms(id) }
      - { columns: [load_profile_id], references: load_profiles(id) }
    unique_constraints:
      - { columns: [gym_id, name] }
      - { columns: [id, gym_id] }

  - name: training_plan_exercises
    lifecycle_policy: ARCHIVABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: training_plan_version_id, type: uuid, nullable: false }
      - { name: exercise_id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: position, type: integer, nullable: false }
      - { name: target_sets, type: integer, nullable: true }
      - { name: target_reps_min, type: integer, nullable: true }
      - { name: target_reps_max, type: integer, nullable: true }
    primary_key: [id]
    foreign_keys:
      - { columns: [training_plan_version_id], references: training_plan_versions(id) }
      - { columns: [exercise_id], references: exercises(id) }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [training_plan_version_id, position] }
    checks:
      - position > 0
      - target_sets IS NULL OR target_sets > 0
      - target_reps_min IS NULL OR target_reps_min > 0
      - target_reps_max IS NULL OR target_reps_max > 0
      - target_reps_min IS NULL OR target_reps_max IS NULL OR target_reps_min <= target_reps_max

  - name: exercise_variants
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: exercise_id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: variant_type, type: text, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [exercise_id], references: exercises(id) }
    unique_constraints:
      - { columns: [exercise_id, name] }

  - name: exercise_variant_equipment_compatibilities
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: exercise_variant_id, type: uuid, nullable: false }
      - { name: equipment_station_id, type: uuid, nullable: false }
      - { name: is_enabled, type: boolean, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [exercise_variant_id], references: exercise_variants(id) }
      - { columns: [equipment_station_id], references: equipment_stations(id) }
    unique_constraints:
      - { columns: [exercise_variant_id, equipment_station_id] }

  - name: plan_exercise_options
    lifecycle_policy: ARCHIVABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: training_plan_exercise_id, type: uuid, nullable: false }
      - { name: gym_id, type: uuid, nullable: false }
      - { name: exercise_variant_id, type: uuid, nullable: false }
      - { name: equipment_station_id, type: uuid, nullable: true }
      - { name: selection_order, type: integer, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [training_plan_exercise_id], references: training_plan_exercises(id) }
      - { columns: [gym_id], references: gyms(id) }
      - { columns: [exercise_variant_id], references: exercise_variants(id) }
      - { columns: [equipment_station_id, gym_id], references: "equipment_stations(id,gym_id)" }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [training_plan_exercise_id, gym_id, exercise_variant_id, equipment_station_id] }
      - { columns: [training_plan_exercise_id, gym_id, selection_order] }
    checks:
      - selection_order > 0

  - name: workouts
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: training_plan_version_id, type: uuid, nullable: false }
      - { name: gym_id, type: uuid, nullable: true }
      - { name: user_id, type: uuid, nullable: false }
      - { name: started_at, type: timestamptz, nullable: true }
      - { name: completed_at, type: timestamptz, nullable: true }
      - { name: current_exercise_position, type: integer, nullable: true }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [training_plan_version_id], references: training_plan_versions(id) }
      - { columns: [gym_id], references: gyms(id) }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [id, user_id] }
    checks:
      - current_exercise_position IS NULL OR current_exercise_position > 0
      - completed_at IS NULL OR started_at IS NULL OR completed_at >= started_at

  - name: workout_exercises
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: workout_id, type: uuid, nullable: false }
      - { name: training_plan_exercise_id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: position, type: integer, nullable: false }
      - { name: selected_variant_id, type: uuid, nullable: true }
      - { name: selected_station_id, type: uuid, nullable: true }
      - { name: selected_plan_exercise_option_id, type: uuid, nullable: true }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [workout_id], references: workouts(id) }
      - { columns: [workout_id, user_id], references: "workouts(id,user_id)" }
      - { columns: [training_plan_exercise_id], references: training_plan_exercises(id) }
      - { columns: [user_id], references: users(id) }
      - { columns: [selected_variant_id], references: exercise_variants(id) }
      - { columns: [selected_station_id], references: equipment_stations(id) }
      - { columns: [selected_plan_exercise_option_id], references: plan_exercise_options(id) }
    unique_constraints:
      - { columns: [workout_id, position] }
      - { columns: [id, user_id] }
    checks:
      - position > 0

  - name: workout_sets
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: workout_exercise_id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: set_index, type: integer, nullable: false }
      - { name: reps, type: integer, nullable: true }
      - { name: load_display_value, type: numeric, nullable: false }
      - { name: load_display_unit, type: text, nullable: false }
      - { name: load_canonical_kg, type: numeric, nullable: false }
      - { name: completed_at, type: timestamptz, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [workout_exercise_id], references: workout_exercises(id) }
      - { columns: [workout_exercise_id, user_id], references: "workout_exercises(id,user_id)" }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [workout_exercise_id, set_index] }
    checks:
      - set_index > 0
      - reps IS NULL OR reps > 0
      - load_display_value >= 0
      - load_canonical_kg >= 0
      - load_display_unit in ('kg', 'lbs')

domain_rule_implementations:
  - rule: single_active_workout_per_user
    implemented_by:
      - active_workout_reads_filter_workouts_by_user_id_and_completed_at_is_null
      - active_workout_create_checks_existing_active_workout_for_same_user_before_insert

  - rule: protected_api_routes_require_authenticated_session
    implemented_by:
      - auth_login_verifies_access_key_against_active_user_secret
      - auth_login_persists_session_token_hash_with_idle_and_absolute_expiry
      - middleware_resolves_cookie_session_and_touches_last_seen_when_valid

  - rule: workout_reads_and_writes_are_user_scoped
    implemented_by:
      - workouts_table_stores_user_id
      - repository_queries_filter_workouts_by_user_id
      - composite_foreign_keys_enforce_parent_child_user_ownership_consistency
      - workout_exercises_and_sets_store_user_id_for_cascade_and_integrity

  - rule: training_plan_listing_is_user_scoped
    implemented_by:
      - training_plan_summaries_query_filters_training_plans_by_user_id
      - training_plan_exercises_join_latest_training_plan_versions_for_counts

  - rule: domain_model_omits_user_id_from_core_workout_entities
    implemented_by:
      - keep_user_id_at_persistence_and_session_context_boundaries
      - do_not_duplicate_user_id_across_every_domain_entity_payload
