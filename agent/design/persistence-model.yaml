version: 1
database: postgresql
source_of_truth: persistence-layout
references:
  glossary: /Users/cpf/Workspace/personal/PumpBuddy/agent/design/glossary.yaml
formatting:
  indent_spaces: 2

lifecycle_policy_implementation:
  - id: ARCHIVABLE
    db_strategy:
      - keep_row
      - mark_logically_inactive_via_timestamp_or_flag
      - preserve_references_for_history
  - id: IMMUTABLE
    db_strategy:
      - insert_only
      - block_in_place_mutation_except_operational_fields
      - preserve_for_history_or_audit
  - id: HARD_DELETABLE
    db_strategy:
      - allow_delete_when_business_rule_permits
      - allow_cascade_for_aggregate_children

principles:
  - persistence_is_user_scoped_for_application_data
  - user_scoped_integrity_is_enforced_via_composite_foreign_keys_for_owned_reference_data
  - domain_entities_omit_user_id_even_when_tables_store_it
  - auth_state_is_persisted_via_user_secrets_sessions_login_attempt_throttle_state_and_preferences
  - relational_child_tables_for_workout_exercises_and_sets

decisions:
  - id: user_scoping_strategy
    decision: Persist user ownership in the database and enforce user-scoped queries in repository methods, while keeping user_id out of most domain entity payloads.
    rationale: Separates identity/tenancy concerns from workout domain structures while still enforcing isolation at persistence boundaries.
  - id: current_auth_surface_role_strategy
    decision: Keep the current authenticated HTTP surface single-user and self-service only, without separate role or authorization persistence for a public administrative API that does not yet exist.
    rationale: Avoids speculative authorization modeling until the product has distinct principals or admin-only HTTP capabilities that need least-privilege separation.
  - id: user_scoped_constraint_strategy
    decision: Model owned reference data with user_id plus composite unique and foreign-key constraints where needed to enforce tenant-safe parent-child linkage.
    rationale: Aligns table-level ownership and referential integrity with implemented SQL isolation semantics.
  - id: session_persistence_strategy
    decision: Authenticate via access-key secret verification and persist revocable sessions with idle and absolute expiry windows.
    rationale: Enables secure protected routes with durable server-side session lifecycle management.
  - id: auth_login_attempt_throttle_storage_strategy
    decision: Persist principal-scoped and IP-scoped failed-login windows in auth_login_attempts, update them in place while the throttle window remains active, and hard-delete the matching rows after a successful authentication for the same keys.
    rationale: Supports durable abuse-resistance lockout state across requests while matching the implemented fetch/record/clear persistence behavior in backend/src/persistence/auth.rs, the login flow in backend/src/application/auth.rs, and backend test reset coverage that truncates auth_login_attempts in backend/src/test_support.rs.
  - id: auth_session_preference_storage_strategy
    decision: Persist favorite_gym_id and max_load_kg as per-user keyed preferences in user_preferences and resolve them during authenticated session reads/updates.
    rationale: Keeps auth/session profile values durable, user-scoped, and extensible without changing stable auth payload contracts.
  - id: workout_set_storage
    decision: Store workout sets as relational child rows under workout_exercises.
    rationale: Supports strict constraints, ordering, and efficient read/write patterns for active workout flows.
  - id: workout_mode_derivation_strategy
    decision: Do not persist a workout_mode column; derive workout mode from workouts.gym_id, where null means free and a non-null gym_id means configured_gym.
    rationale: Keeps the runtime representation aligned with API payloads and avoids synchronizing duplicate mode state with gym binding.
  - id: load_profile_sum_type_storage
    decision: Persist load profile variant definitions in load_profiles.definition as JSONB with fixed_list|formula variants in one table.
    rationale: Keeps LoadProfile as a single persistence aggregate while allowing immutable variant-specific shape.
  - id: load_profile_mutability_semantics
    decision: Allow updates to load_profiles.name while treating load_profiles.definition as immutable after insert.
    rationale: Supports display-name edits without changing a profile's canonical load behavior contract.
  - id: load_profile_definition_variant_requirements
    decision: Require definition.kind plus variant-specific shape constraints (fixed_list requires values to be a non-empty array; formula requires numeric min and positive numeric step).
    rationale: Matches load-profile domain invariants at the durable write boundary so malformed immutable definitions cannot be persisted for later read-path expansion failures.
  - id: variant_station_modeling_strategy
    decision: Keep training_plan_exercise_variants gym-agnostic and free of direct station linkage; use exercise_variants.requires_station plus exercise_variant_equipment_compatibilities as the configured-gym station realizability source of truth.
    rationale: Avoids duplicated variant-station modeling, keeps option ownership independent from gyms, and supports configured-gym stationless variants explicitly.
  - id: variant_load_input_mode_strategy
    decision: Persist exercise_variants.load_input_mode with values TOTAL and PER_SIDE, where PER_SIDE always means two-sided load semantics independent of bilateral or unilateral sequencing.
    rationale: Makes variant-level load entry semantics explicit without introducing configurable side counts.
  - id: variant_set_tracking_mode_strategy
    decision: Persist exercise_variants.set_tracking_mode with values BILATERAL and UNILATERAL to encode one-entry versus side-paired logical set behavior.
    rationale: Makes side-aware workout-set lifecycle deterministic and queryable from variant metadata.
  - id: variant_repetition_kind_strategy
    decision: Persist exercise_variants.repetition_kind with values REPS and SECS to define repetition-value interpretation for each variant.
    rationale: Makes variant-level repetition semantics explicit for both count-based and timed sets.
  - id: training_plan_exercise_variant_rep_range_strategy
    decision: Persist rep_min and rep_max on training_plan_exercise_variants as the canonical progression-bound source, and disable progression fallback when either bound is null or when rep_min >= rep_max.
    rationale: Centralizes rep-range ownership at option level and prevents invalid or degenerate bounds from driving fallback suggestions.
  - id: training_plan_exercise_variant_target_sets_strategy
    decision: Persist target_sets on training_plan_exercise_variants as nullable integer where present values must be >= 1, with null retaining legacy behavior.
    rationale: Enables target-set-aware behavior without forcing migration of legacy options.
  - id: stationless_null_load_strategy
    decision: Permit null load values in workout_sets for stationless selections while retaining non-negative checks for populated loads.
    rationale: Aligns persistence with stationless execution while preserving validation for station-based loads.
  - id: workout_set_repetition_value_strategy
    decision: Keep workout_sets.repetition_value as the persisted integer repetition value field where REPS means count and SECS means total whole seconds.
    rationale: Aligns persistence naming with schema and API contracts while defining generic repetition-value semantics for timed sets.
  - id: workout_set_canonical_total_load_strategy
    decision: Persist workout_sets load fields as canonical total load regardless of exercise_variants.load_input_mode.
    rationale: Preserves one canonical total-load representation for history, summaries, and downstream calculations.
  - id: workout_set_side_storage_strategy
    decision: Persist workout_sets.set_side with values LEFT, RIGHT, and BILATERAL, where UNILATERAL variants record LEFT then RIGHT for each set_index and BILATERAL variants record only BILATERAL.
    rationale: Supports deterministic unilateral sequencing while preserving unchanged bilateral semantics.
  - id: workout_exercise_performance_score_strategy
    decision: Persist workout_exercises.performance_score as a nullable integer that remains unset before exercise completion and is written by backend completion logic using the exercise's recorded set data semantics.
    rationale: Captures completion-only scoring lifecycle without exposing score fields in API contracts for this plan scope.
  - id: row_timestamp_trigger_strategy
    decision: Persist created_at and updated_at on all core tables and manage both exclusively via a shared database trigger function.
    rationale: Centralizes timestamp write semantics and keeps application code read-only for these operational fields.

tables:
  - name: users
    lifecycle_policy: ARCHIVABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: login_name, type: text, nullable: true }
      - { name: display_name, type: text, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
      - { name: disabled_at, type: timestamptz, nullable: true }
    primary_key: [id]

  - name: user_secrets
    lifecycle_policy: ARCHIVABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: secret_hash, type: text, nullable: false }
      - { name: label, type: text, nullable: true }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
      - { name: revoked_at, type: timestamptz, nullable: true }
      - { name: last_used_at, type: timestamptz, nullable: true }
      - { name: rotated_by_user_id, type: uuid, nullable: true }
      - { name: rotation_reason, type: text, nullable: true }
    primary_key: [id]
    foreign_keys:
      - { columns: [user_id], references: users(id) }
      - { columns: [rotated_by_user_id], references: users(id) }

  - name: sessions
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: session_token_hash, type: text, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
      - { name: last_seen_at, type: timestamptz, nullable: false }
      - { name: idle_expires_at, type: timestamptz, nullable: false }
      - { name: absolute_expires_at, type: timestamptz, nullable: false }
      - { name: revoked_at, type: timestamptz, nullable: true }
      - { name: replaced_by_session_id, type: uuid, nullable: true }
      - { name: user_agent, type: text, nullable: true }
      - { name: ip_address, type: text, nullable: true }
      - { name: device_label, type: text, nullable: true }
      - { name: revoke_reason, type: text, nullable: true }
    primary_key: [id]
    foreign_keys:
      - { columns: [user_id], references: users(id) }
      - { columns: [replaced_by_session_id], references: sessions(id) }
    unique_constraints:
      - { columns: [session_token_hash] }
    checks:
      - idle_expires_at >= created_at
      - absolute_expires_at >= created_at

  - name: auth_login_attempts
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: key_scope, type: text, nullable: false }
      - { name: key_value, type: text, nullable: false }
      - { name: window_started_at, type: timestamptz, nullable: false }
      - { name: failure_count, type: integer, nullable: false }
      - { name: last_failure_at, type: timestamptz, nullable: true }
      - { name: blocked_until, type: timestamptz, nullable: true }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    unique_constraints:
      - { columns: [key_scope, key_value] }
    checks:
      - key_scope in ('ip', 'principal')
      - failure_count >= 0
      - created_at and updated_at are maintained by the shared row timestamp trigger

  - name: user_preferences
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: preference_key, type: text, nullable: false }
      - { name: preference_value, type: text, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [user_id, preference_key] }
    checks:
      - length(trim(preference_key)) > 0
      - created_at and updated_at are maintained by the shared row timestamp trigger

  - name: training_plans
    lifecycle_policy: ARCHIVABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [user_id], references: users(id) }

  - name: training_plan_versions
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: training_plan_id, type: uuid, nullable: false }
      - { name: version_number, type: integer, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [training_plan_id], references: training_plans(id) }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [training_plan_id, version_number] }
    checks:
      - version_number > 0

  - name: exercises
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [name, user_id] }
      - { columns: [id, user_id] }

  - name: gyms
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [id, user_id] }

  - name: load_profiles
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: weight_unit, type: text, nullable: false }
      - { name: definition, type: jsonb, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [id, user_id] }
    checks:
      - weight_unit in ('KG', 'LBS')
      - definition ? 'kind'
      - (definition->>'kind') in ('fixed_list', 'formula')
      - (definition->>'kind') <> 'fixed_list' OR jsonb_typeof(definition->'values') = 'array' AND jsonb_array_length(definition->'values') > 0
      - (definition->>'kind') <> 'formula' OR jsonb_typeof(definition->'min') = 'number' AND jsonb_typeof(definition->'step') = 'number' AND (definition->>'step')::numeric > 0

  - name: equipment_stations
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: gym_id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: load_profile_id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [gym_id, user_id], references: "gyms(id,user_id)" }
      - { columns: [load_profile_id, user_id], references: "load_profiles(id,user_id)" }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [gym_id, user_id, name] }
      - { columns: [id, user_id] }

  - name: training_plan_exercises
    lifecycle_policy: ARCHIVABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: training_plan_version_id, type: uuid, nullable: false }
      - { name: exercise_id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: position, type: integer, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [training_plan_version_id], references: training_plan_versions(id) }
      - { columns: [exercise_id], references: exercises(id) }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [training_plan_version_id, position] }
    checks:
      - position > 0

  - name: exercise_variants
    lifecycle_policy: IMMUTABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: exercise_id, type: uuid, nullable: false }
      - { name: name, type: text, nullable: false }
      - { name: variant_type, type: text, nullable: false }
      - { name: requires_station, type: boolean, nullable: false }
      - { name: load_input_mode, type: text, nullable: false }
      - { name: set_tracking_mode, type: text, nullable: false }
      - { name: repetition_kind, type: text, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [exercise_id, user_id], references: "exercises(id,user_id)" }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [exercise_id, user_id, name] }
      - { columns: [id, user_id] }
    checks:
      - load_input_mode in ('TOTAL', 'PER_SIDE')
      - set_tracking_mode in ('UNILATERAL', 'BILATERAL')
      - repetition_kind in ('REPS', 'SECS')

  - name: exercise_variant_equipment_compatibilities
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: exercise_variant_id, type: uuid, nullable: false }
      - { name: equipment_station_id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: is_enabled, type: boolean, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [exercise_variant_id, user_id], references: "exercise_variants(id,user_id)" }
      - { columns: [equipment_station_id, user_id], references: "equipment_stations(id,user_id)" }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [exercise_variant_id, equipment_station_id] }

  - name: training_plan_exercise_variants
    lifecycle_policy: ARCHIVABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: training_plan_exercise_id, type: uuid, nullable: false }
      - { name: exercise_variant_id, type: uuid, nullable: false }
      - { name: selection_order, type: integer, nullable: false }
      - { name: rep_min, type: integer, nullable: true }
      - { name: rep_max, type: integer, nullable: true }
      - { name: target_sets, type: integer, nullable: true }
      - { name: user_id, type: uuid, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [training_plan_exercise_id], references: training_plan_exercises(id) }
      - { columns: [exercise_variant_id], references: exercise_variants(id) }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [training_plan_exercise_id, exercise_variant_id] }
      - { columns: [training_plan_exercise_id, selection_order] }
    checks:
      - selection_order > 0
      - rep_min IS NULL OR rep_min > 0
      - rep_max IS NULL OR rep_max > 0
      - rep_min IS NULL OR rep_max IS NULL OR rep_min <= rep_max
      - target_sets IS NULL OR target_sets >= 1

  - name: workouts
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: training_plan_version_id, type: uuid, nullable: false }
      - { name: gym_id, type: uuid, nullable: true }
      - { name: user_id, type: uuid, nullable: false }
      - { name: started_at, type: timestamptz, nullable: true }
      - { name: completed_at, type: timestamptz, nullable: true }
      - { name: current_exercise_position, type: integer, nullable: true }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [training_plan_version_id], references: training_plan_versions(id) }
      - { columns: [gym_id], references: gyms(id) }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [id, user_id] }
    indexes:
      - { columns: [user_id] }
    checks:
      - current_exercise_position IS NULL OR current_exercise_position > 0
      - completed_at IS NULL OR started_at IS NULL OR completed_at >= started_at
      - workouts_single_active_per_user_unique is a partial unique index on user_id where completed_at IS NULL
      - workout mode is derived from nullable gym_id; no workout_mode column is persisted

  - name: workout_exercises
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: workout_id, type: uuid, nullable: false }
      - { name: training_plan_exercise_id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: position, type: integer, nullable: false }
      - { name: selected_variant_id, type: uuid, nullable: true }
      - { name: selected_station_id, type: uuid, nullable: true }
      - { name: selected_training_plan_exercise_variant_id, type: uuid, nullable: true }
      - { name: skipped_at, type: timestamptz, nullable: true }
      - { name: completed_at, type: timestamptz, nullable: true }
      - { name: performance_score, type: integer, nullable: true }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [workout_id], references: workouts(id) }
      - { columns: [workout_id, user_id], references: "workouts(id,user_id)" }
      - { columns: [training_plan_exercise_id], references: training_plan_exercises(id) }
      - { columns: [user_id], references: users(id) }
      - { columns: [selected_variant_id], references: exercise_variants(id) }
      - { columns: [selected_station_id], references: equipment_stations(id) }
      - { columns: [selected_training_plan_exercise_variant_id], references: training_plan_exercise_variants(id) }
    unique_constraints:
      - { columns: [workout_id, position] }
      - { columns: [id, user_id] }
    checks:
      - position > 0
      - performance_score IS NULL OR performance_score >= 0
      - performance_score write lifecycle is completion-driven by backend logic (unset before completion; populated on completion)

  - name: workout_sets
    lifecycle_policy: HARD_DELETABLE
    columns:
      - { name: id, type: uuid, nullable: false }
      - { name: workout_exercise_id, type: uuid, nullable: false }
      - { name: user_id, type: uuid, nullable: false }
      - { name: set_index, type: integer, nullable: false }
      - { name: set_side, type: text, nullable: false }
      - { name: repetition_value, type: integer, nullable: true }
      - { name: load_display_value, type: numeric, nullable: true }
      - { name: load_display_unit, type: text, nullable: false }
      - { name: load_canonical_kg, type: numeric, nullable: true }
      - { name: completed_at, type: timestamptz, nullable: false }
      - { name: created_at, type: timestamptz, nullable: false }
      - { name: updated_at, type: timestamptz, nullable: false }
    primary_key: [id]
    foreign_keys:
      - { columns: [workout_exercise_id], references: workout_exercises(id) }
      - { columns: [workout_exercise_id, user_id], references: "workout_exercises(id,user_id)" }
      - { columns: [user_id], references: users(id) }
    unique_constraints:
      - { columns: [workout_exercise_id, set_index, set_side] }
    checks:
      - set_index > 0
      - set_side in ('LEFT', 'RIGHT', 'BILATERAL')
      - repetition_value stores generic repetition value where REPS means count and SECS means total whole seconds
      - repetition_value IS NULL OR repetition_value > 0
      - load_display_value stores canonical total load when populated, independent of load_input_mode
      - load_display_value >= 0
      - load_canonical_kg stores canonical total load when populated, independent of load_input_mode
      - load_canonical_kg >= 0
      - load_display_unit in ('kg', 'lbs')

