version: 1
scope: training-plans-workouts-execution
source_of_truth: domain-structure
references:
  glossary: /Users/cpf/Workspace/personal/PumpBuddy/agent/design/glossary.yaml
formatting:
  indent_spaces: 2
value_sets:
  - id: WORKOUT_MODE
    values:
      - configured_gym
      - free

lifecycle_policies:
  - id: ARCHIVABLE
    description: Entity may be hidden by logical delete (archive flag) but should not be physically deleted once historically relevant.
  - id: IMMUTABLE
    description: Entity is append-only and not archived or deleted after creation/publication.
  - id: HARD_DELETABLE
    description: Entity may be physically deleted when business rules allow it.

entities:
  - name: Exercise
    description: Canonical movement definition.
    attributes:
      - id
      - name
    relationships:
      - type: one_to_many
        target: ExerciseVariant
      - type: one_to_many
        target: TrainingPlanExercise
    lifecycle_policy: IMMUTABLE

  - name: ExerciseVariant
    description: Concrete execution form of an exercise.
    attributes:
      - id
      - exercise_id
      - name
      - variant_type
    relationships:
      - type: many_to_one
        target: Exercise
      - type: one_to_many
        target: PlanExerciseOption
    lifecycle_policy: IMMUTABLE

  - name: Gym
    description: Real-world gym location.
    attributes:
      - id
      - name
    relationships:
      - type: one_to_many
        target: EquipmentStation
      - type: one_to_many
        target: Workout
      - type: one_to_many
        target: PlanExerciseOption
    lifecycle_policy: IMMUTABLE

  - name: EquipmentStation
    description: Specific station within a gym.
    attributes:
      - id
      - gym_id
      - name
      - load_profile_id
    relationships:
      - type: many_to_one
        target: Gym
      - type: many_to_one
        target: LoadProfile
      - type: one_to_many
        target: PlanExerciseOption
    lifecycle_policy: IMMUTABLE

  - name: LoadProfile
    description: Station load contract with immutable definition payload and editable display name.
    attributes:
      - id
      - name
      - weight_unit
      - definition
      - created_at
      - updated_at
    relationships:
      - type: one_to_many
        target: EquipmentStation
    lifecycle_policy: IMMUTABLE

  - name: TrainingPlan
    description: Training plan aggregate with nested exercises.
    attributes:
      - id
      - name
    relationships:
      - type: one_to_many
        target: TrainingPlanExercise
    lifecycle_policy: IMMUTABLE

  - name: TrainingPlanSummary
    description: List-facing projection of a training plan.
    attributes:
      - id
      - name
      - exercise_count
    relationships:
      - type: many_to_one
        target: TrainingPlan
    lifecycle_policy: IMMUTABLE

  - name: GymSummary
    description: List-facing projection of a gym.
    attributes:
      - id
      - name
    relationships:
      - type: many_to_one
        target: Gym
    lifecycle_policy: IMMUTABLE

  - name: TrainingPlanExercise
    description: Ordered exercise entry in one training plan.
    attributes:
      - id
      - position
      - target_sets
      - target_reps_min
      - target_reps_max
      - exercise
      - options
    relationships:
      - type: many_to_one
        target: TrainingPlan
      - type: many_to_one
        target: Exercise
      - type: one_to_many
        target: PlanExerciseOption
    lifecycle_policy: ARCHIVABLE

  - name: PlanExerciseOption
    description: Allowed gym-variant-station option for one plan exercise.
    attributes:
      - id
      - training_plan_exercise_id
      - gym
      - variant
      - station
    relationships:
      - type: many_to_one
        target: TrainingPlanExercise
      - type: many_to_one
        target: Gym
      - type: many_to_one
        target: ExerciseVariant
      - type: optional_many_to_one
        target: EquipmentStation
    lifecycle_policy: ARCHIVABLE

  - name: PlanExerciseOptionSummary
    description: Flattened projection of a plan exercise option for list and selection flows.
    attributes:
      - id
      - training_plan_exercise_id
      - exercise_name
      - exercise_position
      - variant_id
      - variant_name
      - variant_type
      - station_id
      - station_name
    relationships:
      - type: many_to_one
        target: PlanExerciseOption
    lifecycle_policy: IMMUTABLE

  - name: Workout
    description: Concrete workout execution for one plan and gym.
    attributes:
      - id
      - training_plan_id
      - gym_id
      - started_at
      - completed_at
      - exercises
    relationships:
      - type: many_to_one
        target: TrainingPlan
      - type: many_to_one
        target: Gym
      - type: one_to_many
        target: WorkoutExercise
    states:
      - active
      - completed
    lifecycle_policy: HARD_DELETABLE

  - name: WorkoutExercise
    description: Exercise execution row within one workout.
    attributes:
      - id
      - training_plan_exercise_id
      - position
      - selected_variant_id
      - selected_station_id
      - selected_plan_exercise_option_id
      - sets
    relationships:
      - type: many_to_one
        target: Workout
      - type: many_to_one
        target: TrainingPlanExercise
      - type: optional_many_to_one
        target: ExerciseVariant
      - type: optional_many_to_one
        target: EquipmentStation
      - type: optional_many_to_one
        target: PlanExerciseOption
      - type: one_to_many
        target: WorkoutSet
    lifecycle_policy: HARD_DELETABLE

  - name: WorkoutSet
    description: One recorded set in a workout exercise.
    attributes:
      - id
      - set_index
      - reps
      - load_display_value
      - load_display_unit
      - load_canonical_kg
      - completed_at
    relationships:
      - type: many_to_one
        target: WorkoutExercise
    lifecycle_policy: HARD_DELETABLE

  - name: WorkoutSummary
    description: Read projection for workout history and list views.
    attributes:
      - id
      - training_plan_id
      - training_plan_name
      - gym_id
      - gym_name
      - started_at
      - completed_at
      - exercise_count
      - completed_set_count
    relationships:
      - type: many_to_one
        target: Workout
    lifecycle_policy: IMMUTABLE

  - name: ActiveWorkout
    description: Runtime-facing projection for currently active workout state.
    attributes:
      - id
      - training_plan_id
      - training_plan_name
      - gym_id
      - gym_name
      - started_at
      - updated_at
      - current_exercise_position
      - total_exercise_count
      - exercises
    relationships:
      - type: one_to_many
        target: ActiveWorkoutExercise
    lifecycle_policy: HARD_DELETABLE

  - name: ActiveWorkoutExercise
    description: Runtime-facing projection for one exercise within an active workout.
    attributes:
      - training_plan_exercise_id
      - position
      - exercise_name
      - selected_plan_exercise_option_id
      - selected_variant_id
      - selected_variant_name
      - selected_station_id
      - selected_station_name
      - completed_sets
      - suggested_set
    relationships:
      - type: one_to_many
        target: CompletedActiveWorkoutSet
      - type: one_to_one
        target: ActiveWorkoutSet
    lifecycle_policy: HARD_DELETABLE

  - name: CompletedActiveWorkoutSet
    description: Completed-set projection embedded into active workout view.
    attributes:
      - set_index
      - load_value
      - reps
    relationships:
      - type: many_to_one
        target: ActiveWorkoutExercise
    lifecycle_policy: HARD_DELETABLE

  - name: ActiveWorkoutSet
    description: Suggested next set projection embedded into active workout view.
    attributes:
      - load_value
      - reps
    relationships:
      - type: many_to_one
        target: ActiveWorkoutExercise
    lifecycle_policy: HARD_DELETABLE

  - name: NewWorkout
    description: Input model used to create a workout aggregate.
    attributes:
      - training_plan_id
      - gym_id
      - started_at
      - completed_at
      - current_exercise_position
      - exercises
    relationships:
      - type: one_to_many
        target: NewWorkoutExercise
    lifecycle_policy: HARD_DELETABLE

  - name: NewWorkoutExercise
    description: Input model used to create one workout exercise row.
    attributes:
      - training_plan_exercise_id
      - position
      - selected_variant_id
      - selected_station_id
      - selected_plan_exercise_option_id
      - sets
    relationships:
      - type: one_to_many
        target: NewWorkoutSet
    lifecycle_policy: HARD_DELETABLE

  - name: NewWorkoutSet
    description: Input model used to create one workout set.
    attributes:
      - set_index
      - reps
      - load_display_value
      - load_display_unit
      - load_canonical_kg
      - completed_at
    relationships:
      - type: many_to_one
        target: NewWorkoutExercise
    lifecycle_policy: HARD_DELETABLE

invariants:
  - id: invariant.identity_scope_out_of_domain_entities
    rule: user_id ownership and persisted session records are enforced in persistence/api layers and intentionally not repeated as attributes on every domain entity.
  - id: invariant.protected_workflow_requires_authenticated_session_context
    rule: Protected workout and training-plan flows execute in an authenticated user session context.
  - id: invariant.training_plan_exercise_order_unique
    rule: TrainingPlanExercise.position is unique within one TrainingPlan.
  - id: invariant.workout_exercise_order_unique
    rule: WorkoutExercise.position is unique within one Workout.
  - id: invariant.workout_plan_binding
    rule: Workout references exactly one TrainingPlan via training_plan_id.
  - id: invariant.workout_set_index_unique
    rule: WorkoutSet.set_index is unique within one WorkoutExercise.
  - id: invariant.active_workout_projection_consistency
    rule: ActiveWorkout.total_exercise_count equals the number of ActiveWorkout.exercises.
  - id: invariant.selection_fields_optional
    rule: WorkoutExercise selected_* fields may remain empty until an explicit choice is made.
  - id: invariant.plan_exercise_option_station_optional
    rule: PlanExerciseOption.station may be empty for bodyweight or no-station variants.
  - id: invariant.load_profile_definition_is_immutable
    rule: LoadProfile.definition is immutable after creation and must not be mutated in place.
  - id: invariant.load_profile_name_is_editable
    rule: LoadProfile.name is mutable for display updates without changing LoadProfile.definition.
  - id: invariant.load_profile_definition_sum_type
    rule: LoadProfile.definition uses kind as discriminator and permits only fixed_list or formula variants.
  - id: invariant.load_profile_fixed_list_definition_shape
    rule: fixed_list definitions include a non-empty ordered values array expressed in LoadProfile.weight_unit.
  - id: invariant.load_profile_formula_definition_shape
    rule: formula definitions include min and step where step > 0, both expressed in LoadProfile.weight_unit.
