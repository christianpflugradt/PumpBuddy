version: 1
scope: training-plans-workouts-loads
source_of_truth: domain-structure
references:
  glossary: /Users/cpf/Workspace/personal/PumpBuddy/agent/design/glossary.yaml
formatting:
  indent_spaces: 2
value_sets:
  - id: WORKOUT_MODE
    values:
      - configured_gym
      - free

lifecycle_policies:
  - id: ARCHIVABLE
    description: Entity may be hidden by logical delete (archive flag) but should not be physically deleted once historically relevant.
  - id: IMMUTABLE
    description: Entity is append-only and not archived or deleted after creation/publication.
  - id: HARD_DELETABLE
    description: Entity may be physically deleted when business rules allow it.

entities:
  - name: Exercise
    description: Canonical movement definition.
    attributes:
      - id
      - name
    relationships:
      - type: one_to_many
        target: ExerciseVariant
    lifecycle_policy: ARCHIVABLE

  - name: ExerciseVariant
    description: Concrete execution form of an exercise.
    attributes:
      - id
      - exercise_id
      - name
      - variant_type
    relationships:
      - type: many_to_one
        target: Exercise
      - type: one_to_many
        target: ExerciseVariantEquipmentCompatibility
    lifecycle_policy: ARCHIVABLE

  - name: LoadProfile
    description: Ordered allowed load steps for a station.
    attributes:
      - id
      - name
      - display_unit
      - canonical_unit
      - min_display_load
      - max_display_load
      - is_archived
    relationships:
      - type: one_to_many
        target: LoadStep
      - type: one_to_many
        target: EquipmentStation
    lifecycle_policy: ARCHIVABLE

  - name: LoadStep
    description: Single discrete load value in one load profile.
    attributes:
      - id
      - load_profile_id
      - position
      - display_value
      - canonical_value_kg
    relationships:
      - type: many_to_one
        target: LoadProfile
    lifecycle_policy: IMMUTABLE

  - name: Gym
    description: Real-world gym location.
    attributes:
      - id
      - name
      - is_archived
    relationships:
      - type: one_to_many
        target: EquipmentStation
      - type: one_to_many
        target: Workout
    lifecycle_policy: ARCHIVABLE

  - name: EquipmentStation
    description: Specific station within a gym.
    attributes:
      - id
      - gym_id
      - name
      - load_profile_id
      - is_archived
    relationships:
      - type: many_to_one
        target: Gym
      - type: many_to_one
        target: LoadProfile
    lifecycle_policy: ARCHIVABLE

  - name: ExerciseVariantEquipmentCompatibility
    description: Technical compatibility mapping between variant and station in gym context.
    attributes:
      - id
      - exercise_variant_id
      - equipment_station_id
      - is_enabled
    relationships:
      - type: many_to_one
        target: ExerciseVariant
      - type: many_to_one
        target: EquipmentStation
    lifecycle_policy: HARD_DELETABLE

  - name: TrainingPlan
    description: Stable plan identity across multiple immutable versions.
    attributes:
      - id
      - name
      - is_archived
    relationships:
      - type: one_to_many
        target: TrainingPlanVersion
    lifecycle_policy: ARCHIVABLE

  - name: TrainingPlanVersion
    description: Immutable snapshot of a training plan used as workout blueprint.
    attributes:
      - id
      - training_plan_id
      - version_number
      - is_archived
      - published_at
    relationships:
      - type: many_to_one
        target: TrainingPlan
      - type: one_to_many
        target: TrainingPlanExercise
      - type: one_to_many
        target: Workout
    lifecycle_policy: IMMUTABLE

  - name: TrainingPlanExercise
    description: Ordered exercise entry in a specific plan version.
    attributes:
      - id
      - training_plan_version_id
      - exercise_id
      - position
      - target_sets
      - target_reps_min
      - target_reps_max
    relationships:
      - type: many_to_one
        target: TrainingPlanVersion
      - type: many_to_one
        target: Exercise
      - type: one_to_many
        target: TrainingPlanExerciseOption
    lifecycle_policy: IMMUTABLE

  - name: TrainingPlanExerciseOption
    description: Ordered allowed variant-station option for one plan exercise in one gym.
    attributes:
      - id
      - training_plan_exercise_id
      - gym_id
      - exercise_variant_id
      - equipment_station_id
      - selection_order
    relationships:
      - type: many_to_one
        target: TrainingPlanExercise
      - type: many_to_one
        target: Gym
      - type: many_to_one
        target: ExerciseVariant
      - type: many_to_one
        target: EquipmentStation
    lifecycle_policy: IMMUTABLE

  - name: Workout
    description: Concrete execution instance started from one plan version.
    attributes:
      - id
      - mode
      - training_plan_version_id
      - gym_id
      - started_at
      - completed_at
      - current_exercise_position
    relationships:
      - type: many_to_one
        target: TrainingPlanVersion
      - type: optional_many_to_one
        target: Gym
      - type: one_to_many
        target: WorkoutExercise
    states:
      - active
      - completed
    lifecycle_policy: HARD_DELETABLE

  - name: WorkoutExercise
    description: Exercise execution row within one workout.
    attributes:
      - id
      - workout_id
      - training_plan_exercise_id
      - position
      - selected_variant_id
      - selected_station_id
      - selected_training_plan_exercise_option_id
    relationships:
      - type: many_to_one
        target: Workout
      - type: many_to_one
        target: TrainingPlanExercise
      - type: optional_many_to_one
        target: ExerciseVariant
      - type: optional_many_to_one
        target: EquipmentStation
      - type: optional_many_to_one
        target: TrainingPlanExerciseOption
      - type: one_to_many
        target: WorkoutSet
    lifecycle_policy: HARD_DELETABLE

  - name: WorkoutSet
    description: One confirmed set in an exercise execution.
    attributes:
      - id
      - workout_exercise_id
      - set_index
      - reps
      - load_display_value
      - load_display_unit
      - load_canonical_kg
      - completed_at
    relationships:
      - type: many_to_one
        target: WorkoutExercise
    lifecycle_policy: HARD_DELETABLE

invariants:
  - id: invariant.plan_version_order_unique
    rule: TrainingPlanExercise.position is unique within one TrainingPlanVersion.
  - id: invariant.workout_exercise_order_unique
    rule: WorkoutExercise.position is unique within one Workout.
  - id: invariant.workout_plan_binding
    rule: Workout references exactly one TrainingPlanVersion.
  - id: invariant.plan_version_unique
    rule: TrainingPlanVersion.version_number is unique per TrainingPlan.
  - id: invariant.plan_version_immutable
    rule: Published TrainingPlanVersion records are immutable.
  - id: invariant.archive_not_delete_blueprints
    rule: Blueprint entities with historical impact are archived, not physically deleted.
  - id: invariant.gym_scoped_allowed_options
    rule: Allowed options are gym-specific via TrainingPlanExerciseOption.
  - id: invariant.option_order_deterministic
    rule: Allowed options are ordered and deterministic via selection_order.
  - id: invariant.workout_start_eligibility
    rule: In configured_gym mode, workout start requires at least one realizable option per plan exercise in the selected gym.
  - id: invariant.workout_mode_gym_binding
    rule: Workout.mode configured_gym requires gym_id, and Workout.mode free requires gym_id to be empty.
  - id: invariant.workout_mode_selection_fields
    rule: In free mode, selected variant/station/option fields remain empty for workout exercises.
  - id: invariant.load_canonical_required
    rule: WorkoutSet.load_canonical_kg is always stored even when display unit is lbs.
  - id: invariant.load_must_match_profile
    rule: WorkoutSet.load_display_value must match a valid LoadStep for the selected station profile.
  - id: invariant.active_workout_limit
    rule: Intended application state contains at most one ActiveWorkout.
  - id: invariant.progression_input_quality
    rule: Gym-aware progression suggestions exclude free-mode workouts by default.
  - id: invariant.lifecycle_archivable
    rule: ARCHIVABLE entities are logically deleted (archived) instead of physically deleted once historically relevant.
  - id: invariant.lifecycle_immutable
    rule: IMMUTABLE entities are append-only after creation/publication.
  - id: invariant.lifecycle_hard_deletable
    rule: HARD_DELETABLE entities may be physically deleted when explicit business rules allow deletion.
