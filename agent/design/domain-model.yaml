version: 1
scope: training-plans-workouts-execution
source_of_truth: domain-structure
references:
  glossary: /Users/cpf/Workspace/personal/PumpBuddy/agent/design/glossary.yaml
formatting:
  indent_spaces: 2
value_sets:
  - id: WORKOUT_MODE
    values:
      - configured_gym
      - free
  - id: LOAD_INPUT_MODE
    values:
      - TOTAL
      - PER_SIDE
  - id: SET_TRACKING_MODE
    values:
      - UNILATERAL
      - BILATERAL
  - id: SET_SIDE
    values:
      - LEFT
      - RIGHT
      - BILATERAL
  - id: REPETITION_KIND
    values:
      - REPS
      - SECS

lifecycle_policies:
  - id: ARCHIVABLE
    description: Entity may be hidden by logical delete (archive flag) but should not be physically deleted once historically relevant.
  - id: IMMUTABLE
    description: Entity is append-only and not archived or deleted after creation/publication.
  - id: HARD_DELETABLE
    description: Entity may be physically deleted when business rules allow it.

entities:
  - name: Exercise
    description: Canonical movement definition.
    attributes:
      - id
      - name
    relationships:
      - type: one_to_many
        target: ExerciseVariant
      - type: one_to_many
        target: TrainingPlanExercise
    lifecycle_policy: IMMUTABLE

  - name: ExerciseVariant
    description: Concrete execution form of an exercise, including station-required versus stationless behavior and side-tracking semantics.
    attributes:
      - id
      - exercise_id
      - name
      - variant_type
      - requires_station
      - load_input_mode
      - set_tracking_mode
      - repetition_kind
    relationships:
      - type: many_to_one
        target: Exercise
      - type: one_to_many
        target: TrainingPlanExerciseVariant
      - type: one_to_many
        target: ExerciseVariantEquipmentCompatibility
    lifecycle_policy: IMMUTABLE

  - name: Gym
    description: Real-world gym location.
    attributes:
      - id
      - name
    relationships:
      - type: one_to_many
        target: EquipmentStation
      - type: one_to_many
        target: Workout
    lifecycle_policy: IMMUTABLE

  - name: EquipmentStation
    description: Specific station within a gym.
    attributes:
      - id
      - gym_id
      - name
      - load_profile_id
    relationships:
      - type: many_to_one
        target: Gym
      - type: many_to_one
        target: LoadProfile
    lifecycle_policy: IMMUTABLE

  - name: LoadProfile
    description: Station load contract with immutable definition payload and editable display name.
    attributes:
      - id
      - name
      - weight_unit
      - definition
      - created_at
      - updated_at
    relationships:
      - type: one_to_many
        target: EquipmentStation
    lifecycle_policy: IMMUTABLE

  - name: TrainingPlan
    description: Training plan aggregate with versioned exercise definitions.
    attributes:
      - id
      - name
    relationships:
      - type: one_to_many
        target: TrainingPlanVersion
    lifecycle_policy: IMMUTABLE

  - name: TrainingPlanVersion
    description: Immutable snapshot version of one training plan.
    attributes:
      - id
      - training_plan_id
      - version_number
      - created_at
      - updated_at
    relationships:
      - type: many_to_one
        target: TrainingPlan
      - type: one_to_many
        target: TrainingPlanExercise
      - type: one_to_many
        target: Workout
    lifecycle_policy: IMMUTABLE

  - name: TrainingPlanSummary
    description: List-facing projection of a training plan.
    attributes:
      - id
      - name
      - exercise_count
    relationships:
      - type: many_to_one
        target: TrainingPlan
    lifecycle_policy: IMMUTABLE

  - name: GymSummary
    description: List-facing projection of a gym.
    attributes:
      - id
      - name
    relationships:
      - type: many_to_one
        target: Gym
    lifecycle_policy: IMMUTABLE

  - name: TrainingPlanExercise
    description: Ordered exercise entry in one training plan version.
    attributes:
      - id
      - position
      - exercise
      - options
    relationships:
      - type: many_to_one
        target: TrainingPlanVersion
      - type: many_to_one
        target: Exercise
      - type: one_to_many
        target: TrainingPlanExerciseVariant
    lifecycle_policy: ARCHIVABLE

  - name: TrainingPlanExerciseVariant
    description: Allowed variant selection option for one plan exercise; options are gym-agnostic source-of-truth records where rep_min/rep_max define progression bounds, target_sets defines optional logical set targeting, and configured-gym realizability is derived from compatibility mappings plus requires_station semantics.
    attributes:
      - id
      - training_plan_exercise_id
      - variant
      - rep_min
      - rep_max
      - target_sets
    relationships:
      - type: many_to_one
        target: TrainingPlanExercise
      - type: many_to_one
        target: ExerciseVariant
    lifecycle_policy: ARCHIVABLE

  - name: ExerciseVariantEquipmentCompatibility
    description: Station compatibility mapping for station-required variants in configured gym mode.
    attributes:
      - id
      - exercise_variant_id
      - equipment_station_id
      - is_enabled
    relationships:
      - type: many_to_one
        target: ExerciseVariant
      - type: many_to_one
        target: EquipmentStation
    lifecycle_policy: HARD_DELETABLE

  - name: TrainingPlanExerciseVariantSummary
    description: Flattened projection of a plan exercise option for list and selection flows.
    attributes:
      - id
      - training_plan_exercise_id
      - exercise_name
      - exercise_position
      - variant_id
      - variant_name
      - variant_type
      - station_id
      - station_name
    relationships:
      - type: many_to_one
        target: TrainingPlanExerciseVariant
    lifecycle_policy: IMMUTABLE

  - name: Workout
    description: Concrete workout execution for one training plan version and gym.
    attributes:
      - id
      - training_plan_version_id
      - gym_id
      - started_at
      - completed_at
      - exercises
    relationships:
      - type: many_to_one
        target: TrainingPlanVersion
      - type: many_to_one
        target: Gym
      - type: one_to_many
        target: WorkoutExercise
    states:
      - active
      - completed
    lifecycle_policy: HARD_DELETABLE

  - name: WorkoutExercise
    description: Exercise execution row within one workout, including completion-time performance scoring semantics.
    attributes:
      - id
      - training_plan_exercise_id
      - position
      - selected_variant_id
      - selected_station_id
      - selected_training_plan_exercise_variant_id
      - skipped_at
      - completed_at
      - performance_score
      - sets
    relationships:
      - type: many_to_one
        target: Workout
      - type: many_to_one
        target: TrainingPlanExercise
      - type: optional_many_to_one
        target: ExerciseVariant
      - type: optional_many_to_one
        target: EquipmentStation
      - type: optional_many_to_one
        target: TrainingPlanExerciseVariant
      - type: one_to_many
        target: WorkoutSet
    lifecycle_policy: HARD_DELETABLE

  - name: WorkoutSet
    description: One recorded set-side entry in a workout exercise, including null load support for stationless variant flows.
    attributes:
      - id
      - set_index
      - set_side
      - repetition_value
      - load_display_value
      - load_display_unit
      - load_canonical_kg
      - completed_at
    relationships:
      - type: many_to_one
        target: WorkoutExercise
    lifecycle_policy: HARD_DELETABLE

  - name: WorkoutSummary
    description: Read projection for workout history and list views.
    attributes:
      - id
      - training_plan_id
      - training_plan_name
      - gym_id
      - gym_name
      - started_at
      - completed_at
      - exercise_count
      - completed_set_count
    relationships:
      - type: many_to_one
        target: Workout
    lifecycle_policy: IMMUTABLE

  - name: ActiveWorkout
    description: Runtime-facing projection for currently active workout state.
    attributes:
      - id
      - training_plan_id
      - training_plan_name
      - gym_id
      - gym_name
      - started_at
      - updated_at
      - current_exercise_position
      - total_exercise_count
      - exercises
    relationships:
      - type: one_to_many
        target: ActiveWorkoutExercise
    lifecycle_policy: HARD_DELETABLE

  - name: ActiveWorkoutExercise
    description: Runtime-facing projection for one exercise within an active workout.
    attributes:
      - training_plan_exercise_id
      - position
      - exercise_name
      - selected_training_plan_exercise_variant_id
      - selected_variant_id
      - selected_variant_name
      - selected_station_id
      - selected_station_name
      - skipped_at
      - completed_at
      - completed_sets
      - suggested_set
    relationships:
      - type: one_to_many
        target: CompletedActiveWorkoutSet
      - type: one_to_one
        target: ActiveWorkoutSet
    lifecycle_policy: HARD_DELETABLE

  - name: CompletedActiveWorkoutSet
    description: Completed set-side projection embedded into active workout view.
    attributes:
      - set_index
      - set_side
      - load_value
      - repetition_value
    relationships:
      - type: many_to_one
        target: ActiveWorkoutExercise
    lifecycle_policy: HARD_DELETABLE

  - name: ActiveWorkoutSet
    description: Suggested next set projection embedded into active workout view.
    attributes:
      - set_index
      - set_side
      - load_value
      - repetition_value
    relationships:
      - type: many_to_one
        target: ActiveWorkoutExercise
    lifecycle_policy: HARD_DELETABLE

  - name: NewWorkout
    description: Input model used to create a workout aggregate.
    attributes:
      - training_plan_id
      - gym_id
      - started_at
      - completed_at
      - current_exercise_position
      - exercises
    relationships:
      - type: one_to_many
        target: NewWorkoutExercise
    lifecycle_policy: HARD_DELETABLE

  - name: NewWorkoutExercise
    description: Input model used to create one workout exercise row.
    attributes:
      - training_plan_exercise_id
      - position
      - selected_variant_id
      - selected_station_id
      - selected_training_plan_exercise_variant_id
      - skipped_at
      - completed_at
      - sets
    relationships:
      - type: one_to_many
        target: NewWorkoutSet
    lifecycle_policy: HARD_DELETABLE

  - name: NewWorkoutSet
    description: Input model used to create one workout set-side entry.
    attributes:
      - set_index
      - set_side
      - repetition_value
      - load_display_value
      - load_display_unit
      - load_canonical_kg
      - completed_at
    relationships:
      - type: many_to_one
        target: NewWorkoutExercise
    lifecycle_policy: HARD_DELETABLE

invariants:
  - id: invariant.identity_scope_out_of_domain_entities
    rule: user_id ownership and persisted session records are enforced in persistence/api layers and intentionally not repeated as attributes on every domain entity.
  - id: invariant.protected_workflow_requires_authenticated_session_context
    rule: Protected workout and training-plan flows execute in an authenticated user session context.
  - id: invariant.training_plan_exercise_order_unique
    rule: TrainingPlanExercise.position is unique within one TrainingPlanVersion.
  - id: invariant.workout_exercise_order_unique
    rule: WorkoutExercise.position is unique within one Workout.
  - id: invariant.workout_plan_binding
    rule: Workout references exactly one TrainingPlanVersion via training_plan_version_id.
  - id: invariant.workout_set_index_unique
    rule: WorkoutSet identity is unique within one WorkoutExercise by (set_index, set_side), where set_side values are LEFT|RIGHT|BILATERAL.
  - id: invariant.active_workout_projection_consistency
    rule: ActiveWorkout.total_exercise_count equals the number of ActiveWorkout.exercises.
  - id: invariant.selection_fields_optional
    rule: WorkoutExercise selected_* fields may remain empty until an explicit choice is made.
  - id: invariant.training_plan_exercise_variant_station_derived
    rule: TrainingPlanExerciseVariant is gym-agnostic and stores no gym or station linkage; configured-gym station assignment is resolved from ExerciseVariantEquipmentCompatibility for stations in the selected gym when ExerciseVariant.requires_station is true, and remains empty for stationless variants.
  - id: invariant.exercise_variant_requires_station_semantics
    rule: ExerciseVariant.requires_station defines whether a station compatibility mapping is required for configured gym realizability.
  - id: invariant.exercise_variant_load_input_mode_semantics
    rule: ExerciseVariant.load_input_mode defines load entry semantics where TOTAL means user-entered and renderer-displayed load is already canonical total load, and PER_SIDE means user enters one-side load while canonical total load is two-sided (2x per-side).
  - id: invariant.exercise_variant_set_tracking_mode_semantics
    rule: ExerciseVariant.set_tracking_mode defines set lifecycle semantics where BILATERAL records one entry per logical set with set_side=BILATERAL and UNILATERAL records deterministic left-then-right entries with set_side LEFT then RIGHT for each set_index.
  - id: invariant.exercise_variant_repetition_kind_semantics
    rule: ExerciseVariant.repetition_kind permits only REPS or SECS and defines how WorkoutSet.repetition_value is interpreted.
  - id: invariant.training_plan_exercise_variant_rep_range_ownership
    rule: TrainingPlanExerciseVariant is the canonical owner of rep_min/rep_max progression bounds and nullable target_sets; TrainingPlanExercise does not persist rep or target set fields.
  - id: invariant.training_plan_exercise_variant_progression_fallback_disablement
    rule: Progression fallback suggestions are disabled when TrainingPlanExerciseVariant.rep_min is null, TrainingPlanExerciseVariant.rep_max is null, or rep_min >= rep_max (degenerate bounds).
  - id: invariant.workout_set_repetition_value_semantics
    rule: WorkoutSet.repetition_value is an integer where REPS means repetition count and SECS means total whole seconds.
  - id: invariant.unilateral_resume_progression
    rule: For UNILATERAL variants, a persisted LEFT entry without RIGHT for the same set_index means resume continues at RIGHT before advancing to the next set_index.
  - id: invariant.workout_set_stationless_null_load_allowed
    rule: WorkoutSet permits null load_display_value and load_canonical_kg for stationless selections (null load), while station-based flows persist canonical total load values.
  - id: invariant.load_profile_definition_is_immutable
    rule: LoadProfile.definition is immutable after creation and must not be mutated in place.
  - id: invariant.load_profile_name_is_editable
    rule: LoadProfile.name is mutable for display updates without changing LoadProfile.definition.
  - id: invariant.load_profile_definition_sum_type
    rule: LoadProfile.definition uses kind as discriminator and permits only fixed_list or formula variants.
  - id: invariant.load_profile_fixed_list_definition_shape
    rule: fixed_list definitions include a non-empty ordered values array expressed in LoadProfile.weight_unit.
  - id: invariant.load_profile_formula_definition_shape
    rule: formula definitions include min and step where step > 0, both expressed in LoadProfile.weight_unit.
