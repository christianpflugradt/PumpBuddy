version: 1
area: workout_insights
source_of_truth: use_case_domain_mapping
references:
  glossary: /Users/cpf/Workspace/personal/PumpBuddy/agent/design/glossary.yaml
  use_cases: /Users/cpf/Workspace/personal/PumpBuddy/agent/design/workout-insights-use-cases.yaml
  domain_model: /Users/cpf/Workspace/personal/PumpBuddy/agent/design/domain-model.yaml
  persistence_model: /Users/cpf/Workspace/personal/PumpBuddy/agent/design/persistence-model.yaml
  api_contract: /Users/cpf/Workspace/personal/PumpBuddy/agent/design/api-contract.yaml
formatting:
  indent_spaces: 2

mapping_conventions:
  primary_entities: Entities directly projected or navigated by the insights use case.
  supporting_entities: Entities used for lookup, enrichment, or ordering guarantees.
  key_rules: Domain rules and read-side constraints that must hold for the use case.
  state_changes: Meaningful navigation transitions; insights flows are otherwise read-only.
  persistence_impact: Read and write effects grouped by operation.

mappings:
  - use_case_id: UC-08
    use_case_name: List Completed Workout History
    mode: configured_gym_and_free
    primary_entities:
      - Workout
    supporting_entities:
      - TrainingPlan
      - Gym
    key_rules:
      - history_and_progress_views_are_read_only_and_never_create_or_mutate_workouts
      - history_and_progress_views_only_surface_completed_workout_data
    state_changes:
      - none_read_only_projection
    persistence_impact:
      read:
        - workouts
        - training_plans
        - gyms

  - use_case_id: UC-09
    use_case_name: Retrieve Completed Workout Detail
    mode: configured_gym_and_free
    primary_entities:
      - Workout
      - WorkoutExercise
      - WorkoutSet
    supporting_entities:
      - TrainingPlan
      - ExerciseVariant
      - EquipmentStation
    key_rules:
      - history_and_progress_views_are_read_only_and_never_create_or_mutate_workouts
      - history_and_progress_views_only_surface_completed_workout_data
      - workout_detail_set_lines_preserve_deterministic_order
    state_changes:
      - none_read_only_projection
    persistence_impact:
      read:
        - workouts
        - workout_exercises
        - workout_sets
        - training_plans
        - exercise_variants
        - equipment_stations

  - use_case_id: UC-10
    use_case_name: Retrieve Workout Progress Timeline
    mode: configured_gym_and_free
    primary_entities:
      - Workout
    supporting_entities:
      - TrainingPlan
    key_rules:
      - history_and_progress_views_are_read_only_and_never_create_or_mutate_workouts
      - history_and_progress_views_only_surface_completed_workout_data
      - progress_scores_are_projected_with_availability_status_and_tone
    state_changes:
      - none_read_only_projection
    persistence_impact:
      read:
        - workouts
        - training_plans

  - use_case_id: UC-11
    use_case_name: Open Exercise Variant Detail From Insights Surfaces
    mode: configured_gym_and_free
    primary_entities:
      - ExerciseVariant
      - Workout
    supporting_entities:
      - WorkoutExercise
      - WorkoutSet
    key_rules:
      - variant_detail_navigation_uses_variant_id_from_existing_insights_payloads
      - history_and_progress_views_are_read_only_and_never_create_or_mutate_workouts
    state_changes:
      - insights_screen_to_variant_detail_view
      - optional_variant_detail_to_exercises_scroll_restore
    persistence_impact:
      read:
        - workouts
        - workout_exercises
        - workout_sets
        - exercise_variants

  - use_case_id: UC-12
    use_case_name: List Gym Transparency
    mode: configured_gym_and_free
    primary_entities:
      - GymSummary
    supporting_entities:
      - Gym
      - Workout
    key_rules:
      - gym_transparency_views_are_read_only_and_never_mutate_configuration
      - gym_summary_rows_are_authenticated_user_scoped
    state_changes:
      - navigation_to_pb_gyms_screen
      - none_configuration_mutation
    persistence_impact:
      read:
        - gyms
        - workouts

  - use_case_id: UC-13
    use_case_name: Retrieve Gym Detail
    mode: configured_gym_and_free
    primary_entities:
      - GymDetail
      - GymStationSummary
      - GymExerciseGroup
      - GymExerciseVariantSummary
    supporting_entities:
      - Gym
      - EquipmentStation
      - LoadProfile
      - Exercise
      - ExerciseVariant
      - ExerciseVariantEquipmentCompatibility
    key_rules:
      - gym_transparency_views_are_read_only_and_never_mutate_configuration
      - gym_detail_station_and_exercise_variant_order_is_backend_owned
      - stationless_variants_are_represented_in_gym_detail_without_synthetic_station_rows
    state_changes:
      - pb_gyms_screen_to_pb_gym_detail_screen
      - none_configuration_mutation
    persistence_impact:
      read:
        - gyms
        - equipment_stations
        - load_profiles
        - exercises
        - exercise_variants
        - exercise_variant_equipment_compatibilities

  - use_case_id: UC-14
    use_case_name: Retrieve Station Detail
    mode: configured_gym_and_free
    primary_entities:
      - GymStationDetail
      - GymLoadProfileSummary
      - GymStationExerciseGroup
      - GymStationExerciseVariantSummary
    supporting_entities:
      - Gym
      - EquipmentStation
      - LoadProfile
      - Exercise
      - ExerciseVariant
      - ExerciseVariantEquipmentCompatibility
    key_rules:
      - gym_transparency_views_are_read_only_and_never_mutate_configuration
      - station_transparency_only_surfaces_concrete_station_compatibility
      - load_profile_possible_values_are_read_side_expansions_of_immutable_definition
    state_changes:
      - pb_gym_detail_screen_to_pb_station_detail_screen
      - station_detail_to_variant_detail_navigation_optional
      - none_configuration_mutation
    persistence_impact:
      read:
        - gyms
        - equipment_stations
        - load_profiles
        - exercises
        - exercise_variants
        - exercise_variant_equipment_compatibilities

summary:
  - UC-08 covers GET /api/workouts history-list retrieval for completed workouts.
  - UC-09 covers GET /api/workouts/{workoutId} history-detail retrieval with hero, completion stats, ordered set lines, and variant_id-based subtitle links.
  - UC-10 covers GET /api/workouts/progress progress-timeline retrieval with score availability and tone.
  - UC-11 covers variant-detail drill-down from Exercises and Workout Detail using existing variant_id payload fields, with optional conditional load of GET /api/workouts/exercises-performance before rendering detail.
  - UC-12 covers GET /api/gyms list retrieval for the renderer Gyms screen.
  - UC-13 covers GET /api/gyms/{gymId} Gym Detail retrieval for station and exercise suitability browsing.
  - UC-14 covers GET /api/gyms/{gymId}/stations/{stationId} Station Detail retrieval for load-profile and station-compatible variant browsing.
