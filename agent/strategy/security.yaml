version: 1
source_of_truth: security
formatting:
  indent_spaces: 2

scope:
  level: practical_application_security
  compliance_frameworks_required_by_default: false

runtime_topology:
  public:
    - external_reverse_proxy
  internal:
    - renderer
    - backend
    - postgresql
  privileged_local:
    - backend_maintenance_cli
    - init_access_key_one_shot_bootstrap

trust_boundaries:
  public_boundary:
    reachable_components:
      - external_reverse_proxy
    constraints:
      - assume_hostile_traffic
      - external_tls_termination_happens_before_renderer_in_production
      - external_reverse_proxy_owns_public_client_ip_rate_limiting_and_ban_policy
      - renderer_upstream_must_not_be_directly_published_to_untrusted_networks
      - no_internal_service_exposure_via_public_proxy_without_explicit_approval
      - no_additional_public_endpoints_without_explicit_approval

  private_service_boundary:
    allowed_paths:
      - external_reverse_proxy_to_renderer_loopback_or_private_upstream_only
      - renderer_to_backend_internal_network_only
      - backend_to_postgresql_internal_network_only
    constraints:
      - reverse_proxy_may_be_public_but_renderer_upstream_binding_is_private
      - backend_not_publicly_reachable
      - postgresql_not_publicly_reachable
      - no_browser_direct_access_to_backend_or_postgresql

  privileged_local_boundary:
    maintenance_execution:
      - backend_container_local_cli
      - docker_exec_style_local_execution
      - approved_init_access_key_postgres_client_exception
    constraints:
      - no_public_exposure
      - no_user_facing_api_exposure
      - no_convenience_http_maintenance_endpoints_without_explicit_approval

approved_exceptions:
  - id: one_shot_bootstrap_access_key_seed
    boundary: privileged_local_boundary
    applies_to:
      - maintenance_cli_local_only_inside_backend_container
      - privileged_maintenance_is_local_cli_only
    allowance: The production init-access-key service may connect directly to
      PostgreSQL as an internal one-shot bootstrap client to create the first
      admin access key when the users table is empty.
    constraints:
      - service_is_not_publicly_exposed
      - service_runs_on_internal_compose_network_only
      - no_general_purpose_database_maintenance_access
      - generated_access_key_written_only_to_bootstrap_handoff_volume
      - bootstrap_key_is_rotated_and_handoff_file_removed_after_first_sign_in

authentication_access_model:
  authentication_type: token_based
  token_storage: database
  required_access_paths:
    - workout_and_self_service_authenticated_access
    - privileged_local_maintenance_access
  constraints:
    - current_public_http_surface_contains_only_workout_and_self_service_endpoints
    - no_dedicated_public_administrative_api_exists_in_current_product_slice
    - keep_privileged_local_maintenance_separated
    - self_service_profile_actions_are_not_treated_as_administrative_access
    - if_a_dedicated_public_administrative_api_is_added_then_separate_its_access_path
    - no_implicit_privilege_escalation
    - external_reverse_proxy_owns_public_client_ip_rate_limiting_and_ban_policy
    - backend_does_not_store_source_ip_or_forwarded_client_address_throttle_keys
    - backend_does_not_parse_forwarded_client_address_headers_for_login_throttling

token_model:
  required_token_purposes:
    - workout_and_self_service_usage
  constraints:
    - if_a_dedicated_public_administrative_api_is_added_then_use_purpose_separated_tokens
    - preserve_future_token_to_user_mapping

secret_handling_rules:
  - never_commit_secrets_or_long_lived_tokens
  - do_not_log_tokens_or_sensitive_credentials_in_plain_text
  - prefer_runtime_secret_injection
  - do_not_expose_privileged_credentials_through_public_interfaces

service_exposure_rules:
  external_reverse_proxy: public
  renderer: private_upstream_only
  backend: internal_only
  postgresql: internal_only
  maintenance_cli: local_only_inside_backend_container
  init_access_key: local_internal_one_shot_bootstrap_only

security_invariants:
  - external_reverse_proxy_is_only_internet_facing_component
  - production_renderer_upstream_is_private_or_loopback_only
  - backend_is_internal_only
  - postgresql_is_internal_only
  - privileged_maintenance_is_local_cli_only
  - init_access_key_exception_is_one_shot_internal_only
  - workout_and_self_service_http_access_is_separated_from_privileged_local_maintenance
  - tokens_are_stored_in_database_not_hardcoded_in_repository

review_security_focus:
  - trust_boundary_violations
  - accidental_public_exposure_of_internal_services
  - insecure_token_or_secret_handling
  - access_path_mixing_between_public_http_and_privileged_local_maintenance
  - public_maintenance_endpoint_introduction
  - architecture_that_blocks_future_token_user_mapping
  - accidental_backend_trust_or_storage_of_forwarded_client_address_headers

out_of_scope_by_default:
  - formal_compliance_checklists
  - regulatory_certification_processes
  - exhaustive_penetration_testing_frameworks
  - advanced_multi_user_authorization_rules
  - app_level_public_client_ip_reputation_or_ban_logic
  - speculative_role_based_authorization_before_distinct_roles_exist
  - public_client_ip_rate_limiting_when_external_reverse_proxy_or_fail2ban_owns_that_control
