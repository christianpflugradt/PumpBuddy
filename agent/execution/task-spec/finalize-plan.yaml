version: 1
task: finalize-plan
source_of_truth: task_spec

intent:
  outcome: close_or_reopen_the_active_plan_after_stakeholder_decision

pre_conditions:
  - at_least_one_done_item_exists
  - no_open_or_review_items_exist
  - plan_file_exists_at_agent_execution_plan_yaml
  - execution_config_available

flow:
  - resolve_task_alias_to_finalize_plan
  - load_required_context_from_task_context_config
  - load_all_done_items_for_summary
  - ask_stakeholder_for_accept_or_return
  - emit_finalize_script_reference
  - emit_instruction_contract

post_conditions:
  - task_output_contains_finalize_script
  - task_output_contains_instruction
  - task_output_contains_done_item_context

finalize_behavior:
  config_path: agent/execution/execution-config.yaml
  dry_run:
    - no_file_writes
    - no_item_state_changes
    - no_git_add
    - no_git_commit
    - no_git_push
    - emit_would_do_messages
  non_dry_run:
    - for_accept_archive_current_plan_and_done_items
    - for_accept_archive_plan_item_files_flat
    - for_accept_create_next_plan_from_template
    - for_return_create_new_open_items_from_findings
    - update_workflow_state
    - validate_execution_items
    - stage_changes
    - commit_when_commit_enabled
    - push_when_push_enabled
    - trigger_release_workflow_when_accept_and_enabled

script_contract:
  dispatcher_script: agent/scripts/tasks.sh
  task_script: agent/scripts/task/finalize-plan/run.sh
  finalize_script: agent/scripts/task/finalize-plan/finalize.sh
  context_config: agent/execution/task-context/finalize-plan.yaml
