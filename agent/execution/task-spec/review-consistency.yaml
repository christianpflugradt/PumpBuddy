version: 1
task: review-consistency
source_of_truth: task_spec

intent:
  outcome: run_review-consistency_workspace_alignment_review

pre_conditions:
  - strategy_and_design_context_available

flow:
  - resolve_task_alias_to_review-consistency
  - load_required_context_from_task_context_config
  - inspect_workspace_against_strategy_and_design
  - produce_structured_findings

post_conditions:
  - task_output_declares_workspace_scope
  - task_output_contains_instruction
  - task_output_contains_findings_write_path

script_contract:
  dispatcher_script: agent/scripts/tasks.sh
  task_script: agent/scripts/task/review-consistency/run.sh
  finalize_script: agent/scripts/task/extended-review/finalize.sh
  context_config: agent/execution/task-context/review-consistency.yaml
