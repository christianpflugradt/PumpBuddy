version: 1
task: review-consistency
source_of_truth: task_spec

intent:
  outcome: run_review-consistency_workspace_alignment_review

pre_conditions:
  - strategy_and_design_context_available

flow:
  - resolve_task_alias_to_review-consistency
  - load_required_context_from_task_context_config
  - inspect_workspace_against_strategy_and_design
  - produce_structured_findings
  - set_plan_item_required_per_proposed_backlog_item_with_skip_reason_when_false
  - summarize_findings_for_stakeholder
  - ask_stakeholder_for_backlog_selection_mode

post_conditions:
  - findings_are_presented_before_status_block
  - stakeholder_is_prompted_for_mode_before_finalize
  - task_output_declares_workspace_scope
  - task_output_contains_instruction
  - task_output_contains_findings_write_path

finalize_behavior:
  config_path: agent/execution/execution-config.yaml
  dry_run:
    - no_file_writes
    - no_item_state_changes
    - no_git_add
    - no_git_commit
    - no_git_push
    - emit_would_do_messages
  non_dry_run:
    - validate_active_plan_guard
    - optionally_create_open_items_from_selected_findings
    - update_workflow_state_when_items_created
    - validate_execution_items
    - stage_changes
    - commit_when_commit_enabled
    - push_when_push_enabled

script_contract:
  dispatcher_script: agent/scripts/tasks.sh
  task_script: agent/scripts/task/review-consistency/run.sh
  finalize_script: agent/scripts/task/extended-review/finalize.sh
  context_config: agent/execution/task-context/review-consistency.yaml
