version: 1
task: review-item
source_of_truth: task_spec

intent:
  outcome: review_selected_item_and_transition_state_to_done_or_open

pre_conditions:
  - at_least_one_review_item_exists
  - matching_item_plan_exists_for_selected_item
  - execution_config_available

flow:
  - resolve_task_alias_to_review_item
  - select_next_review_item_deterministically
  - resolve_matching_item_plan_path
  - load_required_context_from_task_context_config
  - load_additional_context_from_item_inputs_and_plan_context
  - emit_finalize_script_reference
  - emit_instruction_contract

post_conditions:
  - task_output_contains_item_path
  - task_output_contains_finalize_script
  - task_output_contains_instruction

clarification_policy:
  required_when:
    - acceptance_criteria_are_not_testable_as_written
    - review_outcome_is_blocked_by_ambiguous_or_missing_expected_behavior
    - evidence_conflicts_with_item_acceptance_definition
  should_not_ask_when:
    - review_can_conclude_with_clear_accept_or_return_based_on_available_evidence
    - minor_uncertainty_does_not_change_outcome
  stakeholder_question_style:
    - ask_only_blocking_questions_with_why_risk_default_decision_structure
  overload_guidance:
    - if_review_basis_is_broadly_unclear_request_item_rewrite_for_testable_acceptance
  default_if_not_blocking: proceed_with_explicit_assumptions

finalize_behavior:
  config_path: agent/execution/execution-config.yaml
  dry_run:
    - no_file_writes
    - no_item_state_rename
    - no_git_add
    - no_git_commit
    - no_git_push
    - emit_would_do_messages
  non_dry_run:
    - validate_review_result_in_item
    - move_review_item_to_done_or_open
    - update_item_status_hint_to_target_state
    - stage_changes
    - commit_when_commit_enabled
    - push_when_push_enabled

script_contract:
  dispatcher_script: agent/scripts/tasks.sh
  task_script: agent/scripts/task/review-item/run.sh
  finalize_script: agent/scripts/task/review-item/finalize.sh
  context_config: agent/execution/task-context/review-item.yaml
