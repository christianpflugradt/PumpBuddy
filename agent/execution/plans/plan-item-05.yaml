version: 1
kind: item_plan

plan:
  item_id: "05"
  item_path: agent/execution/open-item-05.yaml
  title: Align Rust persistence and seed SQL with domain model, then sync persistence docs

summary:
  goal: Implement required Rust/SQL persistence alignment to the current domain model and then update persistence documentation to match implemented behavior, without renderer API changes.

context:
  required:
    - /Users/cpf/Workspace/personal/PumpBuddy/agent/design/domain-model.yaml
    - /Users/cpf/Workspace/personal/PumpBuddy/agent/design/persistence-model.yaml
    - /Users/cpf/Workspace/personal/PumpBuddy/backend/init.sql
    - /Users/cpf/Workspace/personal/PumpBuddy/backend/src/domain.rs
    - /Users/cpf/Workspace/personal/PumpBuddy/backend/src/persistence.rs
  optional:
    - /Users/cpf/Workspace/personal/PumpBuddy/backend/src
    - /Users/cpf/Workspace/personal/PumpBuddy/agent/design/glossary.yaml

implementation_approach:
  - Build a strict mismatch inventory with domain model as target behavior: `agent/design/domain-model.yaml` vs `backend/init.sql` vs `backend/src/persistence.rs`/`backend/src/domain.rs`.
  - Implement minimal Rust persistence and/or `init.sql` seed/schema changes required to close confirmed mismatches (including user ownership/session persistence aspects where relevant).
  - After implementation changes, update `agent/design/persistence-model.yaml` so docs describe the resulting executable persistence model exactly.
  - Keep scope focused: no renderer/API contract changes, no broad auth redesign, and no unrelated refactors.

risks_and_assumptions:
  - Similar table/field naming (`training_plan_exercise_options` vs `plan_exercise_options`) can cause accidental partial updates; apply one consistent mapping per boundary.
  - User/session persistence tables are security-sensitive; avoid behavior changes beyond required model alignment.
  - Seed/schema adjustments may affect integration tests; validate early before final doc sync.

validation_plan:
  - Run focused diffs with `rg` across `backend/init.sql`, `backend/src/domain.rs`, and `backend/src/persistence.rs` for ownership, foreign keys, table naming, and workout option references.
  - Execute `cargo test --manifest-path backend/Cargo.toml`.
  - Verify non-doc backend change presence with `test -n "$(git diff --name-only -- backend/init.sql backend/src/domain.rs backend/src/persistence.rs)"`.
  - Perform final consistency pass so `agent/design/persistence-model.yaml` matches implemented Rust/SQL behavior.

out_of_scope:
  - Broad schema redesign or auth feature expansion beyond confirmed alignment gaps.
  - Renderer API contract modifications or new renderer behaviors.
  - Non-essential refactors in unrelated backend modules.

handoff_notes:
  - Review should reject docs-only completion for this item.
  - Review should prioritize implemented Rust/SQL alignment to domain model, then persistence-doc fidelity to that implementation.
