version: 1
kind: item_plan
plan:
  item_id: '05'
  item_path: agent/execution/items/review-item-05.yaml
  title: Plan load profile detail read boundary
summary:
  goal: Add a contract-backed load-profile detail read endpoint that exposes persisted
    definition fields and backend-owned preview values for detail screens.
context:
  required:
  - agent/execution/items/open-item-05.yaml
  - agent/design/configurator-use-cases.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/api-contract.yaml
  optional:
  - backend/src/persistence/load_profiles.rs
  - backend/src/api/handlers/load_profiles.rs
  - backend/tests/persistence_integration/options_and_gyms.rs
implementation_approach:
- Extend agent/design/api-contract.yaml with an authenticated GET detail path for
  one load profile and a response schema that exposes status, weight unit, persisted
  fixed-list values or formula fields, station-count transparency, and preview loads.
- Regenerate backend and renderer OpenAPI artifacts through the repository flow so
  the new detail payload becomes the typed boundary for follow-up renderer work.
- Add backend repository, application-service, and handler support for fetching one
  user-scoped load profile by id without reconstructing editor prefill state from
  summaries.
- Reuse existing backend load-expansion logic to emit preview values capped by the
  authenticated user max-load preference, keeping detail preview semantics aligned
  with workout and station detail behavior.
- Add backend integration coverage for detail reads across fixed-list and formula
  profiles, user scoping, not-found behavior, and max-load-capped preview values.
risks_and_assumptions:
- 'Risk: if the detail response omits raw definition fields and exposes only derived
  summaries, draft edit prefilling will remain blocked.'
- Assume preview values should be backend-provided rather than recomputed in the renderer
  so configured max-load behavior stays identical across surfaces.
- 'Risk: mixing write concerns into this item would recreate the earlier dependency
  ambiguity; keep this slice read-only and detail-focused.'
validation_plan:
- make check-backend
out_of_scope:
- Full-screen renderer authoring UX for drafts.
- Rename, create, update, or delete write behavior already covered by other items.
- Generalized configurator CRUD beyond load-profile detail reads.
handoff_notes:
- This item must land before draft edit or historical detail renderer work because
  list summaries do not contain the stored definition payload needed for prefill.
- Keep the detail schema minimal but sufficient for both draft editor hydration and
  historical preview popup consumption.
