version: 1
kind: item_plan
plan:
  item_id: '03'
  item_path: agent/execution/items/open-item-03.yaml
  title: Add Backend Progress Metric Edge-Case Tests
summary:
  goal: Add deterministic backend tests that lock in strict-majority gating, baseline
    exclusion behavior, clamp bounds, and raw numeric outputs for workout progress
    computation.
context:
  required:
  - agent/execution/items/open-item-03.yaml
  - agent/execution/plan.yaml
  - agent/strategy/test-strategy.yaml
  optional:
  - agent/execution/plans/plan-item-02.yaml
  - agent/design/workout-use-cases.yaml
implementation_approach:
- Locate the backend test module that currently covers workout completion progress
  aggregation and extend it with explicit edge-case scenarios rather than broad snapshot-style
  assertions.
- Add strict-majority gate tests across representative even and odd exercise totals
  to verify >50% semantics remain intact (for example 2/4 fails, 3/4 passes, 2/3
  passes).
- Add tests that confirm exercises without historical baselines are excluded from
  ratio averaging while still contributing to total exercise count used by the sufficiency
  gate.
- Add clamp-boundary tests that verify ratios below 0.70 clamp to 0.70 and above
  1.20 clamp to 1.20 before aggregation, including an in-range control case.
- Assert backend outputs expose raw numeric progress values suitable for downstream
  rounding/display (no presentation formatting in backend assertions).
- Keep test assertions behavior-focused and deterministic so regressions are caught
  without coupling to internal implementation details.
risks_and_assumptions:
- Assumption: Item 02 aggregation behavior is available in the backend branch under
    test and can be exercised through existing domain/service entry points.
- Risk: Overly coupled test setup data can make threshold intent hard to read and
    weaken review confidence in strict-majority semantics.
- Risk: Floating-point assertions may become flaky unless comparisons use stable
    values or tolerance-aware checks where appropriate.
validation_plan:
- make check-backend
out_of_scope:
- Renderer/UI text, rounding presentation decisions, and plan completed screen formatting.
- Changes to aggregation algorithm, baseline lookup rules, or historical window semantics.
handoff_notes:
- Prefer table-driven test structure or clearly named individual cases so threshold
  expectations are obvious during review.
- Keep acceptance-criteria mapping visible in test naming/comments to simplify review
  against item scope.
