plan:
  item_id: '03'
  item_path: agent/execution/items/open-item-03.yaml
  title: Adaptive Middle Menu Ordering
summary:
  goal: Persist authenticated-user click counts for the side menu middle destinations
    and apply deterministic descending-count ordering on the next menu open without
    moving Workout or the utility group.
context:
  required:
