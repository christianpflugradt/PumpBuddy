version: 1
kind: item_plan
plan:
  item_id: '03'
  item_path: agent/execution/items/review-item-03.yaml
  title: Align OpenAPI variant naming and regenerate derived API models
summary:
  goal: Update canonical API contract terminology from plan exercise option naming
    to training plan exercise variant naming, then regenerate backend and renderer
    API artifacts.
context:
  required:
  - agent/execution/items/open-item-03.yaml
  - agent/design/api-contract.yaml
  - Makefile
  optional:
  - backend/src/models/mod.rs
  - renderer/dist/generated/openapi/typescript
implementation_approach:
- Audit `agent/design/api-contract.yaml` for remaining legacy identifiers such as
  `selected_plan_exercise_option_id` and `PlanExerciseOption`, then map each usage
  to the corresponding training-plan-exercise-variant terminology.
- Update schema names, field names, and internal contract references in the OpenAPI
  source so wire semantics remain equivalent while renamed terms become authoritative.
- Regenerate contract-derived backend and renderer API artifacts using the repository
  make target to keep generated clients/models in sync with the updated contract.
- Review regenerated outputs for consistency of renamed identifiers across backend
  and renderer boundaries, avoiding manual edits to generated files.
risks_and_assumptions:
- Assumes `agent/design/api-contract.yaml` is the single source of truth and generated
  artifacts should only change as a consequence of contract updates.
- 'Risk: incomplete contract rename can leave mixed terminology and produce partially
  updated generated types.'
- 'Risk: schema/component rename without all corresponding `$ref` updates can break
  generation or create invalid OpenAPI links.'
validation_plan:
- make refresh-api-clients
- make check-backend
- make check-renderer
out_of_scope:
- Non-contract backend business-logic changes outside generated model alignment.
- Settings UX or feature behavior changes unrelated to terminology updates.
handoff_notes:
- Treat generated outputs as derived artifacts; if unexpected churn appears, re-check
  contract references first before manual adjustments.
- Keep any intentionally retained legacy term explicitly documented in review notes
  if it cannot be removed in this item.
