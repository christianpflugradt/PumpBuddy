version: 1
kind: item_plan
plan:
  item_id: '01'
  item_path: agent/execution/items/open-item-01.yaml
  title: Retarget contract-alignment gates to the current renderer API boundary
summary:
  goal: Update the dedicated API contract-drift gate so its path filters and local
    enforcement logic follow the renderer's current contract-adapter modules instead
    of the pre-refactor file layout.
context:
  required:
  - agent/strategy/quality-gates.yaml
  - .github/workflows/ci-quality.yaml
  - agent/scripts/check/verify-api-contract-alignment.sh
  - renderer/src/openapi-contract.ts
  - renderer/src/workout-contract-state.ts
  - renderer/src/workout-contract.ts
  - renderer/src/workout-api.ts
  optional:
  - agent/strategy/engineering-guardrails.yaml
  - agent/design/api-contract.yaml
  - Makefile
implementation_approach:
- Identify the renderer files that currently define the OpenAPI parsing, contract-shape
  mapping, and fetch-boundary request or response surface, then use that concrete
  set as the dedicated `api_contract_alignment` boundary instead of the legacy `workout-types.ts`
  marker.
- Update `agent/strategy/quality-gates.yaml` so the documented gate points at the
  current renderer contract modules and stays aligned with the post-refactor boundary
  split.
- Update `.github/workflows/ci-quality.yaml` path filters so CI triggers the dedicated
  alignment job whenever those current renderer contract files change, while still
  preserving backend API and canonical contract coverage.
- Update `agent/scripts/check/verify-api-contract-alignment.sh` so its changed-file
  detection matches the same renderer boundary markers as the strategy and CI workflow,
  keeping review-item deterministic checks aligned with the documented gate.
- Keep the gate intentionally narrow to contract-adapter and API-facing renderer modules
  rather than broadening it to unrelated UI or app-state files, because `renderer_code`
  already covers the full renderer tree.
risks_and_assumptions:
- The recommended default is to treat `renderer/src/openapi-contract.ts` as the primary
  generated-contract adapter boundary, with `renderer/src/workout-contract-state.ts`,
  `renderer/src/workout-contract.ts`, and `renderer/src/workout-api.ts` included only
  where they still materially affect wire-contract drift.
- This item should remain tooling-only; if implementation uncovers a renderer file
  that looks contract-adjacent but only carries UI-local state, prefer leaving it
  out of the dedicated drift gate and relying on the broader renderer quality gate
  instead.
- The main failure mode is mismatch across the three gate definitions, so the implementation
  should update strategy, CI, and local script logic together rather than fixing only
  one surface.
validation_plan:
- make check
out_of_scope:
- changing endpoint payload semantics or the canonical OpenAPI contract
- redesigning renderer workflow or app-state modules outside the gate-targeting work
- broadening the dedicated gate to all renderer files
handoff_notes:
- Review should confirm that `agent/strategy/quality-gates.yaml`, `.github/workflows/ci-quality.yaml`,
  and `agent/scripts/check/verify-api-contract-alignment.sh` all reference the same
  current renderer contract boundary files.
- Review should also verify that the dedicated contract-alignment gate now follows
  the post-refactor adapter boundary without regressing into a catch-all renderer
  gate that duplicates `make check-renderer`.
