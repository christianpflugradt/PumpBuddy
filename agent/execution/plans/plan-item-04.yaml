version: 1
kind: item_plan
plan:
  item_id: '04'
  item_path: agent/execution/items/open-item-04.yaml
  title: Build Configurator Gym editor
summary:
  goal: Deliver a compact Configurator Gym create and rename editor with Draft-only
    deletion and backend-authoritative lifecycle enforcement.
context:
  required:
  - agent/execution/plan.yaml
  - agent/execution/items/open-item-04.yaml
  - agent/design/domain-context.md
  - renderer/src/pb-configurator-load-profile-editor-screen.ts
  - renderer/src/pb-configurator-load-profiles-screen.ts
  - renderer/src/pb-app-root.ts
  - renderer/src/workout-contract.ts
  - renderer/src/workout-api.ts
  - renderer/src/workout-controller.ts
  - renderer/src/workout-controller-navigation.ts
  optional:
  - renderer/src/pb-configurator-load-profile-editor-screen.test.ts
  - renderer/src/styles.scss
  - renderer/src/openapi-contract.ts
  - renderer/src/workout-controller-screen-data.ts
implementation_approach:
- Add Gym create, name-only update, and lifecycle-aware detail types plus generated-model
  parsing and serialization adapters; use POST, PATCH, and DELETE through the existing
  same-origin authenticated API client conventions.
- Complete the Configurator Gym destination state from item 03 with existing-Gym detail
  loading and separate editor state, preserving stale-request protection and returning
  a not-found or API failure as an actionable screen error.
- Build a dedicated compact Gym editor component with static `Gym` detail title, one
  accessible Name input, back navigation, and create versus edit modes; do not render
  the Gym name as an additional page heading.
- In create mode, validate a trimmed non-blank name and normalized duplicate against
  the loaded Configurator Gym list, then issue the create request and present the
  resulting `new` record as Draft through existing status mapping.
- In edit mode, fetch the selected Gym detail, retain status only as display state,
  permit a name-only save for Draft, Active, and Inactive records, and disable redundant
  saves while an asynchronous request is pending.
- Before an Active or Inactive rename leaves the editor, show the established consequential
  historical-meaning warning with confirm and continue-editing actions; require confirmation
  only when the normalized name has changed.
- Render `Delete Draft` only for a persisted Draft Gym, send deletion through the
  API client, remove the row from Configurator Gym list state after success, and return
  to that list; surface server 400, 404, and 409 responses without treating client
  visibility as authorization.
- On successful create or rename, update the local Configurator Gym list deterministically,
  return to the list, and refresh it from the server; retain editor input and show
  a request error when a write fails.
- Reuse Load Profile editor accessibility, focus preservation, error presentation,
  confirmation dialog, and design-token conventions while adding no permanent lifecycle
  explanation, status control, Station content, or extra Gym field.
- Add focused renderer component and controller tests for live name feedback, trimmed
  request payloads, Draft creation, all-status rename behavior, historical rename
  confirmation, Draft-only delete affordance and request, backend error display, list
  refresh, and return navigation.
risks_and_assumptions:
- 'Assumption: items 01 through 03 provide lifecycle-aware Gym API responses and Configurator-local
  list and destination state before this item is implemented.'
- 'Risk: client duplicate checks can become stale or race concurrent writes; use them
  only for immediate feedback and always surface the backend conflict response.'
- 'Risk: Gym detail responses contain transparency data that is out of scope; fetch
  only to establish the selected Gym and lifecycle state, and do not render Stations
  or historical metadata.'
- 'Risk: future lifecycle changes could be introduced through UI state; use status
  solely to select display, warning, and Draft-delete affordance, never as an editable
  request field.'
validation_plan:
- make check-renderer
out_of_scope:
- Status selectors, activation, deactivation, reactivation, bulk actions, or any lifecycle-transition
  control.
- Equipment Station management, Gym transparency data, workout data, addresses, descriptions,
  counts, or additional Gym properties.
- Database, backend authorization, API contract, or public-topology changes.
handoff_notes:
- Use Draft in every user-facing label, including `Delete Draft`; `new` remains a
  transport and persisted value.
- The backend remains the authority for duplicate names, ownership, and Draft-only
  deletion; the editor only improves feedback and flow.
