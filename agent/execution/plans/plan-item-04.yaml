version: 1
kind: item_plan
plan:
  item_id: '04'
  item_path: agent/execution/items/done-item-04.yaml
  title: Render blocked-start exercise and gym context feedback
summary:
  goal: Ensure blocked workout starts are prevented and clearly explain missing exercise
    availability for the selected gym.
context:
  required:
  - renderer/src/workout-state.ts
  - renderer/src/pb-start-screen.ts
  - renderer/src/pb-app-root.ts
  - agent/design/workout-use-cases.yaml
  optional:
  - agent/design/api-contract.yaml
implementation_approach:
- Extend workout start state shaping in `renderer/src/workout-state.ts` to carry deterministic
  blocked-start details per missing exercise and selected gym context.
- Update `renderer/src/pb-start-screen.ts` blocked-start rendering so launch actions
  remain disabled and users see stable per-exercise messaging with selected gym context.
- Update `renderer/src/pb-app-root.ts` wiring only as needed so blocked-start payload
  fields reach start-screen rendering without changing non-blocked start behavior.
risks_and_assumptions:
- Assume backend blocked-start payload already includes enough data to render exercise-specific
  gaps and selected gym context.
- Risk: message ordering may fluctuate if source lists are unsorted; normalize ordering
    in renderer state to keep output deterministic.
validation_plan:
- make check-renderer
out_of_scope:
- Backend validation or API contract changes.
- Start-screen shell/layout redesign beyond blocked-start messaging updates.
handoff_notes:
- Review should focus on blocked-start clarity, selected-gym context presence, and
  regression checks for non-blocked start flow.
