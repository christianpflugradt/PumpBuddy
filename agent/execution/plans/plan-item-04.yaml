version: 1
kind: item_plan
plan:
  item_id: '04'
  item_path: agent/execution/items/open-item-04.yaml
  title: Implement exercises route and grouped renderer list
summary:
  goal: Add the Exercises navigation route and screen that renders backend-grouped
    variant performance rows with strict client-side variant-name filtering behavior.
context:
  required:
  - agent/execution/items/open-item-04.yaml
  - agent/execution/plan.yaml
  - agent/design/api-contract.yaml
  optional:
  - agent/design/workout-capabilities.yaml
implementation_approach:
- Identify the renderer navigation/menu definition and insert Exercises between Progress
  and History, then wire it to a new Exercises screen route that reuses existing page
  chrome patterns (banner plus headline treatment) from adjacent workout screens.
- Create the Exercises screen container that requests the exercises-performance endpoint
  data and keeps backend-provided grouping/tone semantics intact rather than deriving
  renderer-owned business logic.
- Add a filter input directly under the headline that performs case-insensitive substring
  matching on variant name only against the in-memory dataset, with explicit clear action
  that restores the full unfiltered dataset.
- Render grouped sections and rows from payload order/structure, including per-row details
  for variant label, formatted first-set summary, session count, days-since-last, and a
  right-side chevron affordance with no click behavior enabled.
- Add renderer tests that cover nav order and route mount, filter match and clear semantics,
  and grouped row/detail rendering to prevent regressions in this slice.
risks_and_assumptions:
- Assumption: backend endpoint and payload contract from prior items are available to
    the renderer in this branch or can be mocked in tests with the canonical schema shape.
- Risk: re-sorting or re-grouping data in the screen could drift from backend-owned semantics;
    mitigate by rendering payload groups directly and limiting client transforms to variant-name
    filter predicates.
- Risk: filter clear behavior can accidentally preserve stale filtered state; mitigate with
    explicit source-of-truth state for original payload and dedicated clear-action tests.
validation_plan:
- make check-renderer
out_of_scope:
- Server-side text filtering/search behavior.
- Backend performance tone computation or station-selection logic changes.
- Variant detail navigation activation behind row chevrons.
handoff_notes:
- Keep renderer formatting helpers focused on presentation (for first-set summary and days labels)
  and avoid embedding business classification rules.
- During review, confirm menu placement is exactly between Progress and History in both
  desktop and responsive navigation variants.
