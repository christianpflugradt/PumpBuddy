refinement_note: |
  Refinement should derive execution items that sequence schema+seed migration, backend domain/persistence updates, API contract/model propagation, renderer control/timer UX implementation, and cross-layer test coverage.
  Include at least one focused item dedicated to updating and validating design docs (`domain-model`, `persistence-model`, `workout-use-cases`) so execution and review can validate architecture intent explicitly.
  Ensure items isolate high-risk compatibility edges:
  1) variant-derived repetition kind propagation,
  2) timer interaction lockouts and resume safety,
  3) unilateral/stationless/per-side combination behavior.
  If refinement finds this exceeds one focused workday, split by boundary (e.g., backend contract slice vs renderer timer UX slice) rather than inflating one plan cycle.
