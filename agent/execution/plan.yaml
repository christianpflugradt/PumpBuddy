refinement_note: |
  Refinement should derive roughly five to seven focused execution items from this plan.
  Treat manual schema migration/backfill as an external prerequisite, not an implementation item. Preserve the existing raw, Gym/user-scoped Station-name uniqueness semantics while service-layer validation trims input. If a proposed implementation would change an existing workout-facing Station contract, refinement must report the gap instead of changing this file.
