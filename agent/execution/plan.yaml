refinement_note: |
  Refinement should derive about 4-8 execution items that cover contract/backend projection alignment, renderer data integration, the three-screen navigation flow, visual implementation, and focused verification.
  Before implementation, confirm the current API behavior: existing training-plan detail/options endpoints may need to be extended so no-gym mode can list all configured variants and selected-gym mode can include unavailable variants plus compatible station rows.
  Current context suggests GET /api/training-plans/{trainingPlanId}/options is start-workout-oriented: it requires gymId and filters out station-required variants without compatible stations. That shape must not be treated as sufficient for the browsing screens unless implementation has already changed.
  Keep the implementation faithful to the supplied plan text if it conflicts with generated reference-image extras; the forbidden legends and helper/info boxes must remain omitted.
  If the required data is already available in code despite the design-contract snapshot, refinement should prefer the existing authoritative implementation and avoid unnecessary API changes.
