version: 1
kind: backlog_item
item:
  id: pb-019-item-05
  title: Align Rust persistence and seed data with the current domain model
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Backend Rust persistence code and seeded database state are aligned to
    the current domain model and then mirrored in persistence documentation without
    API contract changes.
  rationale: The current plan drifted toward docs-only updates; this item must treat
    executable backend behavior and seed SQL as mandatory deliverables.
scope:
  in:
  - Update backend persistence code and seed SQL to match the current domain model
    decisions where mismatches exist.
  - Reflect resulting implemented behavior in `agent/design/persistence-model.yaml`.
  - Include user ownership/session-related persistence aspects in design docs when
    present in implementation scope.
  out:
  - Broad auth redesign beyond persistence alignment for this item.
  - Renderer API contract changes.
constraints:
- Prefer targeted updates that remain completable in one focused workday.
- Keep renderer API behavior stable for existing consumers.
- Do not resolve this item with documentation-only changes.
inputs:
  required:
  - /Users/cpf/Workspace/personal/PumpBuddy/agent/design/domain-model.yaml
  - /Users/cpf/Workspace/personal/PumpBuddy/agent/design/persistence-model.yaml
  - /Users/cpf/Workspace/personal/PumpBuddy/backend/init.sql
  - /Users/cpf/Workspace/personal/PumpBuddy/backend/src/domain.rs
  - /Users/cpf/Workspace/personal/PumpBuddy/backend/src/persistence/mod.rs
  optional:
  - /Users/cpf/Workspace/personal/PumpBuddy/agent/design/glossary.yaml
acceptance_criteria:
- id: ac-01
  statement: Rust persistence behavior and seed SQL are updated to match current domain-model
    expectations, and persistence documentation is consistent with that implemented
    state.
  verification:
    type: command
    command: cargo test --manifest-path backend/Cargo.toml
    expected: Backend test suite passes after persistence alignment changes.
- id: ac-02
  statement: The change set includes backend implementation and SQL changes (not docs-only)
    that resolve confirmed model mismatches.
  verification:
    type: command
    command: test -n \"$(git diff --name-only -- backend/init.sql backend/src/persistence
      backend/src/domain.rs)\"
    expected: Backend SQL and/or Rust persistence files are changed in the item diff.
- id: ac-03
  statement: Persistence schema introduces explicit plan versioning with a dedicated
    `training_plan_versions` table linked to `training_plans`.
  verification:
    type: command
    command: rg -n \"CREATE TABLE IF NOT EXISTS training_plan_versions|training_plan_id
      UUID NOT NULL REFERENCES training_plans\\(id\\)|version_number\" backend/init.sql
      -S
    expected: init.sql defines training_plan_versions with plan FK and version number.
- id: ac-04
  statement: Workouts bind to a concrete plan version (not only plan root) in schema
    and Rust persistence queries.
  verification:
    type: command
    command: rg -n \"training_plan_version_id|training_plan_versions\" backend/init.sql
      backend/src/persistence -S
    expected: SQL and persistence queries use training_plan_version_id for workout
      binding.
- id: ac-04b
  statement: Training plan exercises bind to plan versions (not only plan root) in
    schema and persistence reads.
  verification:
    type: command
    command: rg -n \"training_plan_exercises.*training_plan_version_id|WHERE tpe\\.training_plan_version_id|JOIN
      training_plan_versions\" backend/init.sql backend/src/persistence -S
    expected: training_plan_exercises and dependent reads are version-scoped.
- id: ac-05
  statement: Plan exercise options support deterministic ordering per exercise+gym
    via explicit order field.
  verification:
    type: command
    command: rg -n \"selection_order\" backend/init.sql backend/src/persistence -S
    expected: selection_order exists in schema and is used in option reads/order-by.
- id: ac-05b
  statement: Plan exercise option ordering is constrained to be unique per (training_plan_exercise_id,
    gym_id, selection_order).
  verification:
    type: command
    command: rg -n \"UNIQUE .*training_plan_exercise_id.*gym_id.*selection_order|CONSTRAINT
      .*selection_order\" backend/init.sql -S
    expected: Schema enforces stable non-ambiguous option order per exercise and gym.
- id: ac-06
  statement: User scoping remains enforced on persisted application data and queries
    after versioning/order changes.
  verification:
    type: command
    command: rg -n \"user_id|WHERE .*user_id\" backend/init.sql backend/src/persistence
      -S
    expected: user ownership columns and user-filtered persistence queries remain
      present.
- id: ac-06b
  statement: User ownership is present for user-scoped plan/workout tables after versioning
    refactor.
  verification:
    type: command
    command: rg -n \"CREATE TABLE IF NOT EXISTS (training_plans|training_plan_versions|training_plan_exercises|plan_exercise_options|workouts|workout_exercises|workout_sets)|user_id
      UUID\" backend/init.sql -S
    expected: Each user-scoped plan/workout table includes user_id ownership.
- id: ac-07
  statement: Session persistence mechanism remains intact (secrets, sessions, expiry
    and touch behavior) after schema alignment.
  verification:
    type: command
    command: rg -n \"user_secrets|sessions|session_token_hash|idle_expires_at|absolute_expires_at|touch_session\"
      backend/init.sql backend/src -S
    expected: Auth/session persistence structures and touch flow remain available.
- id: ac-08
  statement: Persistence design documentation is updated to reflect implemented versioning,
    ordered options, and user/session tables.
  verification:
    type: command
    command: rg -n \"training_plan_versions|training_plan_version_id|selection_order|users|user_secrets|sessions\"
      agent/design/persistence-model.yaml -S
    expected: persistence-model.yaml contains all implemented alignment constructs.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - domain-model
  - rust-persistence-implementation
  - backend-seed-data
  - persistence-design-model
handoff:
  review_focus:
  - Correctness of persistence assumptions across docs, SQL seeds, and backend code.
  - Confirmation that API-facing behavior remains unchanged.
