  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - quality_gate_tooling
  - renderer_contract_boundary
  - github_actions
handoff:
  review_focus:
  - verify the retargeted gate covers the real renderer API boundary after the recent
    refactor
  - verify CI and review-item deterministic alignment checks use the same boundary
    markers
