version: 1
kind: backlog_item
item:
  id: pb-025-item-01
  title: Consolidate variant-station schema and seed source of truth
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: backend/init.sql models station compatibility only in exercise_variant_equipment_compatibilities
    while introducing explicit stationless variant semantics.
  rationale: The plan requires removing duplicated variant-station modeling and making
    seeds/schema consistent with the new compatibility contract.
scope:
  in:
  - Update exercise_variants schema and seeds with an explicit flag for stationless-capable
    variants.
  - Remove direct station linkage from plan_exercise_options schema, constraints,
    and seed inserts.
  - Adjust workout_sets nullability/check constraints so stationless variants can
    persist null load values.
  out:
  - Backend Rust query and validation refactors.
  - Renderer behavior changes.
constraints:
- Keep seeded station-based flows valid and backward-compatible where possible.
inputs:
  required:
  - backend/init.sql
  - agent/design/persistence-model.yaml
  optional:
  - agent/design/domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: init.sql no longer encodes variant-station compatibility in plan_exercise_options
    and includes stationless-capable variant modeling plus nullable workout-set load
    fields.
  verification:
    type: command
    command: rg -n "CREATE TABLE IF NOT EXISTS plan_exercise_options|CREATE TABLE
      IF NOT EXISTS exercise_variant_equipment_compatibilities|requires_station|load_display_value|load_canonical_kg"
      backend/init.sql
    expected: Output confirms compatibility table and stationless/load-null semantics
      are represented without plan option station linkage.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend/schema
  - backend/seeds
handoff:
  review_focus:
  - Verify no remaining plan_exercise_options.equipment_station_id dependency in schema
    and seed structure.
  - Verify workout set constraints allow null load while still rejecting negative
    values when present.
review_feedback:
- at: '2026-03-27T09:45:37Z'
  source: review_result
  notes: "findings:\n- criterion: Keep seeded station-based flows valid and backward-compatible\
    \ where possible.\n  evidence: Finalize quality gate failed with 8 backend tests\
    \ because runtime queries\n    still reference removed column `peo.equipment_station_id`\
    \ (PostgreSQL error code\n    42703), including `active_workout_selection_consistency_*`\
    \ and `validate_active_workout_start_accepts_seeded_gym_with_stationless_options`.\n\
    \  risk: Schema and runtime persistence layer are out of contract, causing workout\n\
    \    option validation/start flows to fail in configured gym scenarios.\n"
- at: '2026-03-27T10:00:59Z'
  source: review_result
  notes: "findings:\n- criterion: Deterministic quality gate must pass before review\
    \ acceptance.\n  evidence: '`agent/scripts/task/review-item/finalize.sh 01 accept`\
    \ failed during\n    `agent/scripts/run-quality.sh backend` with a formatting\
    \ diff in `backend/src/application/workouts.rs`\n    around line 189.'\n  risk:\
    \ Item cannot be accepted because the backend quality gate is failing, which\n\
    \    blocks reliable integration even though SQL acceptance checks pass.\n"
- at: '2026-03-27T10:11:33Z'
  source: review_result
  notes: "findings:\n- criterion: Deterministic quality gate must pass before review\
    \ acceptance.\n  evidence: '`agent/scripts/task/review-item/finalize.sh 01 accept`\
    \ failed in `agent/scripts/run-quality.sh\n    backend` with integration test\
    \ failures: `option_read_path_respects_gym_filter_for_seeded_plan`\n    (expected\
    \ 2 options, got 3) and `seeded_variant_option_parity_and_ordering` (duplicate\n\
    \    variant IDs in seeded option sets).'\n  risk: The init.sql changes regress\
    \ seeded option parity/filtering behavior, so configured-gym\n    option reads\
    \ can return duplicate/incorrect options and break downstream workout\n    flows.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: Acceptance criterion ac-01 is satisfied; `backend/init.sql` models
      variant-station compatibility via `exercise_variant_equipment_compatibilities`,
      includes explicit `exercise_variants.requires_station`, removes plan-option
      station linkage, and allows nullable workout-set loads with non-negative checks
      when present.
    evidence: '`rg -n "CREATE TABLE IF NOT EXISTS plan_exercise_options|CREATE TABLE
      IF NOT EXISTS exercise_variant_equipment_compatibilities|requires_station|load_display_value|load_canonical_kg"
      backend/init.sql` confirms the expected schema/seed semantics with no plan_exercise_options
      station column.'
    runtime_build_check: '`agent/scripts/check/run-quality-gate.sh agent/execution/items/review-item-01.yaml`
      passed with `QUALITY_GATE_RESULT=passed` (backend unit, integration, and persistence
      suites all green).'
    residual_risk: Remaining risk is limited to downstream refactors outside this
      item scope (Rust query/validation and renderer behavior), not to the accepted
      init.sql contract changes.
