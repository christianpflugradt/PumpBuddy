version: 1
kind: backlog_item
item:
  id: pb-053-item-01
  title: Add renderer hydration session state model
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Introduce renderer-owned hydration session state that can track workout-wide
    sip totals without changing backend or generated API models.
  rationale: The workout flow needs a stable state foundation before UI, resume, and
    completion behavior can consume hydration data consistently.
scope:
  in:
  - Define workout-session hydration state shape and update pathways inside existing
    renderer workout state/controller modules.
  - Keep sip tracking session-scoped and decoupled from backend persistence or API
    contract changes.
  - Expose derived workout-wide sip totals needed by exercise and completion screens.
  out:
  - Exercise-screen hydration controls.
  - Resume restoration and cleanup behavior for local hydration state.
  - Completion-screen hydration presentation and feedback copy.
constraints:
- Implementation must remain renderer-only and must not modify generated API artifacts.
- Hydration is represented as sip count only, not liquid volume.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  - renderer/src/workout-state.ts
  - renderer/src/workout-controller.ts
  optional:
  - renderer/src/workout-types.ts
  - renderer/src/workout-controller-screen-data.ts
acceptance_criteria:
- id: ac-01
  statement: Renderer workout state exposes a hydration session model that can accumulate
    repeated sip events and report a workout-level sip total without relying on backend
    payload changes.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with focused coverage proving sip-count state updates
      and derived totals.
- id: ac-02
  statement: Touched state/controller paths keep hydration logic within existing renderer
    workout boundaries instead of introducing entrypoint-heavy or backend-coupled
    flow.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass after hydration state wiring in existing workout
      modules.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - renderer-workout-state
  - renderer-workout-controller
handoff:
  review_focus:
  - Hydration state stays session-scoped and renderer-owned.
  - Derived sip totals are available without leaking presentation concerns into core
    state.
review_feedback:
- at: '2026-04-28T10:43:01Z'
  source: review_result
  notes: "findings:\n- criterion: ac-02\n  evidence: The implementation changes renderer\
    \ API-surface types by adding HydrationSessionState\n    and wiring it through\
    \ AppState/screen state contracts in renderer/src/workout-types.ts:25-28\n   \
    \ and renderer/src/workout-types.ts:513, but agent/design/api-contract.yaml was\n\
    \    not updated. The deterministic finalize gate agent/scripts/check/verify-api-contract-alignment.sh\n\
    \    treats renderer/src/workout-types.ts as contract-bearing API surface and\
    \ failed\n    with exit 41 for source commit e1050408.\n  risk: Without the required\
    \ contract-alignment update, the item cannot pass the repository\n    quality\
    \ gate, so the review cannot conclude with acceptance even though the runtime\n\
    \    state logic itself looks coherent.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 and ac-02 are satisfied: hydration state is renderer-owned,
      session-scoped, and exposed through existing workout app state/controller boundaries
      without backend payload changes.'
    evidence: HydrationSessionState is defined on renderer AppState in renderer/src/workout-types.ts,
      created and updated via createHydrationSessionState/recordHydrationSip in renderer/src/workout-state.ts,
      reset on workout lifecycle boundaries in renderer/src/workout-controller.ts
      and renderer/src/workflow-orchestrator.ts, and covered by the focused sip-accumulation
      test in renderer/src/workout-state.test.ts. agent/design/api-contract.yaml now
      includes the renderer contract-alignment note required by the deterministic
      gate.
    runtime_build_check: Not run manually during review; the repository review finalize
      flow executes the deterministic quality gate for the implementation source commit.
    residual_risk: Hydration state is intentionally in-memory only for this item,
      so resume restoration and completion UX remain deferred to later scoped work.
  findings: []
