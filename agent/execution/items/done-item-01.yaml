version: 1
kind: backlog_item
item:
  id: pb-033-item-01
  title: Deterministic Reps Suggestion Rule Order
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Implement deterministic ordered suggestion rules for reps/time behavior
    and historical/current-workout/default fallbacks.
  rationale: The plan requires a predictable server-side decision flow that can be
    implemented and reviewed without ambiguity.
scope:
  in:
  - Define ordered rule evaluation for progression gate, SECS behavior, REPS history
    matching, first-set fallback, workout-copy fallback, and defaults.
  - Ensure suggestion logic keeps set indexing semantics explicitly 1-based.
  - Keep load suggestion eligibility for SECS while omitting repetition-time suggestions.
  out:
  - Station load normalization details.
  - Progression heuristic implementation beyond current gating contract.
constraints:
- Preserve existing domain invariants for repetition kind, set side sequencing, and
  newest-first historical preference.
- Keep suggestion business logic on the backend.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/domain-model.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/workout-use-cases.yaml
  optional:
  - agent/design/glossary.yaml
acceptance_criteria:
- id: ac-01
  statement: Backend suggestion flow evaluates rules in deterministic order and preserves
    1-based set index behavior.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality checks pass with deterministic suggestion logic behavior
      covered by tests.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend_suggestion_logic
handoff:
  review_focus:
  - Rule order determinism and fallback precedence.
  - Correct SECS handling vs REPS handling.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'AC-01 satisfied: backend suggestion logic applies deterministic
      precedence and preserves explicit 1-based set-index behavior across unilateral
      and bilateral flows.'
    evidence: Implementation commit `b6d3c6f` enforces SECS repetition suppression
      while preserving load suggestions in backend suggestion construction (`backend/src/persistence/active_workouts.rs`,
      `backend/src/persistence/suggestions.rs`) and updates API/persistence assertions
      to require null repetition values for SECS (`backend/tests/api_workouts.rs`,
      `backend/tests/persistence_integration.rs`). Deterministic rule ordering and
      fallback precedence are encoded in `evaluate_historical_suggestion_rules` with
      explicit Rule 1-6 sequencing plus current-workout and side-aware fallback handling,
      and exercised by focused integration tests including `suggestions_rule_1_exact_index_match_takes_precedence_over_last_current`,
      `suggestions_rules_2_to_6_use_last_current_when_idx_is_two_or_more`, `suggestions_rule_order_prefers_same_gym_variant_before_other_gym_variant`,
      and unilateral RIGHT/LEFT sequencing scenarios.
    runtime_build_check: Pending finalize quality gate execution via `agent/scripts/task/review-item/finalize.sh
      01 accept` (review policy delegates deterministic validation to finalize).
    residual_risk: 'Low: precedence and set-index/side semantics are covered with
      integration scenarios, with remaining risk mainly in future refactors that could
      alter branching order without updating the scenario matrix.'
