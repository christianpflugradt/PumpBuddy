intent:
  outcome: Automated backend tests protect progress metric behavior across threshold
    and baseline edge cases.
  rationale: The metric includes multiple branch conditions that need regression protection
    before integration to UI.
scope:
  in:
  - Add backend tests covering missing baselines, strict-majority threshold examples,
    and clamp lower/upper bounds.
  - Verify rounding-ready raw numeric values are produced for downstream presentation.
  out:
