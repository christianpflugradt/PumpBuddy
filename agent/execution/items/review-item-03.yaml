version: 1
kind: backlog_item
item:
  id: pb-024-item-03
  title: Refactor station profile load retrieval for suggestion and validation flows
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Update station profile load retrieval used by suggestion and workout validation
    flows to source loads from load_profiles.definition-derived kg values.
  rationale: All backend load stepping and snapping logic must consume the same definition-derived
    load sequences.
scope:
  in:
  - Replace load_steps-based station profile load query path in suggestions persistence.
  - Keep stepping/snap/suggestion behavior operating on finite kg vectors.
  - Verify configured-gym validation uses the refactored station load retrieval path.
  out:
  - Changing progression heuristics (baseline/default ratios).
  - Frontend workflow or API payload adjustments.
constraints:
- Maintain current step/snap boundary behavior for valid profile vectors.
- Ensure missing or invalid profile definitions surface clear validation/persistence
  errors.
inputs:
  required:
  - agent/execution/plan.yaml
  - backend/src/persistence/suggestions.rs
  - backend/src/application/workouts.rs
  optional:
  - backend/src/persistence/mod.rs
acceptance_criteria:
- id: ac-01
  statement: Suggestion and active-workout validation tests continue to pass when
    station profile loads are definition-derived.
  verification:
    type: command
    command: cargo test --manifest-path backend/Cargo.toml validate_active_workout
    expected: Command exits 0 and targeted tests confirm snapping/validation correctness
      with definition-based loads.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend/src/persistence/suggestions.rs
  - backend/src/application/workouts.rs
handoff:
  review_focus:
  - Shared load materialization usage consistency across suggestion and validation.
  - Regression risk in configured-gym load matching checks.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 satisfied. Suggestion load retrieval and configured-gym validation both consume definition-derived kilogram vectors via shared station profile load materialization.
    evidence: '`cargo test --manifest-path backend/Cargo.toml validate_active_workout` exits 0. Suggestion stepping/snap/start-load unit coverage also passes with `cargo test --manifest-path backend/Cargo.toml suggestions` for `persistence::suggestions::tests` (5 passed). Code review confirms `fetch_station_profile_loads` now reads `load_profiles.definition` plus `weight_unit` and uses `DomainRepository::load_profile_definition_to_kg`, and validation path in `validate_configured_gym_profile_loads` uses that same repository method.'
    runtime_build_check: Item-level verification commands completed successfully on 2026-03-26 for targeted active-workout validation and suggestion module behavior.
    residual_risk: Low to medium. A broader persistence integration test (`active_workout_response_includes_completed_set_history_and_backend_suggestions`) still fails in this branch due a separate `training_plan_version_id` fixture/schema issue, but it is outside this item’s acceptance command and changed boundaries.
