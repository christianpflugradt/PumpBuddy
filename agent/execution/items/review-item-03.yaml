version: 1
kind: backlog_item
item:
  id: pb-023-item-03
  title: Persist and expose selected station identity through active-workout lifecycle
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Ensure selected station identity is persisted and returned consistently
    for workout exercises across active-workout create, update, resume, and complete
    flows.
  rationale: Station identity is required for configured-gym consistency, resumability,
    and downstream load-profile-based set behavior.
scope:
  in:
  - enforce selected station persistence in active-workout lifecycle repositories/services
  - align API/domain mapping for selected station identifiers and names where required
  - add integration and contract-focused tests for station identity continuity
  out:
  - changing station recommendation logic
  - non-workout endpoints unrelated to active-workout flows
constraints:
- keep transport/business/persistence separation intact
- avoid manual edits to generated artifacts; regenerate from canonical contract when
  needed
- preserve backward-safe handling for existing nullable selection fields
inputs:
  required:
  - backend/src
  - backend/tests
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/api-contract.yaml
  - agent/execution/plan.yaml
  optional:
  - renderer/src
acceptance_criteria:
- id: ac-01
  statement: Selected station identity remains stable and visible in active-workout
    payloads after create/update/resume/complete transitions.
  verification:
    type: command
    command: cargo test --manifest-path backend/Cargo.toml
    expected: Backend tests pass and assert selected station fields across lifecycle
      transitions.
- id: ac-02
  statement: API contract and backend payload mapping for selected station fields
    are aligned and reproducible.
  verification:
    type: command
    command: rg -n "selected_station_id|selected_station_name" agent/design/api-contract.yaml
      backend/src
    expected: Contract and implementation both include station identity fields with
      consistent naming.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend
  - api
  - database
handoff:
  review_focus:
  - lifecycle consistency of selected station fields
  - API/domain alignment for station identity
  - regressions in resume and completion flows
