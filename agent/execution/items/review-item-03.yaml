version: 1
kind: backlog_item
item:
  id: pb-025-item-03
  title: Allow stationless configured-gym workout progression with null set loads
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Backend workout validation and persistence accept stationless configured-gym
    variants with reps-only sets and null load fields end-to-end.
  rationale: Stationless variants must be executable in configured-gym mode without
    forcing station profile lookups or synthetic load values.
scope:
  in:
  - Update workout validation in backend/src/application/workouts.rs to skip station-profile
    load enforcement for stationless selections.
  - Update persistence write/read paths in backend/src/persistence/workouts.rs and
    backend/src/persistence/active_workouts.rs for nullable set load fields.
  - Keep station-based configured-gym validation strict for profile-constrained load
    values.
  out:
  - SQL schema/seed restructuring.
  - Renderer control visibility and interaction behavior.
constraints:
- Preserve free-mode behavior and fallback selection lock semantics.
inputs:
  required:
  - backend/src/application/workouts.rs
  - backend/src/persistence/workouts.rs
  - backend/src/persistence/active_workouts.rs
  - backend/init.sql
  optional:
  - agent/design/domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Configured-gym stationless payloads with null set load values pass validation/persistence
    while off-profile station-based loads continue to fail.
  verification:
    type: command
    command: cargo test --manifest-path backend/Cargo.toml workouts
    expected: Backend workout validation and persistence tests pass for both stationless-null-load
      and station-based profile-load scenarios.
execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
  - backend/application-validation
  - backend/workout-persistence
handoff:
  review_focus:
  - Verify null-load handling does not panic or coerce nulls to defaults.
  - Verify station-based profile checks still run when station selection is present.
