version: 1
kind: backlog_item

item:
  id: pb-044-item-02
  title: Implement backend workout history endpoint
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Backend serves authenticated workout history data in recency-first order with duration minutes computed consistently with completion behavior.
  rationale: History screen requires a stable, user-scoped backend source that returns all workouts without schema changes.

scope:
  in:
    - Implement GET /api/workouts handler wiring in router and handlers.
    - Add persistence query and domain/api model mapping for history entries.
    - Compute/return duration minutes using the same start/completion semantics as workout completion behavior, rounded to minutes for display.
    - Sort returned workouts by recency descending and return the full available list (no limit).
    - Add/adjust backend tests that cover ordering, shape, and duration behavior.
  out:
    - Renderer History UI grouping and row rendering.
    - Workout detail drill-down/navigation behavior from history rows.

constraints:
  - Do not change the database schema or add stored duration columns.
  - Keep user scoping and internal service boundaries unchanged.

inputs:
  required:
    - agent/execution/plan.yaml
    - agent/execution/items/open-item-01.yaml
    - backend/src/api/router.rs
    - backend/src/api/handlers/workouts.rs
    - backend/src/persistence/workouts.rs
  optional:
    - backend/src/domain.rs
    - backend/src/api/models.rs

acceptance_criteria:
  - id: ac-01
    statement: GET /api/workouts returns user-scoped workout history ordered by most recent completion/start timestamp first with duration minutes aligned to completion-screen calculation rules.
    verification:
      type: command
      command: make check-backend
      expected: Backend quality/test checks pass with coverage for history endpoint behavior and no regressions.

execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
    - backend_api
    - backend_persistence

handoff:
  review_focus:
    - recency ordering, duration rounding semantics, and absence of API-side list limiting

review_feedback: []
review_result: null
