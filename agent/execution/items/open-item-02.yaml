version: 1
kind: backlog_item

item:
  id: pb-040-item-02
  title: Rename backend workout selection field usage
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Backend domain, persistence, and workout application layers use `selected_training_plan_exercise_variant_id` terminology consistently.
  rationale: Aligns backend runtime logic with renamed persistence identifiers and removes ambiguous legacy naming.

scope:
  in:
    - Update backend models and mapping code from `selected_plan_exercise_option_id` to `selected_training_plan_exercise_variant_id`.
    - Update backend training-plan/workout persistence query aliases and method naming that expose plan option terminology.
  out:
    - OpenAPI schema and generated API client model regeneration.
    - Renderer-side field renames.

constraints:
  - Preserve existing validation semantics and option-to-variant/station matching behavior.
  - Keep backend internal-only topology and trust boundaries unchanged.

inputs:
  required:
    - agent/execution/plan.yaml
    - backend/src/domain.rs
    - backend/src/persistence
    - backend/src/application/workouts.rs
  optional:
    - backend/src/api/models.rs

acceptance_criteria:
  - id: ac-01
    statement: Active backend code paths no longer rely on `selected_plan_exercise_option_id` as the primary field name.
    verification:
      type: command
      command: rg -n "selected_plan_exercise_option_id" backend/src
      expected: No active backend source references remain except intentional compatibility shims (if any).
  - id: ac-02
    statement: Backend quality checks validate renamed field wiring end-to-end.
    verification:
      type: command
      command: make check-backend
      expected: Backend quality/test suite passes.

execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
    - backend

handoff:
  review_focus:
    - Field rename consistency across domain models, persistence mapping, and validation messages.

review_feedback: []
review_result: null
