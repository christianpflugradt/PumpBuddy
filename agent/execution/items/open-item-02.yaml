  - id: ac-01
    statement: Personal Records section renders compact alternating rows, correct formatted values, and excludes per-row dates.
    verification:
      type: command
      command: make check-renderer
      expected: Renderer checks pass with snapshot/DOM assertions for Personal Records card structure and formatting behavior.

