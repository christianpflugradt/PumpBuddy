version: 1
kind: backlog_item

item:
  id: pb-039-item-02
  title: Rework configured-gym option realizability query
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Configured-gym option summaries derive realizability from variant-to-station compatibility for the selected gym.
  rationale: Station-required variants should be considered realizable only when compatible stations exist in the chosen gym, while stationless variants remain available.

scope:
  in:
    - Update option-summary persistence queries in `backend/src/persistence/training_plans.rs`.
    - Join `exercise_variant_equipment_compatibilities` and `equipment_stations` for selected gym filtering.
    - Preserve behavior for variants with `requires_station = false`.
  out:
    - Renderer messaging changes.
    - API payload shape changes beyond existing option summaries.

constraints:
  - Treat compatibility mapping as the only source of station realizability for station-required variants.
  - Do not reintroduce option-level gym filtering.

inputs:
  required:
    - backend/src/persistence/training_plans.rs
    - runtime/database/00-schema.sql
    - agent/design/persistence-model.yaml
  optional:
    - agent/design/workout-use-cases-to-domain-model.yaml

acceptance_criteria:
  - id: ac-01
    statement: Configured-gym option summaries include only realizable variants for selected gym, plus stationless variants.
    verification:
      type: command
      command: make check-backend
      expected: Backend quality and tests pass with updated realizability query logic.

execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
    - backend persistence layer
    - configured-gym option resolution

handoff:
  review_focus:
    - Validate SQL join correctness and selected-gym filtering semantics.
    - Validate stationless variant inclusion path remains intact.

review_feedback: []
review_result: null
