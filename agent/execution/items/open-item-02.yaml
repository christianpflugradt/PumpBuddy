version: 1
kind: backlog_item

item:
  id: pb-027-item-02
  title: Restructure Workout Context and Current Set Layout
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Redesign workout-in-progress markup hierarchy so mandatory workout context stays visible and the current set number is rendered exactly once.
  rationale: The workout screen must preserve critical training context while reducing vertical density and eliminating duplicate set indicators.

scope:
  in:
    - update workout-in-progress header/content markup ordering for plan+gym context, exercise progress, exercise name, and variant name
    - remove redundant current-set labeling so set number appears once in the active interaction region
    - keep fallback selector, save status, and existing data-action hooks functionally intact
  out:
    - cross-screen token system definition
    - compact completed-set history visual treatment

constraints:
  - preserve current renderer interaction architecture based on innerHTML rendering plus data-action event delegation
  - keep renderer thin and avoid moving business logic into presentation modules
  - keep user-facing copy in english unless explicitly changed later

inputs:
  required:
    - agent/execution/plan.yaml
    - agent/tmp/pumpbuddy_workout_redesign_revised.md
    - renderer/src/workout-render.ts
  optional:
    - renderer/src/workout-interaction.ts
    - renderer/src/workout-controller.ts

acceptance_criteria:
  - id: ac-01
    statement: Workout-in-progress render output contains plan+gym context, progress counter, exercise name, and variant label while avoiding duplicate current set indicators.
    verification:
      type: command
      command: cd renderer && npm run vitest:run -- src/workout-render.test.ts
      expected: command exits 0 and tests validating workout render structure pass

execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
    - renderer/src/workout-render.ts
    - renderer/src/workout-render.test.ts

handoff:
  review_focus:
    - verify required context fields remain visible in the rendered exercise screen
    - verify current set number is displayed once and no duplicate label remains in active controls

review_feedback: []
review_result: null
