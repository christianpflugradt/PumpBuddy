item:
  id: pb-050-item-02
  title: Personal records section rendering and compact table styling
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Render the Personal Records section in exercise variant detail with compact, calm table-like rows, subtle alternation, and no dates in record rows.
  rationale: This delivers the user-facing Personal Records experience once derivation logic is available.

scope:
  in:
    - Add Personal Records card markup to the exercise variant detail layout.
    - Render record rows using the derived model from item 01 with metric-aware value formatting.
    - Apply lightweight row styling consistent with existing PumpBuddy card language and avoid heavy nested-card visuals.
  out:
    - Recent Sessions and Data Basis cards.
    - Refactoring unrelated Progress or History screen markup.

constraints:
  - Keep hero prominence and avoid visual competition with the top trend section.
  - Do not include performed date fields in Personal Records table rows.
  - Preserve dark mobile-first design language and restrained accent usage.

