version: 1
kind: backlog_item
item:
  id: pb-044-item-01
  title: Define workout history API contract
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: OpenAPI contract defines the history-list endpoint and response fields
    required by the new History screen.
  rationale: Contract-first alignment is required before backend and renderer implementation
    can proceed safely.
scope:
  in:
  - Add GET /api/workouts to the canonical OpenAPI document as the history-list endpoint.
  - 'Define response schema fields needed by History rows: workout id, training plan
    name, workout timestamps, gym name, and display-ready/format-ready duration minutes.'
  - Keep response semantics unbounded for this plan (no API-side pagination or hard
    limit).
  out:
  - Backend handler/repository implementation.
  - Renderer History screen rendering and navigation.
constraints:
- Keep openapi_yaml as the canonical source of truth and avoid editing generated clients
  directly.
- Preserve existing endpoint contracts unchanged while adding history support.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/api-contract.yaml
  - Makefile
  optional:
  - agent/strategy/engineering-guardrails.yaml
acceptance_criteria:
- id: ac-01
  statement: Canonical OpenAPI contract includes GET /api/workouts with a success
    response schema that fully covers History screen data needs.
  verification:
    type: command
    command: make refresh-api-clients
    expected: Command succeeds and regenerates backend/renderer API clients from the
      updated contract without manual edits in generated output.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - api_contract
handoff:
  review_focus:
  - endpoint path and response shape satisfy plan success criteria without introducing
    pagination or schema drift
review_feedback: []
review_result: null
