    reference: agent/execution/plan.yaml
intent:
  outcome: Progress heatmap day selection opens the matching completed workout detail.
  rationale: Deliver the first requested read-only interconnection for drill-down
    from timeline score dots.
scope:
  in:
  - Map heatmap day interaction payload to a concrete completed workout identifier.
  - Trigger existing workout-detail navigation from the Progress screen interaction.
  out:
  - Any History screen interaction changes.
  - Any new cross-screen links beyond Progress to Workout Detail.
constraints:
- Keep Progress read-only with no workout mutation side effects.
- Reuse existing route parameter patterns when available.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  optional:
  - agent/design/domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Selecting a Progress heatmap day dot navigates to the completed workout
    detail for that day entry.
  verification:
    type: command
    command: make check-renderer
    expected: Command exits successfully with renderer checks passing.
