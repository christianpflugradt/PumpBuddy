version: 1
kind: backlog_item
item:
  id: pb-033-item-01
  title: Deterministic Reps Suggestion Rule Order
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Implement deterministic ordered suggestion rules for reps/time behavior
    and historical/current-workout/default fallbacks.
  rationale: The plan requires a predictable server-side decision flow that can be
    implemented and reviewed without ambiguity.
scope:
  in:
  - Define ordered rule evaluation for progression gate, SECS behavior, REPS history
    matching, first-set fallback, workout-copy fallback, and defaults.
  - Ensure suggestion logic keeps set indexing semantics explicitly 1-based.
  - Keep load suggestion eligibility for SECS while omitting repetition-time suggestions.
  out:
  - Station load normalization details.
  - Progression heuristic implementation beyond current gating contract.
constraints:
- Preserve existing domain invariants for repetition kind, set side sequencing, and
  newest-first historical preference.
- Keep suggestion business logic on the backend.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/domain-model.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/workout-use-cases.yaml
  optional:
  - agent/design/glossary.yaml
acceptance_criteria:
- id: ac-01
  statement: Backend suggestion flow evaluates rules in deterministic order and preserves
    1-based set index behavior.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality checks pass with deterministic suggestion logic behavior
      covered by tests.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend_suggestion_logic
handoff:
  review_focus:
  - Rule order determinism and fallback precedence.
  - Correct SECS handling vs REPS handling.
review_feedback: []
review_result: null
