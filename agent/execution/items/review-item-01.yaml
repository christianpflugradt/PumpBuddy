    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Add canonical OpenAPI path and response schemas for History workout detail
    retrieval.
  rationale: The renderer and backend need one typed contract source for the new detail
    screen payload.
scope:
  in:
  - Add a workout-detail GET endpoint path and operation metadata to the canonical
    API contract.
  - Define response schema fields for detail hero metadata, completion stats, and
    ordered exercise set lines.
  - Keep naming and payload ownership aligned with existing API contract conventions.
  out:
  - Backend endpoint implementation.
  - Renderer UI wiring and presentation changes.
constraints:
- Do not modify persistence-model or database schema definitions.
- Keep endpoint and payload definitions in agent/design/api-contract.yaml as the source
  of truth.
- Maintain backwards compatibility for existing endpoint schemas.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/api-contract.yaml
  optional:
  - agent/design/domain-model.yaml
  - agent/design/workout-use-cases.yaml
