version: 1
kind: backlog_item
item:
  id: pb-035-item-01
  title: Simplify Fresh-Install Schema Baseline
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Restructure `runtime/database/00-schema.sql` as a fresh-install-first schema
    with direct final table definitions.
  rationale: The active plan requires removal of migration-style bootstrap behavior
    so new installs start from the canonical schema state.
scope:
  in:
  - Remove migration-style backfill and conditional bootstrap statements from `runtime/database/00-schema.sql`
    when they are not needed for empty-database initialization.
  - Keep any non-create statement only when a concrete fresh-install requirement exists
    and document the reason inline.
  out:
  - Data repair or migration support for existing populated databases.
constraints:
- Preserve all table/constraint semantics required by current backend and renderer
  behavior.
- Keep the schema file readable and deterministic for one-pass bootstrap.
inputs:
  required:
  - agent/execution/plan.yaml
  - runtime/database/00-schema.sql
  optional:
  - agent/design/persistence-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Schema file no longer contains migration-style backfill/update blocks
    tied to `workout_sets` bootstrap compatibility.
  verification:
    type: command
    command: '! rg -n "UPDATE workout_sets|ADD COLUMN IF NOT EXISTS repetition_value|sync_workout_set_repetition_columns|workout_sets_sync_repetition_columns"
      runtime/database/00-schema.sql'
    expected: Command exits successfully with no matches.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - runtime_database_schema
handoff:
  review_focus:
  - Fresh-install schema clarity and determinism.
  - Justification quality for any retained non-create statements.
review_feedback: []
review_result: null
