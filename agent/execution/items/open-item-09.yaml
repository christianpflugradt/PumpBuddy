version: 1
kind: backlog_item
item:
  id: pb-020-item-09
  title: Align API Contract With Implemented Free-Mode Gym Optionality
  status_hint: open
  source:
    type: finalize_return
    reference: agent/tmp/finalize-plan-findings.yaml
intent:
  outcome: Update design contract so API request gym_id requirements match implemented
    mode-dependent validation semantics.
  rationale: Finalization is blocked because contract/runtime drift can cause incorrect
    integrations and future regressions despite passing code tests.
scope:
  in:
  - Update `agent/design/api-contract.yaml` request schemas to reflect optional `gym_id`
    where free mode is allowed.
  - Add explicit contract notes covering mode invariants where free mode allows null gym/option references and configured-gym mode requires gym and option context.
  - Add a verification check that fails if contract reintroduces required gym_id in
    free-mode-capable payloads.
  out:
  - Backend runtime validation code changes outside contract alignment.
constraints:
- Keep configured-gym requirements explicit and unchanged.
- Keep contract language consistent with persisted gym_id-null mode indicator.
inputs:
  required:
  - agent/design/api-contract.yaml
  - backend/src/api/models.rs
  - backend/src/domain.rs
  optional: []
acceptance_criteria:
- id: ac-01
  statement: Contract no longer marks free-mode-capable request gym_id fields as required
    and documents mode invariants explicitly.
  verification:
    type: command
    command: rg "required:|gym_id|free mode|configured" agent/design/api-contract.yaml
    expected: Output shows gym_id optionality for free-mode-capable payloads and explicit
      mode-invariant documentation.
execution:
  plan_item_required: true
  risk_level: medium
  boundary_impact:
  - API contract and integrator guidance
handoff:
  review_focus:
  - Verify contract fields and requirement lists exactly match runtime validation
    behavior.
