  title: Implement persisted skip lifecycle for workout exercises
  status_hint: open
  source:
    type: extended_review
    reference: agent/tmp/review-architecture-findings.yaml
intent:
  outcome: Skip actions are stored server-side and restored reliably during resume
    flows.
  rationale: Align runtime behavior with UC-04/UC-05 lifecycle guarantees.
scope:
  in:
  - Add explicit skip marker field in persistence model and schema.
  - Extend active-workout update/complete flows to persist and return skip state.
  - Update renderer orchestration to persist skip transitions before navigation.
  out:
  - New analytics on skipped exercises.
constraints:
- Keep contract-first alignment between API and OpenAPI.
- Preserve immediate persistence expectations for workout progression state.
