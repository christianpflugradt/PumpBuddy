version: 1
kind: backlog_item
item:
  id: pb-056-item-07
  title: Extract workout scoring and projection logic from persistence
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-architecture-findings.yaml
intent:
  outcome: Persistence modules return row-shaped data, while application/domain services
    compute scores, progress, suggestions, and renderer-ready read models.
  rationale: Separating row access from use-case calculations makes the boundary easier
    to reason about and keeps sqlx modules from becoming the business layer.
scope:
  in:
  - Move pure scoring, progress, personal-record, and suggestion derivation into application
    or domain modules.
  - Keep SQL row fetching and transaction control in persistence.
  - Preserve current API response semantics and existing scoring behavior.
  - Add or retain focused backend tests around extracted pure functions and repository
    integration.
  out:
  - Changing the scoring formulas as product behavior.
  - Changing OpenAPI payload shapes.
  - Rewriting all persistence modules at once beyond the workout metrics/progression
    paths.
constraints:
- Keep backend business logic server-side.
- Do not introduce an ORM or a new analytics dependency.
- Use make targets for verification.
inputs:
  required:
  - agent/strategy/engineering-guardrails.yaml
  - backend/src/persistence/workouts.rs
  - backend/src/persistence/active_workouts.rs
  - backend/src/application/workouts.rs
  - backend/src/performance.rs
  optional:
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-insights-use-cases.yaml
acceptance_criteria:
- id: ac-01
  statement: Workout scoring, progress, and exercise-performance derivation are testable
    outside sqlx row-fetching modules.
  verification:
    type: command
    command: make check-backend
    expected: Backend unit and integration tests pass with extracted pure/application-level
      logic.
- id: ac-02
  statement: Persistence modules retain SQL and row mapping responsibilities without
    owning business projection formulas.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality passes and no public API shape change is required.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - backend persistence
  - backend application
  - backend domain
handoff:
  review_focus:
  - Check that SQL modules do not retain score/progress/formatted-display calculations.
  - Check that extracted functions preserve current edge cases for stationless, timed,
    unilateral, and per-side sets.
  - Check that tests cover both pure calculations and repository integration.
review_feedback:
- at: '2026-05-30T09:19:36Z'
  source: review-architecture:f-03
  notes: Persistence files do not just fetch and store rows; they compute workout
    scores, progress ratios, exercise performance groups, personal records, display
    labels, and progression suggestions. That conflicts with the guardrail to keep
    business logic separate from raw persistence details.
- at: '2026-05-30T12:11:53Z'
  source: review_result
  notes: "findings:\n- criterion: ac-02\n  evidence: backend/src/workout_suggestion_logic.rs:480-483\
    \ clears repetition_value\n    for every SECS suggestion when no no-load prior\
    \ value is found. Before this extraction,\n    backend/src/persistence/active_workouts.rs\
    \ only cleared SECS values in the else\n    branch after has_no_load_option_selection,\
    \ so a stationless configured no-load\n    timed exercise could keep the current-workout\
    \ last_current fallback when no matching\n    historical row existed. The new\
    \ flow gets last_current from derive_last_current,\n    passes it as from_rules,\
    \ and then build_suggested_set clears it to None.\n  risk: Stationless timed next-set\
    \ suggestions can lose the existing current-workout\n    duration fallback and\
    \ return a null suggested duration for the next set, changing\n    API response\
    \ semantics for a timed edge case that the item explicitly asked to\n    preserve.\n"
  findings:
  - criterion: ac-02
    evidence: backend/src/workout_suggestion_logic.rs:480-483 clears repetition_value
      for every SECS suggestion when no no-load prior value is found. Before this
      extraction, backend/src/persistence/active_workouts.rs only cleared SECS values
      in the else branch after has_no_load_option_selection, so a stationless configured
      no-load timed exercise could keep the current-workout last_current fallback
      when no matching historical row existed. The new flow gets last_current from
      derive_last_current, passes it as from_rules, and then build_suggested_set clears
      it to None.
    risk: Stationless timed next-set suggestions can lose the existing current-workout
      duration fallback and return a null suggested duration for the next set, changing
      API response semantics for a timed edge case that the item explicitly asked
      to preserve.
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 and ac-02 are met: scoring, progress, performance projection,
      personal-record, and suggestion calculations are testable in pure workout modules,
      while persistence keeps SQL, row mapping, transactions, and delegation.'
    evidence: The corrective commit threads has_no_load_option_selection from backend/src/persistence/active_workouts.rs
      into workout_suggestion_logic::build_suggested_set, preserving the stationless
      timed current-workout fallback. Pure coverage includes build_suggested_set_preserves_stationless_timed_current_fallback_without_prior_history
      plus existing scoring/progress/suggestion tests in workout_metrics.rs, workout_progression.rs,
      and workout_suggestion_logic.rs. Persistence scans show delegation to pure helpers
      rather than owning the formulas.
    runtime_build_check: Implementation reported make check-backend passing; accept
      finalization will run the deterministic quality gate.
    residual_risk: Low. SQL query orchestration and eligibility lookups remain in
      persistence by design, but calculation/projection behavior is extracted and
      the returned timed/no-load edge case is covered.
  findings: []
