version: 1
kind: backlog_item
item:
  id: pb-030-item-07
  title: Redesign history table for bilateral and unilateral set views
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Workout history table removes status column and renders bilateral/unilateral
    rows with the agreed column sets.
  rationale: History readability is a key UX requirement and must represent partial
    unilateral completion correctly.
scope:
  in:
  - Remove static status column from history table.
  - Render bilateral history as `Set|kg|reps`.
  - Render unilateral history as `Set|kg (L)|reps (L)|kg (R)|reps (R)` with right-side
    cells blank until right is completed.
  out:
  - Current-set progression flow changes.
  - Backend persistence transformations.
constraints:
- Unilateral rows must preserve one logical set row while side values populate incrementally.
- Bilateral history display must remain simple and unchanged apart from status-column
  removal.
inputs:
  required:
  - agent/execution/plan.yaml
  - renderer/src
  - agent/design/workout-use-cases.yaml
  optional:
  - renderer/tests
acceptance_criteria:
- id: ac-01
  statement: History table displays bilateral and unilateral set data in the agreed
    formats and supports unilateral partial-right blanks.
  verification:
    type: command
    command: make check
    expected: Quality gate passes with UI tests covering bilateral rows, unilateral
      rows, and partial unilateral completion rendering.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer/history-ui
handoff:
  review_focus:
  - Verify unilateral rows stay single-row per set index with side columns.
  - Verify status column removal does not break layout or data mapping.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: Acceptance criterion ac-01 is met; history rendering now uses bilateral
      columns `Set|kg|reps` and unilateral columns `Set|kg (L)|reps (L)|kg (R)|reps
      (R)` with right-side cells blank when only the left side is completed.
    evidence: Renderer history model and UI wiring are side-aware via `renderer/src/completed-set-history.ts`
      and its consumers in `renderer/src/pb-exercise-screen.ts` and `renderer/src/workout-render.ts`;
      targeted verification passed with `npm --prefix renderer run vitest:run -- src/completed-set-history.test.ts
      src/pb-exercise-screen.test.ts` (2 files, 10 tests), including bilateral row
      shape and unilateral partial-right blank-cell coverage.
    runtime_build_check: Targeted runtime verification is green in this review run;
      review finalize will execute the deterministic repository quality gate from
      the implementation source commit.
    residual_risk: Low residual risk; `renderer/src/pb-set-history.ts` currently maps
      history items without explicit side metadata, so if that legacy element is later
      reused for unilateral display it should be aligned with the shared side-aware
      model input contract.
