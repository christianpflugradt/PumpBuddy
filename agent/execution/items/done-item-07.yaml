version: 1
kind: backlog_item
item:
  id: pb-032-item-07
  title: Redesign SECS workout control to agreed single-field icon-button layout
  status_hint: done
  source:
    type: finalize_return
    reference: agent/tmp/finalize-plan-findings.yaml
intent:
  outcome: Deliver the agreed SECS UI with a single `m:ss` time field and icon-only
    reset/play-pause controls in a REPS-like button-field-button row.
  rationale: Finalize is blocked because the implemented SECS UI does not match the
    agreed interaction and visual contract (stacked TIME/MIN/SEC layout, separate
    min/sec inputs, and text-only RESET/PLAY controls).
scope:
  in:
  - Replace the current SECS stacked TIME/MIN/SEC presentation with label `SECS` and
    a single-row control layout `reset-icon button | single time field | play/pause-icon
    button`.
  - Replace text `RESET` and `PLAY/PAUSE` controls with proper SVG icon buttons for
    reset and play/pause states.
  - Implement one editable time input for SECS that starts at `0:00`, displays `m:ss`,
    and increments one second per tick while playing.
  - Ensure interacting with the single SECS time field opens a single spinner/editor
    flow for that one field rather than separate minute/second fields.
  out:
  - Changes to REPS variant control layout and interactions.
  - Backend/schema/API contract changes unrelated to renderer SECS control UX.
constraints:
- Preserve existing one-second timer progression, pause behavior, and reset-to-zero
  semantics.
- Keep SECS storage/submission semantics as integer total seconds.
- Use SVG assets implemented in-repo for reset and play/pause icons.
inputs:
  required:
  - renderer/src/pb-exercise-screen.ts
  - renderer/src/workout-render.ts
  - renderer/src/workout-controller.ts
  - renderer/src/styles.scss
  - renderer/src/*test.ts
  optional:
  - agent/design/workout-use-cases.yaml
acceptance_criteria:
- id: ac-01
  statement: SECS UI renders as `SECS` with REPS-like single-row controls (`reset
    icon button | single m:ss field | play/pause icon button`) and no separate MIN/SEC
    fields.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer tests pass with assertions for single-field SECS layout and
      icon-button controls, and no tests rely on separate MIN/SEC inputs.
- id: ac-02
  statement: The single SECS field initializes at `0:00`, opens one spinner/editor
    interaction, and updates to `0:01` after one second of play.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer tests pass with coverage for one-field spinner/editor interaction
      and deterministic one-second play progression from `0:00` to `0:01`.
execution:
  plan_item_required: true
  risk_level: high
  boundary_impact:
  - renderer
  - ui
  - tests
handoff:
  review_focus:
  - Confirm the SECS control visual/interaction contract exactly matches agreed button-field-button
    layout and iconography.
  - Confirm single-field input/edit behavior and timer progression remain deterministic
    and do not regress REPS flows.
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 are satisfied because SECS now renders as a single-row
      icon-button layout with one `m:ss` field and the tests cover both single-field
      picker interaction and deterministic one-second timer progression.
    evidence: '`renderer/src/workout-render.ts` renders `SECS` as `reset icon button
      | single time field | play/pause icon button` via `renderSecsSetField`, uses
      `formatSecondsToMinutesSeconds`, and no longer uses `type="time"`/split MIN+SEC
      controls; `renderer/src/workout-render.test.ts` asserts `value="1:15"`, `data-action="secs-input"`,
      and absence of `type="time"` while verifying icon-button labels; `renderer/src/pb-exercise-screen.test.ts`
      verifies single-field trigger rendering and one picker flow that emits a single
      `secs-input` value (`2:30`); `renderer/src/workout-controller.test.ts` includes
      deterministic running-timer coverage from `0:00` to `0:01` after one second
      (`increments SECS value from 0:00 to 0:01 after one second while running`).'
    runtime_build_check: Pending finalize quality gate execution.
    residual_risk: Low residual risk remains around visual micro-alignment of icon
      controls across breakpoints, but functional contract and timer progression are
      covered by renderer/controller tests.
review_feedback:
- at: '2026-04-03T21:41:34Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01\n  evidence: '`renderer/src/workout-render.ts`\
    \ still renders the SECS field as `type=\"time\"`\n    with `HH:MM:SS` formatting\
    \ (`formatSecondsForTimeInput`, `value=\"00:01:15\"` style),\n    and `renderer/src/workout-render.test.ts`\
    \ explicitly asserts this legacy format.\n    That does not match the agreed single\
    \ `m:ss` field contract used in `renderer/src/pb-exercise-screen.ts`.'\n  risk:\
    \ Renderer paths and tests are inconsistent on the SECS contract, creating a\n\
    \    regression risk where the old `HH:MM:SS` control behavior can persist or\
    \ be reintroduced.\n- criterion: ac-02\n  evidence: '`make check-renderer` passes,\
    \ but current SECS tests validate parsing\n    and lockouts (`renderer/src/workout-controller.test.ts`,\
    \ `renderer/src/pb-exercise-screen.test.ts`)\n    without a deterministic assertion\
    \ that active play advances the displayed/underlying\n    value from `0:00` to\
    \ `0:01` after one second.'\n  risk: Timer tick behavior can regress (interval\
    \ wiring, render sync, or display\n    update timing) without a focused one-second\
    \ progression test, weakening confidence\n    in the required deterministic play\
    \ progression.\n"
