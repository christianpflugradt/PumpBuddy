  - Update domain structs and mapping code to use optional station fields for plan
    option projections.
  - Remove empty-string placeholder hydration for absent station data.
  out:
  - Redesign of compatibility table schema.
constraints:
- Preserve ordering and realizability filtering behavior for option queries.
