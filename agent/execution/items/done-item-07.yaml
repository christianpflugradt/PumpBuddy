version: 1
kind: backlog_item
item:
  id: pb-020-item-07
  title: Reduce release workflow token permissions to least privilege
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Restrict release job permissions to only scopes needed for image publishing
    and release operations.
  rationale: Minimize blast radius for CI token compromise.
scope:
  in:
  - Audit top-level and job-level permissions in release workflow.
  - Remove unnecessary issue/PR write or other over-broad scopes.
  out:
  - Organization-wide GitHub permission policy changes.
constraints:
- Maintain successful image publish and release execution.
inputs:
  required:
  - agent/execution/plan.yaml
  - .github/workflows/release.yaml
  optional:
  - agent/tmp/ReviewFindings.yaml
acceptance_criteria:
- id: ac-01
  statement: Release workflow permissions exclude unnecessary issue/PR write scope
    for image publish jobs.
  verification:
    type: command
    command: 'rg "permissions|issues: write|pull-requests: write" .github/workflows/release.yaml'
    expected: Command output shows least-privilege permission blocks without unnecessary
      write scopes.
- id: ac-02
  statement: Required permissions for package publish and repository content operations
    remain explicitly defined.
  verification:
    type: command
    command: 'rg "packages: write|contents: write|contents: read" .github/workflows/release.yaml'
    expected: Command output includes only the minimum required scopes for release
      behavior.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - CI permission hardening
  - release security posture
handoff:
  review_focus:
  - Validate permission changes are least-privilege and non-breaking.
  - Check image publish job scopes specifically.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 verified.
    evidence: 'Image publish jobs at .github/workflows/release.yaml:67-69 and :94-96
      define only `contents: read` and `packages: write` (no `issues: write` or `pull-requests:
      write`), while required explicit scopes remain present (`contents: write` for
      semantic-release at line 19 and read/write package scopes for publish jobs).
      Acceptance checks passed via `rg "permissions|issues: write|pull-requests: write"
      .github/workflows/release.yaml` and `rg "packages: write|contents: write|contents:
      read" .github/workflows/release.yaml`.'
    runtime_build_check: Not run; review performed via static workflow inspection
      and acceptance command checks.
    residual_risk: 'semantic-release still retains `issues: write` and `pull-requests:
      write`; this appears intentional for `@semantic-release/github` issue/PR comment
      behavior, but should be revisited if plugin options are tightened.'
