version: 1
kind: backlog_item

item:
  id: pb-039-item-05
  title: Fix shared app-shell top-left alignment across main screens
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: A shared layout-shell fix anchors the app outer frame to viewport top-left on desktop/large screens across all main app screens.
  rationale: Burger icon and sidebar origin should remain visually consistent and aligned regardless of active screen.

scope:
  in:
    - Implement shared shell/layout correction in renderer styles and shared app structure.
    - Ensure login, workout-selection, workout-execution, and workout-complete screens inherit the same alignment fix.
  out:
    - Per-screen one-off CSS workarounds.
    - Changes to blocked-start validation behavior.

constraints:
  - Prefer a single reusable shell/layout rule path over duplicated per-screen overrides.
  - Preserve mobile behavior while fixing desktop/large-screen alignment.

inputs:
  required:
    - renderer/src/style.css
    - renderer/src/app.ts
    - renderer/src/pb-start-screen.ts
  optional:
    - agent/design/workout-capabilities.yaml

acceptance_criteria:
  - id: ac-01
    statement: Desktop/large-screen app shell remains top-left anchored and burger/sidebar origin aligns consistently across main screens.
    verification:
      type: command
      command: make check-renderer
      expected: Renderer quality and tests pass with shared shell alignment changes.

execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
    - renderer shared layout shell
    - renderer global styles

handoff:
  review_focus:
    - Confirm fix is centralized and reused by all targeted screens.
    - Confirm desktop alignment improvement without mobile regression.

review_feedback: []
review_result: null
