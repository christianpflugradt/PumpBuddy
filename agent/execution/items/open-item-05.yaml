version: 1
kind: backlog_item

item:
  id: pb-028-item-05
  title: Expand persistence integration coverage across rule branches
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Integration tests cover representative scenarios for all major rule branches and fallback paths.
  rationale: The plan success criteria require branch-level confidence in active workout suggested_set responses.

scope:
  in:
    - add or update backend/tests/persistence_integration.rs scenarios covering exact, scoped, current-workout fallback, and global fallback branches
    - assert newest-match behavior when multiple historical candidates are present
  out:
    - non-workout persistence integration scenarios

constraints:
  - keep test setup deterministic and reproducible
  - prefer behavior assertions over internal implementation detail checks

inputs:
  required:
    - backend/tests/persistence_integration.rs
    - agent/tmp/set_rules_compact.md
    - backend/src/persistence/suggestions.rs
  optional:
    - backend/tests/support/mod.rs

acceptance_criteria:
  - id: ac-01
    statement: Persistence integration tests validate expected suggested_set outputs for representative scenarios spanning all rule branches.
    verification:
      type: command
      command: cargo test --manifest-path backend/Cargo.toml --test persistence_integration
      expected: integration suite passes with branch coverage for set suggestion rules

execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
    - backend_integration_test_coverage

handoff:
  review_focus:
    - scenario completeness against compact rule set
    - stability and determinism of test fixtures

review_feedback: []
review_result: null
