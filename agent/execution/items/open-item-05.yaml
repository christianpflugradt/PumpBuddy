version: 1
kind: backlog_item

item:
  id: pb-049-item-05
  title: Implement Strength Progression modes and axis rules
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Deliver Strength Progression chart for last 12 months with metric-mode/station-mode behavior and dynamic axis labeling rules.
  rationale: Strength progression requires the most complex interaction and data shaping in this plan's chart foundation.

scope:
  in:
    - Render Strength Progression for the last 12 months.
    - Support metric modes and station modes (Primary and All stations) by data type.
    - Prevent line connections across different stations in All stations mode.
    - Apply dynamic axis bounds/steps/formatting for kg, reps, and time with 2-5 readable labels.
  out:
    - Personal Records and Recent Sessions sections.
    - Any new global progress/frequency/consistency metrics.

constraints:
  - Reuse existing SVG/CSS chart implementation patterns and shared formatters where possible.
  - Keep station segmentation deterministic so multi-station views remain visually correct.

inputs:
  required:
    - agent/execution/plan.yaml
    - agent/design/workout-capabilities.yaml
    - agent/design/domain-model.yaml
    - agent/strategy/test-strategy.yaml
  optional:
    - agent/design/persistence-model.yaml
    - agent/design/api-contract.yaml

acceptance_criteria:
  - id: ac-01
    statement: Strength chart supports configured metric/station modes by data type, including Primary and All stations behavior.
    verification:
      type: command
      command: make check-renderer
      expected: Renderer checks pass with mode-specific assertions for data mapping and rendering.
  - id: ac-02
    statement: All stations mode does not connect points belonging to different stations.
    verification:
      type: command
      command: make check-renderer
      expected: Renderer checks pass with segmentation assertions across mixed-station data.
  - id: ac-03
    statement: Axis/grid labels follow dynamic bounds and step rules with 2-5 readable labels for kg, reps, and time values.
    verification:
      type: command
      command: make check-renderer
      expected: Renderer checks pass with axis formatting and label-count behavior coverage.

execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: high
  boundary_impact:
    - renderer strength progression chart
    - renderer axis formatting helpers
    - renderer detail mode controls

handoff:
  review_focus:
    - station segmentation correctness
    - dynamic axis rule implementation across metric families

review_feedback: []
review_result: null
