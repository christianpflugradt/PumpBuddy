version: 1
kind: backlog_item

item:
  id: pb-020-item-05
  title: Make workflow runtime state reconciliation deterministic
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Ensure workflow-state counters and phase transitions are updated deterministically from item artifact evidence.
  rationale: Prevent workflow-state drift that can break scripted gating and transitions.

scope:
  in:
    - Update relevant workflow scripts to derive open/review/done counts from item filenames.
    - Add or update checks ensuring state transitions reflect evidence-backed conditions.
  out:
    - Redesign of workflow state machine phases.

constraints:
  - Filename status remains source of truth for item status.

inputs:
  required:
    - agent/execution/plan.yaml
    - agent/execution/workflow-state.yaml
    - agent/execution/workflow-policy.yaml
    - agent/scripts/task
  optional:
    - agent/execution/items

acceptance_criteria:
  - id: ac-01
    statement: Workflow scripts compute item counters from open/review/done item filenames rather than manual state edits.
    verification:
      type: command
      command: rg "open-item|review-item|done-item|item_counters" agent/scripts/task
      expected: Command output shows deterministic counter derivation logic in scripts.
  - id: ac-02
    statement: State transitions enforce evidence-based gate conditions from workflow policy.
    verification:
      type: command
      command: rg "no_open_or_review_items_exist|at_least_one_done_item_exists|at_least_one_open_item_exists" agent/scripts/task agent/execution/workflow-policy.yaml
      expected: Command output shows transition checks wired to policy conditions.

execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
    - workflow runtime consistency
    - script determinism

handoff:
  review_focus:
    - Validate counters stay correct after representative item status changes.
    - Confirm transitions fail fast when gate conditions are unmet.

review_feedback: []
review_result: null
