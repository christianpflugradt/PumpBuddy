version: 1
kind: backlog_item
item:
  id: pb-025-item-13
  title: Widen workout load input field for full fractional and 3-digit value visibility
  status_hint: open
  source:
    type: finalize_return
    reference: stakeholder-report-2026-03-27
intent:
  outcome: Make workout load inputs wide enough to fully display values like 43.09 and 123.45 without clipping or barely visible trailing digits.
  rationale: Stakeholder reports fractional values are still visually truncated (for example "43.0" visible while actual value is "43.09"), which reduces confidence and can hide entered load precision.
scope:
  in:
  - Update workout load input styling/layout so decimal and 3-digit values are fully readable in configured-gym flows.
  - Ensure width adjustments apply consistently across active set rows and relevant breakpoints.
  - Add regression coverage asserting no clipping for representative values including 43.09 and 123.45.
  out:
  - Redesign of unrelated workout layout components.
  - Changes to numeric formatting or payload precision rules.
constraints:
- Keep current rounding/display formatting behavior unchanged except for visibility improvements.
- Maintain mobile and desktop usability.
inputs:
  required:
  - renderer/src/styles.scss
  - renderer/src/workout-render.ts
  - renderer/src/app.test.ts
  optional:
  - renderer/src/workout-state.ts
acceptance_criteria:
- id: ac-01
  statement: Workout load inputs fully display fractional and 3-digit values (including 43.09 and 123.45) without clipping in configured-gym set rows.
  verification:
    type: command
    command: npm --prefix renderer test
    expected: Renderer tests pass with assertions covering full visibility for representative fractional and 3-digit load values.
execution:
  plan_item_required: true
  risk_level: medium
  boundary_impact:
  - renderer/styles
  - renderer/workout-render
  - renderer/tests
handoff:
  review_focus:
  - Verify trailing decimal digits are fully visible in the input field.
  - Verify values above 100 with two decimals remain fully visible without layout regressions.
