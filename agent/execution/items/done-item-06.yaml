version: 1
kind: backlog_item
item:
  id: pb-036-item-06
  title: Wire Side Menu Navigation Actions Including Logout
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Side menu entries navigate to Workout/Settings and Log out clears session
    cookie then returns user to login requiring API key entry.
  rationale: Completes functional global menu behavior and preserves authenticated-boundary
    expectations.
scope:
  in:
  - Wire Workout menu entry to workout selection screen.
  - Wire Settings menu entry to settings screen.
  - Wire Log out entry to clear session cookie/auth state and route to login screen.
  - Ensure post-logout login flow requires fresh API key submission.
  out:
  - New auth endpoints or session model redesign.
  - Multi-account selection UX.
constraints:
- Preserve existing auth/session contract and security boundaries.
- Avoid exposing sensitive session data in logs or UI.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/api-contract.yaml
  - agent/strategy/security.yaml
  optional:
  - agent/strategy/engineering-guardrails.yaml
  - agent/design/persistence-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Menu navigation works for Workout and Settings, and Log out clears session
    state and redirects to login with API key prompt.
  verification:
    type: command
    command: make check
    expected: Full repository quality checks pass with coverage for menu navigation
      and logout flow.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer/auth-navigation
  - renderer/global-side-menu-actions
handoff:
  review_focus:
  - Verify logout fully resets authenticated renderer state.
  - Verify route guards require re-authentication after logout.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 satisfied: side menu actions route Workout and Settings between
      start/settings screens, and Log out clears authenticated session cookie state
      then returns to login requiring API key submission.'
    evidence: Navigation wiring and side-menu action handling are implemented in renderer/src/workout-controller.ts
      and menu emitters in renderer/src/pb-start-screen.ts plus renderer/src/pb-settings-screen.ts;
      logout now posts /auth/logout via renderer/src/auth-gate.ts and app re-initializes
      auth gate on pb-logout in renderer/src/pumpbuddy-app.ts; backend logout endpoint
      and cookie clear semantics are implemented in backend/src/api/auth.rs and routed
      in backend/src/api/router.rs; tests cover navigation/logout/auth-gate behavior
      in renderer/src/workout-controller.test.ts, renderer/src/auth-gate.test.ts,
      and renderer/src/pumpbuddy-app.test.ts.
    runtime_build_check: Not run manually during review; accept finalize is configured
      to execute deterministic quality gates through agent/scripts/check/run-quality-gate.sh.
    residual_risk: Low; residual risk is mainly end-to-end browser cookie-policy variance,
      but server-driven __Host-pb_session clearing with HttpOnly/Secure/SameSite=Strict
      and existing renderer tests reduce regression likelihood.
