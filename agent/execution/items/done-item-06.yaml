version: 1
kind: backlog_item
item:
  id: pb-032-item-06
  title: Enforce running-timer navigation lockouts and cross-mode compatibility coverage
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Running timed sets block navigation/complete-set actions and are verified
    across unilateral, stationless, and per-side-load scenarios.
  rationale: Protect workout state integrity during active timers and prove compatibility
    for high-risk mode combinations.
scope:
  in:
  - Enforce deterministic lockout behavior while a `SECS` timer is running for complete-set
    and previous/next navigation actions.
  - Add/update tests that cover lockout behavior and resume safety.
  - Add regression tests for `SECS` with unilateral tracking, stationless variants,
    and per-side load modes.
  out:
  - New repetition kinds or unrelated UI flow redesign.
constraints:
- Lockout behavior must be deterministic and user-visible through disabled or rejected
  interactions.
- Compatibility tests should cover boundary combinations without introducing brittle
  overbroad UI automation.
- Maintain existing configured-gym/free-mode invariants.
inputs:
  required:
  - renderer/src/workout-controller.ts
  - renderer/src/pb-exercise-screen.ts
  - renderer/src/*test.ts
  - backend/tests/api_workouts.rs
  - backend/tests/persistence_integration.rs
  optional:
  - renderer/src/workout-state.ts
  - agent/design/workout-use-cases.yaml
acceptance_criteria:
- id: ac-01
  statement: Running `SECS` timers prevent complete-set and previous/next navigation
    actions until paused.
  verification:
    type: command
    command: make check-renderer
    expected: Command exits successfully with tests asserting lockout behavior while
      timer is running.
- id: ac-02
  statement: Regression coverage confirms `SECS` compatibility for unilateral, stationless,
    and per-side load scenarios.
  verification:
    type: command
    command: make check
    expected: Command exits successfully with combined backend/renderer coverage for
      the targeted compatibility edges.
execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
  - renderer
  - backend
handoff:
  review_focus:
  - Validate lockout edge cases and cross-mode compatibility assertions map to documented
    use-case constraints.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 are satisfied because SECS running-timer lockouts
      now deterministically block complete-set and previous/next navigation until
      pause, and regression coverage exercises unilateral+per-side and stationless
      SECS flows with resume-after-pause behavior.
    evidence: '`renderer/src/workout-controller.ts` adds a shared running-SECS guard
      used by next-set, previous-exercise, next-exercise, finish-workout, and completion
      flow paths; `renderer/src/pb-exercise-screen.ts` disables complete-set and navigation
      controls during active SECS timers for explicit UI lockout feedback; `renderer/src/workout-controller.test.ts`
      verifies blocked next/previous navigation and complete-set while running plus
      successful actions after pause using unilateral per-side and stationless SECS
      fixtures; `renderer/src/pb-exercise-screen.test.ts` verifies disabled complete-set/previous/next
      controls while timer runs; follow-up API/typing alignment (`backend/src/api/handlers/training_plans.rs`,
      `backend/src/persistence/training_plans.rs`, `renderer/src/workout-state.ts`,
      `renderer/src/workout-types.ts`) ensures renderer lockout behavior is driven
      by stable repetition-kind metadata across backend/renderer boundaries.'
    runtime_build_check: Pending finalize quality gate execution.
    residual_risk: Low residual risk remains around end-to-end timer cadence in real
      browser scheduling conditions, but lockout gating is centralized and covered
      at controller/UI test layers with pause-release assertions.
