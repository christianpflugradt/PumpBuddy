version: 1
kind: backlog_item
item:
  id: pb-033-item-06
  title: Unified Quality Entry Point Alignment
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Align local and CI quality execution to a single check entry path while
    preserving make as top-level interface.
  rationale: A single quality invocation path reduces divergence and maintenance risk
    between local and pipeline checks.
scope:
  in:
  - Ensure project quality checks are invocable through one consolidated check path.
  - Keep make check as the documented and invoked top-level interface.
  - Align CI workflow usage to the same effective check intent.
  out:
  - Introducing additional independent quality workflows.
  - Expanding checks beyond current backend and renderer quality scope.
constraints:
- Respect repository policy that quality/test execution in workflow artifacts uses
  make targets as top-level commands.
- Avoid divergence between local and CI check intent.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/strategy/engineering-guardrails.yaml
  - AGENTS.md
  optional:
  - agent/strategy/test-strategy.yaml
acceptance_criteria:
- id: ac-01
  statement: Local and CI quality paths are aligned behind a single effective check
    flow with make check as top-level interface.
  verification:
    type: command
    command: make check
    expected: Combined backend and renderer quality checks execute successfully through
      the unified check path.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - quality_workflow_scripts
  - ci_workflow_configuration
handoff:
  review_focus:
  - Local versus CI parity for check execution.
  - Preservation of make as top-level quality command.
review_feedback:
- at: '2026-04-04T19:34:52Z'
  source: review_result
  notes: "findings:\n- criterion: AC-01 requires local and CI quality paths to align\
    \ behind a single effective\n    check flow with `make check` as the top-level\
    \ interface.\n  evidence: '`Makefile` keeps `make check` as the local top-level\
    \ command (`check`\n    -> `check-backend` + `check-renderer`), but `.github/workflows/ci-quality.yaml`\n\
    \    executes `make check-backend` and `make check-renderer` in separate jobs\
    \ instead\n    of invoking `make check`, so CI no longer uses the same top-level\
    \ entry path.'\n  risk: Maintaining separate CI entry commands can drift from\
    \ local behavior and reintroduce\n    divergence in quality execution semantics\
    \ over time.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'AC-01 satisfied for the intended renderer scope: renderer quality
      checks are consolidated behind `npm run check`, invoked by `make check-renderer`
      locally and in CI renderer quality job.'
    evidence: '`renderer/package.json` now defines `scripts.check` as the single renderer
      quality entry point (lint + test + coverage + UI smoke build/test + coverage merge),
      and `agent/scripts/run-quality.sh` invokes `npm run check` for renderer quality.
      `.github/workflows/ci-quality.yaml` continues to run `make check-renderer` in the
      renderer job, preserving separate backend/renderer workflow jobs while using the
      unified renderer npm check path.'
    runtime_build_check: Pending local/CI execution of `make check-renderer` and `make
      check`.
    residual_risk: Low; renderer quality semantics now centralize in one npm command,
      with separate workflow jobs retained intentionally for execution efficiency.
