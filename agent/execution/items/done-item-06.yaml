version: 1
kind: backlog_item
item:
  id: pb-062-item-06
  title: Add draft load profile detail authoring flows
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: A dedicated full-screen renderer editor for creating and editing draft
    load profiles, including fixed-list and formula definitions plus draft deletion.
  rationale: The primary new creation value in this plan is authoring draft profiles
    safely in a full-screen mobile flow once stored draft definitions can be loaded
    through a dedicated detail read boundary.
scope:
  in:
  - Implement full-screen create and edit routes for draft load profiles.
  - Load persisted draft definition data from the dedicated load-profile detail boundary
    when editing an existing draft.
  - Support unique-name, weight-unit, and definition-kind authoring for fixed-list
    and formula variants with live validation feedback.
  - Allow draft deletion from the detail flow and return users cleanly to the configurator
    list.
  out:
  - Active or inactive rename warning behavior.
  - Changing load profile status beyond new.
constraints:
- Keep form-state logic aligned with backend-owned validation and avoid duplicating
  durable business rules unnecessarily.
- Use dedicated full-screen mobile layouts instead of modal editing.
- Do not invent renderer-only prefill state from list summaries when editing an existing
  draft.
inputs:
  required:
  - agent/design/configurator-use-cases.yaml
  - agent/design/domain-model.yaml
  - agent/design/api-contract.yaml
  optional:
  - agent/execution/items/open-item-05.yaml
  - renderer/src/pb-settings-screen.ts
  - renderer/src/openapi-contract.ts
acceptance_criteria:
- id: ac-01
  statement: Users can create new drafts and edit existing draft load profiles in
    a dedicated full-screen flow for both fixed-list and formula definitions, with
    existing draft values prefilling from the detail read payload and no renderer
    crashes on invalid input.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer quality checks pass with coverage for draft create and edit
      form behavior across both definition kinds.
- id: ac-02
  statement: Draft deletion is available from the detail flow and returns the user
    to the load profiles list with the removed profile absent.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer tests validate draft delete affordance, API integration, post-delete
      navigation behavior, and edit-mode recovery after save failures.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - renderer/configurator
  - renderer/forms
  - renderer/openapi-boundary
handoff:
  review_focus:
  - Form-state handling for variant-specific inputs and detail-payload prefill behavior.
  - Navigation cleanup after save and delete operations on narrow screens.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: The renderer now supports dedicated full-screen draft load-profile
      create and edit flows, prefills existing draft values from the authenticated
      detail payload for fixed-list and formula definitions, preserves invalid-input
      resilience through local validation, and exposes draft deletion from the editor
      route with return to the configurator list.
    evidence: renderer/src/pb-configurator-load-profile-editor-screen.ts implements
      the full-screen editor with draft-only editing rules, unique-name and definition
      validation, fixed-list and formula field handling, detail-based prefill, and
      delete/save actions; renderer/src/pb-app-root.ts renders the dedicated editor
      route and passes list plus detail state into it; renderer/src/workout-controller-navigation.ts
      and renderer/src/workout-controller-screen-data.ts open the create and edit
      routes, load persisted detail data through GET /api/load-profiles/{loadProfileId},
      and return users to the configurator list; renderer/src/workout-controller.ts
      wires create, update, and delete API actions plus optimistic list refresh; renderer/src/pb-configurator-load-profile-editor-screen.test.ts,
      renderer/src/workout-controller.test.ts, renderer/src/workout-controller-screen-data.test.ts,
      and renderer/src/pb-app-root.test.ts cover prefill, validation, create/edit
      navigation, save failure retention, delete navigation, and detail hydration.
    runtime_build_check: No manual quality command was run during review per task
      guidance; accept-finalize is expected to execute the deterministic renderer
      quality gate for the implementation commit.
    residual_risk: Formula authoring coverage is narrower than the fixed-list path
      in controller-level tests, so future regressions around definition-kind switching
      would benefit from additional targeted cases, but the implemented behavior required
      by this item is present and contract-aligned within current scope.
  findings: []
