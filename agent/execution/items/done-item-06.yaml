version: 1
kind: backlog_item
item:
  id: pb-037-item-06
  title: Add personalized greeting on workout select screen
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Display `Welcome back, <display_name>!` above plan chooser copy using authenticated
    user profile data.
  rationale: Improves start-screen personalization with already-persisted identity
    data.
scope:
  in:
  - Surface authenticated user display name where needed for workout select rendering.
  - Render greeting line directly above existing `Choose a training plan...` text.
  out:
  - Any changes to authentication/session flow behavior.
constraints:
- Consume existing persisted profile data without altering auth semantics.
- Keep existing chooser flow and ordering unchanged.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/persistence-model.yaml
  - agent/design/api-contract.yaml
  optional:
  - agent/design/workout-capabilities.yaml
acceptance_criteria:
- id: ac-01
  statement: Workout select screen shows `Welcome back, <display_name>!` above existing
    chooser text for authenticated users.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with greeting render validated against persisted
      display name data.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - renderer
  - backend
handoff:
  review_focus:
  - Correct source of display_name and stable placement above chooser copy.
  - No regression to unauthenticated/session-invalid handling paths.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 satisfied; workout select rendering now shows `Welcome back,
      <display_name>!` above the existing chooser copy for authenticated users with
      a non-empty display name, while preserving existing behavior when user identity
      data is missing.
    evidence: Start-screen state now carries authenticated profile identity via `sessionUser`
      on `StartScreenState` (`renderer/src/workout-types.ts`) and app-root passes
      it through to start-screen render paths (`renderer/src/pb-app-root.ts`); both
      renderer implementations add greeting output directly before the chooser copy
      line with escaped display name and whitespace-trim suppression when absent (`renderer/src/pb-start-screen.ts`,
      `renderer/src/workout-render.ts`); tests cover start-screen greeting placement/order
      and app-root session-user wiring (`renderer/src/pb-start-screen.test.ts`, `renderer/src/workout-render.test.ts`,
      `renderer/src/pb-app-root.test.ts`).
    runtime_build_check: Finalize accept quality gate was executed via `agent/scripts/task/review-item/finalize.sh
      06 accept`; `make check-renderer` passed (including lint, unit, coverage, and
      UI smoke), but finalize failed on `agent/scripts/check/verify-api-contract-alignment.sh`
      with "API surface changed without updating agent/design/api-contract.yaml",
      so transition to done did not complete.
    residual_risk: Low; greeting render suppression is implemented for missing/blank
      display names but blank/whitespace cases are not covered by a dedicated assertion.
