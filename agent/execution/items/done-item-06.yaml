version: 1
kind: backlog_item
item:
  id: pb-038-item-06
  title: Renderer login and settings updates for login identity
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Update renderer authentication UX to submit login+password and show login
    identity in settings.
  rationale: Expose the new auth contract to users while preserving single-user blank-login
    behavior.
scope:
  in:
  - Update renderer login screen to include separate login and password fields with
    no client-side required validation.
  - Ensure blank login can be submitted.
  - Update settings display to show user login instead of user id.
  - Add/update renderer tests for login form submission payload and settings display
    behavior.
  out:
  - Backend secret verification implementation.
  - Database schema and seed ownership changes.
constraints:
- Preserve established renderer patterns and i18n/copy conventions.
- Avoid introducing additional client-side validation requirements.
inputs:
  required:
  - agent/execution/plan.yaml
  - renderer
  - agent/design/api-contract.yaml
  optional:
  - agent/design/workout-use-cases.yaml
acceptance_criteria:
- id: ac-01
  statement: Renderer login and settings flows reflect login-based identity and permit
    blank login/password submissions client-side.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer quality checks pass with updated UI and tests.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - renderer
  - api
handoff:
  review_focus:
  - Login payload shape, blank-input behavior, and settings identity rendering.
review_feedback:
- at: '2026-04-10T07:46:27Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01 verification gate completion\n  evidence:\
    \ 'Accept-finalize for review item 06 ran the deterministic gate using source\n\
    \    commit 3055cd06757fbffcd5f2014eb2b6f4cbae7ae642; `make check-renderer` passed,\n\
    \    but `agent/scripts/check/verify-api-contract-alignment.sh` failed with `API\
    \ contract\n    alignment failed: API surface changed without updating agent/design/api-contract.yaml`.'\n\
    \  risk: Merging renderer login payload changes without matching API-contract\
    \ alignment\n    can cause renderer/backend contract drift and break generated\
    \ client parity expectations\n    enforced by quality gates.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 met: renderer login submission and settings identity behavior
      align with login-based auth scope, including blank login/password submit handling.'
    evidence: renderer/src/pb-login.ts submits `{ login, password }` directly from
      form values without required validation; renderer/src/pb-login.test.ts verifies
      populated and blank credential payloads; renderer/src/auth-gate.ts forwards
      login payload to `/auth/login` as JSON and renderer/src/auth-gate.test.ts asserts
      request shape; renderer/src/pb-settings-screen.ts renders "User login" from
      `sessionUser.login` and renderer/src/pb-settings-screen.test.ts plus renderer/src/pb-app-root.test.ts
      verify login identity display in settings.
    runtime_build_check: 'make check-renderer: pass (executed during review; command
      exited 0).'
    residual_risk: 'Low: settings login display falls back to "Unavailable" when session
      login is missing, which can expose incomplete session payloads but does not
      block authentication.'
