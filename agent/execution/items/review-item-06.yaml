    completion screens
  - update primary/secondary action colors so complete-set and equivalent primary
    actions read green while orange is used as accent/secondary emphasis
  out:
  - workout state logic, interaction semantics, and API behavior
  - web-component migration or rendering architecture changes
constraints:
- keep renderer interaction model unchanged (innerHTML plus data-action delegation)
- preserve existing copy and information hierarchy except where color styling is adjusted
- do not change variant-name visibility behavior in this item
