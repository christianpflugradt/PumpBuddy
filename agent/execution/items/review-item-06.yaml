version: 1
kind: backlog_item
item:
  id: pb-032-item-06
  title: Enforce running-timer navigation lockouts and cross-mode compatibility coverage
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Running timed sets block navigation/complete-set actions and are verified
    across unilateral, stationless, and per-side-load scenarios.
  rationale: Protect workout state integrity during active timers and prove compatibility
    for high-risk mode combinations.
scope:
  in:
  - Enforce deterministic lockout behavior while a `SECS` timer is running for complete-set
    and previous/next navigation actions.
  - Add/update tests that cover lockout behavior and resume safety.
  - Add regression tests for `SECS` with unilateral tracking, stationless variants,
    and per-side load modes.
  out:
  - New repetition kinds or unrelated UI flow redesign.
constraints:
- Lockout behavior must be deterministic and user-visible through disabled or rejected
  interactions.
- Compatibility tests should cover boundary combinations without introducing brittle
  overbroad UI automation.
- Maintain existing configured-gym/free-mode invariants.
inputs:
  required:
  - renderer/src/workout-controller.ts
  - renderer/src/pb-exercise-screen.ts
  - renderer/src/*test.ts
  - backend/tests/api_workouts.rs
  - backend/tests/persistence_integration.rs
  optional:
  - renderer/src/workout-state.ts
  - agent/design/workout-use-cases.yaml
acceptance_criteria:
- id: ac-01
  statement: Running `SECS` timers prevent complete-set and previous/next navigation
    actions until paused.
  verification:
    type: command
    command: make check-renderer
    expected: Command exits successfully with tests asserting lockout behavior while
      timer is running.
- id: ac-02
  statement: Regression coverage confirms `SECS` compatibility for unilateral, stationless,
    and per-side load scenarios.
  verification:
    type: command
    command: make check
    expected: Command exits successfully with combined backend/renderer coverage for
      the targeted compatibility edges.
execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
  - renderer
  - backend
handoff:
  review_focus:
  - Validate lockout edge cases and cross-mode compatibility assertions map to documented
    use-case constraints.
review_feedback: []
review_result: null
