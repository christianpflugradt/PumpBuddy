version: 1
kind: backlog_item
item:
  id: pb-050-item-06
  title: Final hierarchy polish and cross-screen consistency sweep
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Perform a focused final polish pass that keeps the trend hero visually
    primary, reduces nested-card heaviness, and aligns labels/threshold language with
    related screens.
  rationale: A dedicated consistency and hierarchy pass prevents design-language drift
    before final acceptance.
scope:
  in:
  - Adjust spacing, typography emphasis, and card treatments in exercise variant detail
    for cohesive hierarchy.
  - Reconcile labels and threshold/basis phrasing with Exercises, Progress, History
    detail, and Workout Completion.
  - Update/extend renderer tests to lock in final copy and structure expectations
    for the refined screen.
  out:
  - Broad redesign of unrelated screens.
  - Introduction of new theme tokens or global style-system overhauls.
constraints:
- Keep existing dark mobile-first visual direction and restrained accent approach.
- Reuse established shared classes and tokens where possible instead of introducing
  one-off styling primitives.
- Avoid behavioral regressions to navigation and existing screen interactions.
inputs:
  required:
  - agent/execution/plan.yaml
  - renderer/src/pb-exercise-variant-detail-screen.ts
  - renderer/src/styles.scss
  - renderer/src/pb-exercise-variant-detail-screen.test.ts
  optional:
  - renderer/src/pb-exercises-screen.ts
  - renderer/src/pb-progress-screen.ts
  - renderer/src/pb-history-detail-screen.ts
  - renderer/src/pb-workout-complete-screen.ts
acceptance_criteria:
- id: ac-01
  statement: Exercise variant detail preserves hero prominence and uses consistent
    labels/copy thresholds with related screens without introducing design drift.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer quality checks pass and updated assertions confirm copy/structure
      consistency for the final polished screen.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: low
  boundary_impact:
  - renderer/src/pb-exercise-variant-detail-screen.ts
  - renderer/src/styles.scss
  - renderer/src/pb-exercise-variant-detail-screen.test.ts
  - renderer/src/pb-exercises-screen.ts
  - renderer/src/pb-progress-screen.ts
  - renderer/src/pb-history-detail-screen.ts
  - renderer/src/pb-workout-complete-screen.ts
handoff:
  review_focus:
  - Check visual hierarchy changes are meaningful but restrained and consistent.
  - Verify cross-screen terminology alignment and absence of unintended copy regressions.
review_feedback: []
review_result: null
