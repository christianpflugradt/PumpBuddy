version: 1
kind: backlog_item
item:
  id: pb-040-item-06
  title: Surface login name and registration date in settings data flow
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Settings data contract and backend/renderer mapping provide current user
    login name and registration date for display.
  rationale: Enables the upgraded settings profile view requirements with explicit
    session/profile fields.
scope:
  in:
  - Extend session/profile payloads to include login name and registration date fields
    for the current user.
  - Map backend response fields into renderer settings state and render date-only
    output in user-local timezone.
  out:
  - Display-name edit interaction controls.
  - Auth-failure logging behavior.
constraints:
- Preserve existing authentication/session trust boundaries and avoid exposing sensitive
  credentials.
- Keep user-facing copy in English unless explicitly changed.
inputs:
  required:
  - agent/design/api-contract.yaml
  - backend/src/api/models.rs
  - renderer/src/pb-settings-screen.ts
  optional:
  - renderer/src/pb-settings-screen.test.ts
acceptance_criteria:
- id: ac-01
  statement: Settings view can render login name and registration date from current-session/profile
    data.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer settings tests pass with new fields displayed.
- id: ac-02
  statement: Backend/API mapping supports session/profile response fields for login
    name and registration date.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality/test suite passes with updated response models.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - api
handoff:
  review_focus:
  - Contract/backend/renderer alignment for new settings-facing session user fields.
review_feedback: []
review_result: null
