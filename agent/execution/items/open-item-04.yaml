version: 1
kind: backlog_item

item:
  id: pb-021-item-04
  title: Align active workout persistence for selected option fields
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Ensure selected plan option, variant, and station are consistently validated and persisted across active and completed workout flows.
  rationale: Cross-layer consistency is required so renderer state, API payloads, and DB rows never drift.

scope:
  in:
    - Update backend/domain/API wiring so selected_plan_exercise_option_id, selected_variant_id, and selected_station_id stay coherent in create/update/complete paths.
    - Enforce validation rules that prevent inconsistent combinations.
    - Add backend tests for active-workout create/update/complete persistence and projection behavior.
  out:
    - Redesign of unrelated workout fields.
    - Large persistence refactors outside selection consistency.

constraints:
  - Preserve user-scoped workout query/write guarantees.
  - Keep API contract-first alignment with openapi schema updates as needed.
  - Do not introduce browser-to-database coupling.

inputs:
  required:
    - agent/execution/plan.yaml
    - agent/design/api-contract.yaml
    - agent/design/persistence-model.yaml
    - agent/design/workout-use-cases-to-domain-model.yaml
  optional:
    - agent/design/domain-model.yaml

acceptance_criteria:
  - id: ac-01
    statement: Backend tests verify selection fields are validated and persisted consistently for active workout create/update/complete and history projection.
    verification:
      type: command
      command: cargo test --manifest-path backend/Cargo.toml active_workout_selection_consistency
      expected: Test suite passes with explicit assertions for selected option, variant, and station field consistency.

execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
    - backend
    - api
    - database

handoff:
  review_focus:
    - No mismatch between selected_plan_exercise_option_id and selected_variant_id/selected_station_id.
    - Completion and history surfaces preserve selected fields from active state.

review_feedback: []
review_result: null
