version: 1
kind: backlog_item

item:
  id: pb-032-item-04
  title: Update API contract and handlers for repetition kind/value payloads
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: API contract and backend handler/model serialization expose repetition kind/value consistently for active and completed sets.
  rationale: Keep contract-first flow intact and prevent drift between backend behavior and renderer integration.

scope:
  in:
    - Update canonical API contract/model definitions for set payload repetition kind/value fields.
    - Regenerate/update backend API models and handlers to parse/emit the revised set fields.
    - Add API-layer tests covering both `REPS` and `SECS` serialization/validation paths.
  out:
    - Renderer-side timer controls and interaction lockouts.

constraints:
  - OpenAPI contract remains the canonical authority.
  - API and implementation changes must land together.
  - No manual edits to generated artifacts if regeneration is required.

inputs:
  required:
    - agent/design/api-contract.yaml
    - backend/src/api/models.rs
    - backend/src/api/handlers/workouts.rs
    - backend/tests/api_workouts.rs
  optional:
    - backend/src/domain.rs

acceptance_criteria:
  - id: ac-01
    statement: Contract and API models include repetition kind/value for relevant request/response set payloads.
    verification:
      type: command
      command: rg "repetition_kind|repetition_value|REPS|SECS" agent/design/api-contract.yaml backend/src/api/models.rs backend/src/api/handlers/workouts.rs
      expected: Matches show contract and implementation fields align for both repetition kinds.
  - id: ac-02
    statement: API tests verify serialization and validation behavior for both repetition kinds.
    verification:
      type: command
      command: make check-backend
      expected: Command exits successfully with API tests covering `REPS` and `SECS`.

execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
    - api
    - backend

handoff:
  review_focus:
    - Check contract/implementation parity and generated-model hygiene.

review_feedback: []
review_result: null
