version: 1
kind: backlog_item

item:
  id: pb-023-item-04
  title: Enforce profile-stepped load adjustments and start-load suggestions
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Implement configured-gym load decrement/increment and initial suggested load behavior strictly from the selected station load profile rules.
  rationale: UC-03 requires profile-constrained load behavior and realistic start-load defaults to prevent invalid intermediate values.

scope:
  in:
    - implement `+/-` stepping to move only across valid profile-defined loads for configured-gym exercises
    - implement initial suggested-load rules for bounded discrete profiles and formula/min-step profiles
    - add backend tests for stepping boundaries, non-uniform steps, and suggestion edge cases
  out:
    - free-mode load input behavior changes
    - visual/frontend copy changes not needed for behavioral correctness

constraints:
  - preserve kg as canonical load logic
  - avoid generating invalid intermediate loads between valid profile values
  - keep deterministic behavior for persisted and resumed exercises

inputs:
  required:
    - backend/src
    - backend/tests
    - agent/design/domain-model.yaml
    - agent/design/workout-use-cases.yaml
    - agent/execution/plan.yaml
  optional:
    - backend/init.sql
    - agent/design/persistence-model.yaml

acceptance_criteria:
  - id: ac-01
    statement: Configured-gym load decrease/increase always returns the previous/next valid profile value and never outputs invalid intermediary loads.
    verification:
      type: command
      command: cargo test --manifest-path backend/Cargo.toml
      expected: Tests pass with assertions for profile-step transitions and boundary conditions.
  - id: ac-02
    statement: Initial suggested load follows profile rules (near 30 percent for bounded discrete; 20 kg or next valid above 20 for formula/min-step profiles).
    verification:
      type: command
      command: rg -n "30|20|suggest" backend/src backend/tests
      expected: Implementation and tests document and verify the start-load suggestion rules.

execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
    - backend

handoff:
  review_focus:
    - strict profile-step correctness and boundary handling
    - start-load suggestion rule fidelity
    - configured-gym versus free-mode behavior separation

review_feedback: []
review_result: null
