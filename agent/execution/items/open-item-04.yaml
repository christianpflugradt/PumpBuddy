version: 1
kind: backlog_item
item:
  id: pb-055-item-04
  title: Build renderer Gyms list navigation
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Add a top-level Gyms screen that lists gyms in the required two-line row layout and opens gym detail.
  rationale: Gives users an entry point to browse gym transparency data from the main navigation.
scope:
  in:
    - Add renderer state, data loading, and navigation action handling for the Gyms top-level screen.
    - Add the Gyms entry to existing side menus while preserving burger-menu behavior on list screens.
    - Render gyms in a history-style row with gym name first, then last visited and station count separated by a dot, plus a chevron drill-down affordance.
    - Open gym detail when a gym row is clicked.
  out:
    - Gym detail station/exercise sheet views.
    - Station detail screen and load profile popup.
    - Backend endpoint implementation.
constraints:
  - Reuse existing Web Component and pb-ui-action patterns.
  - Preserve existing workout, history, progress, exercises, settings, about, and logout navigation behavior.
  - Keep user-facing copy in English.
inputs:
  required:
    - agent/execution/plan.yaml
    - renderer/src/workout-types.ts
    - renderer/src/workout-api.ts
    - renderer/src/openapi-contract.ts
    - renderer/src/pb-app-root.ts
    - renderer/src/workout-controller-navigation.ts
    - renderer/src/workout-controller-screen-data.ts
    - renderer/src/pb-history-screen.ts
    - renderer/src/styles.scss
  optional:
    - renderer/src/pb-history-screen.test.ts
    - renderer/src/pb-app-root.test.ts
    - renderer/src/workout-controller.test.ts
    - renderer/src/workout-api.test.ts
acceptance_criteria:
  - id: ac-01
    statement: Users can navigate to a Gyms screen from side menus and see gym rows with name, last-visited text, station count, and chevron drill-down affordance.
    verification:
      type: command
      command: make check-renderer
      expected: Renderer checks pass with component or controller coverage for Gyms navigation and row rendering.
  - id: ac-02
    statement: Clicking a gym row transitions to a gym detail view state without losing the selected gym id.
    verification:
      type: command
      command: make check-renderer
      expected: Renderer checks pass with navigation coverage for opening gym detail from the Gyms list.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
    - renderer-navigation
    - renderer-state
    - renderer-api-client
    - renderer-ui
handoff:
  review_focus:
    - Side-menu additions are consistent across list screens and do not break existing routes.
    - Gym row markup follows the existing history-row affordance closely enough to feel native.
review_feedback: []
review_result: null
