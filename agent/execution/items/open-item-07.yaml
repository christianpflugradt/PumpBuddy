version: 1
kind: backlog_item
item:
  id: pb-062-item-07
  title: Finish preview and historical-profile detail restrictions
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Read-only historical profile detail behavior with warning-confirmed renames
    and a reusable preview popup aligned to workout load expansion rules.
  rationale: The slice is incomplete until users can inspect effective loads and understand
    why active or inactive profiles preserve definition meaning.
scope:
  in:
  - Render read-only definition fields for active and inactive profiles while allowing
    rename initiation.
  - Require explicit warning confirmation before saving active or inactive profile
    renames.
  - Reuse backend-provided load-profile detail preview values in a reusable popup
    aligned with the station-detail inspection pattern.
  - Add renderer regression coverage for historical-profile edit restrictions, preview
    popup behavior, and detail-screen warning flows.
  out:
  - Activation or inactivation workflows.
  - Generalized popup-system redesign beyond reuse of the existing load inspection
    pattern.
constraints:
- Reuse the station-detail load-profile popup interaction baseline instead of inventing
  a new modal pattern.
- Keep preview semantics sourced from the dedicated load-profile detail boundary instead
  of recomputing them in the renderer.
- Do not allow renderer-side bypass of historical-profile immutability.
inputs:
  required:
  - agent/design/configurator-use-cases.yaml
  - agent/design/domain-model.yaml
  - agent/design/api-contract.yaml
  - agent/design/domain-context.md
  optional:
  - agent/execution/items/open-item-05.yaml
  - renderer/src/pb-gym-detail-screen.ts
  - renderer/src/pb-station-detail-screen.ts
acceptance_criteria:
- id: ac-01
  statement: Active and inactive profile detail views keep definition fields read-only
    and only persist renames after an explicit warning-confirmed flow.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer quality checks pass with coverage for historical-profile rename
      restrictions and warning-confirmed detail flows.
- id: ac-02
  statement: The preview popup shows backend-provided distinct sorted loads up to
    the configured max weight and is reachable from load profile detail flows.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer tests validate preview popup reachability, read-only rendering,
      and capped load-value presentation across the historical-profile slice.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - renderer/configurator
  - renderer/popup-patterns
  - renderer/openapi-boundary
handoff:
  review_focus:
  - Preview-source authority and max-load cap alignment at the renderer boundary.
  - Warning-confirmed rename UX for historically relevant profiles.
review_feedback: []
review_result: null
