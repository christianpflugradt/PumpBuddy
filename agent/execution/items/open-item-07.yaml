  - remove top kicker text labels such as Workout in progress and Workout complete from rendered screen headers
  - adjust header spacing so layout remains balanced after kicker removal
  - keep essential context content (plan plus gym, progress, exercise name, variant, completion summary) intact
  out:
  - changing business logic, state transitions, or CTA behavior
  - introducing new screen copy unrelated to compaction
constraints:
- preserve mandatory workout context visibility on the workout screen
- keep user-facing copy in english unless explicitly changed later
- do not modify variant-name visibility behavior in this item
