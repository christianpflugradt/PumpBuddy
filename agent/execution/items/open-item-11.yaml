version: 1
kind: backlog_item
item:
  id: pb-037-item-11
  title: Prefix load-based rep-range guidance with "try "
  status_hint: open
  source:
    type: finalize_return
    reference: agent/tmp/finalize-plan-findings.yaml
intent:
  outcome: Show load-based rep-range guidance as `try rep_min-rep_max` in the Current
    Set reps row.
  rationale: The missing prefix leaves the new centered rep-range guidance inconsistent
    with other prior-set guidance copy and blocks finalize acceptance.
scope:
  in:
  - Update load-based rep-range guidance formatting to include exact lowercase `try
    ` prefix when guidance is rendered.
  - Preserve existing conditional render rules requiring load with both rep bounds.
  out:
  - Changes to no-load reps/time suggestion lookup and formatting.
  - Changes to target-set button threshold behavior.
constraints:
- Prefix must be exact lowercase text `try `.
- Keep rep-range numeric formatting as `rep_min-rep_max` after the prefix.
inputs:
  required:
  - agent/design/workout-capabilities.yaml
  - agent/execution/plan.yaml
  optional: []
acceptance_criteria:
- id: ac-01
  statement: Load-based rep-range guidance renders as `try rep_min-rep_max` whenever
    rep-range guidance is shown.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with assertions validating prefixed rep-range guidance
      output.
execution:
  plan_item_required: true
  risk_level: medium
  boundary_impact:
  - renderer
handoff:
  review_focus:
  - Confirm exact prefix text for load-based rep-range guidance and no regressions
    in hide conditions.
