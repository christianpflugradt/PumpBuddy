version: 1
kind: backlog_item
item:
  id: pb-025-item-12
  title: Fix configured-gym fractional load step values failing profile validation
  status_hint: review
  source:
    type: finalize_return
    reference: stakeholder-report-2026-03-27
intent:
  outcome: Ensure incrementing or decrementing configured-gym station-based loads
    with fractional values (for example lbs-converted decimals) always produces profile-valid
    values that save successfully.
  rationale: Stakeholder reports the error "set.load_value must match selected station
    load profile values in configured-gym mode" still occurs when adjusting fractional
    load values, blocking normal workout progression.
scope:
  in:
  - Reproduce fractional load +/- paths where client-calculated values drift from
    allowed station profile values.
  - Fix load stepping and normalization so fractional values snap or clamp to exact
    profile-valid numbers before save.
  - Add regression coverage for decrement/increment flows with decimal profile values.
  out:
  - Relaxing backend configured-gym off-profile rejection rules.
  - Non-configured-gym load behavior changes.
constraints:
- Preserve strict rejection of genuinely off-profile station-based loads.
- Do not regress stationless no-load behavior.
inputs:
  required:
  - renderer/src/workout-state.ts
  - renderer/src/workout-interaction.ts
  - renderer/src/app.test.ts
  - backend/src/application/workouts.rs
  optional:
  - backend/src/persistence/active_workouts.rs
acceptance_criteria:
- id: ac-01
  statement: Configured-gym station-based loads with fractional profile values remain
    profile-valid after +/- interactions and no longer trigger profile-mismatch save
    errors.
  verification:
    type: command
    command: npm --prefix renderer test && cargo test --manifest-path backend/Cargo.toml
      active_workout_selection_consistency_rejects_off_profile_set_loads_in_configured_gym
    expected: Renderer tests pass with fractional stepping coverage and backend targeted
      validation test still passes for true off-profile values.
execution:
  plan_item_required: true
  risk_level: high
  boundary_impact:
  - renderer/workout-state
  - renderer/workout-interaction
  - renderer/tests
  - backend/application-validation
handoff:
  review_focus:
  - Verify decimal stepping does not produce floating-point drift that bypasses profile
    matching.
  - Verify save path accepts fractional profile-aligned values while still rejecting
    off-profile loads.
