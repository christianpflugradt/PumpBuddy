version: 1
kind: backlog_item
item:
  id: pb-061-item-04
  title: Filter history to completed workouts
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-consistency-findings.yaml
intent:
  outcome: GET /api/workouts returns only completed workouts, and renderer history
    remains aligned with that completed-workout contract.
  rationale: History is a completed-workout read model; active workout lifecycle is
    already modeled separately through /api/active-workout.
scope:
  in:
  - Add the completed_at IS NOT NULL filter to the backend history query.
  - Add backend coverage proving active workouts are excluded from workout history.
  - Review renderer history assumptions around nullable completed_at and keep behavior
    contract-aligned.
  out:
  - Do not redesign workout history grouping or workout detail payloads.
  - Do not change active workout resume/cancel/complete endpoints except as needed
    for tests.
constraints:
- Keep OpenAPI as the canonical contract.
- Preserve the separate active-workout lifecycle and completed-history lifecycle.
- Use make targets for verification.
inputs:
  required:
  - agent/design/api-contract.yaml
  - backend/src/persistence/workouts.rs
  - renderer/src/pb-history-screen.ts
  - agent/strategy/test-strategy.yaml
  optional:
  - renderer/src/pb-history-screen.test.ts
  - backend/src/persistence/tests.rs
acceptance_criteria:
- id: ac-01
  statement: GET /api/workouts excludes active workouts with completed_at NULL.
  verification:
    type: command
    command: make check-backend
    expected: Backend checks pass with coverage for active workout exclusion from
      history.
- id: ac-02
  statement: History UI behavior remains compatible with the completed-workout contract.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass after any contract-state or history-screen adjustments.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - backend persistence read model
  - OpenAPI history contract
  - renderer History screen
handoff:
  review_focus:
  - Verify active workouts cannot be returned by the history repository path.
  - Verify tests cover completed and active rows in the same user scope.
  - Verify renderer still handles documented nullable fields without treating active
    rows as history.
review_feedback:
- at: '2026-06-07T15:46:23Z'
  source: review-consistency:f-01
  notes: The OpenAPI contract defines GET /api/workouts as the completed-workout history
    list, but the backend history query returns every workout for the user, including
    active workouts with completed_at NULL.
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 are met. The backend history query now returns only
      completed workouts, and renderer history behavior remains compatible with the
      completed-workout contract without requiring an OpenAPI change.
    evidence: Reviewed commit c599b4c3 against review-item-04 and plan-item-04. backend/src/persistence/workouts.rs
      adds w.completed_at IS NOT NULL to fetch_workout_history while keeping user_id
      scoping and ordering. backend/tests/api_workouts.rs updates the GET /api/workouts
      API test to insert two same-user completed rows, one same-user active row with
      completed_at NULL, and one foreign-user completed row, then asserts only the
      two same-user completed ids are returned and completed_at is present.
    runtime_build_check: Implementation evidence recorded make check-backend passing,
      including the updated list_workouts_returns_user_scoped_completed_recency_order_and_duration_minutes
      test, and make check-renderer passing with renderer unit tests, coverage, build,
      and UI smoke. Review did not manually rerun full suites per task instruction;
      accept finalize will run the deterministic quality gate for the implementation
      commit.
    residual_risk: Residual risk is low. WorkoutHistorySummary.completed_at remains
      nullable in the OpenAPI contract and renderer keeps defensive fallback handling,
      but backend history now filters to completed rows and the API regression test
      guards against active-row leakage.
  findings: []
