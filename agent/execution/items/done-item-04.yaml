review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 met; backend tests now validate coherent selected option/variant/station
      handling and persistence across active workout lifecycle and completion history
      projection.
    evidence: backend/src/application/workouts.rs validates selected option/variant/station
      consistency before persistence, backend/src/persistence.rs threads selected_plan_exercise_option_id/selected_variant_id/selected_station_id
      through active workout writes and completion snapshot projection, application::workouts
      tests cover matching/mismatched combinations, and backend/tests/persistence_integration.rs::active_workout_selection_consistency_persists_through_completion_history_projection
      verifies values survive completion and history readback.
    runtime_build_check: Ran `cargo test --manifest-path backend/Cargo.toml active_workout_selection_consistency`
      (passed; 3 relevant tests across unit + persistence integration selectors).
    residual_risk: Coverage is targeted to selection-consistency scenarios and confirms
