version: 1
kind: backlog_item
item:
  id: pb-022-item-04
  title: Enrich workout completion screen metrics and return action
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Show full approved workout-complete metrics with labels and provide a working
    action to return to the start screen.
  rationale: Completion should provide meaningful feedback and a clear next-step action.
scope:
  in:
  - 'render metrics: Exercises Completed, Total Sets Completed, Total Reps, Total
    Weight Moved, Workout Duration, Volume per Minute'
  - ensure completion action returns user to start screen reliably
  - add/update tests for metric labels/values and return action behavior
  out:
  - adding historical analytics dashboards
  - changing backend persistence schema for completed workouts
constraints:
- metric computation and display must not break existing completion workflow
- labels must match plan success criteria exactly
inputs:
  required:
  - agent/execution/plan.yaml
  - renderer/src/workout-render.ts
  - renderer/src/workflow-orchestrator.ts
  - renderer/src/app.test.ts
  optional:
  - renderer/src/workout-state.ts
acceptance_criteria:
- id: ac-01
  statement: Workout complete screen displays all six approved metrics with exact
    labels and meaningful values.
  verification:
    type: command
    command: npm --prefix renderer run vitest:run -- src/app.test.ts
    expected: Completion-screen tests pass asserting metric labels and values.
- id: ac-02
  statement: Completion screen return action transitions back to the workout start
    screen.
  verification:
    type: command
    command: npm --prefix renderer run vitest:run -- src/app.test.ts
    expected: Tests confirm return action navigates to start-screen rendering state.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer/completion-ui
  - renderer/workflow-transitions
  - renderer/tests
handoff:
  review_focus:
  - verify exact metric labels match plan and are not regressed by formatting changes
  - verify return action clears completion view and restores start flow entry state
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 met: completion screen renders all six required metric labels
      with computed values (Exercises Completed, Total Sets Completed, Total Reps,
      Total Weight Moved, Workout Duration, Volume per Minute). ac-02 met: completion
      return action transitions the app back to the start screen state.'
    evidence: Reviewed renderer/src/workout-render.ts `computeCompletionMetrics` and
      `renderCompletionScreen` for exact label strings and computed values; reviewed
      renderer/src/workout-interaction.ts `return-to-start` click handling that resets
      viewState to start and clears completion state; reviewed renderer/src/app.test.ts
      completion flow assertions for all six labels plus `data-action="return-to-start"`
      followed by start-screen render assertions.
    runtime_build_check: pass - npm --prefix renderer run vitest:run -- src/app.test.ts
      (1 file, 30 tests passed).
    residual_risk: Low risk; coverage validates completion metric labels and return
      navigation path, with residual risk limited to future copy/action-name refactors
      that would require aligned test updates.
