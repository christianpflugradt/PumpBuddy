version: 1
kind: backlog_item
item:
  id: pb-027-item-04
  title: Align Cross-Screen Action Hierarchy and Responsive Spacing
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Apply a consistent action hierarchy and mobile-responsive spacing rules
    so primary actions are visually emphasized and secondary/tertiary actions are
    de-emphasized across all target screens.
  rationale: The redesign requires consistent interaction emphasis to reduce cognitive
    load and prevent accidental secondary-action focus.
scope:
  in:
  - unify primary, secondary, and tertiary button treatments on start, workout, and
    completion screens
  - ensure next/previous/cancel actions remain de-emphasized relative to complete-set
    and equivalent primary actions
  - tune responsive spacing and control sizing for iPhone-14-like viewport widths,
    preserving usable touch targets
  out:
  - workout business rules or action semantics changes
  - migration to a different rendering framework
constraints:
- keep implementation within current renderer architecture and event handling model
- avoid introducing large frontend frameworks or stack deviations
- keep user-facing copy in english unless explicitly changed later
inputs:
  required:
  - agent/execution/plan.yaml
  - renderer/src/styles.scss
  - renderer/src/workout-render.ts
  optional:
  - agent/tmp/pumpbuddy_workout_redesign_revised.md
acceptance_criteria:
- id: ac-01
  statement: Screen-level action classes and spacing rules consistently express primary
    versus secondary/tertiary emphasis and render without clipping at mobile viewport
    sizes.
  verification:
    type: command
    command: cd renderer && npm run build
    expected: command exits 0 and generated CSS includes updated action hierarchy
      and responsive rules
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - renderer/src/styles.scss
  - renderer/src/workout-render.ts
handoff:
  review_focus:
  - verify primary action emphasis is reserved for complete-set/start/return actions
    as intended
  - verify previous/next/cancel remain de-emphasized and responsive layout avoids
    clipped controls
review_feedback:
- at: '2026-03-28T13:26:31Z'
  source: review_result
  notes: "findings:\n- criterion: Quality gate for renderer code path must pass before\
    \ item can be accepted.\n  evidence: 'agent/scripts/task/review-item/finalize.sh\
    \ 04 accept failed in the deterministic\n    quality gate at renderer tests: src/app.test.ts\
    \ > createApp keeps finish separate\n    from set completion on the last exercise.\
    \ The assertion expects class=\"nav-button\n    nav-button-primary\" while current\
    \ render output includes additional action hierarchy\n    classes (class=\"nav-button\
    \ nav-button-primary action-button action-button-primary\"),\n    causing the\
    \ regex mismatch.'\n  risk: Merging without resolving this failure leaves the\
    \ renderer test suite red\n    for the implementation commit, reducing confidence\
    \ and allowing regressions to\n    ship without passing required automated checks.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 satisfied: start, workout, and completion screens consistently
      apply primary (nav-button-primary + action-button-primary), secondary (nav-button-secondary
      + action-button-secondary), and tertiary (nav-button-tertiary + action-button-tertiary)
      hierarchy classes; complete-set, start-workout, and return-to-start are primary
      while previous/next/finish/cancel remain de-emphasized.'
    evidence: renderer/src/workout-render.ts assigns hierarchy classes to Start Workout
      (line ~370), Complete Set (line ~533), Previous/Finish/Next (lines ~566-578),
      Cancel Workout (line ~588), and Return to Start (line ~660). renderer/src/styles.scss
      defines differentiated treatments for .nav-button-primary/.secondary/.tertiary
      and .action-button variants (~746-772), and includes responsive spacing/layout
      rules at max-width 640px and 430px (~981 and ~1054) to prevent clipped controls
      on iPhone-14-like widths.
    runtime_build_check: '`cd renderer && npm run build` exits 0 (vite build succeeded,
      output CSS generated at dist/assets/index-CYZjp0T_.css). `cd renderer && npm
      test` exits 0 with 5 test files and 75 tests passing, including the prior regression
      area in createApp finish/complete-set behavior.'
    residual_risk: 'Low residual risk: visual hierarchy and responsive behavior are
      covered by stable renderer structure tests, but pixel-perfect spacing differences
      may still vary slightly across device/browser combinations not explicitly snapshot-tested.'
