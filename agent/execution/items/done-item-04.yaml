version: 1
kind: backlog_item
item:
  id: pb-032-item-04
  title: Update API contract and handlers for repetition kind/value payloads
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: API contract and backend handler/model serialization expose repetition
    kind/value consistently for active and completed sets.
  rationale: Keep contract-first flow intact and prevent drift between backend behavior
    and renderer integration.
scope:
  in:
  - Update canonical API contract/model definitions for set payload repetition kind/value
    fields.
  - Regenerate/update backend API models and handlers to parse/emit the revised set
    fields.
  - Add API-layer tests covering both `REPS` and `SECS` serialization/validation paths.
  out:
  - Renderer-side timer controls and interaction lockouts.
constraints:
- OpenAPI contract remains the canonical authority.
- API and implementation changes must land together.
- No manual edits to generated artifacts if regeneration is required.
inputs:
  required:
  - agent/design/api-contract.yaml
  - backend/src/api/models.rs
  - backend/src/api/handlers/workouts.rs
  - backend/tests/api_workouts.rs
  optional:
  - backend/src/domain.rs
acceptance_criteria:
- id: ac-01
  statement: Contract and API models include repetition kind/value for relevant request/response
    set payloads.
  verification:
    type: command
    command: rg "repetition_kind|repetition_value|REPS|SECS" agent/design/api-contract.yaml
      backend/src/api/models.rs backend/src/api/handlers/workouts.rs
    expected: Matches show contract and implementation fields align for both repetition
      kinds.
- id: ac-02
  statement: API tests verify serialization and validation behavior for both repetition
    kinds.
  verification:
    type: command
    command: make check-backend
    expected: Command exits successfully with API tests covering `REPS` and `SECS`.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - api
  - backend
handoff:
  review_focus:
  - Check contract/implementation parity and generated-model hygiene.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: Acceptance criteria ac-01 and ac-02 are satisfied; the canonical
      API contract and API serialization paths include repetition kind/value fields
      and API tests exercise both REPS and SECS behavior.
    evidence: '`agent/design/api-contract.yaml` defines `repetition_kind`/`repetition_value`
      for `CreateWorkoutSetInput`, `ActiveWorkoutSetInput`, `CompletedActiveWorkoutSet`,
      and `ActiveWorkoutSet` with `REPS`/`SECS` enums; `backend/src/api/models.rs`
      validates repetition values, maps request payload `repetition_value` into domain
      sets, and emits `repetition_kind`/`repetition_value` in active-workout suggested/completed
      set responses via `parse_*_repetition_kind_response`; `backend/tests/api_workouts.rs`
      covers REPS payloads across create/update flows and includes `active_workout_secs_variant_serializes_repetition_kind_and_value`
      validating SECS serialization on create and resume.'
    runtime_build_check: Pending finalize quality gate execution via `agent/scripts/task/review-item/finalize.sh
      04 accept` (deterministic checks run by `agent/scripts/check/run-quality-gate.sh`).
    residual_risk: Low residual risk remains because create/update request validation
      enforces numeric repetition bounds but does not add kind-specific constraints
      beyond enum typing; current contract+model behavior still preserves consistent
      API representation for REPS and SECS.
