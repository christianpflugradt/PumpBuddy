version: 1
kind: backlog_item
item:
  id: pb-047-item-04
  title: Re-center workout rule authority in backend use-case services
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-architecture-findings.yaml
intent:
  outcome: Move business-rule decisions for workout execution semantics into backend
    application services with renderer reduced to UI orchestration only.
  rationale: Restoring single rule authority reduces drift, improves change safety,
    and aligns implementation with documented architecture constraints.
scope:
  in:
  - Extract server-owned workout rule decisions into backend/application services
    with explicit response fields for renderer consumption.
  - Replace renderer-internal rule derivation paths with backend-provided resolved
    semantics for set tracking, load interpretation, and fallback progression decisions.
  - Add regression coverage for aligned configured-gym and free-mode semantics across
    API and renderer.
  out:
  - Visual redesign or UX copy changes.
  - New workout features beyond existing contract semantics.
constraints:
- Preserve existing OpenAPI path surface unless explicitly approved.
- Keep renderer public/backend internal/database internal topology unchanged.
- Keep quality/test execution through Make targets only.
inputs:
  required:
  - agent/strategy/tech-stack.yaml
  - agent/strategy/engineering-guardrails.yaml
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - backend/src/application/workouts.rs
  - renderer/src/workout-state.ts
  - renderer/src/workflow-orchestrator.ts
  optional: []
acceptance_criteria:
- id: ac-01
  statement: Workout domain-rule decisions are backend-authored and renderer no longer
    computes canonical business semantics independently.
  verification:
    type: command
    command: make check
    expected: All backend and renderer quality checks pass with no rule-drift regressions.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: high
  boundary_impact:
  - renderer -> backend application
  - backend application -> persistence
handoff:
  review_focus:
  - Rule ownership for configured-gym versus free-mode behavior
  - Sequencing semantics for unilateral/bilateral sets
  - Load-input and repetition-kind interpretation consistency
review_feedback:
- at: '2026-04-21T09:25:33Z'
  source: review-architecture:f-01
  notes: The renderer currently implements and enforces domain-level workout semantics
    (load-input interpretation, unilateral sequencing, fallback progression shaping,
    timer/rep semantics), which conflicts with the guardrail that business logic should
    stay server-side and the renderer should remain thin.
- at: '2026-04-21T09:51:56Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01\n  evidence: Deterministic finalize quality\
    \ gate failed for the implementation source\n    commit (QUALITY_GATE_SOURCE_COMMIT=53df3bc023495b61d1d87b52b437fd3a6e202569).\n\
    \    agent/scripts/check/verify-api-contract-alignment.sh reported \"API surface\
    \ changed\n    without updating agent/design/api-contract.yaml\" for changed files\
    \ including renderer/src/workout-types.ts.\n  risk: Acceptance criterion verification\
    \ requires passing quality checks; shipping\n    API-facing semantic changes without\
    \ synchronized API-contract updates can reintroduce\n    contract drift and undermine\
    \ backend/renderer rule-authority alignment.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 satisfied: renderer rule-flow now consumes backend-owned
      set_tracking_mode/repetition semantics and no longer derives canonical unilateral
      sequencing from local completed-set heuristics.'
    evidence: renderer/src/workout-state.ts now hydrates and fallback-switches setTrackingMode
      from backend payload fields (`set_tracking_mode`) and resolves repetition kind
      from persisted backend workout semantics (`suggested_set.repetition_kind`/completed
      set repetition_kind); renderer/src/workout-state.test.ts adds regressions for
      configured-gym fallback switching and free-mode active-workout hydration to
      verify UNILATERAL/BILATERAL and REPS/SECS behavior alignment; agent/design/api-contract.yaml
      now records the workout semantics authority alignment note confirming no endpoint/path
      schema shape change while documenting backend-owned semantics consumption.
    runtime_build_check: Not run manually during review; finalize accept flow will
      execute deterministic quality gates via agent/scripts/check/run-quality-gate.sh.
    residual_risk: 'Low: backend authority now drives renderer behavior through existing
      API fields, with residual risk limited to legacy payloads that omit set_tracking_mode
      and therefore fall back to conservative bilateral defaults.'
