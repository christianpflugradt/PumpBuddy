version: 1
kind: backlog_item
item:
  id: pb-020-item-08
  title: Sync release documentation with boundary and tag semantics
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Update release documentation so deployment boundary guidance and GHCR tag
    examples match implemented workflow behavior.
  rationale: Remove operational drift and reduce incorrect release usage.
scope:
  in:
  - Update README release section to keep backend private and renderer public in examples.
  - Document actual GHCR tag shape emitted by release flow.
  out:
  - Full deployment runbook redesign.
constraints:
- Documentation must match effective workflow behavior.
inputs:
  required:
  - agent/execution/plan.yaml
  - README.md
  - .github/workflows/release.yaml
  optional:
  - agent/tmp/ReviewFindings.yaml
acceptance_criteria:
- id: ac-01
  statement: README examples preserve backend-private and renderer-public boundary
    guidance.
  verification:
    type: command
    command: rg "backend|renderer|private|public" README.md
    expected: Command output shows explicit boundary-consistent release guidance.
- id: ac-02
  statement: README documents the real GHCR image tag format used by release workflow.
  verification:
    type: command
    command: rg "ghcr.io|tag|version|semantic" README.md .github/workflows/release.yaml
    expected: Command output shows README tag examples aligned with workflow tag generation.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - release documentation accuracy
  - security boundary communication
handoff:
  review_focus:
  - Verify docs align with workflow behavior and security intent.
  - Check tag examples are precise and non-misleading.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 verified.
    evidence: README documents boundary intent with renderer public and backend internal
      (`README.md:30` and `README.md:155`), and release examples keep backend and
      renderer usage aligned with that boundary (`README.md:134-135`, `README.md:151-152`).
      Tag semantics are explicitly documented as semantic-release git tag passthrough
      (`README.md:137`) and match workflow publishing that uses `release_tag` unchanged
      for both GHCR images (`.github/workflows/release.yaml:23`, `:60`, `:87`, `:114`).
      Acceptance checks passed via `rg "backend|renderer|private|public" README.md`
      and `rg "ghcr.io|tag|version|semantic" README.md .github/workflows/release.yaml`.
    runtime_build_check: Not run; review performed via static documentation/workflow
      inspection and acceptance command checks.
    residual_risk: Release docs can drift again if workflow tag derivation or image
      naming changes without synchronized README updates.
