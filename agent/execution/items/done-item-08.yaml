- id: ac-01
  statement: Targeted state/API/screen tests raise line coverage materially in listed
    files and lock in key interactive behavior paths.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with additional behavior-focused tests and measurable
      coverage gains in targeted state/API/screen modules.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
