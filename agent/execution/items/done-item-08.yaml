version: 1
kind: backlog_item
item:
  id: pb-030-item-08
  title: Add regression coverage for unilateral and bilateral workflows
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Automated coverage protects unilateral behavior and bilateral compatibility
    across backend and renderer paths.
  rationale: Cross-layer behavior changes require durable regression protection to
    prevent flow drift.
scope:
  in:
  - Add backend tests for side-aware persistence, suggestion exact-match/fallback,
    and unilateral resume progression.
  - Add renderer tests for unilateral current-set phases and history-table bilateral/unilateral
    rendering.
  - Add assertions that bilateral paths remain behaviorally stable.
  out:
  - New product features beyond unilateral/bilateral set tracking behavior.
  - Non-test refactors not required by failing tests.
constraints:
- Tests must encode stakeholder-agreed rules directly, including right-from-left fallback
  and left-before-right sequencing.
- Test suite updates must remain maintainable and deterministic.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/strategy/test-strategy.yaml
  - backend/tests
  - renderer/tests
  optional:
  - backend/src
  - renderer/src
acceptance_criteria:
- id: ac-01
  statement: Test suite contains unilateral and bilateral regression cases for API/persistence,
    suggestions, resume flow, and UI rendering.
  verification:
    type: command
    command: make check
    expected: Quality gate passes with new or updated tests validating all agreed
      unilateral/bilateral rules.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend/tests
  - renderer/tests
handoff:
  review_focus:
  - Verify tests cover right-side fallback from just-completed left data.
  - Verify bilateral non-regression checks are explicit.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: Acceptance criterion ac-01 is met; the test suite now includes explicit
      unilateral and bilateral regression coverage for backend persistence, suggestions
      fallback priority, resume progression, and renderer current-set/history rendering.
    evidence: Backend regression coverage is explicit in `backend/tests/persistence_integration.rs`
      (side-distinct unilateral persistence with bilateral stability assertion plus
      unilateral right-side exact-match and right-from-left fallback suggestion cases)
      and `backend/tests/api_workouts.rs` (unilateral left completion persists immediately
      and resume returns on right side). Renderer regression coverage is explicit
      in `renderer/src/current-set-phase.test.ts` (unilateral defaults and right-side
      labels with bilateral canonical guard) and `renderer/src/completed-set-history.test.ts`
      (unilateral merged-row rendering with bilateral layout non-regression assertions).
    runtime_build_check: No ad-hoc full-suite checks were run during review per policy;
      accept finalize will run deterministic quality gates via the repository Makefile
      interface.
    residual_risk: Low residual risk; this review depends on deterministic finalize
      quality-gate execution for runtime confirmation, and there is no additional
      uncovered ambiguity in acceptance expectations.
