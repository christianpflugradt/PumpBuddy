version: 1
kind: backlog_item
item:
  id: pb-040-item-08
  title: Update design artifacts to variant terminology
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Design artifacts use training plan exercise variant terminology consistently
    across domain, persistence, and use-case mapping docs.
  rationale: Keeps architecture/design source documents synchronized with implemented
    naming and API language.
scope:
  in:
  - Update `agent/design/domain-model.yaml`, `agent/design/persistence-model.yaml`,
    and `agent/design/workout-use-cases-to-domain-model.yaml` terminology.
  - Preserve meaning of invariants, entity relationships, and persistence decisions
    while renaming terms.
  out:
  - Application runtime logic changes.
  - Additional feature behavior changes outside terminology alignment.
constraints:
- Keep design documents internally consistent with API contract and implementation
  naming.
- Maintain existing architectural intent and trust boundaries.
inputs:
  required:
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  optional:
  - agent/design/glossary.yaml
acceptance_criteria:
- id: ac-01
  statement: Target design artifacts no longer use active `plan_exercise_option` naming
    for current concepts.
  verification:
    type: command
    command: rg -n "plan_exercise_option|selected_plan_exercise_option_id" agent/design/domain-model.yaml
      agent/design/persistence-model.yaml agent/design/workout-use-cases-to-domain-model.yaml
    expected: Legacy term references removed or intentionally marked historical only.
- id: ac-02
  statement: Design terminology remains aligned with contract naming.
  verification:
    type: command
    command: rg -n "training_plan_exercise_variant|selected_training_plan_exercise_variant_id"
      agent/design/api-contract.yaml agent/design/domain-model.yaml agent/design/persistence-model.yaml
      agent/design/workout-use-cases-to-domain-model.yaml
    expected: Renamed terminology is consistently present across these design sources.
execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
  - docs
handoff:
  review_focus:
  - Terminology consistency across all specified design artifacts without semantic
    drift.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 are satisfied; the scoped design artifacts no longer
      use active `plan_exercise_option`/`selected_plan_exercise_option_id` naming
      and now consistently use `training_plan_exercise_variant`/`selected_training_plan_exercise_variant_id`
      terminology aligned with the API contract.
    evidence: Implementation commit `541e42a` updates only the intended design artifacts
      for terminology alignment (`agent/design/domain-model.yaml`, `agent/design/persistence-model.yaml`,
      `agent/design/workout-use-cases-to-domain-model.yaml`), with semantic structures
      preserved (entity relationships, invariants, persistence decisions, and use-case
      mappings retained while renamed); targeted verification command `rg -n "plan_exercise_option|selected_plan_exercise_option_id"
      agent/design/domain-model.yaml agent/design/persistence-model.yaml agent/design/workout-use-cases-to-domain-model.yaml`
      returned no matches, and `rg -n "training_plan_exercise_variant|selected_training_plan_exercise_variant_id"
      agent/design/api-contract.yaml agent/design/domain-model.yaml agent/design/persistence-model.yaml
      agent/design/workout-use-cases-to-domain-model.yaml` returned aligned references
      across contract and design sources.
    runtime_build_check: Not run manually during review by policy for this docs-scope
      item; accept finalize executes deterministic quality gates via `agent/scripts/check/run-quality-gate.sh`
      using implementation commit change scope.
    residual_risk: Low residual risk; this is terminology-only documentation alignment
      with no runtime logic changes, and no semantic drift was observed in reviewed
      invariants, relationships, or persistence intent.
