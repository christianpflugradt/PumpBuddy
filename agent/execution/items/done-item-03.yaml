version: 1
kind: backlog_item
item:
  id: pb-036-item-03
  title: Support Repeated Reverse-Order Set Deletion
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Repeated confirm-delete actions can remove all sets strictly in reverse
    creation order.
  rationale: Completes the LIFO deletion workflow and guards against stale indexing
    after each deletion.
scope:
  in:
  - Recompute latest deletable set after each successful deletion.
  - Allow continued deletion until no completed sets remain.
  - Keep delete affordance hidden when set history is empty.
  out:
  - Deleting skipped exercises.
  - Modifying set-recording creation behavior.
constraints:
- Preserve deterministic set ordering semantics for unilateral and bilateral histories.
- Do not introduce middle-row deletion affordances.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-use-cases.yaml
  - agent/strategy/test-strategy.yaml
  optional:
  - agent/design/workout-capabilities.yaml
  - agent/design/domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Users can repeatedly delete until history is empty, with each step removing
    only the current latest set.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with coverage for multi-step LIFO deletion through
      empty state.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer/workout-set-history-state-machine
handoff:
  review_focus:
  - Verify latest pointer/index recalculation after each deletion.
  - Verify edge behavior when one set remains and when none remain.
review_feedback:
- at: '2026-04-05T20:11:58Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01\n  evidence: Current tests cover latest-row\
    \ deletability and a single deletion mutation, but no explicit test currently\
    \ exercises repeated delete-confirm actions all the way to empty history in one\
    \ flow.\n  risk: Regressions in iterative pointer recalculation could pass current\
    \ checks while breaking multi-step LIFO deletion behavior at runtime.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 satisfied; repeated delete-confirm actions now remove only
      the latest completed set until history is empty.
    evidence: New regression coverage in renderer/src/workflow-orchestrator.test.ts
      exercises three consecutive persistDeleteLatestSet calls from a three-set exercise
      to empty history and verifies each persisted payload reflects current-state
      LIFO removal ([1,2,3]->[1,2]->[1]->[]). Orchestrator deletion logic in renderer/src/workflow-orchestrator.ts
      recalculates from current workout state each invocation and exits when completedSets
      is empty, preventing stale index reuse.
    runtime_build_check: Not run manually during review; accept finalize is configured
      to execute deterministic quality gates via agent/scripts/check/run-quality-gate.sh.
    residual_risk: Low; behavior is now covered for repeated bilateral deletion through
      empty state, with remaining risk primarily around future changes to shared completed-set
      ordering assumptions.
