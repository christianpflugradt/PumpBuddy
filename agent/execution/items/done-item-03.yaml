version: 1
kind: backlog_item
item:
  id: pb-026-item-03
  title: Correct Finish-Exercise Skip Dialog Branching
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Make finish-exercise confirmation treat an exercise as skipped only when
    zero sets are completed.
  rationale: Skip messaging should be driven by persisted completion state, not draft
    modifications on already-started exercises.
scope:
  in:
  - Adjust finish and forward-navigation confirmation branching logic so completed-set
    presence suppresses skip-style messaging.
  - Keep confirmation behavior that warns about discarding draft input when no set
    has been completed.
  out:
  - Changes to workout completion API payload structure or workflow transitions outside
    dialog branching conditions.
constraints:
- Use completed set count as the decisive condition for skip messaging in exercise-finish
  confirmation flows.
inputs:
  required:
  - agent/execution/plan.yaml
  - renderer/src/workout-state.ts
  - renderer/src/workout-interaction.ts
  - renderer/src/app.test.ts
  optional:
  - renderer/src/workout-controller.ts
acceptance_criteria:
- id: ac-01
  statement: Finish-exercise confirmation dialog shows skip-oriented copy only when
    the current exercise has zero completed sets.
  verification:
    type: command
    command: npm --prefix renderer run vitest:run -- src/app.test.ts -t "forward navigation
      confirmation depends on completed work and draft changes"
    expected: Confirmation behavior tests pass with branch decisions keyed to completed-set
      presence rather than draft edits alone.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer/src/workout-state.ts
  - renderer/src/workout-interaction.ts
  - renderer/src/app.test.ts
handoff:
  review_focus:
  - Validate dialog branch conditions for zero-completed-set and at-least-one-completed-set
    cases when draft fields are modified.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 satisfied: finish/forward confirmation now treats an exercise
      as skippable only when completed set count is zero.'
    evidence: renderer/src/workout-state.ts defines shouldConfirmForwardNavigation
      as !hasCompletedSets(exerciseStep), and hasCompletedSets is keyed to completedSets.length
      > 0. renderer/src/workout-interaction.ts uses this predicate for both next-exercise
      and finish-workout confirmation branching, keeping dialog behavior aligned to
      persisted completion state rather than draft edits.
    runtime_build_check: 'PASS: npm --prefix renderer run vitest:run -- src/app.test.ts
      -t "forward navigation confirmation depends on completed work and draft changes"
      (1 file, 1 test passed).'
    residual_risk: Low residual risk. The confirmation predicate is now centralized
      and explicit, but broader full-suite coverage for all finish-dialog edge cases
      still depends on existing integration-style app tests.
