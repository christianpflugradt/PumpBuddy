version: 1
kind: backlog_item
item:
  id: pb-028-item-03
  title: Enforce idx constraints and last-current fallback semantics
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Suggestion logic enforces historical index constraints and case 2-6 idx
    gating exactly.
  rationale: The plan and compact rule spec define strict index reuse and fallback
    behavior that must not regress.
scope:
  in:
  - enforce exact index-match-only historical reuse across rules
  - enforce idx==1 history usage for rules 2 through 6 and mandatory last_current
    fallback for idx>=2
  out:
  - load profile mapping mechanics
constraints:
- never reuse mismatched historical set index
- keep fallback behavior deterministic and explicit
inputs:
  required:
  - agent/tmp/set_rules_compact.md
  - backend/src/persistence/suggestions.rs
  - backend/src/persistence/tests.rs
  optional:
  - backend/tests/persistence_integration.rs
acceptance_criteria:
- id: ac-01
  statement: Rules 2 through 6 use history only at idx 1 and use last_current at idx
    2 and above when available.
  verification:
    type: command
    command: cargo test --manifest-path backend/Cargo.toml idx
    expected: targeted tests for idx gating and historical index matching pass
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend_persistence_suggestion_constraints
handoff:
  review_focus:
  - idx boundary behavior across all rule branches
  - exact historical index reuse constraints
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 satisfied: rules 2-6 only consult history for idx==1; idx>=2
      uses last_current when available; historical reuse requires exact set_index
      match.'
    evidence: Code path in backend/src/persistence/suggestions.rs enforces exact index
      match in fetch query and gates rules 2-6 behind idx==1. Integration tests suggestions_rule_1_idx_rejects_mismatched_historical_index_and_uses_last_current
      and suggestions_rules_2_to_6_use_last_current_when_idx_is_two_or_more pass.
    runtime_build_check: 'PASS: cargo test --manifest-path backend/Cargo.toml idx;
      PASS: cargo test --manifest-path backend/Cargo.toml suggestions.'
    residual_risk: Coverage for rules 3-6 at idx>=2 is represented by shared idx gate
      and rule ordering tests, but only rule-2 path is directly exercised for idx>=2
      in a dedicated integration test.
