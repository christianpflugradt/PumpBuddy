version: 1
kind: backlog_item
item:
  id: pb-052-item-03
  title: Revoke active session on logout
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-security-findings.yaml
intent:
  outcome: Ensure logout immediately invalidates the current server-side session token.
  rationale: Cookie clearing alone is not sufficient when a token is exfiltrated;
    server-side revocation must be part of logout semantics.
scope:
  in:
  - Add persistence support to revoke a session by token hash (set revoked_at and
    revoke_reason).
  - Update /auth/logout to read session cookie and revoke the matching session before
    returning 204.
  - Add backend tests proving revoked sessions fail subsequent authenticated requests.
  out:
  - Global session revocation for all devices.
  - Session UI or device management features.
constraints:
- Preserve current 204 plus clear-cookie response contract for successful logout.
- Do not expose internal revocation reason details in API responses.
inputs:
  required:
  - backend/src/api/auth.rs
  - backend/src/application/auth.rs
  - backend/src/persistence/auth.rs
  - backend/tests/api_auth.rs
  optional: []
acceptance_criteria:
- id: ac-01
  statement: After logout, the same cookie/session token is rejected on protected
    routes with 401.
  verification:
    type: command
    command: make check-backend
    expected: Backend tests pass and include coverage for logout-driven session revocation.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: high
  boundary_impact:
  - authentication_access_model
  - session_lifecycle
handoff:
  review_focus:
  - Server-side revocation path correctness
  - No regressions in existing auth response behavior
review_feedback:
- at: '2026-04-26T07:37:40Z'
  source: review-security:f-01
  notes: The logout handler only clears the browser cookie and never revokes the corresponding
    session row, so a stolen cookie remains usable until idle or absolute expiry.
- at: '2026-04-26T09:17:24Z'
  source: review_result
  notes: "findings:\n- criterion: quality-gate:api_contract_alignment\n  evidence:\
    \ 'agent/scripts/check/verify-api-contract-alignment.sh failed during review\n\
    \    finalize: backend/src/api/auth.rs changed in the implementation commit but\
    \ agent/design/api-contract.yaml\n    was not updated.'\n  risk: Cannot accept\
    \ until API contract alignment gate passes; downstream consumers\n    may drift\
    \ from implemented auth behavior.\n"
review_result:
  outcome: accept
  acceptance:
    criteria_met: Logout now revokes the active session server-side and the same token
      is rejected with 401 on subsequent protected access.
    evidence: backend/src/api/auth.rs logout handler revokes cookie-derived session
      token via application::logout_session before returning 204+clear-cookie; backend/src/application/auth.rs
      hashes token and calls repository.revoke_session with internal reason logout;
      backend/src/persistence/auth.rs revoke_session sets revoked_at and revoke_reason
      for active session rows; backend/tests/api_auth.rs::auth_logout_revokes_active_session_and_prevents_reuse
      verifies revoked_at/revoke_reason persisted and reusing the same cookie against
      GET /auth/session returns 401.
    runtime_build_check: '2026-04-26: make check-backend passed (unit, integration,
      persistence suites all green).'
    residual_risk: Logout remains scoped to the current session token only (global
      revoke-all-devices is intentionally out of scope).
  findings: []
