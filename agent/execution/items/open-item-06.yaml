version: 1
kind: backlog_item

item:
  id: pb-028-item-06
  title: Harden active workout response integration without contract drift
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Active workout application flow returns backend-computed suggested_set deterministically while preserving existing API contract semantics.
  rationale: Integration completion requires ensuring the deterministic backend logic reaches API responses with no contract drift.

scope:
  in:
    - validate application and API wiring in backend/src/application/workouts.rs and related handlers so suggested_set values are propagated unchanged from backend suggestion logic
    - verify no OpenAPI updates are required by comparing response shape behavior to current contract
  out:
    - introducing new active workout endpoints or payload fields

constraints:
  - preserve contract-first discipline and avoid surface expansion without explicit need
  - keep renderer free of set suggestion business logic

inputs:
  required:
    - backend/src/application/workouts.rs
    - backend/src/api/handlers/workouts.rs
    - agent/design/api-contract.yaml
    - backend/tests/api_workouts.rs
  optional:
    - renderer/src

acceptance_criteria:
  - id: ac-01
    statement: Active workout API behavior exposes expected suggested_set values from backend logic with no schema drift from the canonical OpenAPI contract.
    verification:
      type: command
      command: cargo test --manifest-path backend/Cargo.toml --test api_workouts
      expected: API workout integration tests pass and no contract mismatch issues are introduced

execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
    - backend_application_api_integration

handoff:
  review_focus:
    - propagation of backend suggestions to API response payloads
    - contract consistency against agent/design/api-contract.yaml

review_feedback: []
review_result: null
