item:
  id: pb-048-item-04
  title: Add exercises UI route and grouped list rendering
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Deliver renderer integration that adds the Exercises navigation entry and
    renders grouped variant performance data with client-side variant-name filtering.
  rationale: Expose backend-provided performance insights through Progress-aligned
    UX without introducing renderer-owned business rules.
scope:
  in:
  - Insert Exercises in side navigation between Progress and History and route to
    a new screen using existing banner/headline styling patterns.
  - Implement client-side substring filtering under the headline with clear action
    and full-list restore behavior.
  - Render grouped rows and per-row details from endpoint payload, including chevron
    affordance without click behavior.
  out:
  - Server-side search/filtering.
  - Variant detail navigation activation behind chevron.
constraints:
- Renderer must not recompute performance tone or station selection logic.
- Row details must include formatted first-set summary, session count, days-since-last,
  and variant label.
