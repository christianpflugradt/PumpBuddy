      and screen mount.
- id: ac-02
  statement: Filter input applies case-insensitive substring matching on variant name
    only and clear action restores the full in-memory dataset.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer tests pass for filter behavior and restore semantics.
