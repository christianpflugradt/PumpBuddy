version: 1
kind: backlog_item
item:
  id: pb-044-item-04
  title: Render grouped History workout list UI
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: History screen renders month-grouped, recency-first workout rows with required
    metadata formatting and inert chevron affordance.
  rationale: This delivers the user-visible History experience defined by the plan
    and stakeholder UI direction.
scope:
  in:
  - Implement month section grouping and ordering (newest month first, workouts newest
    first inside each section).
  - Render month labels in full month-year format (for example August 2026).
  - Render row headline as training plan name.
  - 'Render metadata line in exact order: weekday-short month-short day, gym name,
    duration minutes.'
  - Use centered dot separators between metadata values.
  - Render right-side chevron/arrow affordance and keep row click/tap intentionally
    inert.
  - Add/adjust renderer tests for date/metadata formatting, grouping, and inert-row
    behavior.
  out:
  - Workout detail drill-down destination and interaction.
  - Pagination, lazy loading, or list-size caps.
constraints:
- Align visual hierarchy and layout arrangement with approved UI reference direction.
- Preserve existing screen styles and responsiveness while adding History-specific
  styles.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/execution/items/open-item-03.yaml
  - renderer/src/pb-history-screen.ts
  - renderer/src/styles.scss
  optional:
  - renderer/src/pb-history-screen.test.ts
acceptance_criteria:
- id: ac-01
  statement: History UI displays correctly grouped sections and metadata lines in
    required format, with visible chevron affordance and no row interaction side effects.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer quality/test checks pass with assertions covering grouping
      order, metadata format, and inert row behavior.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - renderer_history_ui
handoff:
  review_focus:
  - formatting exactness (date pattern, separator, duration minutes) and grouping
    correctness under mixed-month datasets
review_feedback: []
review_result: null
