version: 1
kind: backlog_item
item:
  id: pb-053-item-07
  title: Separate renderer API adapters, workflow state, and UI control flow
  status_hint: review
  source:
    type: extended_review
    reference: agent/tmp/review-architecture-findings.yaml
intent:
  outcome: The workout renderer has one clear bootstrap owner, dedicated contract-adapter
    modules, and a slimmer UI/controller layer that no longer mixes app state with
    API DTOs.
  rationale: The current layering makes the renderer the default home for execution
    complexity even though strategy says business logic should stay server-side and
    the renderer should remain thin.
scope:
  in:
  - Choose a single owner for workout bootstrap and start-screen selection orchestration.
  - Split API DTOs and generated-contract adapters away from app-state and workflow-state
    modules.
  - Reduce the amount of execution-rule logic that is spread across controller, orchestrator,
    and state helpers.
  out:
  - Replacing web components or adopting a new frontend framework.
  - Changing user-facing workout behavior unless required to preserve server-owned
    invariants.
constraints:
- Preserve the current renderer technology baseline.
- Keep OpenAPI as the canonical contract source and avoid creating new handwritten
  boundary authorities.
inputs:
  required:
  - renderer/src/workout-controller.ts
  - renderer/src/workflow-orchestrator.ts
  - renderer/src/workout-state.ts
  - renderer/src/workout-types.ts
  - renderer/src/openapi-contract.ts
  - agent/strategy/tech-stack.yaml
  - agent/strategy/engineering-guardrails.yaml
  optional:
  - agent/design/api-contract.yaml
acceptance_criteria:
- id: ac-01
  statement: The renderer has a single owner for start-screen bootstrap and selection
    loading.
  verification:
    type: command
    command: rg -n "const loadStartScreenSelections =" renderer/src/workout-controller.ts
      renderer/src/workflow-orchestrator.ts
    expected: Exactly one bootstrap owner remains instead of duplicated controller
      and orchestrator definitions.
- id: ac-02
  statement: Renderer checks still pass after the layering split.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with the slimmer workflow layering in place.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - renderer_workflow_layer
  - contract_adapter_boundary
  - ui_state_modeling
handoff:
  review_focus:
  - Verify bootstrap and start-screen loading have exactly one orchestration owner.
  - Verify API DTOs are no longer mixed into the same modules that own app state and
    UI control flow.
