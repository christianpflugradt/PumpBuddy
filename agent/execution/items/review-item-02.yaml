  - align backend/src/persistence/active_workouts.rs and related persistence helpers
    to provide the variant, exercise, gym, and station candidate sets needed by the
    evaluator
  - ensure historical candidates are consistently ordered newest first before evaluation
  out:
  - unrelated workout lifecycle behavior changes
constraints:
- keep persistence access user-scoped and backend-internal
- avoid changing public route surface
inputs:
  required:
  - backend/src/persistence/active_workouts.rs
  - backend/src/persistence/workouts.rs
  - backend/src/persistence/suggestions.rs
  - agent/design/persistence-model.yaml
  optional:
  - backend/src/application/workouts.rs
acceptance_criteria:
- id: ac-01
  statement: Persistence-layer candidate retrieval returns stable, correctly scoped
    records used by rule evaluation without ambiguity.
  verification:
    type: command
    command: cargo test --manifest-path backend/Cargo.toml --test persistence_integration
    expected: persistence integration tests that cover active-workout suggestion retrieval
      pass
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
