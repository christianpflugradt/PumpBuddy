version: 1
kind: backlog_item
item:
  id: pb-021-item-02
  title: Guarantee seeded variant option parity with deterministic defaults
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Ensure all seeded exercise variants are selectable in configured-gym training-plan
    option flows with deterministic ordering and default behavior.
  rationale: Prevents dead or missing options and makes workout start behavior predictable.
scope:
  in:
  - Implement backend option resolution so seeded variants in backend/init.sql are
    represented in training-plan option selection.
  - Enforce deterministic selection_order and default-selection behavior (single option
    auto-select; multiple default to first).
  - Add focused tests that assert seed parity and ordering/default semantics.
  out:
  - In-workout fallback variant switching UX.
  - Badge and release metadata fixes.
constraints:
- Preserve configured_gym precondition that every exercise has at least one realizable
  option.
- Keep ordering driven by explicit selection_order semantics.
- Maintain compatibility with existing training plan option API response shape.
inputs:
  required:
  - agent/execution/plan.yaml
  - backend/init.sql
  - agent/design/workout-use-cases.yaml
  - agent/design/api-contract.yaml
  optional:
  - agent/design/workout-use-cases-to-domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Automated tests prove seeded exercise variants are available as selectable
    options and default ordering rules are enforced.
  verification:
    type: command
    command: cargo test --manifest-path backend/Cargo.toml seeded_variant_option_parity_and_ordering
    expected: Test suite passes and includes assertions for seed parity plus single/multi-option
      default behavior.
execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
  - backend
  - database
handoff:
  review_focus:
  - No seeded variant becomes unreachable in configured-gym option selection.
  - Default-selection behavior matches UC-02 rules exactly.
review_feedback: []
review_result: null
