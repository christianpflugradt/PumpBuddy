version: 1
kind: backlog_item
item:
  id: pb-062-item-02
  title: Define load profile list read boundary
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: A contract-first backend read boundary that lists user-scoped load profiles
    with status-aware ordering and renderer-ready summary fields.
  rationale: The configurator landing screen needs a durable list projection before
    any create or edit flow can be integrated safely.
scope:
  in:
  - Extend the OpenAPI contract and generated models for a load profiles list endpoint
    and summary payload.
  - Add backend domain, persistence, and handler support for user-scoped load profile
    list reads.
  - Apply non-inactive-first alphabetical ordering with inactive profiles grouped
    last and summary fields for name, status, definition kind, and usage transparency.
  out:
  - Create, update, rename, or delete write endpoints.
  - Renderer list-screen implementation.
constraints:
- Keep OpenAPI as the canonical API source and regenerate affected clients instead
  of editing generated files.
- Preserve thin transport boundaries and keep ordering semantics backend-owned.
- Do not introduce speculative configurator CRUD for gyms or exercises.
inputs:
  required:
  - agent/design/configurator-use-cases.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/api-contract.yaml
  optional:
  - backend/src/persistence/gyms.rs
  - backend/src/api/handlers/gyms.rs
acceptance_criteria:
- id: ac-01
  statement: Authenticated callers can retrieve load profile summaries through a documented
    API boundary that exposes the fields needed for the configurator list screen.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality checks pass with contract and API coverage for the load
      profile list endpoint.
- id: ac-02
  statement: List ordering and inactive separation rules are enforced server-side
    and covered by deterministic tests.
  verification:
    type: command
    command: make check-backend
    expected: Backend tests validate status-aware ordering and renderer-ready summary
      mapping.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - api/openapi
  - backend/api
  - backend/persistence
handoff:
  review_focus:
  - Contract-to-handler alignment and generated model refresh coverage.
  - User-scoped ordering behavior and summary-field completeness for renderer needs.
review_feedback:
- at: '2026-08-18T13:49:29Z'
  source: review_result
  notes: "findings:\n- criterion: ac-02\n  evidence: backend/src/persistence/load_profiles.rs:27-31\
    \ orders non-inactive rows\n    alphabetically with lp.id as a stable tie-breaker,\
    \ but backend/tests/api_workouts.rs:617-732\n    seeds only one new, one active,\
    \ and one inactive profile. The assertions at 727-732\n    prove inactive-last\
    \ for that fixture, yet they would still pass if non-inactive\n    rows were grouped\
    \ by status or otherwise misordered because no same-group alphabetical\n    or\
    \ tie-break case is exercised.\n  risk: A regression in backend-owned ordering\
    \ can slip through tests while the renderer\n    still depends on the API to deliver\
    \ stable alphabetical summaries, so acceptance\n    criterion ac-02 is not deterministically\
    \ enforced.\n"
  findings:
  - criterion: ac-02
    evidence: backend/src/persistence/load_profiles.rs:27-31 orders non-inactive rows
      alphabetically with lp.id as a stable tie-breaker, but backend/tests/api_workouts.rs:617-732
      seeds only one new, one active, and one inactive profile. The assertions at
      727-732 prove inactive-last for that fixture, yet they would still pass if non-inactive
      rows were grouped by status or otherwise misordered because no same-group alphabetical
      or tie-break case is exercised.
    risk: A regression in backend-owned ordering can slip through tests while the
      renderer still depends on the API to deliver stable alphabetical summaries,
      so acceptance criterion ac-02 is not deterministically enforced.
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01: The OpenAPI contract documents GET /api/load-profiles with
      the renderer-facing summary fields, and the backend domain/handler/persistence
      path maps id, name, status, definition_kind, weight_unit, and station_count
      through the authenticated user-scoped read boundary. ac-02: The persistence
      query enforces inactive-last alphabetical ordering with lp.id as a stable tie-breaker,
      and the integration test now covers mixed casing, duplicate display names, foreign-user
      exclusion, and inactive-last placement.'
    evidence: agent/design/api-contract.yaml:310-323 documents the authenticated list
      endpoint and backend-owned ordering semantics; agent/design/api-contract.yaml:1234-1268
      defines the LoadProfileSummary schema required by the configurator list. backend/src/persistence/load_profiles.rs:13-31
      implements user-scoped summary reads with inactive-last, case-insensitive alphabetical
      ordering and stable id tie-breaks. backend/src/api/handlers/load_profiles.rs:45-71
      maps the persistence/domain projection into the generated response model without
      bypassing the authenticated service boundary. backend/tests/api_workouts.rs:618-777
      seeds same-name and mixed-case fixtures, verifies summary field mapping and
      station counts, excludes foreign-user rows, and asserts the expected ordering
      relationships.
    runtime_build_check: Acceptance finalize runs agent/scripts/check/run-quality-gate.sh
      via agent/scripts/task/review-item/finalize.sh 02 accept; I did not run manual
      full-suite quality commands during review per repository policy.
    residual_risk: Low. The main remaining risk is future drift if additional status
      values or naming collation rules are introduced without corresponding contract
      and test updates, but the current acceptance scope is covered by deterministic
      endpoint assertions.
  findings: []
