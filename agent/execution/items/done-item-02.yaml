version: 1
kind: backlog_item
item:
  id: pb-039-item-02
  title: Rework configured-gym option realizability query
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Configured-gym option summaries derive realizability from variant-to-station
    compatibility for the selected gym.
  rationale: Station-required variants should be considered realizable only when compatible
    stations exist in the chosen gym, while stationless variants remain available.
scope:
  in:
  - Update option-summary persistence queries in `backend/src/persistence/training_plans.rs`.
  - Join `exercise_variant_equipment_compatibilities` and `equipment_stations` for
    selected gym filtering.
  - Preserve behavior for variants with `requires_station = false`.
  out:
  - Renderer messaging changes.
  - API payload shape changes beyond existing option summaries.
constraints:
- Treat compatibility mapping as the only source of station realizability for station-required
  variants.
- Do not reintroduce option-level gym filtering.
inputs:
  required:
  - backend/src/persistence/training_plans.rs
  - runtime/database/00-schema.sql
  - agent/design/persistence-model.yaml
  optional:
  - agent/design/workout-use-cases-to-domain-model.yaml
acceptance_criteria:
- id: ac-01
  statement: Configured-gym option summaries include only realizable variants for
    selected gym, plus stationless variants.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality and tests pass with updated realizability query logic.
execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
  - backend persistence layer
  - configured-gym option resolution
handoff:
  review_focus:
  - Validate SQL join correctness and selected-gym filtering semantics.
  - Validate stationless variant inclusion path remains intact.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 satisfied: configured-gym option summaries now gate station-required
      variants by selected-gym station compatibility while preserving stationless
      variants.'
    evidence: backend/src/persistence/training_plans.rs fetch_plan_exercise_option_summaries
      and fetch_plan_exercise_option_summaries_for_user build compatible_variant_stations
      from exercise_variant_equipment_compatibilities joined to equipment_stations
      filtered by selected gym (es.gym_id = $2::uuid) and then enforce realizability
      with WHERE (ev.requires_station = FALSE OR cvs.station_id IS NOT NULL); this
      keeps stationless variants available and excludes station-required variants
      with no compatible station in the selected gym; queries do not filter options
      by a plan-option gym field.
    runtime_build_check: Not run manually during review by policy; finalize accept
      will execute deterministic quality gate via agent/scripts/check/run-quality-gate.sh
      (includes make check-backend for this item).
    residual_risk: 'Low: option summaries return one row per compatible station for
      station-required variants, so downstream grouping assumptions must continue
      to treat station as part of summary identity.'
