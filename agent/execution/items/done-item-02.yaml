      rows after a successful login.
    runtime_build_check: This item is documentation-only. The acceptance verification
      command rg -n "auth_login_attempts" agent/design/persistence-model.yaml runtime/database/00-schema.sql
      matches both artifacts, and the implementation finalize flow for commit aa761d42
      passed repository document validation without changing runtime behavior.
    residual_risk: The documented throttle semantics remain coupled to the existing
