review_result:
  outcome: accept
  acceptance:
    criteria_met: The persistence model now documents auth_login_attempts alongside
      the existing auth persistence surfaces, including its throttle and lockout role
      and its hard-delete lifecycle after successful authentication.
    evidence: agent/design/persistence-model.yaml now adds auth_login_attempts to
