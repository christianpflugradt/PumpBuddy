version: 1
kind: backlog_item
item:
  id: pb-020-item-02
  title: Assert immutable version binding with integration coverage
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Add automated integration assertions that version binding remains unchanged
    from workout creation to completion.
  rationale: Prevent regressions by codifying c-01 invariants with positive and negative-path
    checks.
scope:
  in:
  - Add integration tests covering create, update, and complete lifecycle invariants
    for training_plan_version_id.
  - Add at least one negative-path assertion proving rebinding does not occur when
    a newer plan version exists.
  out:
  - Non-workout integration test refactors.
constraints:
- Tests must validate both happy-path lifecycle and rebinding rejection/non-occurrence
  behavior.
inputs:
  required:
  - agent/execution/plan.yaml
  - backend/src/persistence/active_workouts.rs
  - backend/tests
  optional:
  - agent/tmp/ReviewFindings.yaml
acceptance_criteria:
- id: ac-01
  statement: Integration tests explicitly assert that training_plan_version_id remains
    stable through update and completion.
  verification:
    type: command
    command: rg "training_plan_version_id" backend/tests
    expected: Command output includes lifecycle assertions for unchanged training_plan_version_id.
- id: ac-02
  statement: Test suite includes a negative-path case where a newer plan version exists
    but active workout remains bound to original version.
  verification:
    type: command
    command: rg "newer|latest|rebind|immutable" backend/tests
    expected: Command output includes a negative-path test scenario for rebinding
      prevention.
execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
  - backend integration tests
  - workout lifecycle quality gate
handoff:
  review_focus:
  - Confirm negative-path coverage is meaningful and not superficial.
  - Check assertions fail if rebinding behavior reappears.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 are satisfied by integration coverage in backend/tests/persistence_integration.rs.
    evidence: The test active_workout_update_and_completion_remain_immutable_when_newer_plan_version_exists
      creates an active workout, inserts a newer training_plan_versions row, then
      asserts training_plan_version_id is unchanged after both update_active_workout
      and complete_active_workout calls.
    runtime_build_check: '`cargo test --manifest-path backend/Cargo.toml --test persistence_integration
      -- --nocapture` passed with 11 passed and 0 failed.'
    residual_risk: Assertions are concentrated in one integration test path; additional
      scenarios with varied fixture shapes could improve confidence against future
      query-level regressions.
