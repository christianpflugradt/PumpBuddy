version: 1
kind: backlog_item

item:
  id: pb-048-item-01
  title: Define exercises performance endpoint contract
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Publish canonical API contract entries for the 30-day exercises performance endpoint and payload schema.
  rationale: Establish contract-first boundaries so backend and renderer can implement against a stable response model.

scope:
  in:
    - Add path, operation, and response schema for the new exercises performance endpoint in the canonical contract file.
    - Model grouped payload semantics, including tone groups and row display fields required by the renderer.
    - Encode selected-station average, variant-wide session count, and not-enough-data signaling as explicit schema fields.
  out:
    - Backend handler or query implementation.
    - Renderer UI behavior and client-side filtering logic.

constraints:
  - Keep naming and payload semantics aligned with existing Progress/Workout Completion tone vocabulary.
  - Preserve contract-first workflow using agent/design/api-contract.yaml as the source of truth.

inputs:
  required:
    - agent/execution/plan.yaml
    - agent/design/api-contract.yaml
  optional:
    - agent/design/workout-capabilities.yaml

acceptance_criteria:
  - id: ac-01
    statement: The canonical API contract declares one new exercises performance endpoint with request and response shapes that cover all renderer-required fields from the active plan.
    verification:
      type: command
      command: make refresh-api-clients
      expected: OpenAPI generator completes successfully for backend and frontend outputs without schema errors.
  - id: ac-02
    statement: Contract descriptions differentiate selected-station scoring aggregates from variant-wide session counts to prevent renderer-side business derivation.
    verification:
      type: command
      command: make check
      expected: Repository quality checks pass after the contract update.

execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
    - api-contract
    - backend-generated-openapi
    - renderer-generated-openapi

handoff:
  review_focus:
    - Endpoint naming and response shape match plan scope exactly.
    - Field semantics clearly separate selected-station and variant-wide metrics.

review_feedback: []
review_result: null
