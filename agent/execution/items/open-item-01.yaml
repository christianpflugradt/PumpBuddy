version: 1
kind: backlog_item

item:
  id: pb-036-item-01
  title: Add LIFO Delete Control To Active Workout Set History
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Render a delete control only for the latest completed set row in the current exercise set history.
  rationale: Enforces strict last-in-first-out deletion affordance and prevents out-of-order set removal attempts.

scope:
  in:
    - Add an X delete affordance on the far right of completed set rows in the active workout exercise view.
    - Show the delete affordance only for the most recently recorded completed set row.
    - Keep non-latest set rows non-deletable in the UI.
  out:
    - Persisting deletion mutations.
    - Confirmation modal behavior.

constraints:
  - Preserve existing web component architecture and current styling conventions.
  - Keep row layout stable while adding right-aligned delete affordance.

inputs:
  required:
    - agent/execution/plan.yaml
    - agent/strategy/engineering-guardrails.yaml
    - agent/strategy/test-strategy.yaml
  optional:
    - agent/design/workout-use-cases.yaml
    - agent/design/domain-model.yaml

acceptance_criteria:
  - id: ac-01
    statement: Completed set history renders a right-aligned delete X only on the newest set row for the current exercise.
    verification:
      type: command
      command: make check-renderer
      expected: Renderer quality checks pass with tests covering latest-row-only delete affordance visibility.

execution:
  plan_item_required: false
  risk_level: low
  boundary_impact:
    - renderer/workout-active-flow

handoff:
  review_focus:
    - Verify latest-set-only visibility logic across bilateral and unilateral set histories.
    - Verify no layout regressions in completed-set row rendering.

review_feedback: []
review_result: null
