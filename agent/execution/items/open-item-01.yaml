version: 1
kind: backlog_item

item:
  id: pb-026-item-01
  title: Establish Shared Workout Load Display Rule
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Define and centralize one canonical load rounding and formatting rule used by workout load UI surfaces.
  rationale: A single source of truth prevents drift between load input rendering and completed-set row rendering.

scope:
  in:
    - Introduce a shared load display helper usable by both load-input and completed-set rendering code paths.
    - Align helper behavior to two-decimal display semantics with trailing-zero trimming for equivalent values.
  out:
    - Changing persisted load precision or API payload serialization behavior.

constraints:
  - Preserve exact numeric values in workout state and payloads while only normalizing user-facing display text.

inputs:
  required:
    - agent/execution/plan.yaml
    - renderer/src/workout-state.ts
    - renderer/src/workout-render.ts
  optional:
    - renderer/src/workout-types.ts

acceptance_criteria:
  - id: ac-01
    statement: A single shared formatter exists and both workout-state load input formatting and workout-render load display formatting use it.
    verification:
      type: command
      command: npm --prefix renderer run vitest:run -- src/workout-state.test.ts src/workout-render.test.ts
      expected: Vitest passes and no duplicated competing load display formatter remains in the touched modules.

execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
    - renderer/src/workout-state.ts
    - renderer/src/workout-render.ts

handoff:
  review_focus:
    - Verify shared formatter semantics are applied consistently without introducing module coupling regressions.

review_feedback: []
review_result: null
