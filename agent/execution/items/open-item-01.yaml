version: 1
kind: backlog_item

item:
  id: pb-025-item-01
  title: Consolidate variant-station schema and seed source of truth
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: backend/init.sql models station compatibility only in exercise_variant_equipment_compatibilities while introducing explicit stationless variant semantics.
  rationale: The plan requires removing duplicated variant-station modeling and making seeds/schema consistent with the new compatibility contract.

scope:
  in:
    - Update exercise_variants schema and seeds with an explicit flag for stationless-capable variants.
    - Remove direct station linkage from plan_exercise_options schema, constraints, and seed inserts.
    - Adjust workout_sets nullability/check constraints so stationless variants can persist null load values.
  out:
    - Backend Rust query and validation refactors.
    - Renderer behavior changes.

constraints:
  - Keep seeded station-based flows valid and backward-compatible where possible.

inputs:
  required:
    - backend/init.sql
    - agent/design/persistence-model.yaml
  optional:
    - agent/design/domain-model.yaml

acceptance_criteria:
  - id: ac-01
    statement: init.sql no longer encodes variant-station compatibility in plan_exercise_options and includes stationless-capable variant modeling plus nullable workout-set load fields.
    verification:
      type: command
      command: rg -n "CREATE TABLE IF NOT EXISTS plan_exercise_options|CREATE TABLE IF NOT EXISTS exercise_variant_equipment_compatibilities|requires_station|load_display_value|load_canonical_kg" backend/init.sql
      expected: Output confirms compatibility table and stationless/load-null semantics are represented without plan option station linkage.

execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
    - backend/schema
    - backend/seeds

handoff:
  review_focus:
    - Verify no remaining plan_exercise_options.equipment_station_id dependency in schema and seed structure.
    - Verify workout set constraints allow null load while still rejecting negative values when present.

review_feedback: []
review_result: null
