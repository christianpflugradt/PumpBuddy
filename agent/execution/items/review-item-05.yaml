version: 1
kind: backlog_item
item:
  id: pb-058-item-05
  title: Exercise In Plan Detail Screen
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Build the Exercise-in-Plan Detail Screen showing position, overview, allowed
    variants, targets, and selected-gym availability details.
  rationale: Users need to inspect every configured variant for a plan exercise, including
    unavailable variants and target metadata that are not visible on the Plan Detail
    cards.
scope:
  in:
  - Add the Exercise-in-Plan Detail Web Component and app-root branch for a plan exercise
    route.
  - Render exercise position, exercise name, selected plan context, and compact overview
    metadata.
  - Render all allowed variants for the selected plan exercise in configured order.
  - Render TARGET content only when at least one of rep_min, rep_max, or target_sets
    exists.
  - Format minimum-only, maximum-only, bounded range, sets-only, combined target,
    and empty-target cases according to the stakeholder behavior.
  - In selected-gym mode, show each variant as Available or Not available with compact
    execution metadata.
  - In selected-gym mode, show compatible clickable station rows for available station-required
    variants and the direct "No compatible station in this gym" status for unavailable
    station-required variants.
  - In no-gym mode, omit availability status and station rows.
  out:
  - Starting or editing workouts from this screen.
  - Changing the existing Exercise Variant Detail or Station Detail content.
  - Adding explanatory legends, helper boxes, or general instructional copy.
constraints:
- Use backend response fields as the source of truth for variant availability and
  compatible station rows.
- Keep TrainingPlanExerciseVariant gym-agnostic in renderer naming and behavior; selected-gym
  station availability is contextual display data.
- Reuse existing dark detail-screen card styling and keep row hit targets stable across
  mobile and desktop.
- Keep user-facing copy compact and direct.
inputs:
  required:
  - agent/execution/plan.yaml
  - renderer/src/pb-gym-detail-screen.ts
  - renderer/src/pb-station-detail-screen.ts
  - renderer/src/pb-exercise-variant-detail-screen.ts
  - renderer/src/pb-app-root.ts
  - renderer/src/workout-controller-navigation.ts
  - renderer/src/workout-types.ts
  - renderer/src/styles.scss
  optional:
  - renderer/src/pb-exercise-variant-detail-screen.test.ts
  - renderer/src/pb-station-detail-screen.test.ts
  - renderer/src/pb-app-root.test.ts
acceptance_criteria:
- id: ac-01
  statement: Exercise-in-Plan Detail renders all allowed variants and conditionally
    renders TARGET content for min-only, max-only, bounded range, sets-only, combined,
    and empty-target cases.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass, including focused component tests for target formatting
      and omitted empty targets.
- id: ac-02
  statement: Selected-gym Exercise-in-Plan Detail shows Available or Not available
    per variant with compatible station rows or the direct unavailable-station status.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass, including component tests for stationless, single-station,
      multi-station, and unavailable station-required variants.
- id: ac-03
  statement: No-gym Exercise-in-Plan Detail omits availability status and station
    rows while still showing all configured variants.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass, including component tests for no-gym omission
      behavior.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - renderer_component
  - renderer_styles
  - renderer_contract_consumption
handoff:
  review_focus:
  - Verify unavailable variants remain visible.
  - Verify target formatting handles partial target data without noisy empty labels.
  - Verify no-gym mode does not render selected-gym availability concepts.
  - Verify station rows are only shown when a selected gym provides compatible stations.
review_feedback: []
review_result: null
