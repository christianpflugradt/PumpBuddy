version: 1
kind: backlog_item
item:
  id: pb-032-item-05
  title: Implement renderer timed-set controls and timer progression for SECS variants
  status_hint: review
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Renderer presents and runs the `SECS` control UX with spinner input, play/pause
    timer progression, reset behavior, and `m:ss` formatting.
  rationale: Deliver the user-facing timed set flow with precise control semantics
    and whole-second persistence.
scope:
  in:
  - Drive repetition-kind-aware UI behavior from variant metadata in workout state/controller/render
    flow.
  - Replace decrement with reset and increment with play/pause toggle for `SECS` variants.
  - Implement minute/second spinner editing (0-59 each), `m:ss` display formatting,
    and one-second count-up while running.
  - Ensure default `SECS` suggestion starts at `0:00` instead of using historical
    values.
  out:
  - Backend schema/domain/API changes.
constraints:
- Persist and transmit only integer total seconds for `SECS`.
- Timer interval is one-second granularity with no fractional display.
- Existing `REPS` variant behavior remains unchanged.
inputs:
  required:
  - renderer/src/workout-types.ts
  - renderer/src/workout-state.ts
  - renderer/src/workout-controller.ts
  - renderer/src/pb-exercise-screen.ts
  - renderer/src/workout-render.ts
  optional:
  - renderer/src/styles.scss
  - renderer/src/*test.ts
acceptance_criteria:
- id: ac-01
  statement: '`SECS` variants render timed controls and formatted values (`m:ss`)
    with spinner bounds of 0-59 per field.'
  verification:
    type: command
    command: rg "SECS|play|pause|reset|m:ss|spinner|seconds" renderer/src/workout-types.ts
      renderer/src/workout-state.ts renderer/src/workout-controller.ts renderer/src/pb-exercise-screen.ts
      renderer/src/workout-render.ts
    expected: Renderer code paths show timed controls, formatting, and value-editing
      semantics for `SECS` variants.
- id: ac-02
  statement: Renderer tests validate play/pause progression, reset behavior, and zero-based
    default suggestion for `SECS`.
  verification:
    type: command
    command: make check-renderer
    expected: Command exits successfully with updated timed-set interaction tests.
execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
  - renderer
handoff:
  review_focus:
  - Confirm timer state transitions and formatting are deterministic and do not regress
    `REPS` interactions.
review_feedback: []
review_result: null
