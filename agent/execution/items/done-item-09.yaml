version: 1
kind: backlog_item
item:
  id: pb-032-item-09
  title: Unify Rust toolchain pinning across CI and container builds
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-technology-findings.yaml
intent:
  outcome: One explicit Rust toolchain version governs local, CI, and Docker behavior.
  rationale: Aligns with compatibility and deterministic quality-gate expectations.
scope:
  in:
  - Add repository toolchain pinning (`rust-toolchain.toml` or equivalent).
  - Align CI and Docker references to the same pinned channel/version.
  out:
  - Broad dependency upgrades unrelated to toolchain alignment.
constraints:
- Preserve existing backend stack (axum/tokio/sqlx) and test strategy.
inputs:
  required:
  - /Users/cpf/Workspace/personal/PumpBuddy/backend/Dockerfile
  - /Users/cpf/Workspace/personal/PumpBuddy/.github/workflows/ci-quality.yaml
  - /Users/cpf/Workspace/personal/PumpBuddy/backend/Cargo.toml
  optional: []
acceptance_criteria:
- id: ac-01
  statement: Backend quality checks run under one declared Rust toolchain version
    across CI and local workflows.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality checks pass with no version-drift-related formatter/lint/compiler
      inconsistencies.
execution:
  plan_item_required: true
  risk_level: medium
  boundary_impact:
  - backend
  - docker
  - deps
handoff:
  review_focus:
  - Toolchain pin location and discoverability.
  - CI/container parity.
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 is satisfied because one explicit Rust toolchain line (`1.94`)
      now governs local workflows via `rust-toolchain.toml`, CI backend quality setup
      via `dtolnay/rust-toolchain@master` reading that file, and backend container
      builds via `ARG RUST_TOOLCHAIN=1.94`.
    evidence: Implementation commit `75b446f2157e78bb30524ec884aa0c48fb95c082` adds
      `rust-toolchain.toml` with `channel = "1.94"` plus `rustfmt`, `clippy`, and
      `llvm-tools-preview`; updates `.github/workflows/ci-quality.yaml` backend job
      to `dtolnay/rust-toolchain@master` and includes `rust-toolchain.toml` in path
      filters; and updates `backend/Dockerfile` to define `ARG RUST_TOOLCHAIN=1.94`
      used consistently in both Rust base images.
    runtime_build_check: Pending finalize quality gate execution.
    residual_risk: Low residual risk remains from manual lockstep maintenance between
      Docker ARG and rust-toolchain file, but discoverability is improved by explicit
      Dockerfile lockstep comment and a single repository-level toolchain source.
review_feedback:
- at: '2026-04-04T06:29:21Z'
  source: review-technology:f-02
  notes: Rust version selection is split between `rust:1.94` in Dockerfiles and floating
    `stable` in CI, with no repository-level toolchain pin file.
