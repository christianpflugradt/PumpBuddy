version: 1
kind: backlog_item
item:
  id: pb-056-item-09
  title: Align backend domain option and variant structs with the design model
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-architecture-findings.yaml
intent:
  outcome: Backend domain structs either match the canonical model or are renamed/removed
    when they are read projections rather than domain entities.
  rationale: Clear model names and fields keep future use-case work from treating
    legacy projection shapes as the domain source of truth.
scope:
  in:
  - Remove unused stale structs or add missing fields where the backend still models
    canonical entities.
  - Rename or document projection structs that intentionally include configured-gym
    station realization.
  - Keep production behavior and API payloads unchanged.
  out:
  - Changing database schema.
  - Changing OpenAPI payload shapes.
  - Moving renderer workflow behavior.
constraints:
- Preserve the canonical domain model as the naming authority.
- Avoid broad refactors beyond domain struct alignment.
- Use make targets for verification.
inputs:
  required:
  - agent/design/domain-model.yaml
  - backend/src/domain.rs
  - backend/src/persistence/training_plans.rs
  - backend/src/api/handlers/training_plans.rs
  optional: []
acceptance_criteria:
- id: ac-01
  statement: Backend domain structs no longer contradict ExerciseVariant.requires_station
    semantics or gym-agnostic TrainingPlanExerciseVariant naming.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality passes after the model cleanup.
execution:
  plan_item_required: false
  plan_item_skip_reason: This can be handled as isolated domain cleanup if it only
    removes unused structs and renames or documents projections without API or database
    changes.
  risk_level: low
  boundary_impact:
  - backend domain
  - backend persistence projections
handoff:
  review_focus:
  - Check that removed or renamed structs are truly unused or behavior-preserving.
  - Check that projection names make station/gym derivation explicit.
  - Check that no API contract fields change accidentally.
review_feedback:
- at: '2026-05-30T09:19:36Z'
  source: review-architecture:f-05
  notes: The canonical domain model says ExerciseVariant carries requires_station
    and that training plan exercise variants are gym-agnostic, but the backend's core
    domain structs do not fully reflect that shape. A legacy PlanExerciseOption embeds
    Gym while the active PlanExerciseOptionSummary projection carries gym-derived
    station fields, and ExerciseVariant omits requires_station.
- at: '2026-05-30T13:27:57Z'
  source: review_result
  notes: "findings:\n- criterion: ac-01 verification\n  evidence: Accept finalization\
    \ for source commit 69ed65ba failed in agent/scripts/check/verify-api-contract-alignment.sh\n\
    \    because backend/src/api/handlers/training_plans.rs changed while agent/design/api-contract.yaml\n\
    \    did not. The implementation intended no OpenAPI payload change, but the deterministic\n\
    \    review gate treats backend/src/api/** as API surface and blocks acceptance.\n\
    \  risk: The item cannot be accepted until the implementation either avoids API-surface-path\n\
    \    changes for this internal projection rename or includes the required contract-alignment\n\
    \    evidence without changing payload shapes.\n"
  findings:
  - criterion: ac-01 verification
    evidence: Accept finalization for source commit 69ed65ba failed in agent/scripts/check/verify-api-contract-alignment.sh
      because backend/src/api/handlers/training_plans.rs changed while agent/design/api-contract.yaml
      did not. The implementation intended no OpenAPI payload change, but the deterministic
      review gate treats backend/src/api/** as API surface and blocks acceptance.
    risk: The item cannot be accepted until the implementation either avoids API-surface-path
      changes for this internal projection rename or includes the required contract-alignment
      evidence without changing payload shapes.
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 is met: backend domain no longer carries the stale ExerciseVariant/PlanExerciseOption
      shapes that contradicted requires_station and gym-agnostic TrainingPlanExerciseVariant
      semantics, and the remaining option type is named/documented as a configured-gym-resolved
      projection.'
    evidence: backend/src/domain.rs removes the unused stale Exercise, ExerciseVariant,
      Gym, EquipmentStation, and PlanExerciseOption structs from the final state,
      and exposes ConfiguredGymTrainingPlanExerciseVariantOption with documentation
      that station/profile fields are derived from ExerciseVariant.requires_station
      and compatibility rows before mapping to the existing API response. backend/src/persistence/training_plans.rs
      derives those station fields from the selected gym and ev.requires_station;
      backend/src/api/handlers/training_plans.rs keeps the existing response mapping
      unchanged.
    runtime_build_check: Review did not rerun full-suite checks manually per task
      guidance; implementation evidence records make check-backend passing after the
      corrective commit, and accept finalization will run the deterministic backend
      gate for source commit 9884ca3b.
    residual_risk: The public OpenAPI and renderer contract keep their existing PlanExerciseOptionSummary
      naming because API payload renames were out of scope; future public naming cleanup
      should be handled as a separate contract migration.
  findings: []
