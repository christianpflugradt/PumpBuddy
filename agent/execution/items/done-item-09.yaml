version: 1
kind: backlog_item
item:
  id: pb-037-item-09
  title: Apply post-target unilateral border state immediately
  status_hint: done
  source:
    type: finalize_return
    reference: agent/tmp/finalize-plan-findings.yaml
intent:
  outcome: Switch unilateral Complete Set button styling to green border immediately
    once target sets are reached, including completed-left rows after threshold.
  rationale: Current behavior delays border state until next-set left confirmation,
    causing incorrect post-target visual feedback.
scope:
  in:
  - Adjust unilateral post-target threshold styling so rows at/after threshold display
    green border as soon as logical target is met.
  - Ensure completed-left side in post-target sets uses border style rather than filled
    style.
  out:
  - Changes to target set persistence schema or API payloads.
  - Changes to bilateral threshold semantics.
constraints:
- Keep logical set counting semantics unchanged.
- Do not alter click flow requirements for side completion transitions.
inputs:
  required:
  - agent/design/workout-capabilities.yaml
  - agent/execution/plan.yaml
  optional: []
acceptance_criteria:
- id: ac-01
  statement: For unilateral exercises after reaching configured target sets, Complete
    Set styling switches to bordered state without waiting for left confirmation on
    the next set.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer checks pass with unilateral threshold-state tests covering
      immediate post-target border behavior.
execution:
  plan_item_required: true
  risk_level: medium
  boundary_impact:
  - renderer
handoff:
  review_focus:
  - Validate threshold-edge cases for left-complete/right-pending and subsequent set
    transitions.
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 satisfied; unilateral post-target completion styling now switches
      to outlined state immediately when logical completed sets meet or exceed target_sets,
      including the left-complete action state.
    evidence: Commit `881b7e9` updates `renderer/src/pb-exercise-screen.ts` by broadening
      the outline gate from only `Complete Set` to any unilateral set-completion action
      label (`Complete Set` or `Complete Left Side`) while preserving `targetSets
      !== null && completedLogicalSets >= targetSets` threshold semantics; `renderer/src/pb-exercise-screen.test.ts`
      adds regression coverage for target_sets=2 unilateral flow at set index 3, side
      LEFT, asserting `Complete Left Side` renders with `action-button-primary-outlined`
      immediately after two logical sets are completed.
    runtime_build_check: Ran `make check-renderer` during review; command passed (lint,
      unit tests, coverage, UI smoke checks, and coverage merge).
    residual_risk: Low; targeted logic and regression test cover the reported unilateral
      threshold edge case with minimal blast radius, with minor residual risk around
      other untranslated action-label variants that are not currently in scope.
