item:
  id: pb-026-item-10
  title: Introduce API-owned authenticated session boundary type
  status_hint: review
  source:
    type: extended_review
    reference: agent/tmp/review-architecture-findings.yaml
intent:
  outcome: API layer depends only on application-facing auth/session abstractions.
  rationale: Preserve clean dependency direction transport -> application -> persistence.
scope:
  in:
  - Add an api/auth session struct for handler extraction.
  - Keep persistence session type internal to application/persistence interaction.
  - Update middleware and handlers to use API-owned type.
  out:
  - Authentication protocol changes.
constraints:
- Keep existing behavior and route protection intact.
