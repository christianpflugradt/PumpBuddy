  - 'Verify no renderer markup produces `.configurator-gyms-screen .configurator-gym-create-button`,
    `.configurator-load-profiles-screen .configurator-load-profile-create-button`,
    or `.configurator-exercise-variants > .configurator-editor-actions .nav-button`.'
  - 'Remove only those selectors and directly related completed-adoption residue from
    `renderer/src/styles.scss`.'
  - 'Use `renderer/src/pb-configurator-exercise-editor-screen.ts` as the producer
    check for the active nested Variant action, which uses `.configurator-action-nested-add`
    rather than `.nav-button`.'
  out:
  - 'Do not remove `.nav-button` base contracts or selectors with active producers.'
  - Do not change renderer markup, routes, controls, create behavior, editor behavior,
    or any Class B architecture work.
  - Do not perform unrelated stylesheet cleanup or visual redesign.
constraints:
- Treat the no-producer check as mandatory before deleting each selector.
- Limit cleanup to completed-adoption residue from the approved Configurator consolidation.
- Preserve all active shared Configurator action and list contracts.
