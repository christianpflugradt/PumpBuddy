version: 1
kind: backlog_item

item:
  id: pb-029-item-03
  title: Expose load semantics in workout API payloads
  status_hint: open
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml

intent:
  outcome: Active-workout and related API payloads expose load_input_mode and renderer-ready load values without UI inference heuristics.
  rationale: Keeps business logic server-side and provides deterministic renderer inputs.

scope:
  in:
    - "Extend OpenAPI schemas used by workout execution with a concrete field set: ActiveWorkoutExercise.load_input_mode (enum TOTAL|PER_SIDE, nullable when no variant selected), ActiveWorkoutSet.suggested_load_input_kg (renderer input value; per-side for PER_SIDE, total for TOTAL), ActiveWorkoutSet.suggested_load_total_kg (canonical total load in kg used for persistence semantics), and unchanged canonical request semantics for ActiveWorkoutSetInput.load_value."
    - Update backend DTO mapping and serialization for active workout and set payloads.
    - Ensure create/update/complete request handling preserves canonical total-load persistence semantics.
  out:
    - Renderer UI behavior changes.
    - Load suggestion snapping algorithm changes.

constraints:
  - OpenAPI contract and API implementation must evolve together.
  - Canonical persisted workout_set load remains total even when input mode is PER_SIDE.
  - Suggested response values must let the renderer render/edit current-set loads without dividing historical totals in UI code.
  - Request payload compatibility is preserved by keeping canonical total-load input field semantics.

inputs:
  required:
    - agent/execution/plan.yaml
    - agent/design/api-contract.yaml
    - agent/strategy/engineering-guardrails.yaml
  optional:
    - agent/design/domain-model.yaml
    - agent/strategy/security.yaml

acceptance_criteria:
  - id: ac-01
    statement: OpenAPI schema defines load_input_mode, suggested_load_input_kg, and suggested_load_total_kg for workout execution responses while keeping request load_value canonical total kg.
    verification:
      type: command
      command: rg -n "load_input_mode|suggested_load_input_kg|suggested_load_total_kg|ActiveWorkoutSetInput|load_value" agent/design/api-contract.yaml
      expected: Contract definitions contain the concrete fields and preserve canonical request semantics.
  - id: ac-02
    statement: Backend API tests validate PER_SIDE responses expose both suggested input and canonical total values, while persisted workout_set loads remain total.
    verification:
      type: command
      command: cargo test --manifest-path backend/Cargo.toml active_workout
      expected: API-focused backend tests pass with explicit coverage for response dual-values and canonical persistence.

execution:
  plan_item_required: false
  risk_level: medium
  boundary_impact:
    - api/contract
    - backend/api
    - backend/workout-execution

handoff:
  review_focus:
    - Confirm API contract and Rust response/request models remain in sync.
    - Confirm suggested_load_input_kg and suggested_load_total_kg are both present and correctly derived for TOTAL and PER_SIDE.

review_feedback: []
review_result: null
