version: 1
kind: backlog_item
item:
  id: pb-062-item-05
  title: Add load profile detail read boundary
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: An authenticated load-profile detail payload that exposes persisted definition
    data and backend-owned preview values for draft editing and historical inspection.
  rationale: Existing draft edit and historical detail flows need a read boundary
    that exposes stored fixed-list or formula fields instead of relying on list summaries.
scope:
  in:
  - Extend the OpenAPI contract and generated models with a read endpoint for one
    authenticated load profile.
  - Add backend domain, persistence, application, and handler support for loading
    one load profile by id within user scope.
  - Expose persisted definition fields needed to prefill draft editors for both fixed-list
    and formula variants.
  - Expose backend-owned preview values aligned with configured max-load caps so historical
    and draft detail screens can inspect effective loads without renderer-side recomputation.
  out:
  - Create, update, rename, or delete write endpoints.
  - Full-screen renderer detail UX.
constraints:
- Keep OpenAPI as the canonical API source and regenerate affected clients instead
  of editing generated files.
- Keep the backend authoritative for stored definition shape and preview expansion
  semantics.
- Do not require renderer-side reconstruction of fixed-list values or formula min
  or step from summary payloads.
inputs:
  required:
  - agent/design/configurator-use-cases.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/api-contract.yaml
  optional:
  - backend/src/persistence/load_profiles.rs
  - backend/src/api/handlers/load_profiles.rs
acceptance_criteria:
- id: ac-01
  statement: Authenticated callers can load one load profile detail payload that exposes
    persisted fixed-list values or formula min and step fields needed to prefill existing
    draft editors.
  verification:
    type: command
    command: make check-backend
    expected: Backend quality checks pass with contract and API coverage for the load-profile
      detail read boundary.
- id: ac-02
  statement: Load-profile detail responses include backend-aligned preview values
    capped by configured max weight and remain user-scoped and deterministic across
    repeated reads.
  verification:
    type: command
    command: make check-backend
    expected: Backend tests validate preview-value expansion, max-load cap behavior,
      and user-scoped detail reads.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - api/openapi
  - backend/api
  - backend/persistence
  - renderer/openapi-boundary
handoff:
  review_focus:
  - Detail payload completeness for draft prefill and historical inspection needs.
  - Alignment between detail preview values and existing workout load-expansion semantics.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: The item adds an authenticated GET /api/load-profiles/{loadProfileId}
      detail boundary, returns persisted fixed-list or formula definition fields for
      editor prefill, and emits backend-owned capped preview loads through a user-scoped
      persistence path.
    evidence: agent/design/api-contract.yaml defines LoadProfileDetailResponse plus
      the GET detail path; backend/src/api/router.rs and backend/src/api/handlers/load_profiles.rs
      wire the authenticated endpoint; backend/src/application/load_profiles.rs, backend/src/domain.rs,
      and backend/src/persistence/load_profiles.rs fetch one user-scoped profile with
      persisted definition data and max-load-capped possible_loads_kg; backend/tests/api_workouts.rs
      covers formula and fixed-list detail reads, cap behavior, station counts, and
      foreign-user 404 handling.
    runtime_build_check: No manual quality command was run during review per task
      guidance; accept-finalize is expected to execute the deterministic quality gate
      for the implementation commit.
    residual_risk: Renderer-side detail consumption is still follow-up work, so end-to-end
      UI hydration is not exercised here, but the backend read boundary required for
      that work is present and contract-backed within this item scope.
  findings: []
