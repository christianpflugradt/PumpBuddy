version: 1
kind: backlog_item
item:
  id: pb-048-item-05
  title: Validate end-to-end exercises slice via make gates
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Establish a focused verification pass that proves contract, backend, and
    renderer changes for the exercises slice satisfy acceptance gates.
  rationale: Provide deterministic confidence before execution transitions toward
    finalize.
scope:
  in:
  - Add or update targeted automated checks that cover endpoint consumption and key
    renderer rendering assumptions for this slice.
  - Run repository make-based quality gates and capture pass expectations for the
    slice.
  - Confirm no open acceptance gap remains between plan success criteria and implemented
    checks.
  out:
  - New product behavior beyond verification and test coverage adjustments.
  - Non-slice refactors unrelated to exercises performance delivery.
constraints:
- Use make targets as the sole quality/test command interface in this artifact.
- Validation must include both backend and renderer quality surfaces.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/strategy/test-strategy.yaml
  optional:
  - agent/strategy/security.yaml
acceptance_criteria:
- id: ac-01
  statement: Slice-level automated checks cover endpoint grouping semantics, station-selection
    determinism, and renderer consumption for grouped display/filter paths.
  verification:
    type: command
    command: make check
    expected: Combined backend and renderer quality gates pass with no failures.
- id: ac-02
  statement: Final verification step for the slice runs from repository root using
    make-only commands.
  verification:
    type: command
    command: make check
    expected: End-to-end quality execution succeeds and is suitable for finalize readiness
      review.
execution:
  plan_item_required: false
  plan_item_skip_reason: Validation-only scope with narrow coupling and no standalone
    design complexity beyond running established make gates.
  risk_level: low
  boundary_impact:
  - quality-gates
  - backend-tests
  - renderer-tests
handoff:
  review_focus:
  - Coverage completeness against plan success criteria.
  - Make-only verification discipline.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: ac-01 and ac-02 are satisfied by slice-level automated checks that
      now cover grouped renderer filtering behavior while preserving backend endpoint
      grouping and deterministic station-selection coverage from prior accepted items,
      with final make-only verification delegated to deterministic finalize quality
      gates.
    evidence: Validation commit `3b665f1343677fcf138687dfa82c9ed698ea5915` strengthens
      renderer checks in `renderer/src/pb-exercises-screen.test.ts` by asserting grouped
      display/filter behavior (`Not enough data` group isolation for `Cable Row`)
      and updates `renderer/playwright.config.js` timeout for stable renderer gate
      execution; backend endpoint grouping and station-selection determinism remain
      covered by accepted implementation/tests from item 02 (`backend/tests/api_workouts.rs`).
    runtime_build_check: Deterministic quality gates will run via `agent/scripts/task/review-item/finalize.sh
      05 accept`, which enforces make-based verification through `agent/scripts/check/run-quality-gate.sh`
      against the item source commit.
    residual_risk: Low; residual exposure is limited to environment-dependent gate
      flakiness, partially mitigated by the Playwright startup-timeout adjustment
      and existing backend/renderer test coverage breadth.
