      timed controls with m:ss formatting and bounded minute/second spinner editing,
      and renderer test coverage validates play/pause progression, reset behavior,
      and zero-based SECS defaults without REPS regression.'
    evidence: '`renderer/src/pb-exercise-screen.ts` and `renderer/src/workout-render.ts`
      render timed controls with 0-59 minute/second inputs, m:ss formatting, and Reset/Play-Pause
