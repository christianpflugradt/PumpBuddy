version: 1
kind: backlog_item
item:
  id: pb-030-item-05
  title: Make incremental save and resume side-aware
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Incremental update and resume flows preserve unilateral side progress,
    including left-complete/right-pending continuation.
  rationale: The agreed user flow requires immediate left-side persistence and reliable
    resume into right side.
scope:
  in:
  - Update active-workout save/update progression logic for unilateral side state.
  - Ensure left-side completion is persisted before right-side entry.
  - Ensure resume projects current unilateral side state correctly.
  out:
  - Current set UI copy/labels.
  - History table layout changes.
constraints:
- Resume must not require re-entering already persisted left-side unilateral data.
- Bilateral progression semantics must remain stable.
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-use-cases.yaml
  - agent/design/api-contract.yaml
  - backend/src
  optional:
  - backend/tests
acceptance_criteria:
- id: ac-01
  statement: Active-workout incremental save and resume behavior correctly restore
    unilateral side progression with left persisted before right.
  verification:
    type: command
    command: make check
    expected: Quality gate passes with tests covering unilateral partial-progress
      resume and bilateral non-regression.
execution:
  plan_item_required: false
  risk_level: high
  boundary_impact:
  - backend/active-workout
handoff:
  review_focus:
  - Verify resumed state lands on right side when only left was completed.
  - Verify no duplicate left entries are required after resume.
review_feedback: []
review_result:
  outcome: accept
  acceptance:
    criteria_met: Acceptance criterion ac-01 is met; active-workout persistence now
      normalizes unilateral progression so a workout with latest completed unilateral
      side LEFT remains on that exercise and projects RIGHT as the next suggested
      side, and resume derives the same side-aware state without requiring duplicate
      LEFT re-entry while bilateral progression behavior remains unchanged.
    evidence: '`backend/src/persistence/active_workouts.rs` implements shared unilateral
      pending-position normalization for create/update (`apply_unilateral_pending_position_from_new_workout`)
      and resume projection (`apply_unilateral_pending_position_from_active_workout`),
      and resume suggestion derivation sets `(set_index, set_side)` to `(last_index,
      RIGHT)` after unilateral LEFT completion; `backend/tests/api_workouts.rs` includes
      `unilateral_left_progress_update_persists_and_resumes_on_right_side`, which
      verifies update and subsequent GET resume both keep `current_exercise_position`
      at exercise 1 and return suggested `set_side=RIGHT` with `set_index=1` when
      only LEFT is completed.'
    runtime_build_check: '`make check` passed in this review run, including backend
      unit tests, API integration tests (with `unilateral_left_progress_update_persists_and_resumes_on_right_side`
      passing), persistence integration tests, and renderer lint/tests/coverage.'
    residual_risk: Low residual risk remains for future unilateral sequencing changes
      beyond LEFT then RIGHT ordering, but current acceptance scope for left-persisted/right-pending
      incremental save and resume behavior is covered by implementation and passing
      quality-gate tests.
