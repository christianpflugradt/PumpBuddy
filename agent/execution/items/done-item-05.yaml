  acceptance:
    criteria_met: ac-01 satisfied by centralizing desktop shell anchoring through
      shared app-shell structure and shared root alignment rules across main screens.
    evidence: Shared `.app-screen-shell` wrapper now applied in login/start/settings/exercise/completion
      screens (`renderer/src/pb-login.ts`, `renderer/src/pb-start-screen.ts`, `renderer/src/pb-settings-screen.ts`,
      `renderer/src/pb-exercise-screen.ts`, `renderer/src/pb-completion-screen.ts`)
      with centralized shell/root alignment styles in `renderer/src/styles.scss` (`pb-app-root`/`.pb-app-root`
