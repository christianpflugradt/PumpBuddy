version: 1
kind: backlog_item
item:
  id: pb-054-item-05
  title: Replace corrective API contract finalize heuristic with structured review
    signals
  status_hint: done
  source:
    type: extended_review
    reference: agent/tmp/review-quality-findings.yaml
intent:
  outcome: Implement finalize requires contract updates only when review findings
    explicitly mark true contract-drift remediation.
  rationale: Corrective workflow reliability should be based on structured state,
    not brittle keyword scanning of prose.
scope:
  in:
  - Add structured metadata or an explicit flag for returned findings that genuinely
    require an API contract update.
  - Update review-item and implement-item finalize logic to consume that structured
    signal instead of keyword-scanning prose.
  - Add a regression-proof path for tooling-only contract-alignment returns that should
    not force `agent/design/api-contract.yaml` edits.
  out:
  - Relaxing actual API-contract-first governance.
  - Changing endpoint schemas or review backlog semantics beyond what the structured
    signal needs.
constraints:
- Preserve current behavior for genuine API surface versus contract drift.
- Keep execution artifacts machine-validated.
- Use make targets only for quality and test execution commands.
inputs:
  required:
  - agent/scripts/task/implement-item/finalize.sh
  - agent/scripts/task/review-item/write-review-result.py
  - agent/scripts/task/review-item/finalize.sh
  - agent/templates/item-template.yaml
  optional:
  - agent/execution/items/done-item-01.yaml
acceptance_criteria:
- id: ac-01
  statement: Implement finalize no longer infers contract-update requirements solely
    from hard-coded review-prose keyword matches.
  verification:
    type: command
    command: '! rg -n ''for marker in \("verify-api-contract-alignment", "api-contract.yaml"\)''
      agent/scripts/task/implement-item/finalize.sh'
    expected: The old raw keyword scan is absent from implement finalize.
- id: ac-02
  statement: Repository quality still passes after the corrective-finalize workflow
    change.
  verification:
    type: command
    command: make check
    expected: Repository checks pass with the structured corrective-finalize signal
      in place.
execution:
  plan_item_required: true
  plan_item_skip_reason: null
  risk_level: medium
  boundary_impact:
  - execution_framework
  - review_workflow
  - api_contract_governance
handoff:
  review_focus:
  - Verify genuine API drift still forces canonical contract updates.
  - Verify tooling-only corrective returns no longer require no-op `api-contract.yaml`
    edits.
review_feedback:
- at: '2026-05-16T13:05:17Z'
  source: review-quality:f-03
  notes: Returned items can be forced to edit `agent/design/api-contract.yaml` based
    on string matches in review text rather than an actual API-surface drift signal,
    which creates false blockers and incentivizes no-op contract edits.
review_result:
  outcome: accept
  acceptance:
    criteria_met: 'ac-01 and ac-02 are met: implement finalize now derives API-contract
      update requirements from explicit structured review metadata instead of hard-coded
      review-prose keyword matches, and the implementation pass already recorded a
      successful make check.'
    evidence: 'validation/models/template_item_template.py adds requires_api_contract_update
      on review findings plus structured findings storage on review_feedback; agent/scripts/task/review-item/write-review-result.py
      can set that flag via --finding-contract-update or findings-file metadata; agent/scripts/task/review-item/finalize.sh
      preserves structured findings when reopening items; and agent/scripts/task/implement-item/finalize.sh
      now reads those structured findings instead of scanning for the old marker text.
      During review, a targeted helper simulation showed a plain returned finding
      validates without the flag while an explicitly marked finding validates with
      requires_api_contract_update: true.'
    runtime_build_check: I did not rerun make check manually during review because
      the implementation pass already recorded a successful make check for this item.
      I ran targeted helper validation instead, and accept-finalize will rerun deterministic
      quality-gate selection from source commit 909e7946.
    residual_risk: 'Low. The main remaining risk is reviewer omission: genuine API-contract
      drift now depends on reviewers marking the structured flag deliberately through
      the helper, rather than on brittle automatic prose matching.'
  findings: []
