version: 1
kind: backlog_item
item:
  id: pb-043-item-05
  title: Render Completion Progress Value and Data Fallback
  status_hint: done
  source:
    type: plan_refinement
    reference: agent/execution/plan.yaml
intent:
  outcome: Plan completed screen presents progress metric as a rounded raw decimal
    or "not enough data" when sufficiency fails.
  rationale: User-facing completion feedback is the primary feature objective and
    must match display rules exactly.
scope:
  in:
  - Render progress value as a raw decimal rounded to two places when backend reports
    sufficient data.
  - Render the exact fallback copy "not enough data" when sufficiency threshold is
    not met.
  out:
  - Changes to how performance_value is measured or broader completion screen redesign.
constraints:
- Display format must remain a raw decimal (for example 1.10), not a percentage.
- Fallback copy must be exactly "not enough data".
inputs:
  required:
  - agent/execution/plan.yaml
  - agent/design/workout-capabilities.yaml
  optional:
  - agent/design/workout-use-cases.yaml
acceptance_criteria:
- id: ac-01
  statement: Plan completed UI shows a two-decimal raw progress value for sufficient
    data cases and shows "not enough data" otherwise.
  verification:
    type: command
    command: make check-renderer
    expected: Renderer quality checks pass with coverage for numeric rendering and
      fallback copy conditions.
