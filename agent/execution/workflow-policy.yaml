version: 1
source_of_truth: workflow_policy

intent:
  outcome: predictable_plan_execution_with_low_rework
  principles:
    - deterministic_steps_should_be_scripted
    - conversational_steps_should_be_explicitly_scoped
    - implementation_judgment_should_be_evidence_based_and_scope_disciplined
    - quality_gates_should_fail_fast
    - stakeholder_acceptance_is_required_before_finalize
  planning_size_guideline:
    target_execution_items_per_plan:
      min: 4
      max: 8
    target_is_recommendation_not_hard_limit: true
    primary_constraint: completable_within_one_focused_workday
    allow_higher_item_count_when_items_are_lightweight: true
    split_plan_when_exceeding_primary_constraint: true

state_machine:
  states:
    - discuss_plan
    - refine_plan
    - execute_items
    - finalize_plan
    - finalized
  transitions:
    - from: discuss_plan
      to: refine_plan
      when:
        - plan_goal_is_clear
        - plan_scope_is_bounded
    - from: refine_plan
      to: execute_items
      when:
        - at_least_one_open_item_exists
    - from: execute_items
      to: finalize_plan
      when:
        - no_open_or_review_items_exist
        - at_least_one_done_item_exists
    - from: finalize_plan
      to: execute_items
      when:
        - stakeholder_rejected_finalize
      effect:
        - create_return_items
    - from: finalize_plan
      to: finalized
      when:
        - stakeholder_accepted_finalize

item_workflow:
  filename_status_source_of_truth: true
  allowed_statuses:
    - open
    - review
    - done
  mandatory_steps:
    - implement_item
  optional_steps:
    - plan_item
    - review_item

quality_gates:
  fail_on:
    - validation_error
    - validation_warning
    - missing_required_independent_review
    - unmet_acceptance_criteria

clarification_policy:
  required_when:
    - meaning_is_ambiguous_and_changes_implementation_or_acceptance
    - required_information_is_missing_for_scope_or_acceptance_criteria
    - plan_item_or_code_context_contains_material_conflicts
  should_not_ask_when:
    - answer_is_already_available_in_loaded_context
    - question_is_style_preference_without_acceptance_impact
    - reasonable_assumption_has_low_risk_and_is_explicitly_documented
  question_format:
    - state_why_unclear
    - state_risk_if_interpreted_wrong
    - propose_recommended_default
    - ask_for_concrete_decision
  overload_guidance:
    - if_many_points_are_unclear_in_one_turn_acknowledge_high_ambiguity_explicitly
    - ask_stakeholder_to_restate_the_flow_or_scope_instead_of_spamming_many_micro_questions
    - continue_with_targeted_follow_up_questions_after_restatement
  assumption_rule:
    - proceed_with_low_impact_repository_consistent_judgment
    - document_material_assumptions_or_unresolved_concerns_in_the_item_handoff
  implementation_judgment:
    autonomous_when:
      - choice_is_low_impact_reversible_and_repository_precedent_is_clear
      - alternatives_do_not_materially_change_product_behavior_or_domain_semantics
      - better_solution_stays_within_scope_and_preserves_acceptance_criteria
    consult_stakeholder_when:
      - material_product_domain_or_ux_decision_is_unspecified
      - multiple_interpretations_produce_materially_different_behavior
      - literal_solution_conflicts_with_repository_precedent_or_creates_obvious_product_quality_issue
      - new_evidence_materially_undermines_an_earlier_plan_assumption
      - implementation_would_invent_a_business_rule_or_materially_change_contract_or_lifecycle
    block_when:
      - acceptance_criteria_are_mutually_inconsistent
      - required_domain_semantics_or_dependency_contract_is_unavailable
      - implementation_would_violate_a_known_invariant
    scope_discipline:
      - discovering_a_better_solution_does_not_authorize_scope_expansion
      - consult_before_changing_product_behavior_domain_semantics_api_persistence_or_lifecycle_rules

extended_reviews:
  allowed_only_when:
    - active_plan_exists
    - at_least_one_done_item_exists
  recommended_modes:
    - architecture
    - consistency
    - quality
    - security
    - technology
  findings_handling:
    - stakeholder_reviews_findings_summary_with_display_ids
    - stakeholder_walks_findings_one_by_one
    - stakeholder_selects_finding_ids_to_backlog
    - selected_findings_become_open_items

token_efficiency:
  tracking_scope: full_plan_cycle
  primary_metrics:
    - iterations_until_acceptance
    - return_rate_after_review
    - return_rate_after_finalize
