version: 1
task: finalize-plan

context:
  required:
    - agent/execution/plan.yaml
    - agent/execution/workflow-policy.yaml
    - agent/execution/workflow-state.yaml
    - agent/execution/execution-config.yaml
    - agent/templates/plan-template.yaml
    - agent/templates/finalize-plan-findings-template.yaml
    - agent/templates/finalize-plan-accept-template.yaml
  optional: []

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/glossary.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/api-contract.yaml

finalize_script: agent/scripts/task/finalize-plan/finalize.sh

finalize_track_paths:
  - .

instruction: |
  Finalize the active plan only after explicit stakeholder decision. At task start, summarize what was delivered from done items and ask for a binary decision: accept or return. If accepted, write agent/tmp/finalize-plan-accept.md using agent/templates/finalize-plan-accept-template.yaml, then execute agent/scripts/task/finalize-plan/finalize.sh accept. If returned, first ask the stakeholder to provide blocking findings (do not invent or infer new findings from residual-risk text alone), then write agent/tmp/finalize-plan-findings.yaml using agent/templates/finalize-plan-findings-template.yaml (one follow-up item per stakeholder-confirmed blocking finding), validate it with python3 agent/scripts/check/validate-artifact.py finalize-return-findings agent/tmp/finalize-plan-findings.yaml, then execute agent/scripts/task/finalize-plan/finalize.sh return agent/tmp/finalize-plan-findings.yaml. Keep scalar text fields as YAML strings, not lists/objects. Use the output format from agent/templates/task-output-template.yaml exactly. For Status/Task/Workspace fields, use TASK_OUTPUT_STATUS, TASK_OUTPUT_TASK, and TASK_OUTPUT_WORKSPACE emitted by the finalize script without inference.
