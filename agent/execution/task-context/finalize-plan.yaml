version: 1
task: finalize-plan

context:
  required:
    - agent/execution/plan.yaml
    - agent/execution/workflow-policy.yaml
    - agent/execution/workflow-state.yaml
    - agent/execution/execution-config.yaml
    - agent/templates/plan-template.yaml
    - agent/templates/finalize-plan-findings-template.yaml
    - agent/templates/finalize-plan-accept-template.yaml
  optional: []

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/glossary.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/api-contract.yaml

finalize_script: agent/scripts/task/finalize-plan/finalize.sh

finalize_track_paths:
  - .

instruction: |
  Start with a fresh-context holistic review of the completed plan before asking for stakeholder acceptance. Inspect all done items and relevant repository artifacts for plan-outcome satisfaction, cross-item backend/frontend/API/domain consistency, lifecycle behavior, UX consistency, duplicated or missing integration work, quality evidence, scope omissions, and obvious product-quality issues. This is distinct from stakeholder acceptance. If review finds actionable issues, write one follow-up item per issue to agent/tmp/finalize-plan-findings.yaml, format and validate it with the emitted commands, execute agent/scripts/task/finalize-plan/finalize.sh return agent/tmp/finalize-plan-findings.yaml, and return the plan to execution without asking the stakeholder to accept incomplete work. If the review is clean, summarize delivered outcome and review evidence, then ask the stakeholder for a binary accept or return decision. For accept, write agent/tmp/finalize-plan-accept.md using the template and execute agent/scripts/task/finalize-plan/finalize.sh accept. For stakeholder return, collect confirmed blocking findings in the same findings artifact and execute the return finalizer. Accepted finalization runs `make check` once before mutating plan artifacts. Keep scalar text fields as YAML strings, not lists/objects. Quote scalar text containing ': ' or backticks, or use block scalars. Use the output format from agent/templates/task-output-template.yaml exactly. For Status/Task/Workspace fields, use TASK_OUTPUT_STATUS, TASK_OUTPUT_TASK, and TASK_OUTPUT_WORKSPACE emitted by the finalize script without inference.
