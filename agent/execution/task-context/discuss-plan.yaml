version: 1
task: discuss-plan

context:
  required:
    - agent/execution/plan.yaml
    - agent/execution/workflow-policy.yaml
    - agent/execution/workflow-state.yaml
    - agent/execution/execution-config.yaml
  optional: []

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/strategy/tech-stack.yaml
  - agent/strategy/engineering-guardrails.yaml
  - agent/strategy/test-strategy.yaml
  - agent/strategy/security.yaml
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/glossary.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/api-contract.yaml

finalize_script: agent/scripts/task/discuss-plan/finalize.sh

finalize_track_paths:
  - agent/execution/plan.yaml
  - agent/execution/workflow-policy.yaml
  - agent/strategy/tech-stack.yaml
  - agent/strategy/engineering-guardrails.yaml
  - agent/strategy/test-strategy.yaml
  - agent/strategy/security.yaml
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - AGENTS.md
  - README.md

instruction: |
  Discuss and shape the active plan with the stakeholder before refinement using short iterative turns. Start from the stakeholder proposal and avoid drafting a full solution unless requested. In the first turn, ask for scope confirmation in one concise question and do not propose multiple predefined options unless the stakeholder explicitly asks for options. Do not load on-demand context before the stakeholder confirms the direction or asks for deeper analysis. After scope confirmation, load only the minimal additional on-demand files needed for that confirmed direction. Ask targeted clarification questions when ambiguity is blocking (for example scope ambiguity, missing constraints, or conflicting expectations). Use compact structured questions: why unclear, risk if wrong, recommended default, concrete decision needed. Do not ask clarification questions when the answer is already present in loaded context or when uncertainty is low risk and can be handled via explicit assumptions. If many points are unclear, acknowledge high ambiguity and ask the stakeholder to restate the intended flow/scope instead of asking many micro-questions. Aim for a plan size that usually refines into about 4-8 execution items. This is a recommendation, not a hard limit. The primary criterion is that the plan should typically be completable within one focused workday. If items are very small (for example mostly lightweight findings), a higher item count can be acceptable. If scope clearly exceeds one focused workday, propose splitting into multiple plans. Treat PLAN_ID as deterministic and do not ask whether it should be changed. Use the id already present in agent/execution/plan.yaml. Do not create execution item files in this task. Keep focus strictly on plan shaping. When discussion document updates are complete, execute agent/scripts/task/discuss-plan/finalize.sh. Use the output format from agent/templates/task-output-template.yaml exactly.
