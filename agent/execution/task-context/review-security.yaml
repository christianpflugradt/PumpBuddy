version: 1
task: review-security

context:
  required:
    - agent/strategy/security.yaml
    - agent/strategy/tech-stack.yaml
    - agent/strategy/engineering-guardrails.yaml
    - agent/design/domain-model.yaml
    - agent/design/persistence-model.yaml
    - agent/design/workout-use-cases.yaml
    - agent/templates/extended-review-findings-template.yaml
  optional:
    - compose.yaml
    - agent/design/api-contract.yaml

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/design/workout-capabilities.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/glossary.yaml

finalize_script: agent/scripts/task/extended-review/finalize.sh

instruction: |
  Run a security-focused workspace review. Review the repository as a whole (not active plan/items). Focus on trust boundaries, access controls, secret exposure, and high-impact abuse paths versus strategy and design intent. Write findings to agent/tmp/review-security-findings.yaml using agent/templates/extended-review-findings-template.yaml. Use the output format from agent/templates/task-output-template.yaml exactly.
