version: 1
task: implement-item

context:
  required:
    - agent/execution/execution-config.yaml
    - agent/execution/workflow-policy.yaml
    - agent/strategy/commit-policy.yaml
  optional: []

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/glossary.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/api-contract.yaml

finalize_script: agent/scripts/task/implement-item/finalize.sh

finalize_track_paths:
  - .

instruction: |
  Implement the selected open item. Before changing code, discover the relevant repository context and assess the intended outcome, closest analogue, product/UX/domain/architecture fit, acceptance consistency, and whether a better same-scope solution exists. The item is authoritative for outcome, scope boundaries, acceptance criteria, and explicit stakeholder decisions; it is not authoritative for incidental implementation details, unsupported assumptions, or approaches contradicted by repository evidence. Load and use a matching optional item plan when present, but never require one. Proceed autonomously for low-impact, reversible, repository-consistent choices that do not materially change behavior, domain semantics, or scope. Pause for a compact stakeholder consultation when a material product/domain/UX decision is unspecified, reasonable interpretations differ materially, literal implementation conflicts with precedent, a business rule would be invented, or new evidence undermines an earlier decision. State observation, why it matters, recommendation, material alternatives, and concrete decision needed. Block rather than assume when criteria conflict, required semantics or a dependency contract are unavailable, or a known invariant would be violated. A better discovery does not authorize scope expansion: consult before changing behavior, domain semantics, API, persistence, or lifecycle rules. Use the baseline context from this task, then load additional context from the selected item inputs and optional plan context. Apply only the changes needed for this item, run the relevant Makefile quality checks and verify acceptance criteria, and report material assumptions or unresolved concerns. Treat changes in agent/execution/telemetry.yaml as expected framework-managed state for this task run, not as unrelated workspace noise. Do not avoid or revert telemetry changes unless explicitly requested by the stakeholder. When implementation is complete, write the commit message to agent/tmp/implement-item-commit-message.txt following agent/strategy/commit-policy.yaml and execute agent/scripts/task/implement-item/finalize.sh <item-id>. Use the output format from agent/templates/task-output-template.yaml exactly.
