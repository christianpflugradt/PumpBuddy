version: 1
task: review-item

context:
  required:
    - agent/execution/execution-config.yaml
    - agent/execution/workflow-policy.yaml
  optional: []

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/glossary.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/api-contract.yaml

finalize_script: agent/scripts/task/review-item/finalize.sh

finalize_track_paths:
  - .

instruction: |
  Perform a focused independent review only for the selected item explicitly marked execution.independent_review_required=true, against its goal, scope, acceptance criteria, and stated review reason. Use a matching optional item plan if present. Do not hand-edit nested YAML under review_result. Write review_result via agent/scripts/task/review-item/write-review-result.py, then validate with python3 agent/scripts/check/validate-artifact.py review-item <item-path>. For accept, set review_result.outcome=accept and fill review_result.acceptance with criteria_met, evidence, runtime_build_check, and residual_risk as scalar strings. For return, set review_result.outcome=return and fill review_result.findings as a non-empty list of objects with criterion, evidence, and risk. When a returned finding reflects genuine API surface versus OpenAPI contract drift, mark that finding with requires_api_contract_update=true through the helper. Ask a clarification question only when review cannot conclude due to blocking ambiguity in acceptance expectations or evidence interpretation. Treat changes in agent/execution/telemetry.yaml as expected framework-managed state for this task run. Avoid full-suite quality commands manually during review; use targeted Makefile checks needed for evidence ambiguity. The full repository quality gate runs once during accepted plan finalization. If accepted, execute agent/scripts/task/review-item/finalize.sh <item-id> accept. Docker execution failures from targeted checks are environment blockers and must not produce return findings; keep the item in review and report blocked instead. If returned, execute agent/scripts/task/review-item/finalize.sh <item-id> return. On return, finalize appends structured findings to the reopened open-item as review_feedback. Use the output format from agent/templates/task-output-template.yaml exactly.
