version: 1
task: review-consistency

context:
  required:
    - agent/strategy/tech-stack.yaml
    - agent/strategy/engineering-guardrails.yaml
    - agent/strategy/test-strategy.yaml
    - agent/design/workout-use-cases.yaml
    - agent/design/workout-use-cases-to-domain-model.yaml
    - agent/design/domain-model.yaml
    - agent/design/persistence-model.yaml
    - agent/templates/extended-review-findings-template.yaml
  optional:
    - agent/design/api-contract.yaml

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/strategy/security.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/glossary.yaml

finalize_script: agent/scripts/task/extended-review/finalize.sh

instruction: |
  Run a consistency-focused workspace review. Review the repository as a whole (not active plan/items). Focus on alignment drift across implementation, strategy, and design artifacts. Write findings to agent/tmp/review-consistency-findings.yaml using agent/templates/extended-review-findings-template.yaml. Use the output format from agent/templates/task-output-template.yaml exactly.
