version: 1
task: review-consistency

context:
  required:
    - agent/execution/plan.yaml
    - agent/execution/workflow-policy.yaml
    - agent/execution/workflow-state.yaml
    - agent/execution/execution-config.yaml
    - agent/design/workout-use-cases.yaml
    - agent/design/workout-use-cases-to-domain-model.yaml
    - agent/design/domain-model.yaml
    - agent/design/persistence-model.yaml
    - agent/templates/extended-review-findings-template.yaml
  optional:
    - agent/design/api-contract.yaml

templates:
  required:
    - agent/templates/task-output-template.md

on_demand_order:
  - agent/strategy/tech-stack.yaml
  - agent/strategy/test-strategy.yaml
  - agent/strategy/security.yaml

finalize_script: agent/scripts/task/extended-review/finalize.sh

finalize_track_paths:
  - agent/execution

instruction: |
  Run a consistency-focused extended review for the active plan. Focus on alignment drift across plan intent, execution items, and design artifacts. Write findings to agent/tmp/review-consistency-findings.yaml using agent/templates/extended-review-findings-template.yaml. Then ask the stakeholder which backlog selection mode to apply: none, all, only-p0..only-p3, or through-p0..through-p3. Execute agent/scripts/task/extended-review/finalize.sh review-consistency agent/tmp/review-consistency-findings.yaml <mode>. Use the output format from agent/templates/task-output-template.md exactly.
