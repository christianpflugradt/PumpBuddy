version: 1
task: review-quality

context:
  required:
    - agent/strategy/tech-stack.yaml
    - agent/strategy/test-strategy.yaml
    - agent/strategy/engineering-guardrails.yaml
    - agent/design/workout-use-cases.yaml
    - agent/design/domain-model.yaml
    - agent/design/persistence-model.yaml
    - agent/templates/extended-review-findings-template.yaml
  optional: []

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/design/workout-capabilities.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/glossary.yaml

finalize_script: agent/scripts/task/extended-review/finalize.sh

instruction: |
  Run a quality-focused workspace review. Review the repository as a whole (not active plan/items). Focus on correctness confidence, testability, reliability, and maintainability risks versus strategy and design intent. Write findings to agent/tmp/review-quality-findings.yaml using agent/templates/extended-review-findings-template.yaml. Use the output format from agent/templates/task-output-template.yaml exactly.
