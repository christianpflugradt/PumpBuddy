name: ${COMPOSE_PROJECT_NAME:-pumpbuddy}

services:
  renderer:
    image: ghcr.io/christianpflugradt/pumpbuddy-renderer:${APP_VERSION:?APP_VERSION is required}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - pumpbuddy-internal

  backend:
    image: ghcr.io/christianpflugradt/pumpbuddy-backend:${APP_VERSION:?APP_VERSION is required}
    depends_on:
      postgres:
        condition: service_healthy
      init-access-key:
        condition: service_completed_successfully
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8080"
      DATABASE_URL: postgresql://pumpbuddy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/pumpbuddy
    networks:
      - pumpbuddy-internal

  postgres:
    image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    environment:
      POSTGRES_DB: pumpbuddy
      POSTGRES_USER: pumpbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../database/00-schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    networks:
      - pumpbuddy-internal

  init-access-key:
    image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: pumpbuddy
      DB_USER: pumpbuddy
    command:
      - /bin/sh
      - -lc
      - |
        set -euo pipefail

        apk add --no-cache argon2 python3 >/dev/null

        users_count="$$(psql -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d "$$DB_NAME" -tAc "SELECT COUNT(*) FROM users")"

        if [ "$$users_count" != "0" ]; then
          echo "users table is not empty, skipping access key initialization"
          exit 0
        fi

        access_key="$$(python3 -c "import secrets,string; a=string.ascii_letters+string.digits; print(''.join(secrets.choice(a) for _ in range(32)))")"
        salt="$$(python3 -c "import secrets,string; a=string.ascii_letters+string.digits; print(''.join(secrets.choice(a) for _ in range(32)))")"

        access_key_hash="$$(printf '%s' "$$access_key" | argon2 "$$salt" -id -e)"

        init_user_id="00000000-0000-0000-0000-000000000001"
        init_login_name="admin"
        init_display_name="Primary User"

        psql -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d "$$DB_NAME" --set ON_ERROR_STOP=1 \
          -c "INSERT INTO users (id, login_name, display_name, disabled_at) VALUES ('$$init_user_id', '$$init_login_name', '$$init_display_name', NULL) ON CONFLICT (id) DO UPDATE SET login_name=EXCLUDED.login_name, display_name=EXCLUDED.display_name, disabled_at=NULL;"
        psql -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d "$$DB_NAME" --set ON_ERROR_STOP=1 \
          --set="secret_hash=$$access_key_hash" \
          -c "INSERT INTO user_secrets (user_id, secret_hash, label) VALUES ('$$init_user_id', :'secret_hash', 'primary');"

        handoff_path="/bootstrap-secrets/initial-access-key"
        umask 077
        mkdir -p "$$(dirname "$$handoff_path")"
        printf '%s\n' "$$access_key" >"$$handoff_path"
        chmod 600 "$$handoff_path"

        echo "Initial access key written to one-time handoff file: $$handoff_path"
    restart: "no"
    volumes:
      - bootstrap-secret-handoff:/bootstrap-secrets
    networks:
      - pumpbuddy-internal

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-pumpbuddy-postgres-data}
    external: true
  bootstrap-secret-handoff:
    name: ${BOOTSTRAP_SECRET_VOLUME_NAME:-pumpbuddy-bootstrap-secret-handoff}
    external: true

networks:
  pumpbuddy-internal:
