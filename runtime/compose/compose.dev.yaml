services:
  renderer:
    build:
      context: ../../renderer
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"
    networks:
      - pumpbuddy-internal

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8080"
      DATABASE_URL: postgresql://pumpbuddy:pumpbuddy@postgres:5432/pumpbuddy
    networks:
      - pumpbuddy-internal

  postgres:
    image: postgres:18-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    container_name: pumpbuddy-postgres
    environment:
      POSTGRES_DB: pumpbuddy
      POSTGRES_USER: pumpbuddy
      POSTGRES_PASSWORD: pumpbuddy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../database/00-schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ../database/10-seed-dev.sql:/docker-entrypoint-initdb.d/10-seed-dev.sql:ro
    networks:
      - pumpbuddy-internal

  postgres-test:
    image: postgres:18-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    container_name: pumpbuddy-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_DB: pumpbuddy
      POSTGRES_USER: pumpbuddy
      POSTGRES_PASSWORD: pumpbuddy
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - ../database/00-schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ../database/10-seed-dev.sql:/docker-entrypoint-initdb.d/10-seed-dev.sql:ro
    networks:
      - pumpbuddy-test

  backend-test:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pumpbuddy:pumpbuddy@postgres-test:5432/pumpbuddy
    command: ["cargo", "test"]
    networks:
      - pumpbuddy-test

volumes:
  postgres-data:

networks:
  pumpbuddy-internal:
  pumpbuddy-test:
