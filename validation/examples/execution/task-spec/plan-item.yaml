version: 1
task: plan-item
source_of_truth: task_spec

intent:
  outcome: provide_a_small_implementation_plan_for_each_open_item

pre_conditions:
  - at_least_one_unplanned_open_item_with_plan_item_required_true_exists
  - structured_plan_item_template_exists
  - required_strategy_documents_available
  - execution_config_available

flow:
  - resolve_task_alias_to_plan_item
  - select_next_unplanned_open_item_with_plan_item_required_true_deterministically
  - resolve_stable_item_plan_path
  - load_required_context_from_task_context_config
  - emit_item_and_plan_paths
  - emit_finalize_script_reference
  - emit_instruction_contract

post_conditions:
  - task_output_contains_item_path
  - task_output_contains_plan_path
  - task_output_contains_finalize_script
  - task_output_contains_instruction

clarification_policy:
  required_when:
    - selected_item_has_conflicting_scope_and_acceptance_expectations
    - item_intent_is_too_ambiguous_to_define_an_actionable_plan
  should_not_ask_when:
    - item_and_acceptance_are_clear_enough_for_a_minimal_plan
    - minor_uncertainty_does_not_change_implementation_direction
  stakeholder_question_style:
    - ask_only_blocking_questions_with_why_risk_default_decision_structure
  overload_guidance:
    - if_multiple_major_ambiguities_exist_request_item_rewrite_before_planning
  default_if_not_blocking: proceed_with_explicit_assumptions

finalize_behavior:
  config_path: agent/execution/execution-config.yaml
  dry_run:
    - no_file_writes
    - no_git_add
    - no_git_commit
    - no_git_push
    - emit_would_do_messages
  non_dry_run:
    - stage_item_plan_changes
    - commit_when_commit_enabled
    - push_when_push_enabled

script_contract:
  dispatcher_script: agent/scripts/tasks.sh
  task_script: agent/scripts/task/plan-item/run.sh
  finalize_script: agent/scripts/task/plan-item/finalize.sh
  context_config: agent/execution/task-context/plan-item.yaml
