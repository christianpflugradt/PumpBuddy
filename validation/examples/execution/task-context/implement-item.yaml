version: 1
task: implement-item

context:
  required:
    - agent/execution/execution-config.yaml
    - agent/execution/workflow-policy.yaml
    - agent/strategy/commit-policy.yaml
  optional: []

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/glossary.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/api-contract.yaml

finalize_script: agent/scripts/task/implement-item/finalize.sh

finalize_track_paths:
  - .

instruction: |
  Implement the selected open item. Check execution.plan_item_required on the selected item first. If true, load and follow the matching item plan file from agent/execution/plans without changing item scope or acceptance criteria. If false, treat the item as intentionally plan-exempt and proceed from item scope/acceptance plus baseline context. Use the baseline context from this task, then load additional context from the selected item inputs and, when a plan file exists, from plan context (plan.context.required and plan.context.optional). Apply only the changes needed for this item and keep behavior consistent with strategy and design constraints. Load additional on-demand context only when still necessary after item and plan context is loaded. Treat changes in agent/execution/telemetry.yaml as expected framework-managed state for this task run, not as unrelated workspace noise. Do not avoid or revert telemetry changes unless explicitly requested by the stakeholder. When implementation is complete, write the commit message to agent/tmp/implement-item-commit-message.txt following agent/strategy/commit-policy.yaml and execute agent/scripts/task/implement-item/finalize.sh <item-id>. Use the output format from agent/templates/task-output-template.yaml exactly.
