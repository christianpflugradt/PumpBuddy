version: 1
task: review-quality

context:
  required:
    - agent/execution/plan.yaml
    - agent/execution/workflow-policy.yaml
    - agent/execution/workflow-state.yaml
    - agent/execution/execution-config.yaml
    - agent/strategy/test-strategy.yaml
    - agent/strategy/engineering-guardrails.yaml
    - agent/templates/extended-review-findings-template.yaml
  optional: []

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/design/workout-use-cases.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml

finalize_script: agent/scripts/task/extended-review/finalize.sh

finalize_track_paths:
  - agent/execution

instruction: |
  Run a quality-focused extended review for the active plan. Focus on correctness confidence, testability, reliability, and maintainability risks. Write findings to agent/tmp/review-quality-findings.yaml using agent/templates/extended-review-findings-template.yaml. Then ask the stakeholder which backlog selection mode to apply: none, all, only-p0..only-p3, or through-p0..through-p3. Execute agent/scripts/task/extended-review/finalize.sh review-quality agent/tmp/review-quality-findings.yaml <mode>. Use the output format from agent/templates/task-output-template.yaml exactly.
