version: 1
task: review-item

context:
  required:
    - agent/execution/execution-config.yaml
    - agent/execution/workflow-policy.yaml
  optional: []

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/design/workout-use-cases.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/domain-model.yaml
  - agent/design/persistence-model.yaml
  - agent/design/glossary.yaml
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/api-contract.yaml

finalize_script: agent/scripts/task/review-item/finalize.sh

finalize_track_paths:
  - .

instruction: |
  Review the selected review item against its goal, scope, and acceptance criteria. Check execution.plan_item_required on the selected item first. If true, use the matching item plan as implementation guidance. If false, treat the item as intentionally plan-exempt and review directly against item scope and acceptance criteria. Do not hand-edit nested YAML under review_result. Write review_result via agent/scripts/task/review-item/write-review-result.py, then validate with python3 agent/scripts/check/validate-artifact.py review-item <item-path>. For accept, set review_result.outcome=accept and fill review_result.acceptance with criteria_met, evidence, runtime_build_check, and residual_risk as scalar strings. For return, set review_result.outcome=return and fill review_result.findings as a non-empty list of objects with criterion, evidence, and risk. When a returned finding reflects genuine API surface versus OpenAPI contract drift, mark that finding with requires_api_contract_update=true through the helper (for example with --finding-contract-update or a findings-file field) so corrective implement finalize can require canonical contract evidence without relying on prose heuristics. Treat changes in agent/execution/telemetry.yaml as expected framework-managed state for this task run, not as unrelated workspace noise. Do not avoid or revert telemetry changes unless explicitly requested by the stakeholder. If accepted, execute agent/scripts/task/review-item/finalize.sh <item-id> accept. Finalize enforces deterministic quality gates via agent/scripts/check/run-quality-gate.sh based on files changed in the implementation commit that produced the review item. Docker execution failures (for example missing permission or daemon not reachable) are environment blockers and must not produce return findings; keep the item in review and report blocked instead. If returned, execute agent/scripts/task/review-item/finalize.sh <item-id> return. On return, finalize appends structured findings to the reopened open-item as review_feedback so the next implementation pass can address them directly. Use the output format from agent/templates/task-output-template.yaml exactly.
