version: 1
task: review-security

context:
  required:
    - agent/execution/plan.yaml
    - agent/execution/workflow-policy.yaml
    - agent/execution/workflow-state.yaml
    - agent/execution/execution-config.yaml
    - agent/strategy/security.yaml
    - agent/strategy/tech-stack.yaml
    - agent/strategy/engineering-guardrails.yaml
    - agent/templates/extended-review-findings-template.yaml
  optional:
    - compose.yaml

templates:
  required:
    - agent/templates/task-output-template.md

on_demand_order:
  - agent/design/api-contract.yaml
  - agent/design/persistence-model.yaml
  - agent/design/domain-model.yaml

finalize_script: agent/scripts/task/extended-review/finalize.sh

finalize_track_paths:
  - agent/execution

instruction: |
  Run a security-focused extended review for the active plan. Focus on trust boundaries, access controls, secret exposure, and high-impact abuse paths. Write findings to agent/tmp/review-security-findings.yaml using agent/templates/extended-review-findings-template.yaml. Then ask the stakeholder which backlog selection mode to apply: none, all, only-p0..only-p3, or through-p0..through-p3. Execute agent/scripts/task/extended-review/finalize.sh review-security agent/tmp/review-security-findings.yaml <mode>. Use the output format from agent/templates/task-output-template.md exactly.
