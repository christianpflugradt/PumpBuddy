version: 1
task: review-architecture

context:
  required:
    - agent/execution/plan.yaml
    - agent/execution/workflow-policy.yaml
    - agent/execution/workflow-state.yaml
    - agent/execution/execution-config.yaml
    - agent/strategy/tech-stack.yaml
    - agent/strategy/engineering-guardrails.yaml
    - agent/design/domain-model.yaml
    - agent/design/persistence-model.yaml
    - agent/design/workout-use-cases.yaml
    - agent/templates/extended-review-findings-template.yaml
  optional:
    - agent/design/api-contract.yaml

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/design/workout-use-cases-to-domain-model.yaml
  - agent/design/workout-capabilities.yaml
  - agent/design/glossary.yaml

finalize_script: agent/scripts/task/extended-review/finalize.sh

finalize_track_paths:
  - agent/execution

instruction: |
  Run an architecture-focused extended review for the active plan. Focus on boundary clarity, dependency direction, layering, and model-to-use-case alignment. Write findings to agent/tmp/review-architecture-findings.yaml using agent/templates/extended-review-findings-template.yaml. First summarize findings with display IDs F01..FN and priorities, then walk through them one at a time as the stakeholder asks for next/continue. After all findings are presented, ask which finding IDs to create backlog items for (none, all, only F02 F03, or all but F01 F03) and execute agent/scripts/task/extended-review/finalize.sh review-architecture agent/tmp/review-architecture-findings.yaml "<selection>". Use the output format from agent/templates/task-output-template.yaml exactly.
