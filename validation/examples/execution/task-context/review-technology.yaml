version: 1
task: review-technology

context:
  required:
    - agent/execution/plan.yaml
    - agent/execution/workflow-policy.yaml
    - agent/execution/workflow-state.yaml
    - agent/execution/execution-config.yaml
    - agent/strategy/tech-stack.yaml
    - agent/strategy/engineering-guardrails.yaml
    - agent/templates/extended-review-findings-template.yaml
  optional:
    - runtime/compose/compose.dev.yaml
    - runtime/compose/compose.prod.yaml
    - package.json

templates:
  required:
    - agent/templates/task-output-template.yaml

on_demand_order:
  - agent/strategy/test-strategy.yaml
  - agent/strategy/security.yaml
  - agent/design/api-contract.yaml

finalize_script: agent/scripts/task/extended-review/finalize.sh

finalize_track_paths:
  - agent/execution

instruction: |
  Run a technology-focused extended review for the active plan. Focus on stack adherence, dependency/tooling fit, and compatibility risks versus tech strategy. Write findings to agent/tmp/review-technology-findings.yaml using agent/templates/extended-review-findings-template.yaml. First summarize findings with display IDs F01..FN and priorities, then walk through them one at a time as the stakeholder asks for next/continue. After all findings are presented, ask which finding IDs to create backlog items for (none, all, only F02 F03, or all but F01 F03) and execute agent/scripts/task/extended-review/finalize.sh review-technology agent/tmp/review-technology-findings.yaml "<selection>". Use the output format from agent/templates/task-output-template.yaml exactly.
