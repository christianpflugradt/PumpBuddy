version: 1
area: workout
source_of_truth: use_case_domain_mapping
references:
  glossary: validation/examples/design/glossary.yaml
  use_cases: validation/examples/design/use-cases.yaml
  domain_model: validation/examples/design/domain-model.yaml
  persistence_model: validation/examples/design/persistence-model.yaml
formatting:
  indent_spaces: 2

mapping_conventions:
  primary_entities: Created or changed entities.

mappings:
  - use_case_id: UC-01
    use_case_name: Start Workout
    mode: configured_gym
    primary_entities:
      - Workout
    supporting_entities:
      - Exercise
    key_rules:
      - single_active_workout_per_user
    state_changes:
      - inactive_to_active
    persistence_impact:
      create:
        - workouts:
            - mode

cross_cutting_findings:
  - id: example.finding
    status: resolved
    description: Example finding.
    related_use_cases:
      - UC-01

summary:
  - Example summary.
