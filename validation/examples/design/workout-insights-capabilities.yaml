version: 1
area: workout_insights
source_of_truth: capabilities
references:
  glossary: /path/to/glossary.yaml
  execution_capabilities: /path/to/workout-capabilities.yaml
formatting:
  indent_spaces: 2

capabilities:
  - id: workout.insights.history_review
    name: Review Workout History
    description: Example insights capability.
    modes:
      - configured_gym
      - free
    includes:
      - list_completed_workouts
    guarantees:
      - history_view_is_read_only

principles:
  - read_only

non_goals:
  - workout_execution_mutations

referenced_domain_rules:
  - history_and_progress_views_are_read_only_and_never_create_or_mutate_workouts

boundaries:
  in_scope:
    - workout_insights_read_only
  out_of_scope:
    - workout_execution_only
